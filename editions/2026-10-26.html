const NL={"meta": {"icon": "🗞️", "edition": "Vol.42", "cadence": "주간", "date": "2026년 10월 26일 (월)", "curator": "Claude (Cowork)", "title": ["주간 AI 뉴스레터 — ", "TPM Edition"], "lead": "CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식과, 직접 써볼 만한 신규 툴·에이전트. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.", "greeting": "안녕하세요! 이번 주 한 줄 요약은 <b>\"에이전트가 먼저 말을 거는 시대가 열렸고, 이제 조직이 정해야 할 것은 '무엇을 맡기나'보다 '얼마를 쓰고 누가 승인하나'\"</b>입니다.<br><br>10월 21일 Anthropic이 <b>'Claude Duet'</b>을 공개하면서 OpenAI의 Dots(9월 29일), Meta의 Muse와 함께 '먼저 알려 주는 상시 에이전트' 3파전이 됐습니다. 같은 주에 Google Cloud가 OpenAI 모델을 자사 마켓에 올렸고, Apollo의 이코노미스트는 <b>기술업계 밖에서는 AI 투자 성과가 아직 보이지 않는다</b>고 짚었습니다. 노션도 에이전트를 재설계하면서 <b>지출 한도·사용량 관리 화면(AI Command Center)</b>을 예고했습니다.<br><br>국내에서는 카카오의 인적분할 일정(12월 17일 임시주총, 내년 1월 27일 상장)이 구체화됐고, 베스핀글로벌 사례집에서 한수원·산림청의 AX 성과가 공개됐습니다. 6번째 탭에는 <b>한컴독스와 Claude Code를 연결해 한글 문서를 쓰는 국내 오픈소스 스킬</b>과 국내 개발자가 올린 AI 자막 플레이어를 담았습니다.<br><br>이번 주는 국내 협업 도구(Jira·Confluence 등)의 새 AI 기능과 네이버·토스·당근의 새 소식을 확인하지 못했고, 일부 내용은 2차 정리 글·벤더 발표 기준이라 각 카드에 표시했습니다."}, "topics": [{"id": "top", "label": "이 주의 핵심", "icon": "⚡", "tint": "red", "desc": "이번 주 국내외 AI 소식 중 전사 의사결정에 가장 직접적으로 영향을 주는 것들.", "criteria": "규제 조항 설명은 뺐고, <b>직원 계정 사용 기준</b>(상시 에이전트), <b>클라우드·벤더 계약</b>(Google Cloud의 OpenAI 모델), <b>AI 비용 통제</b>, <b>날짜가 정해진 모델 종료</b>처럼 우리가 판단하거나 움직여야 하는 것을 우선했습니다.", "highlight": {"kicker": "이 주의 핵심", "title": "Anthropic 'Claude Duet' 공개 — 먼저 말을 거는 상시 에이전트 3파전(OpenAI Dots·Meta Muse·Claude Duet), 승인 전에는 결제·발송·삭제 안 함", "summary": "Anthropic이 10월 21일 <b>Claude Duet</b>을 리서치 프리뷰로 공개했습니다. 연결된 앱을 몇 시간마다 확인해 <b>주의가 필요한 일을 먼저 알려 주고</b>, 매일 아침 브리핑을 보냅니다. 현재는 미국 Pro·Max 구독자 대기자 명단 방식입니다.", "detail": "<p>MacRumors·iPhone in Canada 보도 기준 주요 내용입니다. ① Opus 5.5 기반이며, 사용자의 컴퓨터가 아니라 <b>클라우드의 가상 머신과 자체 브라우저</b>에서 일하기 때문에 기기를 켜 둘 필요가 없습니다. ② Claude 계정의 메모리·스킬·연결 앱을 그대로 이어받고(6,000개 이상 커넥터 지원이라고 보도), 모든 대화는 하나의 지속 스레드에서 이어집니다. ③ 메시지 발송·결제·문서 서명·파일 삭제 전에는 계획을 보여 주고 <b>사용자 승인을 기다리며</b>, 계정 접근 권한을 받아도 비밀번호는 보지 않는다고 설명합니다. 웹과 별도 iOS 앱으로 쓸 수 있고, 백그라운드 점검도 기존 요금제 사용량 한도에 포함됩니다.</p><p>비교 대상은 OpenAI의 <b>Dots</b>(9월 29일 공개, Pro·Business Premium 대상, 일부 요금제는 관리자 설정 베타)와 Meta의 <b>Muse</b>입니다. Anthropic은 Duet이 '무엇이 급한지 잘못 판단할 수 있다'고 인정했습니다. 한국에서의 제공 여부와 별도 가격은 <b>확인하지 못했습니다</b>.</p>", "source": "MacRumors · iPhone in Canada (2차 보도)", "url": "https://macrumors.com/2026/10/21/anthropic-claude-duet/", "published": "2026-10-21", "foryou": "<b>전사 관점:</b> 상시 에이전트는 직원이 개인 구독으로 Gmail·Slack·캘린더를 연결하는 순간 <b>사내 정보가 개인 계정의 클라우드 VM으로 흘러갈 수 있는</b> 구조입니다. 도입 여부보다 먼저 ① 업무 계정 연결 허용 범위(금지/개인 계정만/승인 후 일부), ② 승인 로그를 누가 보나, ③ 오판 시 책임선을 정해 두면 좋습니다. 개인 계정 체험은 샘플 데이터로 하고, 사내 계정 연결 전에는 정보보안팀(#support-정보보안)에 확인하세요."}, "articles": [{"tag": "멀티클라우드", "source": "TechZine (2차 보도)", "url": "https://www.techzine.eu/news/applications/145174/openais-models-are-finally-fully-supported-on-google-cloud/", "published": "2026-10-21", "title": "Google Cloud, GPT-6 Astra·Sol·Luna를 Model Garden에 — 비공개 프리뷰, 청구서는 기존 Google Cloud 약정에 합산", "summary": "Google Cloud가 OpenAI의 GPT-6 3종을 Model Garden에서 제공하기 시작했습니다. 일부 기업 고객 대상 <b>비공개 프리뷰</b>이며, Claude·Gemini·OpenAI를 모두 파는 유일한 하이퍼스케일러라고 보도됐습니다.", "detail": "<p>보도에 따르면 Astra는 코딩·컴퓨터 사용·과학 연구 같은 고부하 작업용, Sol은 Astra에 가까운 성능을 낮은 비용으로, Luna는 대량 일상 업무용 고속·저비용 모델입니다. 구매는 Google Cloud Marketplace를 통해 이뤄지고 사용량은 하나의 청구서에 합산되며, <b>기존 클라우드 약정과 Flexible Savings Plans에 포함</b>됩니다. 프롬프트와 출력은 고객 데이터 경계 안에 남고 학습에 쓰이지 않는다고 밝혔지만, Zero Data Retention과 Confidential Compute는 <b>추후 제공 예정</b>입니다. 모델별 단가는 기사에 없습니다.</p>", "foryou": "<b>전사 관점:</b> 쓰는 클라우드가 정해져 있어도 모델 선택지가 클라우드 쪽으로 모이는 흐름입니다. 벤더 계약 갱신 때 '모델은 바꾸고 청구는 한 곳에서'가 가능한지, 약정 소진에 포함되는지, ZDR이 지원되는 시점이 언제인지를 체크리스트에 넣어 두세요."}, {"tag": "AI 비용·성과", "source": "Apollo The Daily Spark (이코노미스트 의견) · Mavvrik 설문 인용", "url": "https://www.apollo.com/wealth/insights-news/insights/daily-spark/no-signs-of-ai-payoff-outside-the-tech-sector", "published": "2026-10-24", "title": "Apollo 이코노미스트 '기술업계 밖 미국 기업은 AI 투자 성과가 아직 없다' — 일반 기업은 토큰 지출을 성장이 아니라 마진 압박으로 본다", "summary": "Apollo의 수석 이코노미스트가 10월 24일 기술 섹터 밖 기업의 직원당 매출·이익률이 횡보한다며 AI 성과가 보이지 않는다고 주장했습니다. 이어 10월 14일 글은 기업 396곳 설문에서 <b>AI 지출을 ±10% 이내로 예측한 곳이 11%</b>에 그쳤다고 전합니다.", "detail": "<p>10월 24일 글은 Mag 7은 직원당 매출·이익률이 오르지만 나머지 S&P 493은 횡보하고, SF 연준 데이터 기준 AI로 인한 생산성(TFP) 상승 신호도 없다고 주장합니다. 10월 14일 글이 인용한 Mavvrik·Benchmarkit 설문(2026년 4~5월, 기업 396곳)에서는 예상 못 한 AI 비용이 사업 결정을 바꾼 기업이 62%, AI 프로젝트를 늦추거나 취소한 기업이 25%, AI 비용이 매출총이익률에 중간 이상 영향을 준다는 기업이 81%였습니다. 어디까지나 <b>특정 이코노미스트의 의견과 단일 설문</b>이므로 일반화는 조심해야 합니다.</p>", "foryou": "<b>전사 관점:</b> 경영진 보고에서 'AI로 얼마나 아꼈나' 질문이 올라올 때를 대비해, 팀별 AI 지출 <b>예측 대비 실제 오차</b>를 분기마다 한 장으로 내 볼 만합니다. 노션의 지출 한도 기능(3번 탭)처럼 벤더 도구가 제공하는 한도·알림 기능을 도입 조건으로 넣는 것도 방법입니다."}, {"tag": "날짜 있는 액션", "source": "rulefiles.dev 주간 digest (2차 정리, 원문 changelog 확인 필요)", "url": "https://rulefiles.dev/digest/2026-W42/", "published": "2026-10-18", "title": "Copilot 일부 모델 11월 16일 종료, Codex는 GPT-5.5 이미 종료(10월 14일) — 모델을 이름으로 고정해 둔 설정부터 점검", "summary": "2차 정리 글에 따르면 GitHub Copilot은 <b>11월 16일</b>에 여러 경험(Chat·인라인 편집·Agent 모드·코드 완성)에서 일부 모델 지원을 끝내고, Codex는 ChatGPT 로그인 사용자의 GPT-5.5를 10월 14일에 종료했습니다.", "detail": "<p>정리 글에는 Copilot 종료 대상 <b>모델 목록이 없어</b> 원문 changelog에서 확인해야 합니다. 지난 호에서 다룬 OpenAI의 GPT-4o·GPT-4o-mini·GPT-4.1 API 종료(2027년 1월 14일)와 함께 보면, 모델 종료 공지가 분기마다 나오는 패턴입니다.</p>", "foryou": "<b>전사 관점:</b> 각 팀이 설정 파일·파이프라인에 모델명을 박아 둔 곳이 어디인지 한 번에 파악하는 <b>모델 의존성 목록</b>이 없다면 지금이 만들 시점입니다. 종료일(11/16, 2027/1/14)을 로드맵에 올리고, 대체 모델 검증 담당을 지정해 두세요."}]}, {"id": "dev", "label": "개발 AI 동향", "icon": "🛠️", "tint": "purple", "desc": "함께 일하는 엔지니어팀의 일하는 방식이 실제로 어떻게 바뀌는지.", "criteria": "버전 번호 나열은 하지 않고, <b>코드 호스팅·CI·리뷰까지 에이전트가 파고드는 구조 변화, 관리자 정책 적용, 비용 관측</b>처럼 팀 운영에 영향이 있는 것만 골랐습니다. 국내 개발 도구·조직 문화 소식은 이번 주 이 탭에서는 확인하지 못했고, 한글 문서 자동화 스킬은 6번째 탭에 실었습니다.", "highlight": {"kicker": "개발 AI 핵심", "title": "Cursor, 코드 호스팅 'Origin'에 앱 마켓플레이스 — 배포·CI·리뷰·보안·모니터링·Linear 등 20여 개 앱을 한곳에 연결", "summary": "Cursor가 10월 13일 자사 코드 호스팅 플랫폼 Origin에 <b>앱 마켓플레이스</b>를 열었습니다. Cloudflare·Vercel(배포), CircleCI·Buildkite(CI), CodeRabbit·Greptile(리뷰), Semgrep·Socket(보안), Sentry, Linear 등이 연결됩니다.", "detail": "<p>Havoptic 정리 기준으로 앱은 인증 토큰과 웹훅으로 동작하며 체크 런, PR 코멘트, 리뷰를 직접 남깁니다. 누구나 앱을 제출할 수 있고 심사 후 등록됩니다. 즉 에이전트 도구가 '에디터'에서 <b>저장소·CI·배포·이슈 트래커를 잇는 작업 흐름 전체</b>로 넓어지는 신호입니다.</p><p>다만 정리 글에는 <b>조직 관리자가 앱 설치를 막거나 승인하는 통제 기능에 대한 설명이 없습니다</b>. 외부 앱이 PR에 코멘트를 쓰고 코드를 읽는 권한을 갖게 되므로, 도입 전에 공식 문서로 권한 범위를 확인해야 합니다.</p>", "source": "Havoptic (2차 정리)", "url": "https://www.havoptic.com/r/cursor-origin-app-marketplace", "published": "2026-10-13", "foryou": "<b>전사 관점:</b> 우리 엔지니어팀이 Cursor를 쓴다면 Origin 사용 여부와 외부 앱 연동 범위를 먼저 물어보세요. 코드 호스팅이 둘로 갈라지면 보안 스캔·감사 로그·접근 권한 관리가 이중으로 필요해집니다. 사내 저장소에 연결하기 전에는 정보보안팀(#support-정보보안) 검토를 권합니다."}, "articles": [{"tag": "거버넌스", "source": "rulefiles.dev 주간 digest (2차 정리)", "url": "https://rulefiles.dev/digest/2026-W42/", "published": "2026-10-15", "title": "GitHub Copilot — 관리자가 '최신 정책을 받아야만 시작'하도록 강제 가능, 코드 스캐닝 자동 수정(Agentic autofix) 정식 출시", "summary": "Enterprise 관리자는 지원 클라이언트가 시작할 때 캐시된 정책이 아니라 <b>최신 서버 관리 설정</b>을 가져오도록 요구할 수 있게 됐습니다(10월 13일). 코드 스캐닝 알림의 자동 수정은 10월 15일 GitHub Enterprise Cloud 고객에게 정식 제공됐습니다.", "detail": "<p>정책을 바꿔도 직원 PC에는 이전 설정이 남아 있던 문제를 줄여 줍니다. 모델 종료나 보안 정책을 바꿀 때 '언제부터 전원에게 적용되는가'에 답하기 쉬워집니다. Agentic autofix는 보안 알림이 쌓이는 팀에서 처리 시간을 줄일 수 있지만, 자동 수정 PR을 <b>누가 검토하는지</b>가 정해지지 않으면 지난 호에서 본 리뷰 병목이 더 커질 수 있습니다.</p>", "foryou": "<b>전사 관점:</b> Copilot을 쓰는 조직이라면 관리 설정 강제 적용 여부를 확인하고, 11월 16일 모델 종료 같은 변경을 전원에게 즉시 반영할 수 있는지 점검하세요. 자동 수정 PR은 승인 담당과 SLA를 같이 정하는 것이 좋습니다."}, {"tag": "도구 전략", "source": "Every (인터뷰 기반 기사)", "url": "https://every.to/p/how-codex-happened", "published": "2026-10-15", "title": "'Codex는 어떻게 탄생했나' — 클라우드 에이전트로 시작해 PMF를 못 찾고 로컬 방식으로 방향을 튼 과정", "summary": "Every 기사에 따르면 OpenAI는 2025년 5월 클라우드 기반 Codex를 냈지만 설정 이전의 번거로움과 중간 개입 불가 때문에 자리를 잡지 못했고, <b>개발자 컴퓨터에서 도는 방식</b>으로 전환했습니다. 2026년 6월 기준 주간 사용자 500만 명을 넘었다고 합니다.", "detail": "<p>팀이 얻을 수 있는 시사점은 세 가지입니다. 사용자가 이미 일하는 환경에서 시작해야 채택이 빠르고, 에이전트가 일하는 중에도 사람이 방향을 고칠 수 있어야 신뢰가 쌓이며, 모델이 좋아질수록 맞는 인터페이스가 바뀐다는 점입니다. 수치는 기사에 인용된 내부 관계자 발언이라 독립 검증은 없습니다.</p>", "foryou": "<b>전사 관점:</b> 사내 에이전트 도입 계획이 '클라우드에서 돌려서 결과만 받는' 방식인지, 개발자 환경에서 개입 가능한 방식인지에 따라 채택률이 갈릴 수 있습니다. 파일럿 설계 때 중간 개입 지점을 요건에 넣어 보세요."}, {"tag": "비용 관측", "source": "rulefiles.dev 주간 digest (2차 정리)", "url": "https://rulefiles.dev/digest/2026-W42/", "published": "2026-10-16", "title": "Claude Code — 큰 파일 멘션 시 '경로만 전달' 옵션, 캐시 토큰 사용량을 5분·1시간 수명별로 분리 기록", "summary": "10월 14일 업데이트로 파일 멘션 시 내용 대신 경로만 넘겨 <b>컨텍스트 사용량을 줄이는 환경 변수</b>가 생겼고, OpenTelemetry 요청 이벤트에는 캐시 쓰기 토큰이 수명별로 나뉘어 기록됩니다.", "detail": "<p>두 변화 모두 '쓰는 방식'이 아니라 <b>'쓴 비용을 어떻게 보느냐'</b>에 영향을 줍니다. OpenTelemetry로 사용량을 모으는 조직이라면 캐시 비용 분석이 정밀해지고, 대용량 문서를 자주 멘션하는 팀은 컨텍스트 낭비를 줄일 수 있습니다. 세부 버전 번호는 생략합니다.</p>", "foryou": "<b>전사 관점:</b> 엔지니어팀이 코딩 에이전트 사용량을 어떤 대시보드로 보고 있는지 확인해 보세요. 1번 탭의 'AI 지출 예측 오차'를 팀별로 내려면 이런 관측 데이터가 선행 조건입니다."}]}, {"id": "tpm", "label": "TPM 업무 자동화", "icon": "📋", "tint": "blue", "desc": "로드맵·스프린트·문서화·커뮤니케이션에 바로 붙일 수 있는 기능.", "criteria": "이번 주에 확인된 <b>신규 협업 도구 AI 기능은 노션 중심</b>입니다. 지난 호에 다룬 노션 회의록·아틀라시안 에이전트의 후속은 확인하지 못했고, 국내 협업 도구의 새 AI 기능 소식도 확인하지 못했습니다. 노션 수치(비용 절감 등)는 <b>벤더 발표 기준</b>입니다.", "highlight": {"kicker": "TPM 핵심", "title": "Notion 에이전트 재설계(10월 19일) — 자체 컴퓨터·브라우저, 최대 24시간 작업, 모델 자동 선택, 지출 한도를 다루는 'AI Command Center' 예고", "summary": "노션이 10월 19일 에이전트를 <b>자체 컴퓨터와 브라우저를 갖춘 형태로 재설계</b>했습니다. 최대 24시간 작업, '검토 후 실행(Review for me)' 모드, 작업마다 모델을 고르는 <b>Auto 라우터</b>, 통합 크레딧 체계가 포함됩니다.", "detail": "<p>노션 릴리스 노트 기준 내용입니다. ① Auto는 20개 이상 일반 작업에서 Opus 5.5·Astra와 비슷한 결과를 평균 약 90% 낮은 비용으로 낸다고 <b>노션이 주장</b>합니다. ② ChatGPT Plus·Pro·Go 구독을 개인 노션 에이전트에 연결(BYOK)할 수 있고, 자체 API 키 방식은 Enterprise 대상 프라이빗 알파입니다. ③ <b>AI Command Center(출시 예정)</b>에서는 사용자·기능·에이전트별 사용량을 보고 지출 한도와 알림을 설정하며 팀이 쓸 모델을 관리합니다. ④ 노션 에이전트, 커스텀 에이전트, 외부 AI 도구 사용량을 하나의 크레딧으로 묶는 새 크레딧 시스템이 적용됩니다.</p><p>Command Center는 아직 출시 전이므로 지금 확인 가능한 것은 방향성뿐입니다.</p>", "source": "Notion 릴리스 노트 (벤더 발표)", "url": "https://www.notion.com/releases", "published": "2026-10-19", "foryou": "<b>활용 아이디어:</b> 스프린트 회고 문서 초안·주간 상태 보고 수합처럼 반복 업무 1개에 에이전트를 붙여 보고, 'Review for me'로 실행 전에 사람이 확인하는 흐름을 시험하세요. <b>전사 관점:</b> 사용자·에이전트별 지출 한도와 개인 구독(BYOK) 연결 허용 여부는 도입 전에 정할 수 있는 정책입니다. 출시 일정이 확정되면 Command Center의 한도 설정 단위(개인/팀/워크스페이스)를 먼저 확인하세요."}, "articles": [{"tag": "관리자 통제", "source": "Notion 릴리스 노트 (벤더 발표)", "url": "https://www.notion.com/releases", "published": "2026-10-13", "title": "Notion 3.8 — MCP로 외부 에이전트 연결, 관리자가 'AI 도구별 연결 주체·마지막 사용 시점' 확인하고 개별 접근 해지, 데이터베이스 열 단위 권한", "summary": "MCP를 지원하는 에이전트(ChatGPT, Claude 등)가 워크스페이스 문서와 태스크 트래커를 읽고 업데이트할 수 있습니다. 관리자는 <b>누가 어떤 AI 도구를 연결했는지와 마지막 사용 시점</b>을 보고 특정 사용자 접근만 끊을 수 있습니다.", "detail": "<p>함께 발표된 내용은 ① 사용자나 에이전트별로 속성(열)을 보거나 편집할 권한 설정, ② 스킬을 한 번 쓰고 여러 에이전트와 동기화하는 Skills API, ③ GitHub·Jira·Salesforce부터 다시 만든 동기화 데이터베이스입니다. Business·Enterprise에서는 ChatGPT Plus·Pro 구독으로 노션 내 AI 사용량을 충당할 수 있다고 합니다.</p>", "foryou": "<b>활용 아이디어:</b> 로드맵·이슈 DB를 외부 에이전트가 읽고 갱신하게 하기 전에, 민감한 열(예: 고객사명, 예산)에 열 단위 권한을 먼저 걸어 보세요. <b>전사 관점:</b> 직원이 개인 AI 도구를 사내 워크스페이스에 연결하는 현황을 관리자 화면에서 파악할 수 있는지가 점검 포인트입니다."}, {"tag": "커뮤니케이션", "source": "rulefiles.dev 주간 digest (2차 정리)", "url": "https://rulefiles.dev/digest/2026-W42/", "published": "2026-10-15", "title": "Slack·Teams의 @GitHub, 한 대화에서 여러 저장소 대상으로 작업 가능", "summary": "Slack이나 Teams 대화에서 @GitHub를 불러 <b>여러 저장소를 한꺼번에 대상으로</b> 작업을 시킬 수 있게 됐습니다(10월 15일).", "detail": "<p>여러 서비스에 걸친 변경을 논의하는 스레드에서 저장소마다 따로 요청하지 않아도 됩니다. 정리 글에는 요금제 조건이나 권한 설명이 없어 <b>제공 범위는 확인하지 못했습니다</b>.</p>", "foryou": "<b>활용 아이디어:</b> 여러 팀이 걸린 변경(API 변경, 공통 라이브러리 교체)의 영향 범위를 대화방에서 바로 조사시키는 용도로 시험해 볼 만합니다. <b>전사 관점:</b> 채팅 도구에서 코드 저장소에 쓰기 작업이 가능해지므로 어떤 채널에서 어떤 권한까지 허용할지 기준이 필요합니다."}]}, {"id": "biz", "label": "빅테크 & 전략 동향", "icon": "🌐", "tint": "orange", "desc": "리더십 보고와 전사 전략 수립에 참고할 산업 맥락.", "criteria": "이번 주는 <b>국내 카카오의 분할 로드맵, 국내 통신사 KT의 에이전트 플랫폼, 해외 AI 기업의 상장·가격 구조</b>처럼 계약·예산 판단에 연결되는 것만 골랐습니다. 네이버·토스·당근의 새 소식은 확인하지 못했습니다. 수치는 보도 기준이며 확정 사실이 아닌 것은 카드에 표시했습니다.", "highlight": {"kicker": "전략 핵심", "title": "카카오, 첫 그룹 공동 IR — 12월 17일 임시주총, 1월 1일 분할, 1월 27일 카카오AI·카카오X 상장 예정, 카카오톡을 '통합 에이전틱 AI 인터페이스'로", "summary": "카카오가 10월 13일 첫 공동 IR에서 인적분할 이후 전략을 밝혔습니다. <b>카카오AI(분할비율 0.36)</b>는 카카오톡 중심의 AI·광고·커머스, <b>카카오X(0.64)</b>는 금융·콘텐츠·모빌리티 계열사를 맡습니다.", "detail": "<p>보도된 일정은 10월 20일 2차 소액주주 간담회, 12월 17일 임시주총 승인 추진, 내년 1월 1일 분할 완료, 1월 27일 양사 상장입니다. 사업 가치 합산은 34조 2천억 원인데 최근 3개월 평균 시가총액은 16조 8천억 원이라 저평가 해소가 분할 목적으로 제시됐습니다. 카카오페이는 AI 에이전트 기반 초개인화 금융, 카카오뱅크는 자체 LLM 기반 AI 금융 플랫폼을 내세웠고, 카카오모빌리티는 자율주행·피지컬AI를 언급했습니다.</p><p>기사는 공동 조직 없이 독립 경영하므로 <b>계열사 간 시너지 유지가 과제</b>라고 짚었습니다. 지난 호에서 다룬 카나나 스페이스·칸바스(이프카카오 26)는 카카오AI 쪽 사업입니다. 이 카드는 단일 매체(CEO스코어데일리) 보도 기준입니다.</p>", "source": "CEO스코어데일리 (2차 보도)", "url": "https://ceoscoredaily.com/page/view/2026101414504942262", "published": "2026-10-14", "foryou": "<b>전사 관점:</b> 카카오 관련 연동·제휴가 있다면 분할 뒤 <b>계약 상대가 카카오AI인지 카카오X 계열사인지</b>를 미리 확인하세요(예: 카카오톡 채널·메시지는 카카오AI, 페이·뱅크 연동은 카카오X 계열). 카나나 스페이스가 열리는 2027년 상반기 외부 에이전트 공간에 우리 서비스를 연결할지 검토할 시점도 점검 대상입니다."}, "articles": [{"tag": "벤더 리스크", "source": "FinanceFeeds (Reuters 보도 인용, 미확정)", "url": "https://financefeeds.com/anthropic-ipo-targets-mid-november-as-openai-races-for-30-billion-at-1-25t-1-4t-valuation/", "published": "2026-10-24", "title": "Anthropic 상장은 11월 중순 목표(Reuters 인용), 11월 9일 주간 로드쇼 가능 — 공개 S-1은 아직 없음, OpenAI는 약 300억 달러 조달 협상", "summary": "Reuters(10월 22일)를 인용한 보도에 따르면 Anthropic은 <b>11월 중순 상장</b>을 추진하고 11월 9일 주간에 로드쇼를 시작할 수 있습니다. 10월 24일 기준 공개 S-1은 나오지 않았고 회사의 공식 확인도 없습니다.", "detail": "<p>기업가치는 약 1.5조~2조 달러가 거론되고, 3분기 매출 168억 달러(전 분기 대비 45%)는 비공개 투자자 발표를 기준으로 한 보도입니다. OpenAI는 약 300억 달러 조달을 협상 중이며 기업가치는 1.25조~1.4조 달러 초과로 보도가 엇갈립니다. 모두 <b>관계자 취재 기반이며 확정이 아닙니다</b>.</p>", "foryou": "<b>전사 관점:</b> 상장 과정에서 공개되는 S-1에는 클라우드·컴퓨팅 계약과 재무 의무가 담길 것으로 예상되므로, 핵심 모델 벤더의 가용성·장기 가격을 가늠하는 자료로 쓸 수 있습니다. 공개 시점에 법무·구매와 함께 읽을 항목을 미리 정해 두세요."}, {"tag": "가격 구조", "source": "Elena's Growth Scoop (뉴스레터, 필자 의견)", "url": "https://www.elenaverna.com/p/what-on-earth-is-going-on-with-ai", "published": "2026-10-16", "title": "'AI 가격 책정에 무슨 일이?' — 크레딧·토큰이라는 가상 화폐 때문에 실제로 무엇을 얻는지 알기 어렵다는 지적", "summary": "Lovable 성장 총괄이던 필자는 Grok, Muse, ChatGPT, Claude 요금제가 모두 <b>사용량 기준을 모호하게 표기</b>한다고 비판하며, 가격이 예측 가능한 기업이 경쟁 우위를 가질 것이라고 결론짓습니다.", "detail": "<p>원인으로 ① 크레딧·토큰의 가상 화폐화, ② 큰 숫자가 관대해 보이는 착시, ③ 에이전트는 메시지·작업·시간·도구 호출 중 무엇으로 과금할지 불명확, ④ 단계별 추론 비용의 편차를 꼽습니다. 이번 주 노션의 통합 크레딧 체계(3번 탭)와 같은 맥락입니다. 개인 의견 글이라는 점을 감안해 읽어야 합니다.</p>", "foryou": "<b>전사 관점:</b> 벤더 견적을 받을 때 '크레딧 1개 = 실제 작업 몇 건인지'를 대표 업무 3개로 환산해 달라고 요청하면 비교가 쉬워집니다. 에이전트 도입 PoC에서는 작업당 비용의 분산까지 기록해 두세요."}, {"tag": "국내 동향", "source": "데일리안 (2차 보도, 10월 6일·한 주 이전)", "url": "https://www.dailian.co.kr/news/view/1698010/", "published": "2026-10-06", "title": "KT, 기업용 에이전틱 AI 플랫폼 '에이전틱 온(Agentic On)' 공개 — 모듈형으로 필요한 영역부터 도입", "summary": "KT가 'AI Festa 2026'(10월 6~8일, 코엑스)에서 기업용 에이전트 플랫폼을 처음 공개했습니다. 에이전트 구축, 모델 활용, 데이터 연계, 운영·관리 기능을 <b>모듈형</b>으로 제공하고 여러 에이전트가 협업하는 방향을 지향합니다.", "detail": "<p>기사에는 가격, 고객 사례, 지원 모델 같은 구체 정보가 없어 <b>도입 조건은 확인하지 못했습니다</b>. 이번 주 기사는 아니지만 지난 호에서 다루지 못한 국내 기업용 에이전트 플랫폼 소식이라 실었습니다.</p>", "foryou": "<b>전사 관점:</b> 국내 통신·클라우드 사업자가 내놓는 에이전트 플랫폼은 데이터 국내 보관, 공공·금융 규제 대응에서 선택지가 될 수 있습니다. 해외 플랫폼과 비교하는 평가 기준(데이터 위치, 운영 책임, 비용 구조)을 먼저 만들어 두면 제안이 들어왔을 때 빠르게 판단할 수 있습니다."}]}, {"id": "case", "label": "국내외 AI 도입 사례", "icon": "📚", "tint": "gray", "desc": "실제로 도입한 조직의 성과와 실패 요인 — 우리 조직에 옮긴다면 무엇이 필요한지.", "criteria": "이번 주 사례는 <b>벤더 사례집과 은행권 계획</b> 위주입니다. 성과 수치는 대부분 <b>도입 기업·솔루션 벤더의 자체 보고</b>라 독립 검증이 아니며, 우리은행은 3월 보도라 현재 진행 상황은 확인하지 못했습니다. 국내 사례 2건을 포함했습니다.", "highlight": {"kicker": "도입 사례 핵심", "title": "베스핀글로벌 '2026 산업별 AX 사례집' — 한수원 원전 서류 검토 90% 단축, 산림청 업무 처리 70% 단축, 자사 에이전트 511개 상시 운영", "summary": "ZDNet Korea가 베스핀글로벌의 산업별 AX 고객 사례집(34건)을 소개했습니다. <b>한국수력원자력</b>은 원전 기술서류 검토에 보안 환경 내 자체 AI(에이전트 7개)를 적용해 검토 시간을 90% 줄였다고 합니다.", "detail": "<p>기사에 정리된 국내 사례는 ① 한수원: 보안 환경에 자체 AI를 운영하며 서류 검토 시간 90% 단축, ② 산림청: 산불 예방부터 시설 예약까지 지원하는 AI 에이전트 시스템으로 관련 업무 처리 시간 70% 단축, ③ 베스핀글로벌 자체: 전사 에이전트 511개 상시 운영으로 연간 업무시간 36,800시간 절감·휴먼 에러 99% 감소, ④ KB라이프·우리금융: 약관 분석·규제 준수 AI(수치 미공개)입니다.</p><p>이 수치는 <b>솔루션 벤더가 만든 사례집의 자체 보고</b>이고 측정 방식은 기사에 없습니다. 다만 보안망 안에서 자체 AI를 운영한 사례와 '문서 검토'처럼 범위가 좁은 업무에 집중한 점은 참고할 만합니다.</p>", "source": "ZDNet Korea (벤더 사례집 소개)", "url": "https://zdnet.co.kr/view/?no=20261020180309", "published": "2026-10-20", "foryou": "<b>전사 관점:</b> 효과가 큰 사례가 모두 '서류 검토·약관 분석처럼 입력과 기준이 명확한 업무'라는 점에 주목하세요. 우리 조직에서 후보를 고를 때 ① 입력 문서가 정형인가, ② 검토 기준이 문서화돼 있는가, ③ 오류 시 사람이 되돌릴 수 있는가로 1차 선별해 볼 만합니다."}, "articles": [{"tag": "국내 금융", "source": "이지경제 (3월 7일 보도, 현재 진행 상황 미확인)", "url": "https://www.ezyeconomy.com/news/articleView.html?idxno=233081", "published": "2026-03-07", "title": "우리은행, 575개 후보 중 175개 업무에 AI 에이전트 — 12월 1차 97개 출시, 'AI가 다른 AI를 감시'하는 이중 검증", "summary": "우리은행은 기업여신 심사·자산관리·내부통제·고객상담·업무자동화 5개 영역 29개 업무에 에이전트를 배치하기로 했습니다. 성과는 아직 없고 <b>업무 처리 속도 약 30% 개선을 기대</b>한다는 수치만 제시됐습니다.", "detail": "<p>눈여겨볼 운영 방식은 세 가지입니다. 575개 후보 요건을 실행 가능성과 투자 효과로 평가해 175개로 추렸고, 오류는 직원의 AI 결과 수정 로그 분석과 AI 상호 감시로 검증하며, AI 오류의 책임은 기존처럼 은행이 집니다. 은행은 인력 감축이 아니라 동일 인원으로 더 많은 업무를 처리하는 효율화라고 밝혔습니다. 3월 보도라 12월 출시 일정이 지켜지는지는 확인하지 못했습니다.</p>", "foryou": "<b>전사 관점:</b> '575개 → 175개'처럼 후보를 먼저 길게 모은 뒤 기준으로 걸러내는 방식은 우리 조직 AI 과제 백로그 관리에도 옮길 수 있습니다. 직원의 수정 로그를 품질 지표로 쓰는 아이디어도 참고할 만합니다."}, {"tag": "해외 사례", "source": "ZDNet Korea 사례집 소개 (벤더 자체 보고)", "url": "https://zdnet.co.kr/view/?no=20261020180309", "published": "2026-10-20", "title": "해외 사례 3건 — 이커머스 상품 콘텐츠 자동화 60일 추가 매출 1,700만 달러, 지멘스 AI 비전 검사 연 360만 유로 절감, 도요타 불량 분석 5일→4시간", "summary": "같은 사례집에 실린 해외 사례입니다. 어디까지나 <b>벤더 사례집의 수치</b>이며 측정 기준과 비교 대상은 기사에 없습니다.", "detail": "<p>애드본커머스는 생성형 AI로 상품 콘텐츠를 자동화해 60일 만에 추가 매출 1,700만 달러, 월평균 매출 87% 증가, 구매 전환율 41% 상승을 보고했습니다. 지멘스는 AI 비전 검사로 연간 360만 유로를 절감했고, 도요타 인더스트리는 불량 분석 시간을 5일에서 4시간으로 줄였다고 합니다.</p>", "foryou": "<b>전사 관점:</b> 이 수치를 목표치로 가져오기보다 '어떤 업무 단위를 어떤 지표로 재는지'만 참고하세요. 상품 콘텐츠처럼 프로세스가 반복되고 결과가 매출 지표로 바로 연결되는 업무가 우리 서비스에도 있는지 찾아볼 수 있습니다."}]}, {"id": "tools", "label": "써볼 만한 툴 & 에이전트", "icon": "🧰", "tint": "green", "desc": "요즘 새로 나왔거나 화제인 툴·에이전트 중 업무나 일상에서 바로 써보거나 아이디어를 얻을 만한 것.", "criteria": "이 탭은 <b>'직접 써보고 아이디어를 얻는 용도'</b>입니다. 대부분 출시 초기 제품이라 <b>성능·안전 주장은 제작사 발표 기준</b>이며, 사내 계정이나 업무 데이터를 연결하기 전에는 정보보안팀(#support-정보보안)에 먼저 문의하세요. 개인 계정·샘플 데이터로 먼저 체험해 보는 것을 권합니다. 이번 호의 국내 도구는 <b>한컴독스 스킬, NanumPlayer</b> 2건입니다.", "highlight": {"kicker": "이 주의 써볼 툴", "title": "hancomdocs-skills — 한컴독스(웹 한글)에 올린 HWP 문서를 Claude Code가 브라우저로 직접 읽고 고치는 국내 오픈소스 스킬(MIT)", "summary": "GeekNews(10월 26일)에 올라온 <b>국내 개발자 공개 스킬</b>입니다. 사업계획서·연구개발계획서 같은 양식 문서를 한컴독스에서 열어 본문 수정, 찾아 바꾸기, 표 편집, 서식 정리까지 맡길 수 있습니다. 작성자는 연구개발계획서 작성이 약 2주에서 2일로 줄었다고 밝혔습니다.", "detail": "<p>저장소 README 기준 구성은 4개 스킬입니다. <code>hancomdocs-edit</code>(문서 열기·읽기·찾아 바꾸기·표 줄 추가/삭제), <code>hancomdocs-paste</code>(HTML 붙여넣기와 표 설정), <code>hancomdocs-format</code>(글머리·단계 서식, 자간), <code>hwpable-html</code>(한글 붙여넣기에 맞는 HTML 변환)입니다. HWP 파일을 직접 건드리면 서식이 깨지는 문제가 있어, <b>한글이 일부 HTML을 지원하는 점을 이용해 웹 한컴독스에 붙여 넣는 방식</b>을 택했다고 설명합니다.</p><p>요구 사항은 Claude Code, Claude in Chrome 확장, 한컴독스에 로그인된 Chrome이고, 설치는 <code>/plugin marketplace add teddysbeach/hancomdocs-skills</code> 후 <code>/plugin install hancomdocs@hancomdocs-skills</code>입니다. <b>macOS+Chrome에서만 검증</b>됐고 Windows는 시험 중입니다. 변경 내용 추적을 켜 두기를 권하며, 표 줄 추가·삭제는 변경 기록에 남지 않고, 다른 사용자가 편집 중이면 작업이 멈추며, 한컴독스 화면이 바뀌면 일부 절차가 깨질 수 있습니다. 2주→2일은 작성자 본인의 경험담이고 가격은 오픈소스라 무료입니다(Claude 구독 별도).</p>", "source": "GeekNews Show GN · GitHub README (작성자 공개, 독립 검증 없음)", "url": "https://github.com/teddysbeach/hancomdocs-skills", "published": "2026-10-26", "foryou": "<b>써보는 방법:</b> 개인 한컴독스 계정에 <b>샘플 양식 문서</b>를 올리고 ① 기관명 일괄 교체, ② 한 장의 문단을 AI가 쓴 초안으로 교체하는 두 가지만 먼저 시험해 보세요. 업무에서는 정부·지원사업 양식 문서나 정형 보고서 작성에, 일상에서는 이력서·신청서 양식에 쓸 아이디어를 얻을 수 있습니다. <b>전사 관점:</b> 사내 문서를 외부 한컴독스 계정에 올리고 브라우저 에이전트가 읽게 되는 구조라 문서 반출·계정 권한 기준이 필요합니다. 정식 사용 전에 정보보안팀(#support-정보보안) 확인을 권합니다."}, "articles": [{"tag": "에이전트 보안", "source": "Product Hunt 1Password 제품 페이지 (제작사 설명)", "url": "https://www.producthunt.com/products/1password", "published": "2026-10-24", "title": "1Password for Agents — 에이전트가 비밀번호를 보지 않고 로그인, 요청마다 내 기기에서 승인", "summary": "에이전트가 로그인 화면에 닿으면 1Password에 자격 증명을 요청하고, 사용자가 <b>본인 기기에서 승인</b>하면 1Password가 비밀번호나 일회용 코드를 직접 입력합니다. 이번 주 출시됐고 Individual·Family 요금제에 포함된다고 표시돼 있습니다.", "detail": "<p>에이전트를 연결해도 전체 볼트가 열리지 않고, 브라우저 자동 입력(Agentic Autofill)으로 로그인하며, 새 계정 정보를 볼트에 저장할 수도 있습니다. 현재 Meta Muse와 Grok Bot에 순차 도입 중이고 대기자 명단이 있으며, <b>Claude Code 등 다른 에이전트 연동은 확인하지 못했습니다</b>. 승인 요청을 제때 처리하지 못했을 때의 동작도 페이지에 없습니다.</p>", "foryou": "<b>써보는 방법:</b> 지난 호의 Aside 같은 에이전트 브라우저에서 '비밀번호를 에이전트에 맡기지 않는 구조'가 어떤 경험인지 개인 계정으로 확인해 보세요. <b>전사 관점:</b> 에이전트 로그인 문제를 '비밀번호 공유 금지'로만 막기 어려워지고 있습니다. 승인 방식 로그인이 사내 비밀번호 관리 정책과 맞는지 보안팀과 논의할 만합니다."}, {"tag": "국내·일상", "source": "GeekNews Show GN (작성자 공개)", "url": "https://news.hada.io/topic?id=36007", "published": "2026-10-26", "title": "NanumPlayer — 어떤 영상이든 실시간 AI 자막을 띄워 주는 Windows용 무료 오픈소스 플레이어(GPL-2.0)", "summary": "국내 개발자가 만든 <b>mpv 기반 영상 플레이어</b>로, 재생 중 음성을 인식해 번역 자막을 실시간으로 띄웁니다. 로컬 파일, 유튜브, 웹페이지 영상에 적용되고 재생 없이 영상 전체를 SRT로 뽑을 수도 있습니다.", "detail": "<p>음성 인식은 whisper.cpp로 로컬 처리하고, 번역은 Ollama 호환 서버를 쓰며 <b>로컬과 클라우드 중 선택</b>할 수 있습니다. 클라우드를 고르면 자막 텍스트가 외부 서버로 나갑니다. 용어집으로 인물·지명 번역을 통일하고 존댓말·반말 같은 말투를 고를 수 있습니다. Windows 10/11 64비트, AVX2 CPU가 필요하고 NVIDIA GPU가 있으면 인식이 빨라집니다. 구체적인 번역 모델명은 글에 없습니다.</p>", "foryou": "<b>써보는 방법:</b> 일상에서는 외국어 강연·콘퍼런스 영상 시청에, 업무에서는 공개된 해외 AI 행사 영상을 빠르게 훑는 용도로 시험해 보세요. 개인 PC에서 <b>로컬 모드</b>로 먼저 쓰기를 권합니다. <b>전사 관점:</b> 사내 회의 녹화처럼 비공개 영상을 클라우드 번역 모드로 돌리면 외부 전송이 발생하므로 쓰지 않는 편이 안전합니다."}, {"tag": "코딩 에이전트 운영", "source": "GeekNews · 각 제품 공식 사이트·GitHub (제작사 설명)", "url": "https://corgi.computer/", "published": "2026-10-26", "title": "코딩 에이전트를 '관리'하는 도구 3종 — Corgi(여러 에이전트를 터미널에서 한눈에), AgentValley(Mac 메뉴바 상태), Sphinx(푸시 전 이해도 퀴즈)", "summary": "에이전트를 여러 개 돌리는 팀을 위한 신규 도구들입니다. <b>Corgi</b>는 작업 중·확인 필요 상태를 구분해 보여 주는 터미널 멀티플렉서이고, <b>Sphinx</b>는 AI가 쓴 코드를 푸시하기 전에 변경 동작을 예측하는 퀴즈를 풀게 합니다.", "detail": "<p>Corgi는 Claude Code·Codex·Pi·OpenCode를 지원하고 토큰 사용량을 top처럼 보여 주며 macOS·Linux·WSL에서 동작합니다(가격 미확인). Sphinx는 보호 브랜치 push를 Git에서 붙잡고 별도 리뷰어 모델이 만든 질문에 답하면 통과시키는 MIT 도구입니다. 주의할 점은 <b>변경된 코드가 리뷰어 모델 제공자에게 전송</b>되고, 설치가 전역 Git 훅 경로를 바꾸며, 호출 상한이 기본적으로 없다는 것입니다. 보안 게이트가 아니라 학습 도구라고 스스로 밝힙니다. AgentValley(Mac 메뉴바에서 Claude Code 상태 표시)는 Product Hunt 소개 문구만 확인했습니다.</p>", "foryou": "<b>써보는 방법:</b> 개인 프로젝트나 오픈소스 저장소에서 에이전트 2~3개를 병렬로 돌릴 때 Corgi를 써 보고, Sphinx로 '리뷰 병목'(1번 탭 지난 호)을 줄이는 대신 <b>작성자 이해도를 확인하는 방식</b>이 맞는지 체감해 보세요. <b>전사 관점:</b> 사내 코드를 외부 모델에 보내는 도구는 정보보안팀(#support-정보보안) 검토 전에는 사내 저장소에 쓰지 마세요."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.10.06~10.12</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});

})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
