const NL={meta:{icon:"🗞️",edition:"Vol.30",cadence:"주간",date:"2026년 8월 3일 (월)",curator:"Claude (Cowork)",title:["주간 AI 뉴스레터 — ","TPM Edition"],lead:"CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.",greeting:"안녕하세요! 이번 주부터 피드백을 반영해 구성을 바꿨어요. 해외 규제 조항이나 개발툴 체인지로그 디테일은 줄이고, 국내 AI 소식 비중을 높였습니다. 그리고 '국내외 AI 도입 사례' 탭을 새로 추가해 다른 조직이 실제로 AI를 어떻게 도입했는지도 함께 담았어요. <b>탭마다 'TPM 관점'</b>으로 실무에 어떻게 연결되는지 정리했습니다. 이번 호는 새 구성 확인용이니, 피드백 편하게 주세요."},topics:[{id:"top",label:"이 주의 핵심",icon:"⚡",tint:"red",desc:"이번 주 국내외 AI 소식 중 전사 의사결정에 가장 직접적으로 영향을 주는 한 가지.",criteria:"<b>프로그램 의사결정과 팀 운영에 직접 영향을 주는</b> 소식을 국내외 가리지 않고 선정했습니다.",highlight:{kicker:"이 주의 빅스토리",title:"국내 기업 AI 도입률 88%인데 전사 내재화는 7%뿐 — 확산의 관문은 '키맨'",summary:"딜로이트코리아와 한경 AX서밋 조사에 따르면 국내 기업의 88%가 최소 한 개 업무 기능에 AI를 활용 중이지만, AI가 전사적으로 완전히 배포·통합됐다고 답한 곳은 7%에 불과합니다. 근로자의 49%는 업무에서 AI를 전혀 쓰지 않는다고 답해, '도입'과 '실제 확산' 사이 간극이 여전히 크다는 점이 확인됐습니다.",detail:"<p><b>왜 이 격차가 생기나</b>: 현장 전문가들은 개발자가 아닌 각 조직의 '키맨(선도 사용자)'이 AI 활용 경험을 동료들에게 전파하는 구조가 확산의 실질적 관문이라고 지적합니다. AI를 잘 쓰는 개인은 늘고 있지만, 그 경험이 조직 표준 워크플로로 전환되지 못하면 전사 지표에는 반영되지 않습니다.</p><p>이는 해외 규제 뉴스보다 국내 CTO 조직이 당장 마주하는 훨씬 실질적인 병목입니다.</p>",source:"한국경제 (2026 한경 AX 서밋)",url:"https://www.hankyung.com/article/202607068325g",published:"2026-07-06",foryou:"전사 AI 도입 로드맵을 짤 때 '툴 배포'가 아니라 '키맨 발굴과 확산 프로세스'를 KPI에 넣는 걸 고려해보세요. 이번 주 '국내외 AI 도입 사례' 탭에서 실제로 이 격차를 좁힌 사례를 같이 다뤘습니다."},articles:[{tag:"국내 정책",source:"법률신문",url:"https://www.lawtimes.co.kr/news/articleViewAmp.html?idxno=223727",published:"2026-07",title:"AI기본법 시행령 개정안 국무회의 통과 — 'AI 제품·서비스 확인 제도' 신설",summary:"7월 14일 국무회의를 통과한 AI기본법 시행령 개정안에 따라 국가기관이 제품·서비스를 도입할 때 AI 제품·서비스를 우선 고려하는 '확인 제도'가 신설됩니다. 개정 AI기본법은 7월 21일부터 시행 중이며, 총 7종의 고시·가이드라인 초안도 함께 공개됐습니다.",detail:"<p>공공 부문을 AI 제품 테스트베드로 활용해 혁신 제품의 초기 레퍼런스를 만들어주려는 취지로, 공공 대상 사업을 하는 조직이라면 인증·확인 절차를 미리 파악해두는 게 유리합니다.</p>",foryou:"공공기관 대상 AI 서비스를 검토 중이라면 이 '확인 제도'가 진입장벽이자 기회가 될 수 있습니다. 과기정통부 고시·가이드라인 초안을 법무·정책팀과 함께 리뷰해보세요."},{tag:"해외 규제",source:"Technology.org",url:"https://www.technology.org/2026/07/17/eu-ai-act-what-actually-applies-on-2-august-2026/",published:"2026-07-17",title:"EU AI Act 투명성 규정 8월 2일 발효 — 고위험 의무는 2028년으로 연기",summary:"EU AI Act의 투명성 조항과 범용 AI 집행 권한이 8월 2일부로 시행됐습니다. 다만 '디지털 옴니버스' 개정으로 고위험 시스템 의무는 최대 2028년까지 늦춰져, 당장 전면 대응이 필요한 범위는 챗봇 등 투명성 고지 의무로 좁혀졌습니다.",detail:"<p>EU 대상 서비스에 AI 기능이 있다면 고위험 분류 여부보다 투명성 고지 문구부터 점검하는 게 우선입니다.</p>",foryou:"EU 이용자 대상 서비스가 있다면 투명성 고지 요건만 우선 점검하고, 고위험 분류 대응은 일정이 늦춰졌다는 점을 리더십에 함께 공유해 불필요한 긴급대응을 막으세요."}]},{id:"devtools",label:"개발 AI 동향",icon:"🛠️",tint:"purple",desc:"함께 일하는 엔지니어팀이 쓰는 AI 도구 변화 — 알아야 대화가 됩니다.",criteria:"버전·체인지로그보다 <b>팀 워크플로에 실제로 어떤 변화가 생기는지</b>를 기준으로 골랐습니다.",highlight:{kicker:"이 주의 개발 조직 사례",title:"토스·올리브영이 개발자 AI 활용을 조직문화로 만드는 법 — 'AI Surf Day'",summary:"토스는 4월부터 매주 금요일을 'AI Surf Day'로 정해, 본업은 월~목에 집중하고 금요일엔 AI로 자유롭게 실험하는 문화를 운영하고 있습니다. 앤트로픽·올리브영 등도 각자의 방식으로 개발자의 AI 활용 방식을 조직 차원에서 설계하고 있다는 사례가 함께 공유됐습니다.",detail:"<p><b>왜 이런 구조가 필요한가</b>: 토스는 슬랙 중심의 대화형 데이터 축적 문화 덕에 AI가 온보딩·맥락 파악 속도를 눈에 띄게 끌어올렸다고 설명합니다. 다만 AI 도구를 나눠주는 것만으론 부족하고, 사내 전문가가 매주 노하우를 공유하는 세션과 자율적인 소모임이 실제 확산을 이끌었다고 강조합니다.</p><p>'AI는 생산성 도구가 아니라 불필요한 일을 줄이는 도구여야 한다'는 토스의 원칙도 눈에 띕니다.</p>",source:"CIO Korea",url:"https://www.cio.com/article/4111488/%EA%B0%9C%EB%B0%9C%EC%9E%90-ai-%EC%A7%80%EC%9B%90-%EC%96%B4%EB%94%94%EA%B9%8C%EC%A7%80-%EC%99%94%EB%82%98%EC%95%A4%ED%8A%B8%EB%A1%9C%ED%94%BD%C2%B7%ED%86%A0%EC%8A%A4%C2%B7%EC%98%AC%EB%A6%AC.html",published:"2026-07",foryou:"'AI 도구 배포'와 '실제 활용'의 간극을 좁히려면 툴 지급보다 이런 정기 실험 세션이나 사내 전문가 네트워크를 먼저 설계하는 게 효과적일 수 있습니다. 우리 조직에 맞는 '주 1회 AI 실험 타임' 같은 파일럿을 검토해보세요."},articles:[{tag:"도구 업데이트",source:"GitHub Changelog",url:"https://github.blog/changelog/2026-07-29-copilot-code-review-agent-skills-and-mcp-now-generally-available/",published:"2026-07-29",title:"GitHub Copilot 코드 리뷰, 팀 표준을 직접 반영 — Agent Skills·MCP 정식 출시",summary:"GitHub Copilot 코드 리뷰가 Agent Skills와 MCP 서버 연결을 정식 지원하면서, 리뷰 결과가 Copilot의 범용 기준이 아니라 팀이 정의한 코딩 표준·보안 규칙을 반영하도록 바뀌고 있습니다. 그동안 'AI 리뷰는 참고만 하고 사람이 다시 본다'는 이중 검토 구조를 줄일 수 있는 계기로 평가됩니다.",detail:"<p><b>실질적 변화</b>: 팀의 아키텍처 가이드나 서드파티 보안 스캐너를 MCP로 연결하면, 신규 입사자의 PR도 팀 표준에 맞게 첫 리뷰부터 걸러집니다. 온보딩 기간과 리뷰어 부담을 동시에 줄이는 방향입니다.</p>",foryou:"코드 리뷰 자동화를 도입한다면 '범용 AI 리뷰'가 아니라 우리 팀 표준을 Agent Skill로 문서화하는 작업부터 시작하세요. 이게 되어야 리뷰 자동화가 실제로 신뢰받습니다."},{tag:"모델 라인업",source:"GitHub Changelog",url:"https://github.blog/changelog/2026-07-28-grok-4-5-is-now-available-in-github-copilot/",published:"2026-07-28",title:"GitHub Copilot 모델 라인업 개편 — Grok 4.5 추가, Gemini 구모델 지원 종료",summary:"GitHub Copilot이 xAI의 Grok 4.5(최대 50만 토큰 컨텍스트)를 추가하는 동시에 Gemini 2.5 Pro·Gemini 3 Flash 지원을 7월 31일부로 종료했습니다. 팀이 작업 성격에 따라 여러 벤더 모델을 오가는 멀티모델 전략이 본격화되는 흐름입니다.",detail:"<p>CI 파이프라인이나 워크플로에서 특정 모델명을 하드코딩해뒀다면 지원 종료 시점에 조용히 실패할 수 있어, 벤더 체인지로그 구독을 팀 운영 루틴에 넣어두는 게 안전합니다.</p>",foryou:"모델 선택권이 늘어날수록 '어떤 작업에 어떤 모델'이라는 팀 내 가이드라인이 필요해집니다. 지원 종료 일정은 특히 자동화 워크플로에 영향이 크니 미리 점검하세요."}]},{id:"tpm",label:"TPM 업무 자동화",icon:"📋",tint:"blue",desc:"로드맵·스프린트·문서화·커뮤니케이션에 바로 쓸 수 있는 AI 기능.",criteria:"<b>TPM 실무에 직접 적용 가능한</b> AI 도구 업데이트를 국내외 가리지 않고 골랐습니다.",highlight:{kicker:"국내 협업툴 업데이트",title:"카카오워크 2.0 — AI 에이전트 탑재하고 지라·노션 연결하는 MCP 생태계 구축",summary:"카카오워크가 AI 에이전트 '워크 AI'를 탑재한 2.0 버전으로 전환하며, 사내 문서 기반 지식 검색과 문의 자동 응답 기능을 제공합니다. 프로젝트 중심의 '채널·스레드' 기능과 함께, 지라·노션 등 외부 서비스를 MCP로 연결하는 생태계 구축 계획도 밝혔습니다.",detail:"<p><b>TPM에게 유용한 지점</b>: 메신저 기반으로 설계돼 업무 흐름을 유지하면서 문서 작업까지 이어지고, 관리자가 문서를 등록해두면 반복 문의를 AI가 대신 처리하도록 자동화할 수 있습니다. 국내 조직이 이미 쓰는 메신저 안에서 지라·노션 연동까지 가능해지면 도구 전환 비용 없이 자동화를 확장할 수 있습니다.</p>",source:"헤럴드경제",url:"https://biz.heraldcorp.com/article/10807833",published:"2026-07",foryou:"이미 카카오워크를 메신저로 쓰고 있다면, 신규 도구 도입보다 워크 AI의 지식검색·자동응답 기능부터 파일럿해보는 게 진입장벽이 낮습니다. MCP 연동 로드맵도 함께 확인해 지라·노션과의 연결 시점을 미리 파악해두세요."},articles:[{tag:"도구 업데이트",source:"Atlassian Community",url:"https://community.atlassian.com/forums/Jira-articles/Introducing-the-Jira-2026-Summer-Release/ba-p/3268349",published:"2026-07-27",title:"Jira 2026 Summer Release — 워크아이템을 Cursor·Claude Code·Copilot에 직접 할당",summary:"Atlassian이 Jira 워크아이템을 AI 코딩 에이전트에 직접 할당하거나 댓글에서 @멘션으로 작업을 트리거하는 기능을 정식 출시했습니다. 에이전트가 PR을 열면 원본 워크아이템에 자동으로 연결됩니다.",detail:"<p>Loom 녹화를 스페이스에 연결하면 Rovo가 회의 중 결정·액션아이템을 워크아이템 업데이트 초안으로 제안하는 기능도 함께 추가됐습니다.</p>",foryou:"'에이전트에 위임 가능한 작업'을 스프린트 계획 단계에서 미리 태그해두면 실제 할당까지 바로 이어질 수 있습니다. 자동 배정 규칙은 팀과 위임 범위를 합의한 뒤 켜세요."},{tag:"도구 업데이트",source:"Atlassian",url:"https://www.atlassian.com/blog/confluence/rovo-remix-3p-agents-confluence",published:"2026-07",title:"Confluence, 서드파티 MCP 에이전트를 몇 분 만에 연결",summary:"Confluence가 Lovable·Replit·Gamma 등 파트너 에이전트를 Rovo 디렉터리에 몇 분 만에 추가하는 기능을 선보였습니다. 워크스페이스 권한과 컨텍스트를 그대로 상속받아 접근 범위가 자동으로 제한됩니다.",detail:"<p>관리자가 각 에이전트의 MCP 서버를 개별 승인해야 최종 사용자가 쓸 수 있는 구조입니다.</p>",foryou:"여러 도구를 오가며 만드는 문서 작업이 반복된다면, Confluence 안에서 파트너 에이전트를 바로 호출하는 방식으로 컨텍스트 전환을 줄여보세요."},{tag:"도구 업데이트",source:"Windows News",url:"https://windowsnews.ai/article/copilot-cowork-hits-general-availability-as-microsoft-365-adds-claude-and-auto-install-in-july-overh.436600",published:"2026-07-22",title:"Microsoft 365 Copilot Cowork 정식 출시 — 협업형 다단계 업무 자동화, Claude도 선택 가능",summary:"Microsoft 365 Copilot의 협업형 다단계 업무 처리 기능 'Cowork'가 정식 출시(GA)됐습니다. 동시에 Copilot Chat에 Claude가 모델 선택지로 추가돼, 복잡한 분석이나 문서 이해 작업에 원하는 모델을 고를 수 있게 됐습니다.",detail:"<p>여러 팀의 산출물을 취합하는 보고서 작성처럼 반복적인 다단계 업무에 파일럿을 돌려볼 시점입니다.</p>",foryou:"모델을 Claude로 전환할 수 있게 된 만큼, 사내에서 이미 익숙한 모델로 통일해 결과물 품질 편차를 줄이는 것도 고려해보세요."}]},{id:"strategy",label:"빅테크 & 전략 동향",icon:"🌐",tint:"orange",desc:"리더십 보고와 프로그램 의사결정에 필요한 산업 맥락.",criteria:"해외 빅테크 일변도를 지양하고 <b>국내 빅테크·스타트업 전략도 비중 있게</b> 담았습니다.",highlight:{kicker:"국내 전략 이슈",title:"네이버, '에이전트N'으로 승부수 — 대화만으로 행동까지 수행하는 AI 에이전트",summary:"네이버가 '온서비스AI' 성과를 기반으로 대화형 AI 에이전트 '에이전트N' 고도화에 나섰습니다. 사용자 의도를 파악해 콘텐츠·상품·서비스를 연결하는 데서 나아가 실제 행동까지 수행하는 것이 특징으로, 카카오와의 AI 에이전트 경쟁이 하반기 본격화될 전망입니다.",detail:"<p><b>왜 지금 중요한가</b>: 네이버·카카오 모두 지난해 AI 사업 기반 구축을 마무리하고 올해부터 이용자 서비스와 결합한 AI 중심 전략을 본격화하는 단계입니다. 다만 수익화는 2027년부터 점진적으로 가능할 것이라는 전망이 나와, 당장의 매출보다 '에이전트 완성도' 경쟁이 이번 하반기의 핵심 변수입니다.</p>",source:"테크M",url:"https://www.techm.kr/news/articleView.html?idxno=148224",published:"2026-07",foryou:"국내 플랫폼의 에이전트 경쟁 구도는 우리 서비스가 이런 에이전트에 어떻게 연동되거나 대응할지에 대한 참고가 됩니다. 파트너십·API 연동 관점에서 네이버·카카오 에이전트 정책을 주시할 필요가 있습니다."},articles:[{tag:"국내 전략",source:"이투데이",url:"https://www.etoday.co.kr/news/view/2607433",published:"2026-07",title:"네이버·카카오 2분기 나란히 호실적 — 하반기는 'AI 진검승부'",summary:"네이버는 외형을 지키고 카카오는 내실을 다지며 2분기 실적을 나란히 방어했습니다. 두 회사 모두 하반기부터는 AI 에이전트 완성도를 앞세운 본격적인 경쟁 구도로 전환할 것으로 전망됩니다.",detail:"<p>지배구조 단순화 작업을 병행하는 카카오와, 온서비스AI 기반 확장을 이어가는 네이버 각각의 전략 차이도 눈에 띕니다.</p>",foryou:"두 회사의 AI 에이전트 전략 차이는 우리가 어느 쪽 생태계에 먼저 통합할지 판단할 때 참고할 수 있는 신호입니다."},{tag:"해외 전략",source:"AI Weekly",url:"https://aiweekly.co/alerts/openai-previews-astra-model-to-us-senators-in-washington",published:"2026-07-30",title:"OpenAI, 멀티에이전트 모델 'Astra' 상원의원 대상 시연",summary:"샘 알트먼이 7월 29일 워싱턴에서 미 상원의원들에게 차세대 모델 'Astra'를 시연했습니다. 여러 에이전트가 며칠에 걸쳐 협업해 수학·코딩 난제를 푸는 방식으로, 정식 출시명은 아직 정해지지 않았습니다.",detail:"<p>프론티어 모델 사전검토 체계가 자리잡는 가운데, 규제기관에 차세대 모델을 선제적으로 노출시켜 신뢰를 쌓으려는 행보로 해석됩니다.</p>",foryou:"장시간 자율 협업 모델이 현실화되는 신호입니다. 국내 에이전트 전략과 비교하며 필요한 승인·모니터링 체계를 미리 검토해두세요."},{tag:"모델 경쟁",source:"Artificial Analysis",url:"https://artificialanalysis.ai/models/deepseek-v4-flash",published:"2026-07-31",title:"DeepSeek V4 Flash 공개 베타 전환 — 초저가로 자사 대형 모델까지 앞질러",summary:"DeepSeek이 V4 Flash 업데이트 버전(0731)을 API 공개 베타로 전환했습니다. 입력 100만 토큰당 0.14달러의 초저가에도 일부 에이전트 벤치마크에서 자사의 1.6조 파라미터 대형 모델 V4 Pro를 앞서는 결과를 보였습니다.",detail:"<p>가격 대비 성능 경쟁이 계속 심화되는 흐름으로, 벤더 락인을 피하고 싶다면 저비용 오픈모델의 실제 업무 적용 가능성을 분기별로 재평가하는 루틴이 유용합니다.</p>",foryou:"국내 에이전트 전략과 별개로, 비용 효율이 중요한 워크로드가 있다면 이런 초저가 오픈모델을 대안으로 검토해볼 만합니다."}]},{id:"cases",label:"국내외 AI 도입 사례",icon:"📚",tint:"gray",desc:"국내외 기업이 AI를 실제로 어떻게 도입했는지 참고할 수 있는 케이스 스터디.",criteria:"<b>도입 배경, 성과·실패 요인, 조직 변화</b>를 다뤄 우리 조직에 적용한다면 어떻게 할지 참고할 수 있게 골랐습니다.",highlight:{kicker:"이 주의 도입 사례",title:"배달의민족, AI 리뷰 탐지로 허위 제보 83% 감소 — 사람이 아니라 '패턴'을 본다",summary:"배달의민족이 AI 탐지 모델로 리뷰 패턴을 분석해 같은 시간대 다수 계정에서 유사한 리뷰가 집중되는지 등을 판별한 결과, 허위 제보 건수가 83% 감소했습니다. 개별 리뷰의 텍스트가 아니라 계정·시간·패턴을 함께 보는 방식이 핵심입니다.",detail:"<p><b>왜 이 사례가 참고할 만한가</b>: 콘텐츠 필터링을 개별 건 단위로 접근하면 오탐과 누락이 반복되기 쉬운데, 행동 패턴(같은 시간대·유사 계정군)까지 함께 학습시키는 방식으로 정밀도를 끌어올렸습니다. 유사한 어뷰징 문제가 있는 다른 플랫폼 조직에도 적용 가능한 접근입니다.</p>",source:"Reboott AI",url:"https://www.reboott.ai/blog/enterprise-ai-use-cases-2026",published:"2026-07",foryou:"리뷰·제보·어뷰징 탐지처럼 '개별 건'보다 '패턴'이 중요한 업무가 있다면, 텍스트 분류 모델보다 계정·시간 등 행동 데이터를 결합한 탐지 구조가 더 유효할 수 있습니다. 사내 유사 사례가 있다면 이 접근을 벤치마크로 공유해보세요."},articles:[{tag:"국내 사례",source:"Reboott AI",url:"https://www.reboott.ai/blog/enterprise-ai-use-cases-2026",published:"2026-07",title:"한화, 사내 챗봇 'AIDA'로 법무 검색 시간 단축 — ChatGPT 기반 도메인 특화",summary:"한화그룹이 도입한 사내 챗봇 'AIDA'는 건설 법령, 시방서, 내부 지침을 연결해 담당자가 법규를 찾는 시간을 크게 줄이고 검토 실수 위험도 낮췄습니다. 범용 챗봇이 아니라 도메인 문서를 촘촘히 연결한 것이 핵심입니다.",detail:"<p>범용 LLM에 사내 문서를 단순히 얹는 것과, 실무자가 실제로 찾는 문서 구조에 맞춰 연결하는 것 사이엔 체감 효과 차이가 크다는 점을 보여주는 사례입니다.</p>",foryou:"사내 챗봇 도입을 검토한다면 '어떤 도메인 문서를, 실무자가 실제 찾는 방식으로' 연결할지부터 설계하세요. 문서 커버리지보다 검색 구조 설계가 체감 효과를 가릅니다."},{tag:"해외 사례",source:"DARVIS",url:"https://blog.dfinite.ai/ai-adoption-case-studies",published:"2026-07",title:"월마트, 전 직원 150만 명에게 AI 비서 — 슈퍼에이전트 4종으로 역할 분담",summary:"월마트가 고객용 '스파키', 공급업체용 '마티', 엔지니어용 '위비', 직원용 슈퍼에이전트까지 역할별로 AI 에이전트를 나눠 전 세계 11개국, 직원 150만 명 규모로 확산했습니다. 반면 스웨덴 핀테크 클라르나는 AI 도입과 자연 감소로 인력을 5000명에서 3000명으로 40% 줄인 사례도 함께 언급되며 대조를 이룹니다.",detail:"<p>월마트 방식의 특징은 '하나의 범용 AI'가 아니라 이해관계자별로 다른 에이전트를 설계했다는 점입니다. 같은 시기 클라르나 사례는 AI 도입이 인력 구조에 미치는 영향이 조직마다 크게 다를 수 있음을 보여줍니다.</p>",foryou:"AI 에이전트를 '하나로 통합'할지 '이해관계자별로 나눌지'는 조직 규모와 이해관계자 다양성에 따라 다른 정답이 나올 수 있습니다. 도입 로드맵을 짤 때 두 모델의 장단점을 먼저 비교해보세요."},{tag:"국내 사례",source:"Reboott AI",url:"https://www.reboott.ai/blog/enterprise-ai-use-cases-2026",published:"2026-07",title:"현대모비스, 제조 설비 제어·문서 검색에 생성형 AI 적용 — CVPR 우수 논문도 배출",summary:"현대모비스가 생성형 AI를 제조 설비 제어와 문서 검색에 적용해 실질적인 업무 효율성 향상을 이끌어냈습니다. 관련 연구는 컴퓨터비전 분야 최고 권위 학회 CVPR에서 우수 논문으로도 채택됐습니다.",detail:"<p>제조업 현장처럼 데이터가 정형화되지 않은 환경에서도 AI 적용이 가능하다는 점을 보여주는 사례로, R&D와 현장 적용을 함께 끌고 간 점이 특징입니다.</p>",foryou:"제조·물류처럼 비정형 데이터가 많은 현장 조직이 있다면, 이 사례처럼 '연구'와 '현장 적용'을 분리하지 않고 같은 팀이 끌고 가는 구조가 확산 속도에 유리할 수 있습니다."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.07.27~08.03</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 7월 27일~8월 3일 공개 뉴스 기반. 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
</html>
