const NL={meta:{icon:"🗞️",edition:"Vol.31",cadence:"주간",date:"2026년 8월 10일 (월)",curator:"Claude (Cowork)",title:["주간 AI 뉴스레터 — ","TPM Edition"],lead:"CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.",greeting:"안녕하세요! 이번 주는 AI 코딩 에이전트 3사(클로드 코드·제미나이 CLI·코덱스)의 보안 취약점이 동시에 드러나 개발 조직 전반에 점검이 필요해졌어요. 국내에서는 카카오가 카카오톡 안에서 바로 주문·결제까지 되는 에이전틱 커머스를 처음 실험했고, 네이버는 AI 인프라에 크게 베팅했습니다. <b>'국내외 AI 도입 사례' 탭</b>에는 정부의 전국 단위 AI 의료 전략과 우리은행의 175개 AI 에이전트 프로젝트를 담았어요."},topics:[{id:"top",label:"이 주의 핵심",icon:"⚡",tint:"red",desc:"이번 주 국내외 AI 소식 중 전사 의사결정에 가장 직접적으로 영향을 주는 것들.",criteria:"<b>프로그램 의사결정과 팀 운영에 직접 영향을 주는</b> 소식을 국내외 가리지 않고 선정했습니다.",highlight:{kicker:"이 주의 빅스토리",title:"클로드 코드·제미나이 CLI·코덱스, 기본 설정 그대로 뚫려 CI 비밀값 유출",summary:"보안업체 노비 시큐리티가 블랙햇 USA에서 3대 AI 코딩 에이전트(클로드 코드, 제미나이 CLI, 코덱스)를 각사 기본 배포 설정 그대로 공격해 CI 파이프라인의 API 키와 자격증명을 빼내는 데 성공했다고 발표했습니다. 저장소 접근 권한이 없는 외부인도 악성 풀 리퀘스트 하나로 CI 러너나 개발자 PC에서 명령을 실행할 수 있었고, 앤트로픽은 일부 사례를 취약점이 아닌 '설계대로 작동'이라고 해명해 논란이 이어지고 있습니다.",detail:"<p>노비 시큐리티는 클로드 코드의 명령어 검증기가 23개 안전 검사를 실행하기 전 단일 인용부호로 감싼 텍스트를 먼저 제거한다는 점을 악용해, git push 옵션 값에 심은 페이로드가 검사를 그대로 통과하도록 만들었습니다. 제미나이 CLI에서는 CVSS 10.0짜리 컨테이너 런처 명령 삽입 결함이, 클로드 코드에서는 허깅페이스 다운로드 카운터를 API 키 유출 통로로 바꾼 결함이 각각 발견돼 패치됐습니다.</p><p>실제 악용 사례는 아직 보고되지 않았지만, CI 파이프라인과 워크스페이스 신뢰 모델이라는 두 지점이 세 회사 도구에서 공통으로 취약하다는 점이 확인된 것 자체가 조직 차원의 신호입니다.</p>",source:"위키트리",url:"https://www.wikitree.co.kr/articles/1151154",published:"2026-08-08",foryou:"PR 브랜치를 체크아웃하기 전 .mcp.json·.claude/ 등 에이전트 설정 파일 변경 여부를 리뷰 체크리스트에 넣고, 신뢰할 수 없는 PR에 대해서는 CI 러너에서 에이전트 도구 실행 자체를 막는 정책을 이번 스프린트 안에 보안팀과 합의해 두는 것이 실질적인 액션입니다."},articles:[{tag:"국내 정책",source:"데일리시큐",url:"https://www.dailysecu.com/news/articleView.html?idxno=207954",published:"2026-08-07",title:"개인정보위, AI 시대 개인정보 규율 전면 재검토 — 8월 말까지 정책제안 접수",summary:"개인정보보호위원회가 반복적 동의 절차, 가명정보 국외이전, AI 에이전트의 개인정보 처리 책임 등 기존 법체계로 풀기 어려운 과제를 손보기 위해 태스크포스를 꾸리고 8월 6일부터 31일까지 국민 정책제안을 접수합니다. 연내 'AI 시대 개인정보 제도 혁신 방향'을 발표할 계획입니다.",detail:"<p>현행 개인정보 체계는 수집·이용·제공 때마다 동의를 받는 구조인데, AI 에이전트가 여러 서비스를 넘나들며 이용자를 대신해 업무를 수행하는 사례가 늘면서 매번 별도 동의가 필요한지, 사고 시 서비스 제공자와 외부 사업자 간 책임을 어떻게 나눌지가 쟁점으로 떠올랐습니다.</p><p>로봇·드론·스마트글라스 같은 피지컬 AI 기기가 주변 영상·음성·위치정보를 상시 수집하는 문제도 함께 다뤄지며, 접수된 제안 중 공감대가 큰 것은 공개 토론회를 거쳐 정책에 반영됩니다.</p>",foryou:"AI 에이전트·추천 기능을 기획 중이라면 이번 정책제안 창구에 실무 애로사항을 직접 제출해 향후 규율 설계에 우리 서비스 구조가 반영되도록 선제 대응하는 편이 나중에 법에 맞춰 서비스를 뜯어고치는 것보다 비용이 훨씬 적게 듭니다."},{tag:"국내 AI 모델",source:"전자신문",url:"https://www.etnews.com/20260804000053",published:"2026-08-04",title:"카카오, 자체 음성AI '카나나-o' 고도화 — 한국어 벤치마크서 GPT-4o 앞질러",summary:"카카오가 옴니 AI 모델 카나나-o의 음성 생성 기술을 고도화해 감정·억양·사투리까지 자연어 지시만으로 제어할 수 있도록 개선했습니다. 한국어 음성지시 이행 평가에서 94.50점을 기록해 GPT-4o-mini-tts(91.10점)를 앞섰습니다.",detail:"<p>이용자가 '슬픈 목소리로 읽어줘', '경상도 사투리로 읽어줘'처럼 자연어로 요청하면 속도·음량·음높이는 물론 감정·억양·강도까지 반영해 음성을 생성하며, 여러 조건을 동시에 담은 복합 지시도 처리할 수 있습니다.</p><p>새로운 음성 토크나이저를 적용해 생성 속도와 효율도 함께 높였으며, 카카오는 웃음·한숨 등 비언어적 표현 생성 기술도 추가 개발할 계획이라고 밝혔습니다.</p>",foryou:"국내 사업자가 특정 한국어 벤치마크에서 글로벌 빅테크 모델을 앞지른 사례로, 고객센터 음성봇이나 리뷰·공지 음성 안내처럼 한국어 특화 음성 UX가 필요한 영역이라면 해외 범용 모델 대신 국내 파트너 API 도입을 비용·품질 측면에서 비교 검토해볼 시점입니다."},{tag:"국내 기업 실적",source:"전자신문",url:"https://www.etnews.com/20260807000187",published:"2026-08-07",title:"네이버, 2분기 역대 최대 매출 — AI 검색·광고로 수익화 본궤도",summary:"네이버가 2026년 2분기 매출 3조3888억원(전년比 16.2%↑)으로 분기 역대 최대 실적을 기록했습니다. 대화형 AI 검색 'AI탭'은 출시 두 달 만에 월간활성이용자 1000만명을 넘었고, AI 브리핑 광고는 기존 검색광고보다 클릭단가·클릭률·구매전환율이 모두 30% 이상 높게 나타났습니다.",detail:"<p>최수연 대표는 검색·쇼핑·플레이스·결제가 연결된 풀퍼널 플랫폼 구조에서 AI 에이전트가 탐색부터 구매·예약까지 수행하는 환경이 본격화되면 거래 규모 확대의 성장 동력이 될 것이라고 밝혔습니다. 다만 AI 인프라 투자 영향으로 영업이익은 전년 대비 소폭(0.2%) 감소했습니다.</p>",foryou:"'AI 브리핑 광고 CTR·전환율 +30%'는 검색-추천-구매가 한 흐름에 있는 서비스에도 그대로 적용 가능한 벤치마크로, AI 추천·광고 상품 투자 우선순위를 정할 때 내부 ROI 가설 검증의 참고선으로 삼을 만합니다."}]},{id:"devtools",label:"개발 AI 동향",icon:"🛠️",tint:"purple",desc:"함께 일하는 엔지니어팀이 실제로 쓰는 AI 도구 변화 — 알아야 대화가 됩니다.",criteria:"버전·체인지로그보다 <b>팀 워크플로에 실제로 어떤 변화가 생기는지</b>를 기준으로 골랐습니다.",highlight:{kicker:"이 주의 엔터프라이즈 보안 대응",title:"클로드 코드, 사내 인프라 위에서 돌린다 — 앤트로픽 셀프호스팅 공개 베타",summary:"앤트로픽이 클로드 코드 세션을 고객사 자체 네트워크 안에서 구동하는 '셀프호스팅 환경'을 공개 베타로 열었습니다. 하루 앞서 발표한 '추론 후크(Inference Hooks)' 기능은 모든 프롬프트·툴 호출을 사내 보안 서버가 먼저 검사해 허용·차단을 결정합니다.",detail:"<p>셀프호스팅 환경은 Team·Enterprise 플랜 대상 공개 베타로, 리포지토리 체크아웃과 빌드 산출물, 시크릿이 앤트로픽 인프라가 아닌 고객 소유 서버에 남는다는 점이 핵심입니다. 다만 프롬프트·응답·툴 결과 자체는 여전히 추론을 위해 앤트로픽으로 전송되며, 도입 조직은 러너 이미지 관리와 오케스트레이션을 직접 담당할 엔지니어링 리소스를 마련해야 합니다.</p><p>추론 후크는 아직 차단·허용의 이진 판정만 가능한 초기 버전이지만, 기존에 이메일·웹 트래픽에 적용하던 DLP를 채팅과 클로드 코드, Cowork 세션까지 확장한다는 점에서 보안팀의 관심을 받고 있습니다.</p>",source:"Claude(Anthropic) 공식 블로그",url:"https://claude.com/blog/run-claude-code-sessions-on-your-own-compute",published:"2026-08-06",foryou:"결제·개인정보를 다루는 조직 내부망 격리가 필요한 팀부터 셀프호스팅 PoC 대상으로 우선순위를 매기고, 이번 호 '이 주의 핵심'에서 다룬 AI 코딩 에이전트 보안 이슈에 대한 실질적 대응책으로 추론 후크 도입을 함께 검토해보세요."},articles:[{tag:"모델 라인업",source:"GitHub Changelog",url:"https://github.blog/changelog/2026-08-06-kimi-k3-is-now-available-in-github-copilot/",published:"2026-08-06",title:"GitHub Copilot에 오픈 가중치 모델 'Kimi K3' 정식 탑재 — 코딩 AI 가격 경쟁 격화",summary:"GitHub이 Moonshot AI의 오픈 가중치 모델 Kimi K3를 Copilot 모델 피커에 정식 추가했습니다. 입력 토큰 100만 개당 3달러 수준의 저렴한 종량 과금으로 에이전틱 코딩에서 프론티어급 성능을 표방하며, VS Code·Visual Studio·Copilot CLI에서 바로 선택할 수 있습니다.",detail:"<p>Kimi K3는 Fireworks AI 인프라를 통해 GitHub이 호스팅하는 형태로 제공되며, Copilot Pro·Pro+·Max·Business·Enterprise 요금제 전반에서 모델 선택지로 노출됩니다.</p><p>클로드·GPT 계열 대비 훨씬 저렴한 가격표는 개발조직의 AI 코딩 비용 구조에 직접 영향을 줍니다. 반복적 코드 생성·테스트 작성처럼 품질 요구가 상대적으로 낮은 작업을 저비용 모델로 분리하는 식의 예산 최적화 논의가 늘어날 전망입니다.</p>",foryou:"사내 Copilot 라이선스 정책에 '작업 난이도별 모델 선택 가이드'를 넣을지 검토할 타이밍입니다. 리팩토링·테스트 코드처럼 리스크가 낮은 작업은 저가 모델로, 아키텍처 설계나 보안 관련 코드 리뷰는 상위 모델로 분리하면 팀 단위 AI 코딩 비용을 눈에 띄게 낮출 수 있습니다."},{tag:"국내 조직 문화",source:"데일리포스트",url:"https://www.thedailypost.kr/news/articleView.html?idxno=114437",published:"2026-06",title:"우아한형제들 해커톤 '우아톤 2026' — 기획부터 발표자료까지 전 과정 AI 의무화",summary:"우아한형제들이 7회째를 맞은 사내 해커톤 '우아톤 2026'을 열어 임직원 153명, 36팀이 참가해 역대 최대 규모를 기록했습니다. 기획·코드 구현·발표자료 작성까지 전 과정에서 AI 활용을 의무화한 12시간 집중형 방식으로 운영됐고, 예선에서는 AI가 코드·문서·데모를 분석해 채점하는 방식도 처음 도입됐습니다.",detail:"<p>개발자 없이 출전한 팀이 전체의 25%(9팀)에 달할 정도로 비개발 직군의 참여가 두드러졌습니다. 1위 팀은 고객·가게·라이더와 실시간 음성으로 통화하며 주문 조회·재배달·환불까지 처리하는 CS 콜봇 에이전트를 프로토타입으로 구현했습니다.</p><p>같은 시기 구성원 20여 명이 실무 AI 적용 사례를 담은 사내 서적을 출간하는 등, 해커톤을 넘어 상시적인 AI 활용 문화로 이어가려는 움직임이 병행되고 있습니다.</p>",foryou:"'AI 활용 의무화 + AI 1차 채점' 포맷은 다른 사내 대회·해커톤에도 이식 가능한 운영 모델입니다. 특히 비개발 직군 출전 비율(25%)은 AI 툴 교육 대상을 개발 조직 밖으로 얼마나 확대할지 판단하는 데 참고할 만한 실측 데이터입니다."}]},{id:"tpm",label:"TPM 업무 자동화",icon:"📋",tint:"blue",desc:"로드맵·스프린트·문서화·커뮤니케이션에 바로 쓸 수 있는 AI 기능.",criteria:"<b>TPM 실무에 직접 적용 가능한</b> AI 도구 업데이트를 국내외 가리지 않고 골랐습니다.",highlight:{kicker:"이 주의 협업툴 업데이트",title:"Jira 서머 릴리스, 스탠드업·용량 계획까지 대신하는 AI 에이전트 등장",summary:"Atlassian이 8월 5일 발표한 Jira 서머 2026 릴리스는 헬스체크·스탠드업 다이제스트·이해관계자 업데이트를 자동 처리하는 'Delivery Agent'와, 자연어 설명만으로 워크플로우·작업유형을 만들어주는 Rovo 스페이스 생성 기능을 담았습니다. 리스트·검색이 최대 48%, 보드·백로그가 최대 22% 빨라지도록 핵심 뷰가 재설계됐고, 팀별 여유·과부하 인력을 보여주는 Capacity 뷰도 새로 생겼습니다.",detail:"<p>Delivery Agent는 담당자가 매주 수작업으로 하던 헬스체크, 스탠드업 요약, 이해관계자 리포트를 자동화 템플릿으로 대체합니다. Jira Summary 뷰에서 몇 초 만에 설정할 수 있어, PM·TPM이 상태 보고 취합에 쓰던 시간을 실제 리스크 판단에 돌릴 수 있습니다.</p><p>Formula 필드는 잔여 예산, 마감까지 남은 일수 같은 계산식을 자연어로 설명하면 Rovo가 대신 작성해주며, Capacity 뷰는 백로그 바로 옆에서 팀별 가용 인력을 보여줘 툴 전환 없이 재배치 판단이 가능합니다.</p>",source:"Atlassian",url:"https://www.atlassian.com/blog/development/jira-summer-release",published:"2026-08-05",foryou:"여러 프로젝트를 동시에 관리하는 TPM이라면 Delivery Agent 자동화 템플릿부터 켜서 반복 상태 보고를 걷어내고, 대신 매주 Capacity 뷰로 팀별 과부하 여부를 점검하는 루틴으로 바꿔볼 만합니다."},articles:[{tag:"국내 협업툴",source:"카카오워크 블로그",url:"https://blog.kakaowork.com/277",published:"2026-08-05",title:"카카오워크 워크AI, 회의록·계약서 파일 첨부하면 바로 질의응답",summary:"카카오워크가 8월 5일 워크AI에 파일·이미지 첨부 기반 질의응답과 대화 히스토리 검색 기능을 추가했습니다. 회의록, 제안서, 계약서 등을 첨부해 필요한 내용을 바로 질문하고 메일·보고서 같은 후속 문서 작성까지 요청할 수 있습니다.",detail:"<p>기존에는 문서를 찾아 담당자에게 다시 확인하던 과정이 필요했지만, 이제 워크AI에 회의록·계약서 파일을 첨부한 뒤 바로 질의응답이 가능해졌습니다. 문서 기반 요약, 후속 메일·보고서 초안 작성까지 한 번에 이어갈 수 있습니다.</p><p>대화 히스토리 검색 기능은 지난 대화를 제목·내용으로 다시 찾을 수 있게 해, 반복 문의 대응이나 의사결정 근거 추적에 유용합니다.</p>",foryou:"메신저 안에서 회의록·계약서를 즉시 질의응답할 수 있다는 점은, 별도 노트테이킹 툴 없이도 카카오워크만으로 회의 후속 조치를 굴릴 수 있다는 뜻입니다. 팀 표준 회의 운영 가이드에 반영해보세요."},{tag:"회의 자동화",source:"Google Workspace Updates",url:"https://workspaceupdates.googleblog.com/2026/08/visual-screenshots-now-included-in-Google-Meet-meeting-notes.html",published:"2026-08-03",title:"구글 미트 회의록, 발표 화면 스크린샷까지 자동으로 남긴다",summary:"구글이 8월 3일부터 회의록 자동 작성 기능에 발표 화면 스크린샷 자동 캡처를 순차 적용한다고 발표했습니다. 음성 요약·트랜스크립트만으로는 놓치던 슬라이드, 차트, 아키텍처 다이어그램 같은 시각 정보를 회의록 문서에 함께 남길 수 있습니다.",detail:"<p>발표자가 화면 공유를 시작하면 Gemini가 캡처 사실을 알림으로 안내하며, 참석자는 노트 패널에서 해당 기능을 언제든 끌 수 있습니다. 관리자는 조직 단위로 항상 허용 또는 녹화 중일 때만 허용을 선택할 수 있습니다.</p>",foryou:"예산안이나 아키텍처 검토처럼 화면 공유 중심 회의가 많은 조직이면, 회의록에 텍스트 요약뿐 아니라 실제 슬라이드 캡처가 남아 나중에 담당자를 다시 찾는 일이 줄어듭니다. 도입 전 화면 캡처 저장 정책을 보안팀과 미리 조율해두세요."},{tag:"도구 업데이트",source:"Notion",url:"https://www.notion.com/releases/2026-07-31",published:"2026-07-31",title:"노션 AI 회의 노트, 끝나자마자 커스텀 에이전트가 후속 업무 자동 실행",summary:"노션이 AI 미팅 노트 작성이 끝나는 시점에 커스텀 에이전트를 자동으로 트리거하는 기능을 출시했습니다. 상태 트래커 업데이트, 프로젝트 채널에 요약 공유, 티켓 생성 같은 회의 후 반복 작업을 수작업 없이 자동 처리할 수 있습니다.",detail:"<p>회의가 끝나면 별도 조작 없이 커스텀 에이전트가 이어받아 후속 액션을 실행하므로, 회의록 정리와 태스크 배분 사이의 시차를 없앨 수 있습니다.</p><p>다만 8월 3일부터 개인 AI 사용량에 6시간·월간 이중 한도가 걸리므로, 회의가 많은 팀은 사용 패턴을 미리 점검해둘 필요가 있습니다.</p>",foryou:"회의마다 상태 업데이트·티켓 생성을 수동으로 반복하는 TPM이라면 이 트리거를 활용해 '회의 종료 = 후속 업무 자동 착수'로 워크플로우를 재설계할 수 있습니다."}]},{id:"strategy",label:"빅테크 & 전략 동향",icon:"🌐",tint:"orange",desc:"리더십 보고와 프로그램 의사결정에 필요한 산업 맥락.",criteria:"해외 빅테크 일변도를 지양하고 <b>국내 빅테크·스타트업 전략도 비중 있게</b> 담았습니다.",highlight:{kicker:"국내 전략 이슈",title:"카카오, 카톡 대화창서 쿠팡이츠 주문·결제까지 — '의도경제' 겨냥한 에이전틱 커머스 첫 실험",summary:"카카오가 8월 6일 2분기 실적 콘퍼런스콜에서 카카오톡 에이전틱 AI 서비스 '카나나 인 카카오톡'의 첫 연동 파트너로 쿠팡이츠를 공개했습니다. 카톡 대화방 안에서 AI가 메뉴를 추천하고 쿠팡이츠로 주문·결제까지 끝내는 구조로, 거래 검증 후 예약·여행·쇼핑 등으로 에이전트 생태계를 확장한다는 계획입니다. 2분기 매출·영업이익은 역대 최대를 냈지만 AI 서비스 부문은 580억원 영업손실을 기록해 수익화는 아직 시험대에 있습니다.",detail:"<p>정신아 대표는 콘퍼런스콜에서 인터넷·모바일 시대가 이용자의 시선을 확보하는 '주목 경제'였다면 에이전틱 AI 시대에는 의도를 이해해 행동으로 연결하는 '의도 경제'가 본격화할 것이라며, 광고 중심 플랫폼에서 거래 중개 플랫폼으로의 전환 의지를 밝혔습니다. 배달을 첫 버티컬로 택한 이유는 이용 빈도가 높고 구매 과정에서 사용자 개입이 적어 AI 추천이 실제 주문으로 이어지는 효과를 빠르게 검증할 수 있기 때문입니다.</p><p>다만 AI 서비스 부문은 전년 대비 손실 폭이 160억원 늘어난 580억원 적자를 기록해, 실제 수익화 성과로 이어질지가 하반기 최대 관전 포인트로 꼽힙니다.</p>",source:"한국경제",url:"https://www.hankyung.com/article/2026080692471",published:"2026-08-06",foryou:"메신저·슈퍼앱처럼 트래픽이 큰 자사 채널에 AI 에이전트를 붙일 때 '전사 동시 오픈'이 아니라 이용 빈도가 높고 사용자 개입이 적은 단일 버티컬로 파일럿해 거래 전환율부터 증명하는 방식은, AI 에이전트 기능 로드맵 우선순위를 짤 때 참고할 만한 순서 설계입니다."},articles:[{tag:"국내 전략",source:"전자신문",url:"https://www.etnews.com/20260807000008",published:"2026-08-07",title:"네이버, 역대 최대 매출 속 엔비디아와 AI 팩토리 베팅 — 2027년 매출화 시동",summary:"네이버가 2분기 매출 3조3888억원으로 분기 기준 역대 최대를 기록했지만, AI 인프라 투자 확대로 영업이익은 전년 대비 소폭 감소했습니다. 엔비디아·브룩필드와 데이터센터 계약을 맺고 2027년 상반기 55MW를 시작으로 2028년 200MW까지 AI 팩토리 용량을 확대할 계획입니다.",detail:"<p>네이버는 카카오와 달리 즉시 소비자 대면 서비스보다 인프라·플랫폼 사업(AI 팩토리)에 베팅하는 전략을 택했습니다. 확보한 자금은 정부의 3대 메가 프로젝트 중 하나인 1GW급 AI 데이터센터 구축에 투입되며, 매출화 시점은 2027년 상반기로 잡았습니다.</p><p>국내 양대 플랫폼이 하나는 소비자 접점의 에이전틱 커머스(카카오), 하나는 인프라·B2B형 AI 팩토리(네이버)로 서로 다른 승부수를 던지면서, 하반기 AI 수익화 경쟁의 두 가지 모델이 국내 시장에서 동시에 검증대에 오르게 됐습니다.</p>",foryou:"인프라 선투자형(네이버)과 서비스 파일럿형(카카오)이라는 두 갈래 AI 수익화 전략이 동시에 진행되는 사례로, 사내 AI 투자 우선순위(인프라 vs 기능)를 논의할 때 두 모델의 초기 손익 구조와 회수 시점을 비교 벤치마크로 삼을 수 있습니다."},{tag:"해외 전략",source:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-08-05/google-deepmind-boss-hassabis-moves-to-chair-role-in-shakeup",published:"2026-08-05",title:"구글, 데미스 하사비스 회장직 이동 — 딥마인드 조직 전면 개편",summary:"구글이 AI 리더십을 캘리포니아 본사로 집중시키며 딥마인드 수장 데미스 하사비스를 회장직으로 옮기고, 코레이 카부크추을루가 AI 연구·운영 전반을 총괄하도록 조직을 개편했습니다. 핵심 개발자 제프 딘 등이 회사를 떠나 창업에 나서는 등 인재 이탈 속에 알파벳 주가는 발표 직후 4% 하락했습니다.",detail:"<p>이번 개편은 앤트로픽·오픈AI와의 프론티어 모델 경쟁이 가속화되는 가운데 나왔습니다. 딥마인드가 런던 중심으로 운영되며 속도가 느려졌다는 내부 비판이 배경으로 지목되며, 이번 조치로 영국의 AI 연구 허브 지위도 흔들릴 수 있다는 우려가 나옵니다.</p><p>구글은 리더십을 한곳에 모아 의사결정 속도를 높이려는 목적이지만, 조직 개편 과정에서 핵심 인재가 이탈해 경쟁사로 흘러가는 역설적 상황도 함께 드러났습니다.</p>",foryou:"'조직을 통합해 속도를 높이려다 핵심 인재 이탈을 유발'하는 패턴은 사내 AI 조직 개편이나 TF 통폐합을 설계할 때 리스크 요인으로 미리 점검할 사례입니다."},{tag:"국내 전략",source:"쿠팡 뉴스룸",url:"https://news.coupang.com/archives/65494/",published:"2026-08-07",title:"쿠팡, AI 상품비교·리뷰요약 확대 — 탐색부터 구매결정까지 자동화",summary:"쿠팡이 AI 상품비교, AI 인포그래픽, 리뷰 요약 등 5개 이상의 AI 기능을 상품 상세페이지에 순차 적용했다고 밝혔습니다. 별도 챗봇 대화 없이 고객의 탐색 기록과 상품 정보를 기반으로 자동 비교 정보를 제공하는 방식이 특징입니다.",detail:"<p>기존 AI 쇼핑 기능들이 대부분 별도의 챗봇 대화창을 통해 작동했다면, 쿠팡은 사용자가 페이지를 탐색하는 흐름 자체에 AI를 자연스럽게 얹어 추가 입력 없이 비교·요약 정보를 노출하는 방식을 택했습니다.</p><p>가전 등 사양 비교가 복잡한 카테고리에는 AI 인포그래픽을 적용해 구매 결정 시간을 줄이는 데 집중했으며, 이는 카카오·네이버가 대화형 에이전트에 집중하는 것과 달리 기존 UX에 AI를 매끄럽게 통합하는 '비대화형 AI 적용' 접근으로 구분됩니다.</p>",foryou:"챗봇 UI를 새로 만들지 않고 기존 탐색 플로우에 AI 비교·요약을 얹는 '비대화형 AI 적용' 방식은, 신규 AI 기능 도입 시 사용자 학습비용과 초기 채택률 이슈를 줄이는 대안적 UX 전략으로 검토할 만합니다."}]},{id:"cases",label:"국내외 AI 도입 사례",icon:"📚",tint:"gray",desc:"국내외 기업이 AI를 실제로 어떻게 도입했는지 참고할 수 있는 케이스 스터디.",criteria:"<b>도입 배경, 성과·실패 요인, 조직 변화</b>를 다뤄 우리 조직에 적용한다면 어떻게 할지 참고할 수 있게 골랐습니다.",highlight:{kicker:"이 주의 도입 사례",title:"보건소부터 응급실까지 — 정부가 그리는 전국 단위 'AI 기본의료' 로드맵",summary:"정부가 8월 6일 국가정책조정회의에서 '범정부 AI 기본의료 전략'을 의결하고, 전국 보건소·취약지 의원에 영상판독·진료기록 자동화 AI 패키지를 보급하기로 했습니다. 국가 GPU 기반 공공의료 AI 플랫폼에 책임의료기관 72곳을 연결하는 '공공의료 AI 고속도로'도 하반기 9곳 시범 운영으로 시작합니다.",detail:"<p>이 사례는 전국 인프라를 하반기 9곳→2027년 30곳→2029년 72곳으로 단계적으로 넓히는 점진적 확산 모델을 취한다는 점에서, 조직 전체에 AI를 동시다발로 밀어붙이기보다 시범 거점을 먼저 검증한 뒤 확산하는 전략의 실제 사례로 읽을 수 있습니다.</p><p>데이터 허브 구축과 한국형 소버린 의료 AI 개발을 병행한다는 점에서, 인프라(데이터)와 애플리케이션(진단 보조 AI)을 분리해 순차 투자하는 구조도 눈에 띕니다.</p>",source:"전자신문",url:"https://www.etnews.com/20260806000250",published:"2026-08-06",foryou:"여러 부서에 AI를 동시에 밀어넣기보다 '시범 거점 소수 선정 → 성과 검증 → 단계적 확산' 방식의 롤아웃 계획서를 짤 때, 이번 전략의 단계별 확산 비율(9→30→72)을 참고 벤치마크로 인용할 수 있습니다."},articles:[{tag:"국내 사례",source:"이지경제",url:"https://www.ezyeconomy.com/news/articleView.html?idxno=233081",published:"2026-07 (경영전략회의 재확인)",title:"우리은행, '175개 AI 에이전트'로 은행 업무를 통째로 다시 짠다",summary:"우리은행이 금융권 최초로 기업여신·자산관리·내부통제·고객상담·업무자동화 5대 영역, 29개 핵심 업무에 175개 AI 에이전트를 전면 배치하는 엔터프라이즈 AX 프로젝트에 착수했습니다. 575개 후보 과제를 추려 12월 1차 97개, 내년 초 78개를 순차 출시하며 업무 처리 속도를 약 30% 끌어올릴 계획입니다.",detail:"<p>우리은행은 조직 개편까지 병행하며 AI 도입을 '기능 추가'가 아니라 '업무 프로세스 재설계'로 접근했습니다. 인력 감축이 아닌 동일 인원으로 더 많은 업무를 처리하는 것이 목표라고 선을 그은 점, AI 오류 책임을 은행이 그대로 지는 원칙을 명문화한 점이 특히 참고할 만합니다.</p><p>7월 하반기 경영전략회의에서도 AI 에이전트 도입과 데이터 기반 영업 재설계가 재확인돼, 발표에 그치지 않고 실제 로드맵대로 진행되고 있음을 보여줍니다.</p>",foryou:"전사 AI 전환을 설계할 때 '몇 개 부서에 챗봇 붙이기' 수준이 아니라, 575개 후보 중 175개를 추려낸 정량적 스코어링과 단계적 출시 로드맵, 그리고 'AI 오류 책임은 조직이 진다'는 명문화된 원칙이 실제 거버넌스 문서 작성에 바로 참고할 템플릿이 됩니다."},{tag:"국내 사례",source:"이지경제",url:"https://www.ezyeconomy.com/news/articleView.html?idxno=238480",published:"2026-08-07",title:"'배송회사'는 옛말 — CJ대한통운, AI·로봇으로 물류 판을 바꾼다",summary:"CJ대한통운이 AI 기반 과대포장 진단, 자동배차·수요예측, 휴머노이드 로봇 피킹·포장 실증 등으로 물류센터 운영 전반을 AI 중심으로 재설계하고 있습니다. 동시에 사내 공모전을 통해 AI 인재를 발굴해 채용까지 연계하는 등 기술 내재화에 나섰습니다.",detail:"<p>이 사례가 흥미로운 지점은 회사 스스로 '기술 투자가 곧바로 수익성 개선으로 이어지는 것은 아니다'라고 인정한 부분입니다. 초기 구축 비용과 예외 상황 대응력이 뒷받침되지 않으면 도입 자체가 목적이 되어버릴 위험을 경계한 것입니다.</p><p>AI 인재를 사내 공모전으로 직접 발굴·채용하는 방식은 외부 솔루션 구매에만 의존하지 않고 현장 문제를 아는 인력을 내재화하려는 시도로 볼 수 있습니다.</p>",foryou:"'도입 개수'가 아니라 '물류 처리량·정확도·비용 절감'으로 AI 성과를 측정하겠다는 기준 설정 방식은, 사내 AI 과제의 KPI를 도입률 대신 산출물 지표로 바꿔 보고하도록 유도하는 근거로 쓸 수 있습니다."},{tag:"해외 사례",source:"Tearsheet",url:"https://tearsheet.co/data/before-chasing-ai-bank-of-america-wants-banks-to-fix-their-data-first/",published:"2026-08-06",title:"뱅크오브아메리카가 말하는 AI 실패의 진짜 원인, '데이터'",summary:"뱅크오브아메리카는 '가장 큰 리스크는 과소 투자가 아니라 잘못된 투자'라며, 좋은 모델보다 표준화된 데이터가 먼저라는 원칙을 밝혔습니다. 흩어진 ERP·트레저리·은행 포털 데이터를 표준화한 뒤 자동화, 그다음에야 대규모 AI 투자로 넘어가는 순서를 지키며 직원용 AI 코파일럿도 이 원칙 위에서 구축했습니다.",detail:"<p>많은 기업이 더 똑똑한 모델을 쓰면 해결된다고 접근하지만, 뱅크오브아메리카는 정반대로 데이터 표준화 → 반복 업무 자동화 → AI 확대라는 순서를 명문화했습니다. CEO도 프론티어 모델에 신중한 태도를 유지하며 AI를 고위험 의사결정의 주체가 아니라 보조 단계로 한정하고 있습니다.</p><p>'빨리 도입 안 하면 뒤처진다'는 압박이 오히려 잘못된 투자로 이어지는 진짜 위험이라는 지적은, 성과 압박 속에서 AI 예산을 편성하는 조직이라면 곱씹어볼 만합니다.</p>",foryou:"AI 프로젝트 우선순위를 정할 때 '어떤 LLM을 쓸지'보다 '우리 데이터가 표준화·통합되어 있는지'를 선행 체크리스트로 두고, 데이터 정합성이 낮은 영역은 AI 대신 먼저 데이터 정비 과제로 분리해 로드맵에 넣는 것이 이번 사례의 실질적 시사점입니다."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.08.04~08.10</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 8월 4일~8월 10일 공개 뉴스 기반. 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
