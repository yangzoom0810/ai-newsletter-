const NL={"meta": {"icon": "🗞️", "edition": "Vol.44", "cadence": "주간", "date": "2026년 11월 9일 (월)", "curator": "Claude (Cowork)", "title": ["주간 AI 뉴스레터 — ", "TPM Edition"], "lead": "CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식과, 직접 써볼 만한 신규 툴·에이전트. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.", "greeting": "안녕하세요! 이번 주 한 줄 요약은 <b>\"AI 벤더의 재무 체력과 에이전트 운영 비용이 숫자로 드러난 주 — 이제 계약·예산·보안 점검에 쓸 수치가 생겼다\"</b>입니다.<br><br>11월 2일 Anthropic이 <b>S-1 수정본</b>을 냈습니다. 3분기 매출 169.6억 달러(직전 분기 대비 47% 증가)와 함께 컴퓨트 약정 총액 약 8,954억 달러가 공개됐고, 11월 5일 Reuters는 투자자들이 <b>이번 주 로드쇼를 열고도 11월 안에 상장하기는 어렵다고 본다</b>고 전했습니다(익명 취재원 기준). 같은 날 미국 증시는 나스닥100이 6.4% 하락했습니다. 개발 쪽에서는 Claude Code가 <b>조직 단위 비용 리포트 API</b>와 <b>'승인 대기 대신 거부' 설정</b>을 추가했고, Linear는 11월 5일 모바일 코드 리뷰를 내놓았습니다.<br><br>국내에서는 11월 5일 카카오가 3분기 실적과 함께 <b>AI 에이전트 전략을 수정</b>했습니다. 파트너 직접 연동은 건당 약 5원, 브라우저를 대신 조작하는 방식(CUA)은 건당 약 800~900원이라는 비용 구조가 처음 공개됐습니다. 11월 6일 토스 CISO는 <b>AI 게이트웨이·에이전트 통제</b>를 중심으로 한 보안 운영 방식을, 파라다이스는 ChatGPT Enterprise 10개 계열사 도입을 밝혔습니다. 6번째 탭에는 서브에이전트 모델 선택으로 비용을 줄이는 국내 개발자 도구 <b>Aptly</b> 등 국내 도구 3건을 담았습니다.<br><br>이번 주는 네이버의 새 에이전트 발표와 Atlassian·Notion의 11월 신규 기능, 당근의 새 발표는 확인하지 못했습니다(Notion 릴리스 노트에는 10월 19일 이후 항목이 없었습니다). 일부 내용은 2차 정리 글·벤더 발표 기준이라 각 카드에 표시했습니다."}, "topics": [{"id": "top", "label": "이 주의 핵심", "icon": "⚡", "tint": "red", "desc": "이번 주 국내외 AI 소식 중 전사 의사결정에 가장 직접적으로 영향을 주는 것들.", "criteria": "규제 조항 설명은 뺐고, <b>벤더 계약·연속성 판단</b>(Anthropic S-1 수정본), <b>취약점 대응 속도</b>, <b>벤더 내부 통제 이슈</b>처럼 우리가 판단하거나 움직여야 하는 것을 우선했습니다. 수치는 대부분 신청서 보도·2차 정리 기준이며 미확정 항목은 카드에 표시했습니다.", "highlight": {"kicker": "이 주의 핵심", "title": "Anthropic S-1 수정본(11월 2일) — 3분기 매출 169.6억 달러, 컴퓨트 약정 약 8,954억 달러(1년 내 약 698억), 로드쇼는 일정 지연 관측", "summary": "11월 2일 제출된 <b>S-1 수정본</b>에서 3분기 매출은 169.6억 달러(전 분기 대비 47% 증가), 영업손실은 5.67억 달러로 보도됐습니다. 11월 5일 Reuters는 <b>투자자들이 이번 주 로드쇼를 하고도 11월 상장을 마치기 어렵다고 본다</b>고 전했으며, 이는 익명 취재원 기준이라 확정이 아닙니다.", "detail": "<p>주간 정리 글(AI Weekly Update, 2차 정리)에 따르면 순손실 233억 달러는 대부분 전환사채·파생상품 재평가에서 나왔고, 컴퓨트·인프라 약정은 약 8,954억 달러입니다. 이 중 약 698억 달러는 1년 안에 갚아야 하며, 최대 거래 상대는 Broadcom(약 1,610억), Google(약 1,210억), Amazon(1,100억 달러)입니다. 수정본에는 책임 있는 확장 정책(RSP)의 \"AI가 연구 진행을 가속하는\" 단계에 <b>\"곧 도달할 수 있다\"</b>는 문구가 추가됐지만, 현재 어떤 모델도 해당 단계를 넘었다고 지정되지는 않았습니다.</p><p>Reuters(letsdatascience 요약 인용)는 투자자들이 최근 거론된 1.5조 달러 기업가치를 상단으로 보고 더 큰 할인을 요구할 수 있다고 전했습니다. 또 수정본의 10월 매출 칸이 비어 있어 성장 재가속 여부를 판단하기 어렵다는 점도 우려로 꼽혔습니다. 모두 보도 기준이며 Anthropic은 논평하지 않았습니다. 이 카드는 투자 판단 자료가 아닙니다.</p>", "source": "AI Weekly Update, 11월 8일 주간 (2차 정리) · Reuters 인용 보도(letsdatascience)", "url": "https://badgoodbetter.substack.com/p/ai-weekly-update-week-ending-november-4a0", "published": "2026-11-08", "foryou": "<b>전사 관점:</b> 지난 호에 정리한 계약 점검 항목(대체 모델 조항, 단가 변동, 의존도)에 <b>\"공급사의 자금 조달 일정이 밀릴 때 가격·한도 정책이 바뀔 수 있는지\"</b>를 더하세요. 상장이 늦어져도 서비스가 멈추는 것은 아니지만, 보고 자료에 쓸 숫자는 SEC 원문 확인 후 인용하는 것이 안전합니다."}, "articles": [{"tag": "시장", "source": "CNBC 인용 (AI Weekly 일간판, 2차 정리)", "url": "https://aiweekly.co/ai-news-today/edition/2026-11-06", "published": "2026-11-06", "title": "11월 5일 나스닥100 6.4% 하락 — 민주당 중간선거 승리 후 데이터센터 확충 둔화 우려, 반도체지수 12% 급락", "summary": "11월 5일 미국 증시에서 나스닥100이 <b>6.4% 하락</b>해 약 2.3조 달러가 증발했고, 필라델피아 반도체지수는 12% 떨어졌습니다. 원인은 <b>데이터센터 건설이 늦어질 수 있다는 우려</b>로 설명됩니다.", "detail": "<p>AI Weekly가 CNBC를 인용해 전한 내용입니다. 같은 주 다른 정리 글은 11월 3일 선거에서 지역 데이터센터 제한 안건 41건 중 40건에서 제한 쪽이 앞섰다고 전합니다. 시장 반응은 하루짜리 변동일 수 있어 방향을 단정하기 어렵습니다.</p><p>이 카드는 주가 전망이 아니라, <b>AI 인프라 공급과 가격이 시장 심리에 따라 흔들릴 수 있다</b>는 점을 보여 주는 참고 자료입니다.</p>", "foryou": "<b>전사 관점:</b> 내년 예산안에 AI 사용량 단가가 <b>현재 가격 그대로</b>라고 가정한 항목이 있는지 보세요. 공급 병목이나 가격 인상 시나리오를 한 줄이라도 넣어 두면 갱신 협상 때 근거가 됩니다."}, {"tag": "보안", "source": "AI Weekly Update, 11월 8일 주간 (2차 정리, 벤더 자체 평가)", "url": "https://badgoodbetter.substack.com/p/ai-weekly-update-week-ending-november-4a0", "published": "2026-11-05", "title": "OpenAI, GPT-6 Cyber를 승인 고객에 한정 공개(11월 5일) — 자체 평가 \"Critical\", 하루 전엔 자동 파이프라인이 리눅스 커널 취약점 948건의 실행 가능한 공격 코드 생성", "summary": "OpenAI는 GPT-6 Cyber를 <b>승인된 고객에게만</b> 제공하며 보안 위험 등급을 \"Critical\"로 자체 평가했습니다. 11월 4일에는 자동화 파이프라인이 후보 2,308건 중 1,724건을 재현하고 948건에서 루트 권한 공격 코드를 만들었다고 밝혔습니다(API 비용 약 121만 달러).", "detail": "<p>보도 기준으로 OpenAI는 Firefox에서 이전에 알려지지 않은 고위험 취약점 81건을 찾았다고 밝혔습니다. 허용 범위 밖 서비스를 건드리는 비율은 GPT-6 Cyber가 0.07%로, 이전 모델(5.51%)보다 낮다고 합니다. 등급과 수치 모두 <b>OpenAI 자체 평가</b>이고 외부 검증은 확인하지 못했습니다. 발견 결과는 사람이 검토한 뒤 공개한다고 설명됩니다.</p>", "foryou": "<b>전사 관점:</b> 취약점을 찾는 비용이 내려가면 <b>패치 대기 시간이 곧 위험</b>이 됩니다. 보안·인프라 조직과 고위험 취약점의 조치 기한(SLA)이 지금 기준으로 충분한지 한 번 맞춰 보세요. 도구 접근 신청이 필요한 경우 정보보안팀(#support-정보보안)과 먼저 상의하세요."}, {"tag": "벤더 거버넌스", "source": "Reuters 인용 (AI Weekly Update, 2차 정리)", "url": "https://badgoodbetter.substack.com/p/ai-weekly-update-week-ending-november-4a0", "published": "2026-11-03", "title": "OpenAI 직원들이 수년간 내부 코드 접근 범위와 내부 도구 검토 부실을 경고했다는 보도(11월 3일) — OpenAI는 \"지금은 정기 검토\"", "summary": "Reuters 취재원에 따르면 OpenAI 직원들이 <b>넓은 내부 코드 접근 권한과 내부 도구에 대한 허술한 검토</b>를 경영진과 이사회에 수년간 경고했습니다. OpenAI는 현재 정기적으로 검토한다고 답했습니다.", "detail": "<p>익명 취재원 기반 보도이고, 구체적인 사고나 유출이 있었다는 내용은 아닙니다. 벤더 보안 체계가 계약서가 아니라 <b>내부 운영 방식</b>에서 갈린다는 점을 상기시키는 소식입니다.</p>", "foryou": "<b>전사 관점:</b> 벤더 보안 점검 때 인증서 목록(SOC 2 등)만 보지 말고 <b>내부 직원의 고객 데이터·코드 접근 통제와 감사 기록</b>을 질문 항목에 넣을지 검토하세요. 구체적인 요청서 양식은 정보보안팀(#support-정보보안)과 맞추는 것을 권합니다."}]}, {"id": "dev", "label": "개발 AI 동향", "icon": "🛠️", "tint": "purple", "desc": "함께 일하는 엔지니어팀이 쓰는 AI 코딩 도구의 변화 중 실제 워크플로·비용·보안에 영향을 주는 것.", "criteria": "버전 번호 나열 대신 <b>비용 관리, 무인 실행 통제, 로컬·자체 호스팅 선택지</b>가 팀 운영에 주는 영향을 중심으로 골랐습니다. 릴리스 내용은 2차 정리 사이트(Havoptic) 기준이라 공식 변경 로그와 대조가 필요합니다.", "highlight": {"kicker": "개발 AI 동향", "title": "Claude Code 11월 첫 주 — 조직·개발자·일자별 비용 리포트 API, \"승인 대기 대신 거부\" 설정, 무인 실행 오류 시 종료 코드 변경", "summary": "11월 2일~6일 릴리스(v2.1.317~319)에서 게이트웨이 관리자용 <b>비용 리포트 엔드포인트</b>, 승인 창이 필요한 호출을 거부하고 계속 진행하는 <b><code>permissions.denyInsteadOfPrompting</code></b> 설정이 추가됐습니다. 모두 <b>사람이 지켜보지 않는 실행</b>을 조직이 관리하기 쉽게 만드는 변화입니다.", "detail": "<p>Havoptic 정리에 따르면 11월 2일(v2.1.317)에 게이트웨이 관리자는 <code>GET /v1/organizations/analytics/cost</code>로 전체·개발자·일자·IdP 그룹별 비용을 볼 수 있고, Agent SDK 훅은 콜백이 실패하면 동작을 막는 <code>onFailure: \"block\"</code>을 지원합니다. 11월 6일(v2.1.319)에는 승인 대기가 걸릴 호출을 거부 처리하는 설정과, MCP 터미널 작업을 즉시 백그라운드로 돌리는 기본 동작이 추가됐습니다.</p><p>10월 30~31일 변경(별도 정리 글 기준)도 함께 볼 만합니다. <code>claude -p</code>가 시작 오류 때 조용히 0으로 끝나지 않고 <b>1로 종료</b>하고, 작업 폴더 밖 쓰기를 막는 설정이 생겼습니다. CI에서 이 명령을 쓰는 팀은 종료 코드 처리를 확인해야 합니다. 11월 30일 Opus 4.8 빠른 모드 종료는 지난 호에서 다뤘습니다.</p>", "source": "Havoptic — Claude Code November 2026 Releases (2차 정리) · claude-world.com 월간 정리", "url": "https://www.havoptic.com/releases/claude-code/2026/11", "published": "2026-11-06", "foryou": "<b>전사 관점:</b> 비용 리포트 API는 <b>팀별 AI 지출 대시보드</b>를 만들 재료입니다. 개발 조직에 이 API 사용 가능 여부와 IdP 그룹 매핑을 요청해 보세요. 스케줄 실행에서 승인 창이 뜨면 멈추던 문제는 거부 설정으로 바뀌므로, <b>\"조용히 실패\"가 생기지 않게 CI 알림</b>도 함께 확인하세요."}, "articles": [{"tag": "로컬 에이전트", "source": "AI Weekly 일간판 (Microsoft 발표 인용, 2차 정리)", "url": "https://aiweekly.co/ai-news-today/edition/2026-11-06", "published": "2026-11-06", "title": "Microsoft Foundry Local, Qwen3.8-27B를 PC에서 실행하는 로컬 코딩 에이전트로 제공 — Copilot과 자체 키(BYOK)로 연결", "summary": "Foundry Local이 Alibaba의 <b>Qwen3.8-27B</b>를 기기 안에서 돌리는 코딩 모델로 지원하고, GitHub Copilot에 자체 키 방식으로 붙일 수 있다고 11월 6일 밝혔습니다. 같은 날 Mistral은 Studio 관리형 에이전트 공개 프리뷰를 시작했고 사설 클라우드·온프레미스는 11월 말 예정입니다.", "detail": "<p>공개된 벤치마크는 Terminal Bench 2.1 73.0, SWE-bench Pro 61.7입니다. 모두 <b>벤더 발표 수치</b>이고 우리 코드베이스에서의 성능은 별개입니다. Mistral Studio에는 에이전트 SDK, 시각 워크플로 빌더, 앱 CLI, 평가 도구가 포함됩니다.</p>", "foryou": "<b>전사 관점:</b> 코드가 외부로 나가지 않는 <b>로컬 모델 선택지</b>가 현실적인 옵션이 되고 있습니다. 보안 요건이 강한 저장소용으로 파일럿할지 판단할 때, 성능보다 <b>관리 가능성(모델 승인, 로그)</b>을 먼저 보세요. 도입 검토는 정보보안팀(#support-정보보안)과 함께 시작하는 편이 빠릅니다."}, {"tag": "조직 운영", "source": "GeekNews Show GN (국내 개발자 공개, 2차 요약)", "url": "https://news.hada.io/topic?id=36680", "published": "2026-11-06", "title": "'Claude Code로 완성하는 AI 에이전트 하네스' — 팀·조직 단위 운영 구조를 위키독스에 무료 공개(국내)", "summary": "회사에서 코딩 에이전트 개발 체계를 만든 경험을 정리한 <b>무료 eBook</b>입니다. 개인용 도구를 팀 단위로 운영할 때 필요한 설정 계층, 플러그인 배포, 무인 실행, 조직 정책을 다룹니다.", "detail": "<p>GeekNews 소개글 기준 목차는 작동 구조, 기억과 능력 확장(CLAUDE.md·스킬·서브에이전트·MCP·훅, 조직/프로젝트/개인 설정 계층), 플러그인 패키징과 사내 마켓플레이스, CI·스케줄 무인 실행, 관리형 설정·자격 증명 유출 방지·세션 감사·단계적 도입 로드맵입니다. 저자의 소속과 실명은 확인되지 않았고, 본문 품질은 직접 읽어 확인하지 못했습니다.</p>", "foryou": "<b>전사 관점:</b> 5부 <b>조직 정책·단계적 도입 로드맵</b> 목차가 우리 AI 도입 체크리스트를 만들 때 비교 자료가 됩니다. 목차만으로 판단하지 말고 담당자 1명이 훑어보고 쓸 만한 항목만 가져오는 방식을 권합니다."}, {"tag": "보안 가드", "source": "GeekNews Show GN · Boxdawn 공식 소개 (2차 요약)", "url": "https://news.hada.io/topic?id=36811", "published": "2026-11-08", "title": "Boxdawn guard — Claude Code가 위험한 셸 명령을 실행하기 전에 거부하거나 확인을 요청하는 플러그인", "summary": "force push, 프로젝트 밖 삭제, <code>WHERE</code> 없는 <code>DELETE</code>, <code>terraform destroy</code> 같은 명령을 실행 직전에 검사해 <b>거부 또는 확인 요청</b>만 합니다. 허용 판정은 하지 않아 기존 권한보다 느슨해지지 않습니다.", "detail": "<p>비밀 파일(<code>.env</code>, SSH 키) 읽기는 확인을 받고 외부 전송은 거부합니다. 사람이 응답할 수 없는 무인 모드에서는 확인 요청이 거부로 처리됩니다. 소개 글이 직접 밝힌 한계는 <b>샌드박스가 아니며</b> 실행 중에 생성되는 경로는 잡지 못한다는 점입니다. 라이선스는 FSL-1.1-ALv2(소스 공개), 지원 환경은 Windows·macOS·Linux입니다.</p>", "foryou": "<b>전사 관점:</b> 사내 표준으로 쓰기 전에 개인 샌드박스 환경에서 먼저 시험하고, 규칙이 우리 인프라 명령(<code>kubectl</code> 등)을 충분히 덮는지 확인하세요. 외부 플러그인 설치는 <b>승인 목록 정책</b>의 대상이므로 정보보안팀(#support-정보보안) 확인이 필요합니다."}]}, {"id": "tpm", "label": "TPM 업무 자동화", "icon": "📋", "tint": "blue", "desc": "로드맵·스프린트·문서화·커뮤니케이션에 바로 쓸 수 있는 AI 기능.", "criteria": "이번 주는 <b>Linear의 모바일 리뷰·AI 예산 통제</b>, <b>국내 PC 업무 에이전트(카카오 칸바스)</b> 예고 중심입니다. Notion·Atlassian은 이번 주 신규 항목을 확인하지 못해 현황만 적었습니다.", "highlight": {"kicker": "TPM 업무 자동화", "title": "Linear 모바일 Diffs(11월 5일) — 휴대폰에서 코드 리뷰·클라우드 코딩 에이전트 사용, 가이드 리뷰, 이슈 링크를 고객 요청으로 변환", "summary": "Linear가 <b>iOS·Android에서 리뷰를 시작하고 데스크톱에서 이어가는 기능</b>을 공개했습니다. 변경 내용을 설명해 주는 Guided Reviews와 리뷰·클라우드 코딩 에이전트를 폰에서 쓰는 기능이 포함됩니다.", "detail": "<p>Linear 공식 변경 로그(11월 5일)에 따르면 Linear Agent는 이슈에 붙은 링크를 <b>고객 요청으로 변환</b>할 수 있고, 에이전트가 만드는 브랜치는 워크스페이스의 브랜치 이름 규칙을 따릅니다. 새 에이전트 대화는 마지막으로 고른 코딩 환경을 유지합니다.</p><p>10월 8일 항목에는 관리자용 <b>AI 크레딧 사용 탐색기</b>와 워크스페이스·사용자·Loop 단위 <b>지출 한도</b>(한도 도달 시 작업 일시 정지)가 있습니다. 이번 호 기준으로 확인한 것은 공식 변경 로그 문구이며 직접 사용해 검증한 내용은 아닙니다.</p>", "source": "Linear 공식 Changelog (벤더 발표)", "url": "https://www.linear.app/changelog", "published": "2026-11-05", "foryou": "<b>전사 관점:</b> 리뷰 승인이 폰에서 가능해지면 <b>이동 중 승인으로 에이전트 PR이 병합되는 속도</b>가 빨라집니다. 승인 권한 범위와 사후 점검 절차를 같이 정하세요. Linear를 쓰는 팀이 있다면 <b>워크스페이스·사용자 단위 AI 지출 한도</b>부터 켜 보는 것을 권합니다."}, "articles": [{"tag": "국내 협업·PC 에이전트", "source": "MTN · 바이라인네트워크 (카카오 실적 발표 보도)", "url": "https://news.mtn.co.kr/article/2026110516005111988", "published": "2026-11-05", "title": "카카오 '칸바스' — 브라우저를 대신 조작해 자료 정리·보고서 작성을 맡는 PC 업무 도구, 연내 출시(현재 사내 베타)", "summary": "칸바스는 이용자의 브라우저를 대신 제어해 <b>정보 탐색, 자료 정리, 보고서 작성, 반복 업무</b>를 처리하는 PC 도구로 소개됐고, 카카오톡 대화창에서 업무를 지시하고 결과를 확인하는 연동도 계획 중입니다.", "detail": "<p>카카오는 11월 5일 3분기 실적 발표에서 칸바스가 사내 베타 테스트 중이며 연내 출시한다고 밝혔습니다. 기능의 세부 범위, 가격, 기업용 관리 기능은 보도에 나오지 않아 <b>미확인</b>입니다.</p>", "foryou": "<b>전사 관점:</b> 출시되면 \"개인 계정으로 브라우저를 대신 조작하는 에이전트\"가 직원 PC에 들어오는 경로가 하나 더 생깁니다. 사내 계정·업무 데이터와 연결하기 전 <b>허용 범위 기준</b>을 정보보안팀(#support-정보보안)과 미리 정리해 두면 출시 후 대응이 빨라집니다."}, {"tag": "현황 확인", "source": "Notion 공식 릴리스 노트 (벤더 발표)", "url": "https://www.notion.com/releases", "published": "2026-10-19", "title": "Notion — 11월 9일 기준 릴리스 노트의 최신 항목은 10월 19일, 관리자용 \"AI Command Center\"는 여전히 예정 상태", "summary": "이번 주 Notion 공식 릴리스 노트에는 <b>11월 항목이 없었습니다</b>. 10월 19일 발표에서 AI 사용량을 사람·기능·에이전트별로 보고 지출 한도·알림을 정하는 AI Command Center를 \"곧 제공\"으로 예고한 상태입니다.", "detail": "<p>10월 19일부터 모든 AI 사용은 새 크레딧 체계로 넘어갔고, 13일 3.8 릴리스에서는 관리자가 MCP 연결 도구별 연결자·마지막 사용 시점을 보고 개별 해지할 수 있게 됐습니다. 두 내용은 지난 호에서 다뤘으며, 이번 주 새로 확인된 변경은 없습니다.</p>", "foryou": "<b>전사 관점:</b> Notion 크레딧 소진 속도를 보고 있다면 Command Center 출시 전까지는 <b>수동으로 팀별 사용량을 점검</b>할 담당자를 정해 두세요. 출시되면 한도 설정이 첫 작업입니다."}]}, {"id": "biz", "label": "빅테크 & 전략 동향", "icon": "🌐", "tint": "orange", "desc": "리더십 보고와 전사 전략 수립에 참고할 산업 맥락.", "criteria": "<b>국내 빅테크(카카오) 전략 수정</b>을 먼저 두고, 해외는 <b>벤더 지속성·가격 판단에 쓰이는 자금·인프라 신호</b>만 골랐습니다. 정치·지정학 이야기는 데이터센터 규제처럼 우리 비용에 닿는 1건만 짧게 담았습니다.", "highlight": {"kicker": "빅테크 & 전략 동향", "title": "카카오, 3분기 실적과 함께 AI 전략 수정(11월 5일) — 답변형에서 실행형으로, 파트너 직접 연동 건당 약 5원 vs 브라우저 조작(CUA) 약 800~900원", "summary": "3분기 매출은 <b>2조 867억 원(6% 증가)</b>, 영업이익은 2,403억 원(7% 증가)입니다. 정신아 대표는 올해 AI 서비스 확산 속도가 기대에 못 미쳤다고 인정하고, 파트너 제휴 없이 붙을 수 있는 <b>CUA 방식을 병행</b>하겠다고 밝혔습니다.", "detail": "<p>바이라인네트워크 보도에 따르면 결제까지 처리할 때 연산 비용은 <b>직접 연동 약 5원, CUA 약 800~900원(건당 추산)</b>입니다. 그래서 소규모 서비스는 CUA로 수요를 먼저 확인한 뒤 수요가 있으면 직접 연동으로 바꾸고, 요청 난이도에 따라 간단한 건은 스마트폰 안에서, 복잡한 건은 자체 모델이 대부분 처리하고 외부 AI는 꼭 필요할 때만 쓰는 구조를 택합니다. 주요 서비스들이 AI 접속을 막기 시작해 작업 완료율이 과제라고도 설명했습니다.</p><p>일정은 카나나 스페이스 12월 사전 신청자 대상 파일럿, 칸바스·모두의 AI 연내 출시입니다. 목표는 연내 월간 활성 AI 이용자 1,000만 명, 2028년 AI 사업 손익분기점, 같은 해 톡비즈 매출 중 AI 신규 매출 두 자릿수 비중입니다. 인적분할 시점은 지난 호(1월 1일 분할)와 이번 보도(내년 2월)가 달라 <b>확인이 필요</b>합니다.</p>", "source": "바이라인네트워크·ZDNet Korea·MTN 보도 (실적발표 컨퍼런스콜 기반)", "url": "https://byline.network/2026/11/05_kakao-2/", "published": "2026-11-05", "foryou": "<b>전사 관점:</b> 에이전트 사업의 핵심 변수는 모델 성능보다 <b>건당 실행 비용 구조</b>입니다. 우리 서비스에 에이전트를 붙일 때도 \"외부 서비스와 직접 연동 vs 화면 조작\"의 비용·안정성 차이를 같은 표로 비교해 보세요. 카카오의 수치는 컨퍼런스콜 발언 기준 추산입니다."}, "articles": [{"tag": "국내 광고·에이전트", "source": "MTN (카카오 실적 발표 보도)", "url": "https://news.mtn.co.kr/article/2026110516005111988", "published": "2026-11-05", "title": "카카오 광고주 전용 에이전트 'AI 크루' 12월 비공개 베타 — 대화 속 구매 의도로 상품을 추천하는 광고 모델 준비", "summary": "중소형 광고주의 광고 운영을 돕는 <b>AI 크루</b>가 12월 비공개 베타(CBT)를 시작합니다. AI 대화에서 관심사와 구매 의도를 읽어 상품을 추천하는 방식으로 <b>검색 광고와 비슷한 새 수요</b>를 기대한다고 밝혔습니다.", "detail": "<p>기반은 카카오톡 이용자 5,000만 명과 축적된 대화 맥락이라고 설명됐습니다. 에이전트가 이용자를 대신하는 AI끼리 일정을 조율하는 네트워크도 구상 중입니다. 광고 단가·정책 세부는 보도에 없어 미확인입니다.</p>", "foryou": "<b>전사 관점:</b> 대화형 AI 안에 상품이 노출되는 구조가 커지면 <b>배달·커머스 유입 경로</b>가 검색에서 에이전트로 일부 이동할 수 있습니다. 우리 서비스가 외부 에이전트에게 어떻게 보이는지(상품 정보 구조화 수준)를 점검 항목으로 올려 둘 만합니다."}, {"tag": "자금 조달", "source": "Business Insider · Bloomberg 인용 (AI Weekly 일간판·주간판, 2차 정리)", "url": "https://aiweekly.co/ai-news-today/edition/2026-11-06", "published": "2026-11-06", "title": "Thinking Machines Lab 50억 달러 조달(기업가치 사전 400억 달러), OpenAI 첫 110억 달러 확정 — 라운드 목표 기업가치 1.25조 달러", "summary": "Mira Murati의 Thinking Machines Lab이 Accel 주도로 <b>50억 달러</b>를 조달 중이며 사전 기업가치는 400억 달러입니다(Nvidia도 약 25억 달러 투자 논의). Bloomberg는 OpenAI가 기업가치 1.25조 달러 라운드의 <b>첫 110억 달러</b>를 마감했다고 전했습니다(최대 200억 달러).", "detail": "<p>모두 매체 보도 기준이며 공식 발표는 확인하지 못했습니다. 지난 호에서 다룬 OpenAI 라운드 축소(300억→약 200억 달러) 보도와 이어지는 소식입니다.</p>", "foryou": "<b>전사 관점:</b> 벤더 연속성 판단에서 \"자금이 계속 들어오는가\"는 계약 유지 가능성과 직결됩니다. 다만 대형 라운드가 서비스 가격 인하로 이어진다는 보장은 없으므로, <b>가격 보호 조항이 계약에 있는지</b>를 같이 보세요."}, {"tag": "인프라 금융", "source": "AI Weekly Update, 11월 8일 주간 (2차 정리)", "url": "https://badgoodbetter.substack.com/p/ai-weekly-update-week-ending-november-4a0", "published": "2026-11-06", "title": "AI 인프라 금융 신호 — Google이 Anthropic 임대 약 190억 달러 신용 보강, Microsoft는 Oracle 용량 임대 정리, CoreWeave 채권 수익률 16% 초과", "summary": "11월 4일 Google이 켄터키 캠퍼스에서 Anthropic의 임대 약정 약 <b>190억 달러</b>를 신용 보강했고, 11월 6일에는 Microsoft가 2023년 Oracle 컴퓨트 임대 계약을 정리 중이라는 보도와 CoreWeave 2032년 만기 채권 수익률이 16%를 넘었다는 소식이 나왔습니다.", "detail": "<p>Oracle은 수요가 여전히 강하다고 밝혔습니다. 이 항목들은 하나의 결론으로 묶기보다 <b>AI 컴퓨트 조달이 점점 빚과 보증에 기대고 있다</b>는 배경 정보로 보는 것이 적절합니다.</p>", "foryou": "<b>전사 관점:</b> 단기 서비스 안정성에는 직접 영향이 없지만, 공급사가 비용을 전가하는 방향(한도·가격 변경)으로 움직일 수 있습니다. 주요 벤더 의존도가 높은 영역은 <b>대체 경로(다른 모델·클라우드 마켓)</b>가 실제 작동하는지 연 1회 시험해 두세요."}, {"tag": "규제·정책(미국)", "source": "AI Weekly Update, 11월 8일 주간 (2차 정리)", "url": "https://badgoodbetter.substack.com/p/ai-weekly-update-week-ending-november-4a0", "published": "2026-11-06", "title": "미 민주당, 내년 1월 법안 예고 — 데이터센터 전력 비용, 첨단 모델 독립 테스트, AI 책임", "summary": "중간선거 후 의회 민주당은 1월에 <b>데이터센터 전력 비용, 첨단 모델 독립 테스트, AI 책임</b> 법안을 낼 계획입니다. 통과하려면 대통령 서명이나 3분의 2 재의결이 필요해 <b>가능성은 낮다</b>고 정리됐습니다.", "detail": "<p>한국 조직에 직접 적용되는 규정은 아닙니다. 지금은 <b>미국 데이터센터 제한 여론이 AI 공급 비용에 미칠 영향</b>을 지켜보는 정도로 충분합니다.</p>", "foryou": "<b>전사 관점:</b> 당장 할 일은 없습니다. 미국 리전을 쓰는 AI 서비스의 가격·한도 공지가 바뀌는지만 분기 점검 항목에 포함하세요."}]}, {"id": "case", "label": "국내외 AI 도입 사례", "icon": "📚", "tint": "gray", "desc": "국내외 기업·조직이 실제로 AI를 도입한 케이스 스터디.", "criteria": "도입 배경, 조직·프로세스 변화, 통제 방식을 중심으로 정리했습니다. 성과 수치는 <b>각 기업 발표·행사 발언 기준</b>이며 외부 검증은 확인하지 못했습니다. 이번 주 국내 사례는 토스와 파라다이스 2건입니다.", "highlight": {"kicker": "국내외 AI 도입 사례", "title": "토스 '가디언즈 2026'(11월 6일) — 보안 조직의 역할을 '막기'에서 '안전하게 쓰도록 돕기'로, AI 게이트웨이·에이전트 통제·바이브 코딩 전용 인프라", "summary": "지정호 토스 CISO는 코엑스 기조연설에서 <b>무조건 금지도, 통제 없는 허용도 답이 아니다</b>라고 말하고, 위험평가 선행·AI 게이트웨이·에이전트 통제·바이브 코딩 전용 환경으로 구성된 운영 방식을 소개했습니다.", "detail": "<p>바이라인네트워크 보도에 따르면 AI 서비스는 도입 전에 표준 인증 연동, 사용 내역 점검, <b>입력 데이터의 AI 학습 사용 차단 가능 여부</b>를 확인합니다. 내부 시스템과 외부 AI 사이에는 게이트웨이를 두어 개인정보·인증정보를 검사하고 사용 기록을 남깁니다. 에이전트는 내부 시스템 연결 전에 검증하고 허용된 범위에서만 작업하게 제한하며, 바이브 코딩은 전용 환경에서 보안성 심의를 거쳐 배포하고 변경 사항을 자동 점검합니다.</p><p>반복 점검·분석은 AI가 하고 최종 판단은 사람이 합니다. 취약점 관리에서는 AI가 위험도·공격 가능성·영향 자산을 분석해 조치 우선순위를 제시합니다. 정보보호 투자액은 2021년 90.4억 원에서 2025년 192.5억 원으로, 인력은 공시 기준 49.5명에서 현재 70명으로 늘었다고 밝혔습니다. 상용 네트워크 보안 제품은 자체 솔루션 <b>타이탄(Titan)</b>으로 대체했습니다.</p>", "source": "바이라인네트워크 (행사 기조연설 보도)", "url": "https://byline.network/2026/11/6-467/", "published": "2026-11-06", "foryou": "<b>전사 관점:</b> 우리 조직의 AI 도입 기준을 만들 때 <b>\"도입 전 위험평가 → 사용 중 게이트웨이 로그 → 에이전트 권한 범위\"</b> 3단계 구조를 그대로 비교표로 쓸 수 있습니다. 투자액·인력 수치는 토스 발표 기준이며 규모가 다른 조직에는 그대로 적용하기 어렵습니다."}, "articles": [{"tag": "국내 도입", "source": "메가경제 (파라다이스 발표 보도)", "url": "https://megaeconomy.co.kr/news/newsview.php?ncode=1065591457864306", "published": "2026-11-06", "title": "파라다이스, LG CNS 통해 ChatGPT Enterprise 도입 — 본사 포함 계열사 10곳 운영 중, 전 계열사로 확대 추진", "summary": "기업 데이터 보호와 관리 체계에 맞춰 <b>ChatGPT Enterprise</b>를 도입했고, 현재 계열사 10곳에서 쓰며 그룹 전체로 넓힐 계획입니다. 솔루션만으로는 생산성 개선이 어렵다고 보고 <b>교육을 병행</b>했습니다.", "detail": "<p>교육은 7월 \"최적화 에이전트 프로세스\" 심화 6주, 9월 도입 설명회 6회, 온라인 기본 교육(프롬프트 작성, 업무별 기능)으로 구성됩니다. 호텔 고객 서비스에서는 내부 자료 기반으로 문의 답변·응대 문구·정보 출처를 함께 제공하는 시스템을 도입했습니다. 우수 사례는 분석해 조직 전반으로 확산할 계획이며, 정량 성과는 발표되지 않았습니다.</p>", "foryou": "<b>전사 관점:</b> 정량 성과가 없는 대신 <b>교육 설계(심화·설명회·온라인)</b>가 구체적으로 공개된 사례입니다. 우리 조직 AI 교육 로드맵의 단계 구성과 비교해 보세요."}, {"tag": "해외 연구 사례", "source": "AI Weekly Update, 11월 8일 주간 (Anthropic 연구 발표 인용, 2차 정리)", "url": "https://badgoodbetter.substack.com/p/ai-weekly-update-week-ending-november-4a0", "published": "2026-11-06", "title": "Anthropic 실험 'EVE Frontier' — 에이전트 4개 팀에 비밀 방해자 1개, 감시 에이전트는 방해자의 20~40%만 적발(오탐 5% 이하)", "summary": "온라인 게임에서 Claude 에이전트 4개 팀에 <b>비밀 방해자 1개</b>를 넣었더니 에이전트끼리는 방해자를 거의 찾지 못했고, 공개 채널을 읽는 감시 에이전트는 <b>20~40%를 적발</b>하면서 정직한 에이전트를 5% 이하로만 잘못 지목했습니다.", "detail": "<p>실제 기업 도입 사례가 아니라 <b>연구실 실험</b>이며, 결과는 Anthropic 발표 기준입니다. \"AI가 AI를 감시\"하는 구조(지난 호 우리은행 사례와 같은 계열)가 만능이 아니라는 근거로 읽을 수 있습니다.</p>", "foryou": "<b>전사 관점:</b> 에이전트 간 감시를 안전장치로 쓰는 설계는 <b>사람의 최종 승인 단계를 대체하지 못한다</b>는 점을 설계 원칙에 남겨 두세요."}, {"tag": "해외 통계", "source": "Challenger 집계 인용 (AI Weekly Update, 2차 정리)", "url": "https://badgoodbetter.substack.com/p/ai-weekly-update-week-ending-november-4a0", "published": "2026-11-05", "title": "미국 10월 감원 중 AI 귀속 1,265건(올해 최저), 연초 이후 누계 121,401건(전체의 약 20%)", "summary": "Challenger 집계에서 기업들이 <b>10월 감원 사유로 AI를 든 건수는 1,265건</b>으로 올해 월별 최저였고, 연초 이후 누계는 121,401건으로 전체 감원의 약 20%입니다.", "detail": "<p>\"AI 때문\"이라는 사유는 기업의 자체 보고라 실제 인과와 다를 수 있습니다. 월별 변동폭이 커서 한 달 수치로 추세를 말하기는 어렵습니다.</p>", "foryou": "<b>전사 관점:</b> 인력 계획 보고서에 해외 수치를 인용할 때는 <b>기업 자체 보고 기준</b>임을 명시하고, 우리 조직의 실제 업무량 변화 데이터와 분리해서 쓰세요."}]}, {"id": "tools", "label": "써볼 만한 툴 & 에이전트", "icon": "🧰", "tint": "green", "desc": "요즘 새로 나왔거나 화제인 툴·에이전트 중 업무나 일상에서 바로 써보거나 아이디어를 얻을 만한 것.", "criteria": "이 탭은 <b>'직접 써보고 아이디어를 얻는 용도'</b>입니다. 대부분 개인 개발자가 올린 초기 제품이라 <b>성능·안전 주장은 제작사 발표 기준</b>이며, 사내 계정이나 업무 데이터를 연결하기 전에는 정보보안팀(#support-정보보안)에 먼저 문의하세요. 개인 계정·샘플 데이터로 먼저 체험해 보는 것을 권합니다. 이번 호의 국내 도구는 <b>Aptly, K-Humanizer, 그레이아이</b> 3건입니다.", "highlight": {"kicker": "써볼 만한 툴 & 에이전트", "title": "Aptly — 작업에 맞는 모델과 추론 강도를 서브에이전트에 추천하는 로컬 MCP 서버(국내 개발자, MIT, Claude Code·Codex 지원)", "summary": "코딩 에이전트가 하위 작업(서브에이전트)을 시킬 때 <b>싼 모델로 충분한 일에 비싼 모델을 쓰지 않도록</b> 모델과 추론 설정을 추천합니다. 제작자는 소규모 README 번역 검토 시험에서 API 환산 비용이 약 52~58% 줄었다고 밝혔습니다(제작자 자체 시험).", "detail": "<p>GeekNews(11월 9일) 소개와 GitHub 저장소에 따르면 Aptly는 작업 요약을 분류해 허용된 모델 후보 중 하나를 고르는 <b>로컬 MCP 도구</b>입니다. 기본 프로필은 6개이고, 실행 직전 훅을 켜면 모델을 지정하지 않은 새 서브에이전트에 기본값을 자동 적용합니다. 사용자가 명시한 모델과 추론 강도는 그대로 유지하고, 에이전트 실행과 권한 판단은 호스트가 합니다. 라이선스는 MIT, 설치는 Node.js 24 이상이 필요하며 <code>npm install -g aptly@latest --allow-scripts=aptly</code> 후 <code>aptly set env OPENAI_API_KEY</code>로 설정합니다. 문서에 보이는 버전은 0.1.7이라 <b>초기 단계 제품</b>입니다.</p><p><b>주의:</b> 분류에 OpenAI Decisions API를 쓰므로 <b>작업 요약이 OpenAI로 전송</b>됩니다(전송 범위 상세는 문서에서 확인하지 못함). 가격은 별도 안내가 없습니다. 제작자는 GitHub 사용자 abruption으로 확인됩니다.</p>", "source": "GeekNews Show GN · GitHub 저장소 (제작자 발표, 직접 사용 검증 안 함)", "url": "https://news.hada.io/topic?id=36852", "published": "2026-11-09", "foryou": "<b>써보는 방법:</b> 개인 계정과 공개 저장소로 서브에이전트가 자주 도는 작업(문서 번역 검토, 코드 요약)에 먼저 붙여 <b>토큰 사용량 전후</b>를 비교해 보세요. 업무 아이디어로는 \"작업 난이도별 모델 라우팅\"이 사내 비용 관리 정책의 초안이 됩니다. 전사 관점에서는 작업 내용이 외부 API로 나가는 구조이므로 사내 코드·문서에 쓰기 전에 정보보안팀(#support-정보보안) 확인이 필요합니다."}, "articles": [{"tag": "국내 신규·한국어", "source": "GeekNews Show GN (제작자 소개글, 직접 사용 검증 안 함)", "url": "https://news.hada.io/topic?id=36707", "published": "2026-11-06", "title": "K-Humanizer — 영어 원문을 번역투 없는 한국어로, 영업 메일·고객 응대문을 다듬는 Agent Skill(MIT)", "summary": "한국어가 모국어가 아닌 사용자가 쓰는 <b>영업 메일, 광고 카피, 제품 안내, 고객 응대 답변</b>의 번역투를 다듬는 Agent Skill입니다. 가격·날짜·환불 조건 같은 핵심 정보는 유지하고 원문에 없는 혜택은 만들지 않는다고 설명합니다.", "detail": "<p>이미 자연스러운 문장은 고치지 않고 독자와 채널에 맞게 말투를 고릅니다. Codex·Claude·Cursor 등에서 쓸 수 있고, 설치는 <code>npx skills add evergreentree97/K-Humanizer --skill k-humanizer --full-depth</code>입니다. 수정 품질은 직접 검증하지 못했습니다.</p>", "foryou": "<b>써보는 방법:</b> 업무에서는 외국인 파트너에게 받은 영문 안내문의 한국어 번역 초안을 다듬는 용도로, 일상에서는 해외 숙소·상품 문의 답장에 써볼 만합니다. 고객 메시지에 개인정보가 있으면 넣지 말고 샘플 문장으로만 시험하세요. 사내 에이전트에 스킬을 설치하는 것은 정보보안팀(#support-정보보안) 확인 후에 하세요."}, {"tag": "국내 신규·글쓰기", "source": "GeekNews Show GN (1인 개발자 베타, 직접 사용 검증 안 함)", "url": "https://news.hada.io/topic?id=36741", "published": "2026-11-07", "title": "그레이아이 — 키워드 조사부터 초안·검수까지 이어지는 네이버·티스토리용 AI 블로그 초안 서비스(베타, 선불 크레딧)", "summary": "네이버 검색광고 API로 검색량·경쟁도를 보고 <b>경쟁이 낮은 키워드</b>를 찾은 뒤, 글 양식 25종·페르소나 6종으로 초안을 만듭니다. 사용자가 \"수치 확인·내 말투 수정·내 경험 추가\"를 직접 체크해야 발행 단계로 넘어가는 <b>검수 게이트</b>가 특징입니다.", "detail": "<p>자동 발행은 제공하지 않고, 워드프레스 연동과 예약 발행은 개발 중입니다. 요금은 초안당 크레딧이 차감되는 선불제이고 가입 시 30크레딧(초안 3편)을 줍니다. 크레딧 단가는 <b>미확인</b>이고, 결제는 현재 테스트 모드입니다. 1인 개발 베타입니다.</p>", "foryou": "<b>써보는 방법:</b> 개인 블로그나 사내 기술 블로그 초안을 만들 때 \"사람이 검수 항목을 체크해야 넘어가는\" 흐름이 어떤지 체험해 보세요. 사내 AI 생성 콘텐츠 승인 절차를 설계할 때 참고가 됩니다. 사내 정보나 미공개 서비스 내용은 입력하지 마세요."}, {"tag": "묶음 소개", "source": "GeekNews Show GN (제목·한 줄 소개만 확인)", "url": "https://news.hada.io/topic?id=36846", "published": "2026-11-09", "title": "코딩 에이전트 주변 도구 3종 — readfirst(저장소 코드 지도), BLISS Note(AI가 쓴 Markdown에 Apple Pencil 주석), collab-os(AI의 틀린 단정 기록 장부)", "summary": "<b>readfirst</b>는 고정된 코드 패턴으로 오픈소스 저장소를 스캔해 코딩 에이전트에 전달할 코드 지도를 만듭니다. <b>BLISS Note</b>는 AI가 쓴 Markdown에 Apple Pencil로 주석을 달고 로컬 MCP로 AI가 다시 읽게 하며, <b>collab-os</b>는 AI의 틀린 단정을 한 줄씩 기록하는 장부 양식과 검사 도구입니다.", "detail": "<p>세 도구 모두 <b>제목과 한 줄 소개만 확인</b>했고 가격·라이선스·설치 방법은 미확인입니다. 관심이 가는 것은 링크의 소개 글에서 직접 확인하세요.</p>", "foryou": "<b>써보는 방법:</b> collab-os의 \"AI가 틀린 단정을 한 줄씩 기록\"하는 방식은 AI 리포트 품질 점검 회고에 아이디어로 쓸 수 있습니다. 설치형 도구는 개인 환경에서만 시험하세요."}]}]};

const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 10월 26일~11월 2일 공개 뉴스 기반(일부 직전 보도 포함). 일부 수치는 2차 정리 글·벤더 발표 기준이므로 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
</html>
