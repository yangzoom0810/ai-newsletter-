const NL={"meta":{"icon":"🗞️","edition":"Vol.34","cadence":"주간","date":"2026년 8월 31일 (월)","curator":"Claude (Cowork)","title":["주간 AI 뉴스레터 — ","TPM Edition"],"lead":"CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.","greeting":"안녕하세요! 지난주 카카오 인적분할에 이어 이번 주에는 <b>SK텔레콤이 AI 데이터센터를 'SK호라이즌'으로 떼어내며 3조800억원을 유치</b>했습니다. 2주 연속으로 국내 대기업이 'AI를 별도 법인으로 분리'했다는 뜻이라, 우리에게도 <b>AI 손익을 어느 단위로 볼 것인가</b>라는 질문이 곧 옵니다. 개발 쪽 키워드는 '<b>사내망</b>'입니다 — 클로드 코드가 셀프호스팅 베타를 열면서, 그동안 데이터 반출 이슈로 못 쓰던 조직에도 경로가 생겼습니다. 다만 같은 주 발표된 조사에서 <b>조직의 88%가 에이전트 관련 보안사고를 겪었고, 3분의 2가 에이전트에 사람보다 느슨한 통제를 적용</b>하고 있다는 숫자가 나왔습니다. 도입 속도와 통제 속도의 격차가 이번 주의 진짜 주제입니다. 사례 탭에는 신한카드·KB의 대고객 에이전트 확산과, 배민·SK이노베이션·한화큐셀의 정량 성과를 담았습니다."},"topics":[{"id":"top","label":"이 주의 핵심","icon":"⚡","tint":"red","desc":"이번 주 국내외 AI 소식 중 전사 의사결정에 가장 직접적으로 영향을 주는 것들.","criteria":"<b>지금 당장 우리가 무엇을 해야 하는지가 명확한</b> 소식만 골랐습니다. 해외 규제 조항 나열은 1건으로 줄이고, 조직 구조·리스크·예산에 직접 영향을 주는 것으로 좁혔습니다. 국내 소식을 우선 배치했습니다.","highlight":{"kicker":"이 주의 빅스토리","title":"SKT도 AI를 떼어냈다 — 'SK호라이즌' 출범, 318MW에 3조800억원 유치","summary":"SK텔레콤이 8월 27일 100% 자회사 SK브로드밴드를 존속회사(SK브로드밴드)와 신설회사 'SK호라이즌'으로 인적분할한다고 발표했습니다. SK호라이즌은 이미 운영 중인 데이터센터 8개와 울산·구로 등 신규 건설 중인 AI DC를 포함해 총 318MW 규모 인프라 확장을 맡습니다. KKR과 IMM인베스트먼트-스톤브릿지 컨소시엄으로부터 신설회사에 3조800억원 투자를 유치했고, 분할비율은 순자산 장부가액 기준 존속 84% / 신설 16%입니다.","detail":"<p>지난주 카카오의 'AI 법인 분할'에 이어 2주 연속 국내 대기업이 AI 사업을 법인 단위로 떼어냈습니다. 다만 성격은 정반대입니다. 카카오는 <b>서비스·수익화</b>를 분리했고, SKT는 <b>인프라·자본조달</b>을 분리했습니다. SK호라이즌은 AI 데이터센터라는 자본집약 사업의 특성상 통신 본업의 재무구조와 섞이면 대규모 조달이 어렵다는 판단이 깔려 있고, 실제로 분할 발표와 동시에 글로벌 PE 자금을 끌어왔습니다.</p><p>존속 SK브로드밴드는 유선·미디어·엔터프라이즈 사업 혁신에, 신설 SK호라이즌은 국내 최고 수준 AI DC 인프라 확장에 집중합니다. 같은 주 SK하이닉스는 미국 인디애나에 5.5조원을 투입하는 AI 패키징 팹 기공식을 열었습니다. 그룹 차원에서 'AI 인프라 공급자'로 포지션을 굳히는 흐름입니다.</p>","source":"뉴스핌 / SK텔레콤 뉴스룸","url":"https://www.newspim.com/news/view/20260827001195","published":"2026-08-27","foryou":"2주 만에 국내 대형 사업자 두 곳이 'AI를 별도 법인으로 분리'했다는 것은, 우리도 곧 \"AI 투자와 성과를 어느 단위로 귀속시키는가\"라는 질문을 받는다는 뜻입니다. 지금 준비할 실질적 산출물은 조직 개편안이 아니라 데이터입니다 — ① 흩어진 AI 관련 비용(모델 API·GPU·SaaS 라이선스·전담 인력)을 하나의 코스트센터 뷰로 모으고, ② 그 비용에 대응하는 성과 지표를 서비스별로 매핑해두세요. 논의가 시작될 때 근거를 가진 쪽이 프레임을 잡습니다."},"articles":[{"tag":"에이전트 리스크","source":"Infosecurity Magazine / Kiteworks","url":"https://www.infosecurity-magazine.com/news/unchecked-ai-agents-cause/","published":"2026-08","title":"조직의 88%가 에이전트 보안사고 경험 — 문제는 모델이 아니라 '권한'이었다","summary":"지난 1년간 AI 에이전트 관련 보안사고를 확인 또는 의심한 조직이 88%에 달한다는 조사가 나왔습니다. 사고 유형은 데이터 노출 61%, 운영 중단 43%, 업무 프로세스에서의 의도치 않은 행동 41%, 금전 손실 35%입니다. 조사 기관의 진단은 명확합니다 — 대부분은 모델이 잘못된 출력을 낸 사고가 아니라, 정상 동작하는 모델이 <b>애초에 접근하면 안 되는 데이터에 접근할 수 있었던</b> 사고였습니다.","detail":"<p>더 눈여겨볼 숫자는 통제 격차입니다. 조사 대상 조직의 약 3분의 2가 AI 에이전트에 사람 직원보다 <b>느슨한</b> 보안 통제를 적용하고 있었습니다. 사람에게는 최소권한·역할분리·접근 승인·감사로그를 요구하면서, 사람의 수십 배 속도로 시스템을 호출하는 에이전트에는 같은 기준을 적용하지 않는 상태입니다.</p><p>같은 주 구글 클라우드도 8월 24일 State of AI Infrastructure 리포트와 연계한 글에서 에이전트 보안을 확산의 최대 게이팅 이슈로 지목하며, 플랫폼 레벨 거버넌스·작업 단위 출처 추적(provenance)·휴먼 인 더 루프 체크를 권고했습니다. 벤더와 조사기관이 동시에 같은 방향을 가리키고 있다는 점이 신호입니다.</p>","foryou":"이 숫자는 보안 예산과 가드레일 우선순위를 설득할 때 그대로 인용 가능한 근거입니다. 실행 항목은 세 가지로 좁힙니다 — ① 사내에서 돌아가는 에이전트별 '접근 가능한 시스템 × read/write' 인벤토리를 한 장으로 만들고, ② 사람 계정 기준의 최소권한 정책을 에이전트 계정에도 동일 적용하며, ③ 에이전트 행동 로그의 보관 위치·기간을 감사 요건으로 못 박으세요. 도구 선정보다 이 세 가지가 먼저입니다."},{"tag":"국내 규제","source":"법률신문","url":"https://www.lawtimes.co.kr/news/articleViewAmp.html?idxno=223727","published":"2026-08","title":"AI기본법 시행령 개정 — 'AI 제품·서비스 확인 제도'가 새로 생겼습니다","summary":"국내 AI기본법 시행령 개정안이 7월 국무회의를 통과해 7월 21일부터 시행 중이며, 개정법의 위임사항이 구체화되고 <b>'AI 제품·서비스 확인 제도'</b>가 신설됐습니다. 한국은 2026년 1월 22일 AI기본법 본격 시행으로 EU에 이어 세계 두 번째 포괄적 AI 규제 체계를 갖췄지만, EU AI Act와 달리 '규제보다 진흥'에 무게를 둔 최소 규제 설계라는 것이 법제연구원의 분석입니다.","detail":"<p>해외 규제 조항을 따라가는 것보다 훨씬 실무적인 질문은 하나입니다 — <b>우리 서비스가 '고영향 AI'에 해당하는가</b>. AI기본법은 고영향 AI와 생성형 AI에 각각 다른 의무(사전 고지, 영향평가, 안전성 확보 조치 등)를 지우는데, 해당 여부 판단이 곧 사내 프로세스 부담량을 결정합니다. 새로 생긴 확인 제도는 이 판단을 사업자가 홀로 떠안지 않고 정부 확인 절차로 정리할 수 있는 경로를 열어둔 것입니다.</p><p>참고로 EU AI Act 쪽도 8월 2일부터 투명성 의무와 집행 조항이 적용되기 시작했습니다. 국내 서비스만 운영한다면 EU 조항을 세세히 볼 필요는 없지만, 해외 이용자 대상 기능이 있다면 '적용 대상인지'만 한 번 확인해두는 것으로 충분합니다.</p>","foryou":"지금 필요한 건 법령 스터디가 아니라 <b>체크리스트 한 장</b>입니다. 우리 서비스에서 AI가 쓰이는 지점을 나열하고 각각에 대해 ① 고영향 AI 해당 여부, ② 이용자 사전 고지가 되어 있는지, ③ 생성형 산출물 표시 의무 대상인지 — 세 칸만 채워보세요. 대부분은 '해당 없음'으로 정리되고, 남는 소수가 실제로 관리해야 할 대상입니다. 이 표가 있어야 법무 문의가 왔을 때 하루 만에 답할 수 있습니다."},{"tag":"국내 도입 현황","source":"CIO Korea","url":"https://www.cio.com/article/4045735/","published":"2026-08","title":"국내 기업 85%가 생성형 AI 쓴다 — 예산은 79.3%가 늘린다","summary":"국내 기업의 55.7%가 이미 생성형 AI를 전사적으로(22.4%) 또는 일부 부서(33.2%)에서 활용 중이며, 구현 중이거나 1~2년 내 도입 계획까지 포함하면 2026년 중 85%를 넘어설 전망입니다. 2026년 생성형 AI 예산은 기업의 79.3%가 증가를 예상합니다. 다만 별도 조사에서는 도입률이 61%인 반면 <b>조직적 내재화는 6.7%</b>에 그친다는 대비되는 숫자도 함께 나왔습니다.","detail":"<p>이 두 숫자를 함께 봐야 의미가 생깁니다. 도입률 85%는 '어느 팀이든 무언가는 쓰고 있다'는 뜻이고, 내재화 6.7%는 '업무 프로세스 자체가 바뀐 조직은 거의 없다'는 뜻입니다. 즉 대부분의 조직은 개인 생산성 도구 단계에 머물러 있고, 예산은 계속 늘어나는 상태입니다. 성과 압력이 붙기 시작하는 지점이 바로 여기입니다.</p><p>실제로 업계에서는 AI 도입 경쟁이 확산된 이후 이제 성과 검증 국면에 들어섰고, 투자 대비 효과가 검증되지 않는 AI 프로젝트는 구조조정 대상이 되는 흐름이 나타난다는 진단이 나옵니다. 산업부 의뢰 조사에서도 대기업 도입률은 65.1%였지만, 도입과 성과 사이의 간극은 여전히 큽니다.</p>","foryou":"예산이 79% 늘어난다는 것은 뒤집어 말하면 <b>내년에 성과 질문이 온다</b>는 뜻입니다. 지금 해둘 일은 새 과제를 늘리는 게 아니라, 이미 돌아가는 AI 과제들에 '중간 지표'를 붙이는 것입니다. 매출·이익은 AI가 직접 움직이기 어려우므로 처리 시간, 처리 비중, 재작업률, 티켓 감소율처럼 AI가 직접 영향을 주는 지표를 과제별로 하나씩만 정의해두면, 예산 재승인 시즌에 방어 가능한 스토리가 생깁니다."}]},{"id":"dev","label":"개발 AI 동향","icon":"🛠️","tint":"purple","desc":"함께 일하는 엔지니어 조직의 일하는 방식을 실제로 바꾸는 도구 변화.","criteria":"버전 번호와 체인지로그는 걷어내고, <b>팀의 작업 경로·리뷰 방식·권한 구조가 어떻게 달라지는가</b>만 남겼습니다. 이번 주는 '어디서 실행되는가(사내망 vs 벤더)'와 '누가 승인하는가'가 관통 주제였습니다.","highlight":{"kicker":"워크플로가 바뀐다","title":"클로드 코드가 사내망으로 들어온다 — 셀프호스팅 베타와 '오토 모드' 기본값 전환","summary":"앤트로픽이 클로드 코드의 셀프호스팅 실행 환경을 퍼블릭 베타로 열었습니다. Team·Enterprise 플랜 조직은 에이전트 세션을 벤더 인프라가 아닌 자사 내부망에서, 자사 서비스·툴체인·보안 통제 옆에서 실행할 수 있습니다. 동시에 8월 14일부터 Pro·Max·Team 플랜에서 '오토 모드'가 기본값이 됐습니다 — 매번 사람에게 묻던 권한 승인을, 어떤 동작이 안전한지 실시간으로 판단하는 분류기가 대신합니다.","detail":"<p>셀프호스팅은 두 가지 러너 모드를 제공합니다. 고정(fixed) 모드는 정해진 수의 러너에 세션을 분배하고, 온디맨드 모드는 대기 중인 세션을 감지해 러너를 띄웠다가 작업이 끝나면 내립니다. 데이터 소재지(data residency)나 망 분리 요건 때문에 지금까지 코딩 에이전트를 아예 검토조차 못 하던 조직 — 금융, 헬스케어, 방산, 그리고 국내 망분리 규제 대상 — 에 경로가 생겼다는 것이 핵심입니다.</p><p>반대로 오토 모드 기본값 전환은 통제 방향을 반대로 밉니다. 승인 피로(approval fatigue)를 줄여 실제 생산성을 올리는 변화지만, '사람이 승인 다이얼로그를 보고 막는다'는 전제가 더 이상 유효하지 않다는 뜻이기도 합니다. 이와 함께 제한 모드(restricted mode), 세션 간 메시징, 엔터프라이즈용 사용량 크레딧, 서버 관리 설정 진단이 함께 들어왔습니다. 정리하면 이번 변화의 방향은 <b>'개인이 승인하던 것을 조직이 정책으로 승인한다'</b>입니다.</p>","source":"Enterprise DNA / Medium (Blur Brah Lab)","url":"https://enterprisedna.co/resources/news/anthropic-claude-code-auto-mode-default-enterprise-august-2026/","published":"2026-08","foryou":"망분리·데이터 반출 이슈로 코딩 에이전트 도입이 막혀 있던 팀이 있다면, 셀프호스팅 베타는 그 논의를 다시 열 근거입니다. 다만 순서가 중요합니다 — 오토 모드가 기본값이 된 만큼 <b>조직 레벨 정책을 먼저 정한 뒤</b> 셀프호스팅을 켜야 합니다. 최소한 ① 오토 모드에서도 사람 승인이 필수인 액션 목록(프로덕션 배포, DB 마이그레이션, 시크릿 접근), ② 러너가 접근 가능한 내부 네트워크 세그먼트 범위, ③ 세션 로그 보관 정책 — 이 세 가지를 서버 관리 설정으로 강제한 뒤 파일럿을 시작하세요."},"articles":[{"tag":"확산 데이터","source":"Temporal 2026 State of Development Report","url":"https://northflank.com/blog/enterprise-ai-coding-agent-deployment","published":"2026-08","title":"엔지니어 80.8%가 에이전트를 매일 쓴다 — 1년 만에 47%→81%","summary":"Temporal의 2026 State of Development 리포트에 따르면 조사 대상 엔지니어의 80.8%가 AI 에이전트를 하루 한 번 이상 사용합니다. 1년 전 47.3%에서 거의 두 배가 됐습니다. 동시에 <b>에이전트 파일럿의 88%가 프로덕션에 도달하지 못한다</b>는 수치도 함께 보고됐는데, 병목은 모델 성능이 아니라 격리(isolation)·거버넌스·컴플라이언스 통제·데이터 소재지 같은 배포 인프라 요건입니다.","detail":"<p>이 두 숫자의 조합이 현재 상황을 정확히 요약합니다. <b>개인 사용은 이미 표준이 됐지만, 조직 자산으로의 전환은 거의 실패하고 있습니다.</b> 개인이 IDE에서 에이전트를 쓰는 데는 아무 승인이 필요 없지만, 그 에이전트가 사내 시스템을 호출하고 프로덕션에 영향을 주는 순간 보안·플랫폼 조직의 승인 대상이 되고 거기서 88%가 멈춥니다.</p><p>도구 표준화 양상도 바뀌었습니다. 대부분의 전문 엔지니어링 팀이 더 이상 하나의 에이전트로 통일하지 않습니다. 깊은 리팩터링에는 터미널 에이전트, 일상 작업에는 IDE 에이전트, 가끔은 클라우드 위임형 에이전트를 쓰는 조합이 일반적인 패턴으로 관찰됩니다. JetBrains 조사에서도 업무 사용률은 Copilot 29%, Cursor와 Claude Code가 각각 18%로 분산돼 있습니다.</p>","foryou":"'우리는 어떤 에이전트로 통일할까'는 이제 틀린 질문일 가능성이 높습니다. 실제로 필요한 것은 도구 선정이 아니라 <b>어떤 도구든 통과해야 하는 게이트</b>입니다 — 승인된 도구 목록, 각 도구가 접근 가능한 저장소·시크릿 범위, PR 승인 게이트 규칙. 이 세 가지를 도구 중립적으로 정의해두면, 팀마다 다른 도구를 써도 리스크는 한 곳에서 관리됩니다. 그리고 88%가 막히는 지점이 인프라 요건이므로, 플랫폼·보안 조직을 도입 후가 아니라 파일럿 설계 단계에 넣으세요."},{"tag":"국내 조직 문화","source":"MIT Technology Review Korea","url":"https://www.technologyreview.kr/ai-%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8-%EB%8F%84%EC%9E%85%EC%97%90%EC%84%9C-%EC%96%BB%EC%9D%80-%EB%9C%BB%EB%B0%96%EC%9D%98-%EA%B5%90%ED%9B%88/","published":"2026-08","title":"야놀자의 'AI 챔피언' 제도 — 비개발자 45%가 해커톤에 참여했다","summary":"야놀자가 사내 해커톤을 열었는데 참가자의 45%가 비개발자였습니다. 이후 한 마케터는 소속 팀 업무 자동화를 직접 설계해 구현했고, 한 기획자는 원래 외주로 맡겨야 했던 프로그램을 코딩 에이전트로 만들어 팀에서 실사용 중입니다. 야놀자는 각 팀에서 전도사 역할을 맡을 자원자를 모아 확산을 위임하는 <b>'AI 챔피언' 제도</b>를 운영합니다.","detail":"<p>주목할 점은 도구가 아니라 확산 구조입니다. 대부분의 조직은 AI 도입을 '중앙 조직이 도구를 깔고 교육을 돌리는' 방식으로 접근하는데, 이 방식은 팀마다 다른 업무 맥락을 중앙이 알 수 없어 실사용으로 이어지지 않습니다. AI 챔피언 제도는 반대로 <b>각 팀 안에서 자원한 사람에게 확산을 맡기는</b> 구조입니다. 챔피언은 자기 팀 업무를 이미 알고 있으므로 '무엇을 자동화할지'를 중앙보다 정확히 고릅니다.</p><p>같은 기사에서 국내 기업들이 공통적으로 부딪힌 문제로 지목된 것은 기술이 아니라 운영이었습니다. \"무엇을 AI에 맡기고 무엇을 사람의 판단과 책임으로 남길 것인가\"에 답하지 못하면 에이전트는 생산성 도구가 아니라 또 하나의 실험 프로젝트로 남는다는 진단입니다.</p>","foryou":"AI 확산을 중앙 조직 KPI로만 밀고 있다면, 팀별 자원자 기반 확산 구조를 병렬로 얹어볼 가치가 있습니다. 운영 비용도 낮습니다 — 팀당 1명씩 자원 받고, 격주 30분 챔피언 싱크에서 사례와 막힌 지점만 공유하고, 챔피언에게는 도구 예산 승인 권한을 소액이라도 주는 것. 그리고 해커톤을 열 때 <b>비개발자 참여 비율을 명시적 목표로 걸어두면</b> 자동화 아이디어의 출처가 개발 조직 밖으로 넓어집니다."},{"tag":"에이전트 인프라","source":"AWS (Amazon Bedrock AgentCore)","url":"https://aws.amazon.com/blogs/","published":"2026-08-21","title":"Bedrock AgentCore 웹 검색 GA — 데이터가 계정 밖으로 나가지 않는 검색 도구","summary":"AWS가 8월 21일 Amazon Bedrock AgentCore의 웹 검색 기능을 정식 출시(GA)했습니다. 에이전트가 출처가 인용된 최신 웹 정보를 가져오되, <b>데이터가 고객 AWS 계정 밖으로 나가지 않는</b> 관리형 서버사이드 도구입니다. 에이전트에 검색 기능을 붙이려고 외부 검색 API를 직접 연동할 때 생기던 데이터 반출·키 관리 부담을 줄이는 방향입니다.","detail":"<p>에이전트에 '최신 정보 접근'을 붙이는 일은 그동안 보안 검토에서 가장 자주 막히던 지점 중 하나였습니다. 외부 검색 API를 쓰면 쿼리 자체가 외부로 나가는데, 그 쿼리에 사내 프로젝트명·고객 정보·내부 용어가 섞여 들어가는 것을 막기 어려웠기 때문입니다. 관리형 도구로 계정 경계 안에서 처리된다는 점이 검토 통과 여부를 가릅니다.</p><p>출처 인용(cited)이 기본이라는 점도 실무적으로 의미가 있습니다. 에이전트가 웹 정보를 근거로 답을 만들 때 출처가 함께 남으면, 사실관계 검증을 사람이 사후에 처음부터 다시 하지 않아도 됩니다. 리서치·경쟁사 모니터링·시장 조사처럼 TPM이 자주 돌리는 작업에서 검증 비용이 가장 크게 줄어듭니다.</p>","foryou":"AWS를 이미 주력으로 쓰고 있다면, 사내 에이전트에 웹 검색을 붙이는 방식을 '외부 API 직접 연동'에서 관리형 도구로 옮길지 검토할 타이밍입니다. 판단 기준은 하나입니다 — <b>검색 쿼리에 사내 정보가 섞여 나갈 가능성이 있는가</b>. 있다면 관리형 쪽이 보안 검토를 훨씬 빨리 통과합니다. 반대로 순수 공개 정보 조회만 한다면 굳이 옮길 이유는 없습니다."}]},{"id":"tpm","label":"TPM 업무 자동화","icon":"📋","tint":"blue","desc":"로드맵·스프린트·문서화·커뮤니케이션에 이번 주부터 바로 붙여볼 수 있는 기능.","criteria":"데모가 예쁜 기능이 아니라 <b>TPM이 매주 반복하는 작업을 실제로 덜어주는</b> 것만 골랐습니다. 이번 주는 '사내에 흩어진 커스텀 에이전트를 어떻게 관리할 것인가'가 공통 주제였습니다.","highlight":{"kicker":"바로 써볼 것","title":"노션 에이전트 API가 퍼블릭 베타로 — 사내 커스텀 에이전트를 '코드로' 관리하기 시작","summary":"노션이 Notion Agent API를 퍼블릭 베타로 공개했습니다. 세션 기반 채팅, 스트리밍 응답, 액션 제출, 이벤트 히스토리, 그리고 <b>커스텀 에이전트의 프로그래밍 방식 관리</b>가 포함됩니다. 모델도 Claude Sonnet 4, GPT-5, Claude Opus 4.6 중에서 선택할 수 있습니다. 2026년 8월 기준 연동 대상은 Slack, Google Drive, Jira, Microsoft Teams, SharePoint, OneDrive, Linear, GitHub입니다.","detail":"<p>TPM 관점에서 진짜 의미는 채팅 API가 아니라 <b>관리 API</b>입니다. 팀마다 커스텀 에이전트를 만들기 시작하면 6개월 안에 '누가 만든 무엇이 어떤 데이터에 닿는지 아무도 모르는' 상태가 옵니다. 이번 주 카테고리 1에서 본 '조직 88%가 에이전트 사고를 겪었고 원인 대부분이 과도한 데이터 접근'이라는 조사와 정확히 맞물리는 지점입니다. 프로그래밍 방식으로 에이전트 목록을 덤프할 수 있으면 인벤토리를 수작업이 아니라 스케줄 작업으로 유지할 수 있습니다.</p><p>기능 자체는 회의 노트 종료를 트리거로 트래커 업데이트·요약 공유·피드백의 티켓 전환을 자동 처리하는 흐름까지 이어집니다. 다만 풀 기능은 Business 플랜(연간 결제 시 사용자당 월 20달러)부터이고, Free·Plus는 기본 AI 기능의 제한된 체험만 제공됩니다. 도입 검토 시 라이선스 비용이 팀 전체로 곱해진다는 점을 먼저 계산하세요.</p>","source":"Notion Releases / Fazm","url":"https://releasebot.io/updates/notion","published":"2026-08","foryou":"가장 회수가 빠른 활용은 기능 도입이 아니라 <b>인벤토리 자동화</b>입니다. Admin·Agent API로 사내 커스텀 에이전트 목록(소유자, 접근 가능한 스페이스, 연결된 커넥터)을 주 1회 덤프해 시트에 쌓아두세요. 30분이면 붙이고, 나중에 보안 감사나 인시던트가 왔을 때 '언제부터 무엇이 어디에 닿았는지'를 즉시 답할 수 있습니다. 기능 파일럿은 정기 회의 한 개(주간 스쿼드 싱크)를 골라 '회의 종료 → 액션아이템 티켓 생성 → 담당자 알림'까지만 2주 돌려보고 판단하는 것으로 충분합니다."},"articles":[{"tag":"이슈·스프린트","source":"Atlassian Blog","url":"https://www.atlassian.com/blog/development/jira-summer-release","published":"2026-08","title":"지라 2026 여름 릴리스, 8월 말 전면 적용 — 캐파 플래닝과 수식 필드가 들어왔다","summary":"아틀라시안의 2026 여름 지라 클라우드 릴리스가 8월 말까지 순차 적용을 마쳤습니다. Atlassian Intelligence 위에 캐파 플래닝, 수식(calculation) 필드, 미팅 관리 기능이 얹혔고, AI 에이전트가 인사이트를 먼저 띄우고 상태 업데이트를 스스로 작성하는 방향으로 바뀌었습니다.","detail":"<p>TPM 업무에서 실제 시간을 먹는 건 판단이 아니라 조율입니다 — 지연 감지, 담당자 확인, 상태 업데이트 작성, 관련자 공유. 이 구간이 자동화되면 남는 시간이 판단으로 갑니다. 수식 필드는 그동안 스프레드시트로 빼서 계산하던 것(잔여 공수, 스코프 변경률, 마일스톤별 완료 비중)을 이슈 뷰 안에서 처리할 수 있게 해줍니다.</p><p>다만 리스크도 같이 옵니다. 에이전트가 작성한 상태 업데이트가 실제 상황보다 낙관적이거나 맥락을 놓친 채 관련자에게 전달되면, 그 오차를 나중에 사람이 되돌려야 합니다. 캐파 플래닝도 입력 데이터(가용률, 휴가, 병행 과제, 온콜)의 정확도가 낮으면 그럴듯한 숫자가 오판을 만듭니다.</p>","foryou":"자동 상태 업데이트는 바로 켜지 말고 <b>'에이전트가 쓴 업데이트는 담당자 확인 후 발송'을 2~3주 기본값</b>으로 두고 오차 패턴을 모으세요. 오차 유형이 파악되면 그때 자동 발송으로 전환하면 됩니다. 캐파 플래닝은 가용률 입력 규칙(휴가·병행 과제·온콜 반영 방식)을 팀 간에 먼저 통일하지 않으면 숫자만 예뻐집니다 — 규칙 통일이 기능 켜기보다 먼저입니다."},{"tag":"도구 지형 변화","source":"Ramp 벤더 지출 데이터 (2026년 8월)","url":"https://tech-insider.org/linear-vs-jira-2026/","published":"2026-08","title":"Linear 15%, Jira 49% — 프로젝트 관리 도구 점유율이 움직이고 있다","summary":"Ramp의 2026년 8월 벤더 지출 데이터 기준 프로젝트 관리 도구 중 Linear 채택률이 15%로 3%p 상승한 반면, Jira는 3%p 하락한 49%를 기록했습니다. 여전히 Jira가 압도적 1위지만, 상승과 하락이 같은 폭으로 맞물린다는 점이 눈에 띕니다.","detail":"<p>도구 전환 자체보다 <b>왜 움직이는가</b>가 참고 지점입니다. 이동의 동력으로 자주 언급되는 것은 기능 개수가 아니라 속도와 기본값입니다 — 설정 없이도 일관된 워크플로가 강제되는 도구가, 무한히 커스터마이즈 가능한 도구보다 팀 간 파편화를 덜 만든다는 것입니다. 조직이 커질수록 커스터마이즈 가능성은 자산이 아니라 관리 비용이 됩니다.</p><p>다만 3%p 이동을 '트렌드 전환'으로 읽는 것은 과합니다. Jira는 여전히 절반에 가까운 조직이 쓰고 있고, 아틀라시안은 같은 달 여름 릴리스로 AI 기능을 대폭 보강했습니다. 실무적으로는 도구 교체 논의보다, 우리 조직의 지라 워크플로가 실제로 얼마나 파편화돼 있는지를 점검하는 계기로 쓰는 게 낫습니다.</p>","foryou":"도구 마이그레이션은 거의 항상 예상보다 비쌉니다. 대신 이 데이터는 <b>내부 점검 트리거</b>로 쓰세요 — 우리 조직에 존재하는 이슈 타입·워크플로·필수 필드의 개수를 세어보고, 팀마다 다른 것이 몇 개인지 확인해보는 것입니다. 파편화가 실제로 심하다면 도구를 바꾸지 않고도 표준 워크플로 3~4개로 통합하는 것만으로 대부분의 문제가 해결됩니다. 그게 안 되는 이유가 도구 제약이라고 확인됐을 때 비로소 교체 논의가 의미를 갖습니다."},{"tag":"회의·문서 자동화","source":"국내 협업툴·AI 회의록 도구 비교 (2026)","url":"https://teamcandid.kr/blog/best-ai-notetaker","published":"2026-08","title":"국내 회의록 AI, 이제 '요약'이 아니라 '요약 다음'에서 갈린다","summary":"국내에서 실사용되는 AI 회의록 도구로는 클로바노트, 티로, 캐럿, 하이퍼노트 등이 비교되고 있습니다. 협업툴 쪽에서도 네이버웍스·카카오워크·두레이·잔디가 각각 AI 비서 기능을 붙였습니다. 다만 도구 간 실질적 차이는 전사 정확도가 아니라, 정리된 내용이 <b>트래커·티켓·주간 보고로 자동 이어지는가</b>에서 갈립니다.","detail":"<p>회의 요약 자체는 이제 어느 도구나 합니다. TPM 업무에서 실제 시간을 먹는 건 회의 내용을 정리하는 일이 아니라, 정리된 내용을 트래커·티켓·주간 보고 세 곳에 옮겨 붙이는 일입니다. 그래서 도구 선택 기준은 '요약 품질'이 아니라 '우리가 쓰는 이슈 트래커와 연결되는가'가 되어야 합니다.</p><p>국내 도구를 검토할 때 별도로 확인할 것은 데이터 처리 위치와 보관 정책입니다. 회의 녹취에는 인사·계약·미공개 지표가 그대로 들어가기 때문에, 요약 품질보다 '녹취 원본이 어디에 얼마나 남는가'가 먼저 걸러야 할 조건입니다. 국내 서비스는 데이터 소재지 측면에서 유리한 경우가 많지만, 서비스별로 정책이 다르므로 개별 확인이 필요합니다.</p>","foryou":"회의록 도구를 새로 고를 계획이라면 비교 기준을 <b>세 줄로 줄이세요</b> — ① 우리 이슈 트래커로 액션아이템을 자동 생성할 수 있는가, ② 녹취 원본 보관 위치와 기간을 우리가 정할 수 있는가, ③ 외부 참석자가 있는 회의에서 녹취 고지가 자동으로 되는가. 요약 정확도는 대부분 실사용에서 비슷하게 수렴하므로 비교표에서 빼도 무방합니다. 특히 ③은 놓치기 쉬운데 법적으로 가장 민감한 항목입니다."}]},{"id":"biz","label":"빅테크 & 전략 동향","icon":"🌐","tint":"orange","desc":"리더십 보고와 전사 전략 수립에 인용할 만한 산업 맥락.","criteria":"거시·지정학 얘기는 빼고, <b>벤더 선택·가격 협상·조직 설계에 참고가 되는</b> 소식만 담았습니다. 국내 진영의 전략 분화와 해외 벤더의 수익화 방향을 함께 배치했습니다.","highlight":{"kicker":"국내 전략 지도","title":"네이버는 소유하고 카카오는 빌린다 — 국내 양대 플랫폼의 AI 베팅이 정반대로 갈렸다","summary":"네이버는 검색·광고·쇼핑에 AI를 얹는 동시에 GPU·데이터센터·AI 팩토리·소버린 AI·하이퍼클로바X까지 연결하는 <b>풀스택 AI 컴퍼니</b> 전략을 밀고 있습니다. 엔비디아와 함께 2027년 55MW 첫 가동을 시작으로 초대형 AI 팩토리를 구축합니다. 반대로 카카오는 대규모 인프라를 직접 짓기보다 외부 AI 기술을 활용해 카카오톡 안에서 사용자 의도를 행동·거래로 연결하는 <b>에셋라이트 에이전트</b> 전략에 집중합니다.","detail":"<p>같은 국내 시장에서 두 회사가 정반대 자본 구조를 선택했다는 점이 이번 주 전략 지도의 핵심입니다. 네이버는 컴퓨트를 소유해 아시아·태평양·유럽·중동의 소버린 AI 수요를 공략하고, 카카오는 가진 채널(카카오톡) 위에 남의 모델을 얹어 거래로 전환합니다. 어느 쪽이 옳다기보다, <b>자기가 가진 자산이 무엇이냐</b>에 따라 답이 달라진다는 것을 보여주는 대조군입니다.</p><p>시장 평가는 아직 유보적입니다. 2026년은 지배구조 단순화와 AI 에이전트 완성도를 높이는 시기이고 수익화까지는 시간이 걸리며, AI 수익화는 2027년부터 점진적으로 기대 가능하다는 것이 증권가의 대체적 시각입니다. 즉 두 전략 모두 아직 '검증 전'이며, 지금 시점의 교훈은 결과가 아니라 <b>선택의 논리</b>에 있습니다.</p>","source":"테크M / 뉴스핌","url":"https://www.techm.kr/news/articleView.html?idxno=148224","published":"2026-08","foryou":"전사 AI 전략 문서를 쓸 때 이 대조는 '무엇을 소유하고 무엇을 빌릴지'를 설명하는 데 그대로 쓸 수 있습니다. 대부분의 조직에게 실제로 복제 가능한 것은 카카오형(가진 채널에 남의 모델을 얹는 쪽)이므로, 논의를 인프라 소유가 아니라 <b>\"우리 채널에서 AI가 완결되는 지점이 어디인가\"</b>로 좁히는 게 생산적입니다. 그리고 GPU·클라우드 학습 예산을 다년으로 잡고 있다면, 국내 대형 사업자가 컴퓨트 공급자로 진입한다는 사실을 조달 시나리오(낙관·기준·비관)에 반영해두세요."},"articles":[{"tag":"벤더 수익화","source":"OpenAI / Digiday","url":"https://openai.com/index/chatgpt-ads-expands-across-europe/","published":"2026-08-24","title":"챗GPT 광고, 유럽 31개국 개시 — 유료 티어는 광고 없음이 협상 카드가 됐다","summary":"오픈AI가 8월 24일부터 독일·프랑스·스페인·이탈리아·폴란드·스웨덴·네덜란드 등 유럽 31개 시장에서 챗GPT 광고를 시작했습니다. 미국 출시 6개월 만의 확장입니다. 광고는 <b>무료 티어와 월 7.99유로 Go 플랜 이용자에게만</b> 노출되고, Plus·Pro·Enterprise·Business·Education 계정은 광고가 없습니다. GDPR 대응을 위해 프라이버시 정책을 조정했고, 대화 내용은 광고주와 공유되지 않는다고 밝혔습니다.","detail":"<p>광고 자체보다 티어 설계가 시사적입니다. '광고 없음'을 상위 티어의 명시적 혜택으로 못 박았다는 것은, 앞으로 무료·저가 티어의 기능과 데이터 취급이 유료 티어와 구조적으로 갈라진다는 신호입니다. 직원이 개인 무료 계정으로 업무를 처리하는 관행이 남아 있다면, 그 계정과 회사 계정의 데이터 취급 조건이 점점 더 벌어진다는 뜻이기도 합니다.</p><p>초기에는 광고 집행이 오픈AI Ads Solutions 팀과 대행사·기술 파트너를 통해서만 이뤄지고, 셀프서비스 Ads Manager는 이후에 열립니다. CPM·CPC·전환 최적화 CPC 캠페인을 국가 타깃팅, 커스텀 오디언스, 광고주 제공 컨텍스트 힌트와 함께 운영할 수 있습니다.</p>","foryou":"두 가지 실무 액션이 나옵니다. 첫째, <b>섀도 AI 점검</b> — 사내에서 개인 무료 계정으로 업무 데이터를 넣는 관행이 얼마나 되는지 파악하고, 회사 계정 발급으로 흡수하세요. 광고 도입으로 무료 티어의 데이터 취급 조건이 달라지는 흐름은 계속될 가능성이 높습니다. 둘째, 벤더 갱신 협상에서 '광고 없음·학습 미사용' 같은 조건을 <b>계약서 문구로</b> 확보해두세요. 지금은 기본값이지만 기본값은 바뀝니다."},{"tag":"국내 인프라","source":"SK하이닉스 / 국내 보도","url":"https://www.newspim.com/news/view/20260827001195","published":"2026-08-27","title":"SK하이닉스, 인디애나 AI 패키징 팹 기공 — 5.5조원 첫 미국 생산기지","summary":"SK하이닉스가 미국 인디애나에 5조5000억원을 투입하는 AI 패키징 팹 기공식을 열었습니다. SK하이닉스의 첫 미국 생산기지로, HBM 등 AI용 메모리의 후공정 패키징을 현지에서 처리하는 구조입니다. 같은 주 SK텔레콤의 AI DC 분사와 함께 그룹 차원에서 'AI 인프라 공급자' 포지션을 굳히는 움직임입니다.","detail":"<p>메모리 후공정을 미국 현지로 옮기는 것은 고객사(주요 AI 칩·클라우드 사업자)와의 물리적 거리를 줄이고 공급망 리스크를 분산하는 결정입니다. 국내 조직 입장에서 직접적인 영향은 크지 않지만, <b>AI 하드웨어 공급망이 지역별로 재편되고 있다</b>는 배경 정보로는 유효합니다.</p><p>실무적으로 참고할 지점은 조달 계획의 전제입니다. HBM·GPU 공급이 늘어난다는 신호는 중기적으로 인프라 단가 압력이 완화될 수 있다는 뜻이지만, 동시에 수요도 함께 늘고 있어 단순한 가격 하락으로 이어지지는 않습니다. 다년 조달 계획을 세울 때 '공급 확대'와 '수요 확대'를 동시에 시나리오에 넣는 편이 안전합니다.</p>","foryou":"리더십 보고에서 AI 인프라 비용을 다룰 때, '공급이 늘고 있으니 단가가 떨어질 것'이라는 단선적 전망은 피하는 게 좋습니다. 대신 <b>단가 시나리오를 세 개(하락·횡보·상승)</b>로 두고 각각에서 우리 예산이 어떻게 달라지는지 한 장으로 정리해두면, 내년 예산 논의에서 재승인 요청을 줄일 수 있습니다. 이번 소식은 '하락' 시나리오의 근거로 인용 가능한 정도입니다."},{"tag":"모델 가격·성능","source":"LLM Gateway / AI Release Tracker","url":"https://llmgateway.io/timeline","published":"2026-08","title":"저가·고속 모델 경쟁이 계속된다 — Gemini 3.7 Flash, GLM-5.3 Flash 연달아 출시","summary":"8월 중 구글이 Gemini 3.7 Flash를, Z.AI가 GLM-5.3 Flash를(8월 26일) 출시하는 등 '경량·고속·저가' 계열 모델의 출시 주기가 계속 짧아지고 있습니다. 릴리스 트래커 기준 8월 중순까지 6개 주요 제공사에서 124건의 모델 출시·업데이트가 집계됐습니다. 프런티어 모델 성능 경쟁만큼이나 <b>티어 하단의 가격·처리량 경쟁</b>이 빠르게 움직이는 국면입니다.","detail":"<p>실무적으로 이 흐름이 만드는 변화는 하나입니다 — <b>모델 선택이 '이벤트'가 아니라 '주기적 운영 업무'가 됐다</b>는 것. 반년에 한 번 벤더를 정하고 끝나는 게 아니라, 분기마다 워크로드별로 '지금 이 작업을 안정적으로 처리하는 가장 싼 모델'이 바뀝니다.</p><p>다만 매번 갈아타는 것도 비용입니다. 프롬프트 튜닝, 회귀 테스트, 평가셋 재실행이 모두 사람 시간을 먹습니다. 그래서 실제로 필요한 것은 최신 모델을 추적하는 일이 아니라, <b>모델을 바꿔도 품질 회귀를 자동으로 잡아주는 평가셋</b>을 갖추는 것입니다. 평가셋이 없으면 모델 교체는 매번 도박이 되고, 있으면 반나절 작업이 됩니다.</p>","foryou":"모델 출시 뉴스를 따라가는 데 시간을 쓰기보다, 사내 주요 AI 워크로드 3~5개에 대해 <b>50~100건짜리 평가셋</b>을 만들어두세요. 정답이 있는 케이스와 판단이 갈리는 엣지케이스를 섞으면 충분합니다. 이게 있으면 새 모델이 나올 때마다 '반나절 돌려보고 단가 대비 품질을 비교' 하는 루틴이 생기고, 없으면 계속 벤더 발표자료를 근거로 의사결정하게 됩니다. 이번 분기에 만들 수 있는 가장 회수율 높은 자산입니다."}]},{"id":"case","label":"국내외 AI 도입 사례","icon":"📚","tint":"gray","desc":"실제로 도입해본 조직들의 결과 — 성과, 실패 요인, 그리고 조직이 어떻게 바뀌었는지.","criteria":"'AI를 도입했다'는 보도자료가 아니라 <b>규모·성과·조직 변화가 확인되는</b> 사례만 담았습니다. 이번 주는 국내 사례를 3건, 해외 사례를 1건 배치했습니다.","highlight":{"kicker":"국내 사례","title":"금융권이 PoC를 졸업했다 — 신한카드 대고객 에이전트 15종, KB는 망분리를 우회하는 개발 경로를 만들었다","summary":"국내 금융권의 AI 도입이 개념검증(PoC) 단계를 넘어 실제 서비스로 구현되며 비즈니스 성과에 직접 영향을 주는 단계에 들어섰습니다. 신한카드는 경영진 주도로 신용카드 추천, 외국인 고객 신용카드 심사 등을 처리하는 <b>대고객 AI 에이전트 15종</b>을 순차 도입 중입니다. KB금융은 망분리 환경에서의 Agentic AI Ops와 보안·운영 체계를, 현대캐피탈은 온톨로지 기반 금융상품 지식DB와 AI-Ready Data 구축 사례를 공개했습니다.","detail":"<p>가장 참고할 만한 부분은 KB금융의 접근입니다. 망분리 제약을 정면으로 깨는 대신 <b>'AI Dev 센터'를 별도로 세워</b> 외부 R&D 환경에서 SaaS 도구로 1차 개발을 하고, 안전 절차를 거쳐 결과물만 내부망으로 반입하는 프로세스를 만들었습니다. 규제 환경을 바꿀 수 없을 때 개발 경로 자체를 재설계한 사례입니다. KB금융은 그룹 전체에서 약 100개 AI 서비스를 운영하며 300여 개까지 확대를 추진하고 있고, 대상자의 약 90%가 실제로 사용하며 실사용자는 8000명을 넘었습니다.</p><p>공통적으로 관찰되는 것은 <b>경영진 주도(톱다운)</b>입니다. 금융권에서는 CEO가 직접 코딩을 배우는 사례까지 나올 만큼 상층부 개입 강도가 높은데, 이는 부서별 자율 확산으로는 규제 산업의 승인 병목을 넘기 어렵다는 판단으로 읽힙니다. 다만 한계도 공유됩니다 — 업무시간 절감은 확인되지만 이를 매출·이익으로 환산하는 문제는 미해결 과제로 남아 있습니다.</p>","source":"벤처스퀘어 / 게트뉴스","url":"https://www.venturesquare.net/1108985","published":"2026-08","foryou":"규제·보안 제약으로 AI 도구 도입이 막혀 있다면, KB의 'AI Dev 센터' 구조는 그대로 벤치마킹 가능한 패턴입니다 — <b>제약을 없애려 하지 말고, 제약 밖에서 개발하고 결과물만 반입하는 경로를 설계</b>하는 것. 그리고 '대상자의 90%가 사용, 실사용자 8000명'처럼 도입률과 실사용자 수를 함께 관리하는 지표 형식은 우리 전사 보고에도 바로 이식할 수 있습니다. 도입률만 보면 항상 좋아 보이고, 실사용자 수만 보면 규모를 알 수 없습니다."},"articles":[{"tag":"국내 사례 · 플랫폼","source":"전자신문 / 아시아경제","url":"https://www.etnews.com/20260611000241","published":"2026-08","title":"배달의민족의 AI 성과 — 리뷰 조작 제보 83% 감소, LLM 추천 재주문율 54%","summary":"우아한형제들이 서비스 곳곳에 AI를 적용한 결과가 정량 지표로 정리되고 있습니다. AI 탐지 모델로 리뷰 패턴을 분석해 같은 시간대 다수 계정의 유사 리뷰 집중 여부 등을 판단하게 하자 <b>'이 리뷰가 이상하다'는 사용자 제보가 83% 감소</b>했습니다. 주문 데이터 기반 개인 취향과 LLM이 분석한 리뷰 맥락을 결합한 식당 추천은 재주문율 54%를 기록했습니다.","detail":"<p>다른 적용 지점도 함께 정리됩니다. 가게배달 주문 접수 시 AI가 배달 시간을 자동 예측하는 기능이 들어갔고, LLM 기반 생성형 AI로 영어·중국어·일본어 다국어 지원을 붙여 외국인 이용자의 진입 장벽을 낮췄습니다. 고객 상담에는 AI 에이전트 기반 실시간 채팅 상담을 시범 운영 중이고, 서울 강남 일대에서는 무인 자율주행 로봇 배달을 운영하고 있습니다.</p><p>사내 문화 쪽에서는 프로그래머·기획자·디자이너가 함께 참여해 주제에 맞는 서비스를 프로토타입으로 구현하는 사내 해커톤 '우아톤 2026'을 진행했습니다. 야놀자 사례와 마찬가지로, 도구 도입과 별개로 <b>직군을 섞은 실험 이벤트</b>가 국내 플랫폼 기업의 공통 확산 수단으로 자리 잡는 모습입니다.</p>","foryou":"여기서 가져갈 것은 개별 기능이 아니라 <b>지표 형식</b>입니다 — '리뷰 조작 제보 83% 감소'처럼 AI가 직접 움직인 중간 지표를 잡으면, 매출 기여를 증명하지 못해도 성과를 설명할 수 있습니다. 반복 오퍼레이션(리뷰 검수, CS 1차 응대, 정산 예외 처리)이 있는 영역이라면 '처리 비중 × 건당 소요시간 × 재작업률' 세 칸짜리 표로 같은 형식의 측정을 바로 설계할 수 있습니다."},{"tag":"국내 사례 · 제조","source":"국내 기업 AI 도입 사례 정리 (2026)","url":"https://www.reboott.ai/blog/enterprise-ai-use-cases-2026","published":"2026-08","title":"SK이노베이션·한화큐셀 — 자료 검색 자동화로 몇 시간이 몇 분으로, 출시 속도 30% 개선","summary":"SK이노베이션은 Azure 기반 생성형 AI 플랫폼을 도입해 정유·석유화학 분야의 엔지니어링 자료 검색·분석과 데이터 처리를 자동화했고, 과거 몇 시간씩 걸리던 작업이 몇 분으로 단축되고 있습니다. 한화큐셀은 AI 기반 시뮬레이션과 자동화된 워크플로로 <b>시장 출시 속도를 30% 이상 개선</b>하고 에너지 비용 절감과 탄소 배출 감소 성과도 확인했습니다.","detail":"<p>두 사례의 공통점은 AI를 '새로운 기능'이 아니라 <b>기존에 사람이 하던 탐색·조합 작업의 대체</b>로 배치했다는 점입니다. 엔지니어링 자료 검색은 창의적 판단이 아니라 흩어진 문서를 찾아 맞추는 일이고, 이 구간은 정확도 요구가 높으면서도 사람이 하면 느립니다. AI 도입 우선순위를 정할 때 가장 회수가 빠른 유형입니다.</p><p>배경 지표로는 국내 기업의 78%가 AI 도입 후 업무 시간 단축 효과를 경험했고, AI를 도입한 기업이 미도입 기업 대비 부가가치 7.8%, 매출 4% 증가라는 집계가 함께 인용됩니다. 다만 이 숫자들은 인과관계보다 상관관계에 가까우므로, 리더십 보고에 쓸 때는 '도입 기업군의 특성'이라는 단서를 함께 다는 편이 정확합니다.</p>","foryou":"AI 과제 우선순위를 정할 때 <b>'흩어진 문서를 찾아 맞추는 작업'을 최우선 후보군</b>으로 두세요. 정확도 검증이 상대적으로 쉽고(정답 문서가 존재함), 절감 효과를 측정하기 쉬우며(소요 시간), 실패해도 사람이 원래 하던 방식으로 되돌리기 쉽습니다. 우리 조직에서 이런 작업이 어디에 있는지는 간단히 찾을 수 있습니다 — 슬랙에서 \"이거 어디 문서에 있죠?\"가 가장 자주 올라오는 채널이 곧 후보입니다."},{"tag":"해외 사례 · 대규모 운영","source":"IBM AskHR 사례 (2026 집계)","url":"https://www.digitalapplied.com/blog/ai-agent-adoption-2026-enterprise-data-points","published":"2026-08","title":"IBM AskHR, 문의의 94%를 사람 없이 종결 — HR 운영비 4년간 40% 절감","summary":"IBM의 사내 HR 에이전트 AskHR이 일반적인 문의에 대해 <b>94% 컨테인먼트(사람 개입 없이 종결)</b>를 달성했고, 2016년 이후 지원 티켓을 75% 줄였으며, 4년간 HR 운영비 40% 절감에 기여했습니다. 관리자 채택률은 99%입니다. 배경 조사에서는 임원의 52%가 자사 조직이 AI 에이전트를 프로덕션에 배포했다고 답했고 39%는 10개 이상을 운영 중이라고 답했습니다.","detail":"<p>주목할 지점은 기간입니다. 2016년부터 축적된 결과이고, 생성형 AI 이전부터 시작된 프로그램입니다. 즉 94%라는 숫자는 모델 성능이 아니라 <b>10년치 문의 데이터와 프로세스 정비</b>의 결과에 가깝습니다. 최신 모델을 붙인다고 내년에 같은 숫자가 나오지 않습니다.</p><p>확산 통계는 낙관과 비관이 섞여 있습니다. 임원의 52%가 프로덕션 배포를 보고하지만, 실험한 기업 중 실제로 측정 가능한 가치를 낼 만큼 확장한 곳은 10% 미만이라는 조사도 있습니다. 12개월 시점 ROI가 마이너스인 경우가 22%인데, 원인은 대부분 모델 역량이 아니라 <b>스코프 크립, 평가 체계 부재, 오너십 공백</b>이었습니다. 긍정 사례의 중앙값은 프로덕션 가동 후 4~8개월에 ROI 전환입니다.</p>","foryou":"사내 문의 대응(HR, 재무, 인프라, 보안 문의)에 에이전트를 붙일 계획이라면, IBM 사례에서 실제로 이식 가능한 건 기술이 아니라 <b>컨테인먼트율이라는 지표</b>입니다. '사람 개입 없이 종결된 문의 비율'을 KPI로 잡으면 만족도보다 훨씬 명확하고, 남은 6%가 무엇인지 보면 다음 개선 대상이 자동으로 나옵니다. 그리고 ROI 마이너스의 주원인이 스코프 크립·평가 부재·오너십 공백이라는 점은, 과제 승인 게이트에 '오너 지정'과 '평가셋 존재'를 필수 항목으로 넣을 근거가 됩니다."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 8월 24일~8월 31일 공개 뉴스 기반. 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
