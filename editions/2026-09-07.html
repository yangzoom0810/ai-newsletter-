const NL={"meta":{"icon":"🗞️","edition":"Vol.35","cadence":"주간","date":"2026년 9월 7일 (월)","curator":"Claude (Cowork)","title":["주간 AI 뉴스레터 — ","TPM Edition"],"lead":"CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.","greeting":"안녕하세요! 이번 주는 <b>8월 31일부터 9월 3일까지 나흘 사이에 오픈AI·앤트로픽·구글·메타가 차례로 최상위 모델을 내놨습니다</b>. 프런티어 랩 네 곳이 이렇게 몰려 나온 건 이례적인데, 더 중요한 공통점은 네 회사 모두 <b>위험도 높은 기능을 등급 매겨 자격 심사를 통과한 곳에만 열어주는 '게이팅'</b>을 채택했다는 점입니다. 모델 접근이 '계약하면 쓸 수 있는 것'에서 '심사받아야 쓰는 것'으로 바뀌는 중이라, 조달 리드타임 전제가 달라집니다.<br><br>개발 쪽에서는 <b>삼성전자 시스템LSI사업부가 클로드 코드로 한 달 걸리던 반도체 검증을 이틀로 줄인</b> 사례가 나왔습니다. 국내에서 나온 가장 구체적인 정량 성과 중 하나입니다. 다만 같은 주 조사에서는 <b>기업에서 돌아가는 에이전트의 53%가 모니터링·보안 통제 없이 운영</b>되고 있다는 숫자도 나왔습니다. 성과 사례와 통제 공백이 같은 속도로 늘어나는 국면입니다.<br><br>전략 탭에는 네이버(AI 산업화)와 카카오(AI 생활화)의 갈라진 베팅, 그리고 '국가대표 AI' 2차 평가 결과를 담았습니다. 사례 탭은 도입률 85% 대 전사 내재화 6.7%라는 국내 격차 데이터로 시작합니다."},"topics":[{"id":"top","label":"이 주의 핵심","icon":"⚡","tint":"red","desc":"이번 주 국내외 AI 소식 중 전사 의사결정에 가장 직접적으로 영향을 주는 것들.","criteria":"<b>지금 당장 우리가 무엇을 해야 하는지가 명확한</b> 소식만 골랐습니다. 해외 규제는 우리 조직에 실제 적용되는 것 1건으로 줄이고, 모델 조달·리스크·예산에 직접 영향을 주는 것으로 좁혔습니다.","highlight":{"kicker":"이 주의 빅스토리","title":"프런티어 랩 4곳이 나흘 만에 동시 출시 — 승부처는 성능이 아니라 '게이팅'이었다","summary":"8월 31일부터 9월 3일까지 나흘 사이 오픈AI·앤트로픽·구글·메타가 차례로 최상위 모델을 내놨습니다. 네 곳이 이렇게 짧은 간격으로 몰린 것 자체가 이례적이지만, 더 눈여겨볼 공통점은 <b>모델을 전부 풀지 않았다는 것</b>입니다. 네 회사 모두 위험도가 높은 기능에 등급을 매기고, 심사를 통과한 대상에게만 열어주는 '게이팅(gating)' 방식을 채택했습니다.","detail":"<p>가장 극단적인 사례는 오픈AI입니다. 차기 모델 '아스트라'가 자사 위험 평가 체계에서 사이버보안 분야 최고 등급인 '치명적(critical)'에 도달했습니다 — 사람의 단계별 지시 없이도 보안이 강화된 시스템에서 알려지지 않은 취약점을 찾아내고 공격 방법까지 개발할 수 있다는 뜻입니다. 오픈AI는 이 역량을 일반 공개하지 않고 <b>심사를 거친 기업만 참여하는 'Daybreak' 프로그램</b>으로 제한했습니다. 앤트로픽도 같은 주 유사한 판단으로 일부 기능을 제한 공개했습니다.</p><p>이것이 업계 기본값으로 굳으면 실무 전제가 두 가지 바뀝니다. 첫째, <b>모델 접근이 '계약하면 되는 것'에서 '심사받아야 하는 것'으로</b> 이동합니다. 최상위 역량이 필요한 워크로드는 계약 체결과 실제 사용 시점 사이에 심사 기간이 끼어듭니다. 둘째, 국내 사업자들이 자체 안전성 정책을 설계할 때 참고할 기준선이 생겼습니다 — 위험등급 분류와 등급별 접근 통제라는 구조 자체가 표준화되는 흐름입니다.</p>","source":"와우테일 / 한국경제","url":"https://wowtale.net/2026/09/05/264020/","published":"2026-09-05","foryou":"다년 AI 로드맵에 '최상위 모델 역량'을 전제로 깔아둔 과제가 있다면 지금 전제를 점검하세요. 실무 액션은 두 가지입니다 — ① 사내 AI 과제를 '범용 모델로 되는 것 / 최상위 역량이 필요한 것'으로 한 번 분류하고, 후자에는 <b>심사 리드타임(최소 수 주)을 일정에 명시적으로 넣으세요</b>. ② 보안·레드팀 성격의 과제라면 게이팅 대상일 가능성이 높으므로, 벤더에 지금 자격 요건과 심사 절차를 먼저 문의해 두는 편이 안전합니다. 모델이 나온 뒤 알아보면 이미 한 분기가 밀립니다."},"articles":[{"tag":"모델 가격","source":"VentureBeat / Anthropic","url":"https://venturebeat.com/technology/anthropics-claude-fable-5-1-and-mythos-5-1-arrive-with-a-75-cost-reduction-for-fable-cache-reads","published":"2026-09-01","title":"Claude Fable 5.1 출시 — 일반 워크로드 25%, 에이전틱 작업은 최대 45% 저렴해졌다","summary":"앤트로픽이 9월 1일 Claude Fable 5.1과 Mythos 5.1을 공개했습니다. 성능 향상보다 실무적으로 중요한 건 단가입니다 — Fable 5.1은 일반 워크로드에서 이전 세대보다 약 <b>25% 저렴하고, 에이전틱 작업에서는 최대 45%</b> 저렴합니다. <b>캐시 읽기 토큰 가격은 75% 인하</b>됐습니다. 클로드 코드 사용자는 사이버보안 오탐(false positive)이 약 60% 줄어듭니다.","detail":"<p>세 숫자를 실무 언어로 옮기면 이렇습니다. '에이전틱 작업 최대 45%'는 <b>긴 대화를 여러 번 왕복하는 워크로드일수록 절감폭이 크다</b>는 뜻입니다. 단발성 요약·분류는 25% 근처, 코딩 에이전트나 다단계 리서치처럼 컨텍스트를 계속 재사용하는 작업은 절감폭이 훨씬 큽니다. 캐시 읽기 75% 인하가 여기에 겹치기 때문입니다.</p><p>오탐 60% 감소는 비용이 아니라 사람 시간에 영향을 줍니다. 코딩 에이전트가 보안 이슈를 과하게 잡아내면 개발자가 매번 확인하고 무시해야 하는데, 이 확인 비용이 도구 신뢰도를 깎는 주요 원인이었습니다. 다만 오탐이 줄면 미탐(false negative) 리스크는 함께 점검해야 합니다 — 자동 보안 검사를 유일한 게이트로 쓰고 있다면 그렇습니다.</p>","foryou":"이번 인하는 <b>기존 예산으로 사용량을 늘릴 수 있다는 신호</b>이지, 예산을 줄일 근거는 아닙니다. 지금 할 일은 사내 AI 워크로드를 '컨텍스트 재사용이 많은 것 / 단발성인 것'으로 나눠 보고, 전자에 프롬프트 캐싱이 실제로 적용돼 있는지 확인하는 것입니다. 캐싱을 안 쓰고 있으면 75% 인하 혜택이 그냥 지나갑니다. 30분 점검으로 다음 달 청구서가 달라지는 항목입니다."},{"tag":"국내 규제","source":"CODIT Insights / 과기정통부","url":"https://thecodit.com/blog/AI-act-enforcement-decree-kr","published":"2026-09","title":"AI기본법, 최소 1년 유예 방침 확정 — 지금 준비할 건 '사전 고지' 한 줄입니다","summary":"과기정통부가 개정 AI기본법 시행(7월 21일) 이후 기업 혁신 동력이 위축되지 않도록 <b>최소 1년 이상의 유예 기간</b>을 운영하고, 인명 사고 등 사회적 중대 이슈가 없는 한 행정조사·사실조사를 실시하지 않겠다는 방침을 밝혔습니다. 다만 유예는 처벌 유예이지 의무 면제가 아닙니다 — 고영향·생성형 AI 사전 고지 미이행 시 과태료 500만원, 반복 시 최대 1500만원 구조는 그대로입니다.","detail":"<p>유예 방침이 나왔다는 것은 규제 대응을 뒤로 미룰 수 있다는 뜻이 아니라, <b>지금 준비하면 벌금 없이 정비할 시간이 있다</b>는 뜻입니다. 실제로 부담이 큰 항목(영향평가, 안전성 확보 조치, 문서화)은 해당 여부가 확정된 뒤에 붙는 일이므로, 먼저 확인해야 하는 것은 딱 하나입니다 — <b>우리 서비스가 고영향 AI에 해당하는가, 생성형 AI 표시 의무 대상인가.</b></p><p>해외 규제 쪽은 EU AI Act가 8월부터 투명성 의무와 집행 조항 적용에 들어갔지만, 국내 이용자만 대상으로 하는 서비스라면 조항을 상세히 볼 필요는 없습니다. 해외 이용자 대상 기능이 있는 경우에만 '적용 대상인지' 여부만 한 번 확인하는 것으로 충분합니다.</p>","foryou":"유예 기간에 만들어 둘 산출물은 법령 요약이 아니라 <b>한 장짜리 매핑 표</b>입니다. 우리 서비스에서 AI가 개입하는 지점을 나열하고 각각에 ① 고영향 AI 해당 여부, ② 이용자 사전 고지 문구가 실제 화면에 있는지, ③ 생성형 산출물 표시 대상인지 — 세 칸만 채우세요. 대부분은 '해당 없음'으로 정리되고, 남는 소수만 관리 대상이 됩니다. 이 표가 있으면 법무·감사 문의가 왔을 때 하루 안에 답할 수 있고, 없으면 매번 전수조사를 다시 합니다."},{"tag":"에이전트 리스크","source":"CIO Korea","url":"https://www.cio.com/article/4128544/","published":"2026-09","title":"\"절반은 관리되지 않는다\" — 기업 에이전트 53%가 모니터링·보안 통제 없이 돌아간다","summary":"미국·영국 기업에서 사용 중인 AI 에이전트 가운데 모니터링과 보안 통제가 적극적으로 적용되지 않은 비율이 평균 <b>53%</b>라는 조사가 나왔습니다. 조사 기관의 진단은 명확합니다 — 에이전트 도입 속도가 보안팀의 대응 역량을 앞질렀고, 대부분의 보안 실패는 모델 벤치마크 점수가 아니라 <b>권한, 커넥터, 누락된 검토, 부실한 주변 통제</b>에서 비롯됩니다.","detail":"<p>기술적 위험 요소로 지목된 것은 세 가지 조합입니다 — 자연어 처리(입력을 사전에 검증하기 어렵다), 외부 원본과의 상호작용(신뢰할 수 없는 데이터가 지시로 해석될 수 있다), 자율적 결정 능력(사람 확인 없이 실행된다). 여기서 데이터 유출, 데이터 중독, 탈옥, 자격증명 탈취가 파생됩니다.</p><p>특히 API 계층이 문제로 꼽힙니다. 에이전트는 환경 전반의 애플리케이션·데이터·서비스와 API로 상호작용하는데, API는 원래도 보안·거버넌스가 일관되지 않은 영역이었습니다. 에이전트는 사람보다 수십 배 빠른 속도로 그 API를 호출하므로, 기존의 느슨한 지점이 그대로 증폭됩니다.</p>","foryou":"이 숫자는 가드레일 예산을 설득할 때 그대로 인용 가능합니다. 다만 보고서를 읽는 것보다 중요한 건 <b>인벤토리 한 장</b>입니다 — 사내에서 돌아가는 에이전트별로 '소유자 / 접근 가능한 시스템 / read·write 여부 / 로그 보관 위치'를 채운 표를 만드세요. 실제로 만들어 보면 대부분의 조직에서 '누가 만들었는지 모르는 것'이 몇 개 나옵니다. 그게 먼저 손댈 대상입니다. 그리고 사람 계정에 적용하는 최소권한 원칙을 에이전트 계정에도 같은 기준으로 적용하는 것이 가장 비용 대비 효과가 큰 조치입니다."}]},{"id":"dev","label":"개발 AI 동향","icon":"🛠️","tint":"purple","desc":"함께 일하는 엔지니어 조직의 일하는 방식을 실제로 바꾸는 도구 변화.","criteria":"버전 번호와 체인지로그는 걷어내고, <b>팀의 작업 경로·역할 정의·리뷰 방식이 어떻게 달라지는가</b>만 남겼습니다. 이번 주는 '엔지니어가 무엇을 하는 사람이 되는가'가 관통 주제였습니다.","highlight":{"kicker":"국내 정량 성과","title":"삼성전자 시스템LSI, 클로드 코드로 한 달 걸리던 반도체 검증을 이틀로 줄였다","summary":"삼성전자 시스템LSI사업부가 앤트로픽의 코딩 에이전트 '클로드 코드'를 반도체 설계·검증 업무에 투입해, 고객 맞춤형 SoC 프로젝트에서 당초 <b>한 달 이상 걸릴 것으로 예상된 검증 환경 구축과 점검을 이틀 만에</b> 마쳤습니다. 5월부터 소프트웨어 개발 업무에 먼저 도입한 뒤 SoC 검증 등으로 적용 범위를 넓힌 결과입니다.","detail":"<p>더 눈여겨볼 대목은 총 소요시간보다 <b>누가 했는가</b>입니다. 입사 2년 차 엔지니어가 클로드 코드를 이용해 에뮬레이터용 키보드·마우스 USB 모델을 하루 만에 만들고 동작 확인까지 끝냈습니다. 반도체 검증 환경 구축은 도메인 지식과 툴체인 숙련도가 모두 필요해 통상 시니어가 담당하는 영역인데, 그 구간의 진입 장벽이 낮아졌다는 뜻입니다.</p><p>도입 경로도 참고할 만합니다. 처음부터 핵심 설계 업무에 넣지 않고 <b>일반 소프트웨어 개발 → 검증 환경 구축 → SoC 검증</b> 순으로 리스크가 낮은 쪽에서 시작해 범위를 넓혔습니다. 검증 환경 구축은 결과물의 정확성을 기존 방식으로 교차 확인할 수 있어 실패 비용이 낮은 영역입니다. 한편 앤트로픽은 자체 AI 칩 개발을 위해 삼성 파운드리의 2나노 공정과 첨단 패키징 활용을 검토 중이라는 보도도 같은 기간 나왔지만, 아직 초기 논의 단계입니다.</p>","source":"더퍼블릭 / SEN TV","url":"https://www.thepublic.kr/news/articleView.html?idxno=314906","published":"2026-09","foryou":"'코딩 에이전트가 개발 속도를 올린다'는 일반론 대신 <b>이 도입 순서를 그대로 벤치마킹</b>할 수 있습니다 — 검증·테스트·환경 구축처럼 ① 결과를 기존 방식으로 교차 확인할 수 있고 ② 실패해도 되돌리기 쉬운 영역부터 시작하는 것. 그리고 성과 측정 지표로 '개발 속도'가 아니라 <b>'주니어가 시니어 영역 작업을 완료한 건수'</b>를 잡아보세요. 온보딩 기간 단축과 시니어 병목 완화라는, 리더십에 훨씬 설명하기 쉬운 효과로 연결됩니다."},"articles":[{"tag":"역할 재정의","source":"TILNOTE / 업계 보도","url":"https://tilnote.io/en/pages/6a9df8a38a847deea17858b8","published":"2026-09","title":"오픈AI 연구원들은 이제 코드를 짜지 않는다 — 실험의 80%를 에이전트가 자율 수행","summary":"오픈AI 내부 실태 보고에 따르면 연구원들이 파이썬 코드를 직접 작성하는 대신 <b>명세서(spec) 작성에 집중</b>하고, 코딩 에이전트가 실험의 약 80%를 자율 수행하고 있습니다. 세계 최고 수준의 연구 조직에서 '직접 구현하는 사람'이 '무엇을 만들지 정확히 기술하는 사람'으로 역할이 이동했다는 얘기입니다.","detail":"<p>이 변화의 실무적 함의는 '개발자가 필요 없어진다'가 아닙니다. 오히려 <b>모호한 요구사항의 비용이 급격히 올라간다</b>는 쪽입니다. 사람이 구현할 때는 애매한 스펙을 받은 개발자가 중간에 질문하거나 알아서 합리적으로 채워 넣었습니다. 에이전트는 그 빈칸을 질문 없이 그럴듯하게 채우고, 오차는 결과물이 나온 뒤에야 드러납니다.</p><p>즉 병목이 '구현 속도'에서 <b>'스펙 정확도'와 '결과 검증'</b>으로 옮겨갑니다. 이 두 구간은 정확히 TPM·기획 직군이 담당하는 영역입니다. 에이전트 도입으로 업무량이 줄어드는 쪽은 구현이고, 늘어나는 쪽은 명세와 수용 기준(acceptance criteria) 정의입니다.</p>","foryou":"코딩 에이전트를 본격적으로 쓰기 시작한 팀이 있다면, 스프린트 산출물 템플릿에서 <b>'수용 기준(acceptance criteria)' 항목을 필수로 승격</b>하세요. 에이전트에게 넘기는 작업 단위에는 '무엇이 되면 완료인지'가 검증 가능한 문장으로 적혀 있어야 하고, 이게 없으면 리뷰 단계에서 시간을 그대로 반납합니다. 반대로 이 항목이 잘 채워진 팀에서는 에이전트 도입 효과가 가장 크게 나옵니다 — 파일럿 팀 선정 기준으로 써도 좋습니다."},{"tag":"도구 변화","source":"Releasebot (Claude Code)","url":"https://releasebot.io/updates/anthropic/claude-code","published":"2026-09-04","title":"클로드 코드에 '정책·스킬 진단'이 들어왔다 — 개인 설정에서 조직 설정으로","summary":"9월 초 클로드 코드 업데이트에서 실무적으로 의미 있는 변화는 두 가지입니다. 첫째, <b>정책(policy)과 스킬 진단 기능</b>이 추가되어 조직이 설정한 정책이 실제로 적용되고 있는지 확인할 수 있게 됐습니다. 둘째, 미커밋 변경사항을 <b>사이드바이사이드 diff 패널</b>로 보여주기 시작했습니다. 기본 모델은 Fable 5.1로 전환되며 컨텍스트가 확장됐습니다.","detail":"<p>버전 번호보다 방향이 중요합니다. 정책 진단이 들어왔다는 것은 코딩 에이전트가 <b>'개인이 설치해서 쓰는 도구'에서 '조직이 정책으로 관리하는 플랫폼'으로</b> 이동하는 단계에 들어섰다는 신호입니다. 그동안 조직 정책을 설정해도 실제로 적용되는지 확인할 방법이 마땅치 않았고, 그래서 정책이 문서로만 존재하는 경우가 많았습니다.</p><p>사이드바이사이드 diff는 사소해 보이지만 리뷰 방식에 영향을 줍니다. 에이전트가 여러 파일을 한꺼번에 수정할 때 무엇이 바뀌었는지 사람이 파악하는 비용이 가장 크고, 이 비용 때문에 '일단 커밋하고 나중에 본다'는 관행이 생깁니다. 변경 확인이 빨라지면 커밋 전 검토가 실제로 이뤄질 확률이 올라갑니다.</p>","foryou":"조직 정책을 이미 설정해 둔 팀이라면 진단 기능으로 <b>한 번 실제 적용 상태를 점검하세요</b> — 설정한 정책과 적용되는 정책이 다른 경우가 생각보다 흔합니다. 아직 정책을 안 정했다면 최소 세 줄만 정의하면 됩니다: ① 사람 승인이 반드시 필요한 액션(프로덕션 배포, DB 마이그레이션, 시크릿 접근), ② 에이전트가 접근 가능한 저장소 범위, ③ 세션 로그 보관 위치와 기간. 도구를 고르는 일보다 이 세 줄이 먼저입니다."},{"tag":"도구 지형","source":"SitePoint / Uvik","url":"https://www.sitepoint.com/claude-code-vs-cursor-vs-copilot-the-2026-developer-comparison/","published":"2026-09","title":"코딩 에이전트 3사가 기능적으로 수렴했다 — 이제 차이는 '통제'에서 난다","summary":"2026년 하반기 기준 클로드 코드·커서·코파일럿은 <b>기능 측면에서 거의 수렴</b>했습니다. 세 도구 모두 CLI를 제공하고, 에이전틱하게 코드를 실행하며, PR을 여는 클라우드 에이전트를 돌리고, MCP 서버에 연결됩니다. 도구 선택이 기능 비교로 갈리는 국면이 끝났다는 뜻입니다.","detail":"<p>기능이 수렴하면 남는 변수는 세 가지입니다 — <b>실행 위치(벤더 인프라 vs 사내망), 권한 관리 방식(개인 승인 vs 조직 정책), 그리고 라이선스·사용량 과금 구조.</b> 이 세 가지는 모두 개발자 개인의 선호가 아니라 플랫폼·보안·재무 조직의 판단 영역입니다.</p><p>실무에서 관찰되는 패턴도 '한 도구로 통일'이 아닙니다. 깊은 리팩터링에는 터미널 에이전트, 일상 작업에는 IDE 에이전트, 위임 가능한 작업에는 클라우드 에이전트를 섞어 쓰는 조합이 일반적입니다. 즉 도구 표준화보다 <b>도구 중립적인 게이트 설계</b>가 실효성 있는 접근입니다.</p>","foryou":"'우리는 어떤 에이전트로 통일할까'는 이제 답이 잘 안 나오는 질문입니다. 대신 <b>어떤 도구든 통과해야 하는 게이트 3개</b>를 정의하세요 — ① 승인된 도구 목록(신규 도구는 등록 절차를 거친다), ② 도구별 접근 가능 저장소·시크릿 범위, ③ 에이전트가 만든 PR의 승인 규칙(사람 리뷰어 최소 1명 등). 이걸 도구 중립적으로 정의하면 팀마다 다른 도구를 써도 리스크는 한 곳에서 관리되고, 새 도구가 나올 때마다 전사 논의를 다시 하지 않아도 됩니다."}]},{"id":"tpm","label":"TPM 업무 자동화","icon":"📋","tint":"blue","desc":"로드맵·스프린트·문서화·커뮤니케이션에 이번 주부터 바로 붙여볼 수 있는 기능.","criteria":"데모가 예쁜 기능이 아니라 <b>TPM이 매주 반복하는 작업을 실제로 덜어주는</b> 것만 골랐습니다. 이번 주는 '에이전트 산출물을 사람이 어떻게 검토하는가'가 공통 주제였습니다.","highlight":{"kicker":"바로 써볼 것","title":"노션 에이전트에 '라인 단위 승인'이 생겼다 — 에이전트 산출물 검토가 전부/전무에서 벗어났다","summary":"노션이 에이전트에 <b>제안 편집(suggested edits)</b>을 추가했습니다. 에이전트가 문서를 수정할 때 변경사항을 한 줄씩 검토하고 개별 승인·거절할 수 있습니다. 함께 들어온 <b>노션 스킬(Notion Skills)</b>은 반복하는 워크플로를 저장해 재사용하게 해주고, 위치를 먼저 정하지 않고도 에이전트가 초안을 만들어 두는 <b>비공개 초안(private draft)</b> 기능도 추가됐습니다.","detail":"<p>TPM 관점에서 제안 편집이 중요한 이유는 신뢰 구간을 만들어 준다는 점입니다. 지금까지 에이전트에 문서 수정을 맡기는 선택지는 사실상 두 가지뿐이었습니다 — <b>전부 맡기고 나중에 확인하거나, 아예 맡기지 않거나.</b> 그래서 정확도가 중요한 문서(로드맵, 스펙, 회의록의 결정 사항)에는 아무도 에이전트를 붙이지 않았습니다. 라인 단위 승인이 생기면 '에이전트가 초안을 쓰고 사람이 승인하는' 중간 지대가 열립니다.</p><p>노션 스킬은 반복 작업의 표준화 도구로 볼 수 있습니다. 주간 보고 취합, 스프린트 회고 정리, 이슈 상태 요약처럼 매주 같은 형태로 반복하는 작업을 한 번 정의해 두면 이후 호출만 하면 됩니다. 커스텀 에이전트는 5월에 정식 출시(GA)됐고, MCP 연동으로 Linear·Jira·Slack·Figma·Drive·GitHub를 횡단합니다.</p>","source":"Notion Releases / Notion Developers","url":"https://releasebot.io/updates/notion","published":"2026-09","foryou":"가장 회수가 빠른 활용은 <b>정확도가 중요해서 지금까지 자동화를 포기한 문서</b>부터 다시 시도해 보는 것입니다 — 주간 상태 보고, 스프린트 회고 정리, 리스크 로그 갱신. '에이전트가 초안 → 담당자가 라인별 승인' 흐름으로 2주만 돌려 보고 승인 거절률을 세어 보세요. 거절률이 낮으면 그 작업은 자동화 후보로 확정, 높으면 그 이유가 곧 프롬프트 개선 지점입니다. 그리고 반복 작업 하나는 노션 스킬로 저장해 두면 매주 같은 지시를 다시 쓰는 시간이 사라집니다."},"articles":[{"tag":"회의 자동화","source":"eWeek / Slack","url":"https://www.eweek.com/news/slack-ai-update-salesforce-slackbot-2026/","published":"2026-09","title":"슬랙봇이 MCP로 외부 앱을 움직인다 — 회의 요약이 티켓·CRM까지 자동으로 이어진다","summary":"슬랙봇에 <b>MCP 기반 크로스앱 작업 수행</b>과 <b>이벤트 트리거 자동화</b>가 들어왔습니다. 특정 이벤트에 반응해 슬랙봇 작업이 자동 실행되고, 회의가 끝나면 요약과 액션 아이템이 정리된 상태로 올라오며 CRM 업데이트까지 완료됩니다. 문서·스프레드시트·프레젠테이션 생성과 음성 명령 상호작용도 함께 지원됩니다.","detail":"<p>TPM 업무에서 실제로 시간을 먹는 건 회의 내용을 정리하는 일이 아니라, <b>정리된 내용을 트래커·티켓·주간 보고 세 곳에 옮겨 붙이는 일</b>입니다. 요약 기능은 이미 어느 도구나 하지만, 요약 다음 단계가 자동으로 이어지는지가 실제 절감폭을 결정합니다. MCP 연동이 붙었다는 것은 이 '다음 단계'를 슬랙 안에서 끝낼 수 있다는 뜻입니다.</p><p>리스크도 같이 옵니다. 이벤트 트리거 자동화는 잘못 설정하면 잡음을 대량 생산합니다. 그리고 에이전트가 만든 액션 아이템이 실제 논의보다 부정확하거나 담당자를 잘못 지정한 채 티켓으로 굳으면, 그 오차를 나중에 사람이 되돌려야 합니다 — 자동 생성 자체보다 <b>생성물을 누가 확인하는가</b>가 설계 포인트입니다.</p>","foryou":"전면 적용 대신 <b>정기 회의 한 개</b>를 골라 '회의 종료 → 액션아이템 초안 생성 → 담당자 확인 후 티켓 발행'까지만 2~3주 돌려 보세요. 처음부터 티켓 자동 발행으로 두지 말고 담당자 확인 단계를 남겨 두는 게 중요합니다 — 이 기간에 모인 오차 패턴(담당자 오지정, 없는 액션 생성, 결정사항 누락)이 곧 자동화 범위를 정하는 근거가 됩니다. 오차 유형이 파악되면 그때 확인 단계를 제거하면 됩니다."},{"tag":"비용 구조","source":"업계 보도 (Microsoft 오디오 모델)","url":"https://tilnote.io/en/pages/6a9df8a38a847deea17858b8","published":"2026-09","title":"회의 녹취 비용이 시간당 138원으로 — MS 오디오 모델, 경쟁사 대비 72% 저가","summary":"마이크로소프트가 독자 오디오 모델을 공개하며 오픈AI·일레븐랩스 대비 단가를 <b>72% 낮춘 오디오 1시간당 10센트(약 138원)</b>로 책정했습니다. 음성 처리 단가가 이 수준으로 내려가면 '어떤 회의를 녹취·전사할지 고르는' 단계가 사실상 사라집니다.","detail":"<p>실무적 의미는 정확도 향상이 아니라 <b>선별 비용의 소멸</b>입니다. 지금까지는 전사 비용 때문에 중요한 회의만 골라 녹취했고, 그 선별 작업 자체가 사람 판단을 요구했습니다. 시간당 138원이면 주 40시간 회의를 전부 전사해도 월 2만원대입니다. 비용이 판단 기준에서 빠집니다.</p><p>그런데 비용이 빠지면 <b>다른 제약이 전면에 옵니다</b> — 녹취 원본의 보관 위치와 기간, 외부 참석자에 대한 고지, 인사·계약·미공개 지표가 포함된 대화의 접근 권한. 저렴해졌다고 전면 녹취를 켜면, 몇 달 뒤 '어디에 무엇이 얼마나 남아 있는지 모르는' 대화 아카이브가 생깁니다. 실제로 정리해야 할 문제는 여기입니다.</p>","foryou":"전사 비용을 이유로 회의 녹취 범위를 제한하고 있었다면 그 제약은 이제 유효하지 않습니다. 대신 <b>확대 전에 세 줄을 먼저 정하세요</b> — ① 녹취 원본 보관 기간(예: 90일 후 자동 삭제, 요약만 보존), ② 접근 권한 범위(참석자 한정 / 팀 공개), ③ 외부 참석자가 있는 회의의 자동 고지 방식. 특히 ③은 놓치기 쉬우면서 법적으로 가장 민감한 항목입니다. 이 세 줄이 정해지면 범위 확대는 설정 변경 수준의 일이 됩니다."},{"tag":"정보 검색","source":"Notion AI Connectors / eesel AI","url":"https://www.eesel.ai/blog/notion-ai-review","published":"2026-09","title":"도구 횡단 Q&A가 실용 구간에 들어왔다 — Slack·Drive·GitHub·Linear·Jira를 한 번에","summary":"노션 AI 커넥터가 <b>Slack, Google Drive, GitHub, Linear, Jira, Notion Mail</b>을 횡단하는 Q&A를 지원합니다. 엔지니어는 지라에 살고 나머지 조직은 노션에서 계획하는 팀을 위한 지라 연동도 개선됐습니다. '이 결정 어디서 논의됐죠?'를 도구별로 각각 검색하던 작업이 한 번의 질문으로 줄어듭니다.","detail":"<p>TPM 업무에서 이 기능이 실제로 절감하는 것은 검색 시간이 아니라 <b>맥락 재구성 시간</b>입니다. 어떤 결정의 배경을 파악하려면 보통 슬랙 스레드, 노션 회의록, 지라 코멘트를 각각 찾아 시간순으로 맞춰야 하는데, 이 작업이 도구 개수만큼 곱해집니다. 횡단 검색은 이 조합 작업을 줄여 줍니다.</p><p>주의할 점은 <b>권한 경계</b>입니다. 커넥터를 붙이면 검색 범위가 넓어지는 대신, 각 도구에서 그 사용자가 원래 볼 수 있던 범위를 정확히 따라가는지 확인해야 합니다. 특히 슬랙 비공개 채널과 드라이브 제한 문서가 검색 결과에 어떻게 반영되는지는 도입 전 반드시 테스트할 항목입니다.</p>","foryou":"커넥터 도입 검토 시 기능 테스트보다 <b>권한 테스트를 먼저</b> 하세요 — 서로 다른 권한 수준의 계정 2~3개로 같은 질문을 던져 보고, 원래 접근 권한이 없는 문서 내용이 답변에 섞이는지 확인하는 것입니다. 30분이면 되고, 이 테스트를 통과하면 보안 검토가 훨씬 빨라집니다. 그리고 도입 후 첫 활용처로는 <b>온보딩</b>을 추천합니다 — 신규 입사자가 '이건 왜 이렇게 결정됐나요'를 스스로 찾을 수 있게 되면, 시니어의 설명 시간이 가장 눈에 보이게 줄어듭니다."}]},{"id":"biz","label":"빅테크 & 전략 동향","icon":"🌐","tint":"orange","desc":"리더십 보고와 전사 전략 수립에 인용할 만한 산업 맥락.","criteria":"거시·지정학 얘기는 빼고, <b>벤더 선택·가격 협상·조직 설계에 참고가 되는</b> 소식만 담았습니다. 국내 진영의 전략 분화를 앞에, 해외 벤더의 수익화 방향을 뒤에 배치했습니다.","highlight":{"kicker":"국내 전략 지도","title":"네이버는 'AI 산업화', 카카오는 'AI 생활화' — 국내 양대 플랫폼의 베팅이 갈렸다","summary":"네이버와 카카오 모두 인프라 구축기를 마치고 2026년부터 <b>서비스와 결합한 AI</b>로 전환했지만 방향은 정반대입니다. 네이버는 온서비스AI에 이어 사용자 맥락을 이해해 능동적으로 답하는 <b>'에이전트N'</b>을 구축하며, 검색·광고·커머스에 AI Factory와 AIDC까지 연결하는 풀스택 전략을 밉니다. 카카오는 인프라에 자본을 투입하는 대신 <b>카카오톡의 사용시간·광고·커머스·결제를 AI로 강화</b>하는 쪽을 택했습니다.","detail":"<p>업계의 요약은 간결합니다 — <b>\"네이버가 AI 산업화를 지향한다면 카카오는 AI 생활화를 추구한다.\"</b> 네이버는 컴퓨트를 소유해 소버린 AI 수요까지 공략하고, 카카오는 이미 가진 채널 위에 AI를 얹어 거래 전환으로 회수합니다. 어느 쪽이 옳다기보다, <b>자기가 가진 자산이 무엇이냐</b>에 따라 답이 달라진다는 것을 보여 주는 대조군입니다.</p><p>모델 쪽에서도 네이버는 효율화·경량화 노선을 함께 갑니다. 새 하이퍼클로바X는 기존 대비 약 40% 수준의 파라미터로 구성되고 운영 비용이 50% 이상 개선됐으며, 옴니모달 업그레이드도 완료했습니다. 즉 '최대 성능'이 아니라 '서비스에 붙일 수 있는 단가'를 목표로 잡았습니다. 두 회사 모두 2026년은 완성도를 높이는 시기이고 <b>AI 수익화는 2027년부터 점진적으로</b> 기대 가능하다는 것이 증권가의 대체적 시각입니다.</p>","source":"테크M","url":"https://www.techm.kr/news/articleView.html?idxno=148224","published":"2026-09","foryou":"전사 AI 전략 문서에서 '무엇을 소유하고 무엇을 빌릴지'를 설명할 때 이 대조를 그대로 쓸 수 있습니다. 대부분의 조직에게 실제로 복제 가능한 것은 <b>카카오형(가진 채널에 남의 모델을 얹는 쪽)</b>이므로, 논의를 인프라 소유가 아니라 \"우리 채널에서 AI가 완결되는 지점이 어디인가\"로 좁히는 게 생산적입니다. 그리고 네이버의 '파라미터 40%·운영비용 50% 개선' 노선은 사내 모델 선택 기준에도 시사점이 있습니다 — 벤치마크 최고점보다 <b>워크로드별 최소 충분 모델</b>을 고르는 쪽이 지금 업계 흐름과 같은 방향입니다."},"articles":[{"tag":"국내 모델 조달","source":"파이낸셜뉴스","url":"https://www.fnnews.com/news/202608181111487214","published":"2026-09","title":"'국가대표 AI' 2차 평가 — SKT·LG·업스테이지 통과, 연말 최종 2팀 경쟁","summary":"독자 AI 파운데이션 모델 개발 사업의 2차 평가에서 <b>SK텔레콤·LG·업스테이지가 통과</b>하고 모티프는 탈락했습니다. SK텔레콤은 6880억 파라미터 규모 모델과 산업 현장 적용 성과를, LG는 초대형 모델 학습·추론 기술을 앞세워 연말 최종 평가에 나섭니다. 최종적으로 2팀이 선정됩니다.","detail":"<p>이 결과가 실무에 영향을 주는 경로는 <b>중기 조달 옵션</b>입니다. 국가 지원을 받는 국내 파운데이션 모델이 2팀으로 좁혀지면, 데이터 소재지·망분리·공공 조달 요건 때문에 해외 모델을 쓰기 어려운 워크로드에 대한 선택지가 명확해집니다. 반대로 탈락한 팀의 모델을 이미 검토 중이었다면 로드맵 지속성 리스크를 다시 봐야 합니다.</p><p>주목할 점은 평가 기준에 <b>'산업 현장 적용 성과'</b>가 들어간다는 것입니다. 파라미터 규모만이 아니라 실제 적용 실적으로 평가받는 구조라, 선정된 모델은 레퍼런스 케이스를 확보한 상태로 나올 가능성이 높습니다. 도입 검토 시 기술 스펙보다 이 레퍼런스를 먼저 확인하는 편이 실용적입니다.</p>","foryou":"국내 모델을 조달 후보에 두고 있다면 지금은 <b>결정하지 말고 관망</b>하는 것이 합리적입니다 — 연말 최종 2팀 선정 이후 지원 구조와 가격이 달라질 가능성이 큽니다. 대신 그 사이에 해둘 일이 있습니다: 사내 워크로드 중 <b>'해외 모델을 쓸 수 없는 것'</b>이 실제로 무엇인지 목록화하세요(데이터 소재지 요건, 공공 계약 조건, 망분리 대상). 이 목록의 크기가 국내 모델 조달의 실제 필요량이고, 대부분의 조직에서 생각보다 작게 나옵니다."},{"tag":"벤더 수익화","source":"업계 보도 (OpenAI)","url":"https://tilnote.io/en/pages/6a9df8a38a847deea17858b8","published":"2026-09","title":"챗GPT 광고 매출이 연환산 10억 달러를 넘었다 — 200일 만에","summary":"오픈AI의 챗GPT 광고 매출이 <b>연환산 10억 달러를 돌파</b>했습니다. 2026년 2월 미국에서 시험 도입한 지 200일 만입니다. 광고가 실험이 아니라 주요 수익원으로 자리 잡았다는 뜻이고, 이는 무료·저가 티어와 유료 티어의 데이터 취급 조건이 구조적으로 갈라지는 흐름을 가속합니다.","detail":"<p>실무적으로 중요한 것은 광고 자체가 아니라 <b>티어 설계의 방향</b>입니다. '광고 없음'이 상위 티어의 명시적 혜택으로 자리 잡으면, 무료·저가 티어의 기능과 데이터 취급이 유료 티어와 점점 더 달라집니다. 직원이 개인 무료 계정으로 업무를 처리하는 관행이 남아 있는 조직에서는 이 격차가 그대로 리스크가 됩니다.</p><p>같은 흐름의 다른 신호로, 마이크로소프트가 독자 오디오 모델을 경쟁사 대비 72% 낮은 단가로 내놓고, 앤트로픽이 캐시 읽기 가격을 75% 인하한 것도 이번 주였습니다. <b>모델 단가는 내려가고 수익은 다른 곳에서 회수하는</b> 구조로 시장이 재편되는 중입니다. 벤더 협상에서 단가만 보면 전체 그림을 놓칩니다.</p>","foryou":"두 가지 액션이 나옵니다. 첫째, <b>섀도 AI 점검</b> — 사내에서 개인 무료 계정으로 업무 데이터를 다루는 관행이 얼마나 되는지 파악하고 회사 계정 발급으로 흡수하세요. 무료 티어의 데이터 취급 조건은 계속 달라집니다. 둘째, 벤더 갱신 협상에서 '광고 미노출·학습 미사용·데이터 보관 기간'을 <b>단가와 별개 조항으로</b> 계약서에 못 박아 두세요. 지금은 기본값이지만 기본값은 바뀌고, 바뀐 뒤에 협상하면 늦습니다."},{"tag":"리더십 변화","source":"업계 보도 (Apple)","url":"https://tilnote.io/en/pages/6a9df8a38a847deea17858b8","published":"2026-09","title":"애플, 15년 만의 CEO 교체 — 하드웨어 출신 존 터너스 선임","summary":"팀 쿡이 15년 만에 애플 최고경영자에서 물러나고, 하드웨어 엔지니어링을 담당했던 <b>존 터너스</b>가 후임으로 선임됐습니다. AI 경쟁에서 상대적으로 뒤처졌다는 평가를 받아 온 시점에 하드웨어 출신이 승계했다는 점이 향후 방향을 시사합니다.","detail":"<p>국내 조직 실무에 직접 영향은 크지 않지만, 참고할 맥락이 하나 있습니다. 애플은 클라우드 기반 대형 모델 경쟁에서 후발이었지만 <b>온디바이스 실행</b>에서는 하드웨어 통제력이라는 자산을 가지고 있습니다. 하드웨어 출신 CEO 승계는 이 자산을 축으로 삼겠다는 신호로 읽힐 수 있습니다.</p><p>이 방향이 실제로 강화되면 모바일 앱을 운영하는 조직에는 중기적으로 선택지가 하나 늘어납니다 — 지연시간과 프라이버시가 중요한 기능을 서버 호출 없이 단말에서 처리하는 경로입니다. 다만 아직 방향 추정 단계이므로, 지금 로드맵에 반영할 것은 없고 '옵션이 열릴 수 있다' 정도로 알아 두는 편이 적절합니다.</p>","foryou":"리더십 보고에서 빅테크 경영진 교체를 다룰 때는 인사 자체보다 <b>그 회사가 어떤 자산을 축으로 삼는지</b>로 연결하는 편이 유용합니다. 이번 건에서 실무적으로 남는 질문은 하나입니다 — 우리 서비스의 AI 기능 중 <b>온디바이스로 내려갈 수 있는 것</b>이 있는가(지연시간이 중요하거나, 데이터를 서버로 보내기 부담스러운 기능). 있다면 향후 1~2년 내 선택지가 넓어질 영역이므로, 서버 전제로 아키텍처를 굳히기 전에 한 번 짚어 볼 가치가 있습니다."}]},{"id":"case","label":"국내외 AI 도입 사례","icon":"📚","tint":"gray","desc":"실제로 도입해 본 조직들의 결과 — 성과, 실패 요인, 그리고 조직이 어떻게 바뀌었는지.","criteria":"'AI를 도입했다'는 보도자료가 아니라 <b>규모·성과·조직 변화가 확인되는</b> 사례만 담았습니다. 국내 사례 3건, 해외 사례 1건을 배치했습니다.","highlight":{"kicker":"국내 도입 현황","title":"도입률 85%, 전사 내재화 6.7% — 이 격차가 내년 성과 질문의 출처입니다","summary":"국내 기업의 <b>55.7%가 이미 생성형 AI를 활용</b>하고 있습니다(전사 22.4% + 일부 부서 33.2%). 구현 중·도입 계획까지 포함하면 2026년 중 85%를 넘어설 전망이고, 79~80%가 예산 확대를 예상합니다. 그런데 같은 기간 다른 조사에서는 <b>전사 차원에서 생성형 AI가 내재화된 기업이 6.7%</b>에 불과했습니다. 나머지는 탐색·준비(34.8%), 시범 도입(25.9%), 부분 확산(28.5%) 단계입니다.","detail":"<p>두 숫자를 함께 봐야 의미가 생깁니다. 도입률 85%는 '어느 팀이든 무언가는 쓰고 있다'는 뜻이고, 내재화 6.7%는 <b>'업무 프로세스 자체가 바뀐 조직은 거의 없다'</b>는 뜻입니다. 대부분의 조직은 개인 생산성 도구 단계에 머물러 있는데 예산은 계속 늘어납니다. 성과 압력이 붙기 시작하는 지점이 정확히 여기입니다.</p><p>구체적 사례로 자주 인용되는 것들은 공통 패턴이 있습니다 — 포스코의 자체 LLM 기반 'P-GPT'는 임직원이 사내 데이터를 즉시 검색하게 했고, 한화그룹의 사내 챗봇 'AIDA'는 건설 법령 검색을 자동화했으며, 배달의민족의 AI 리뷰 탐지는 리뷰 패턴 분석으로 허위 제보를 83% 줄였습니다. 세 사례 모두 <b>'흩어진 정보를 찾아 맞추는 작업'이거나 '반복 판단 작업'</b>입니다. 창의적 생성이 아니라 탐색·검수 구간에서 성과가 먼저 나옵니다.</p><p>투자 쪽 배경 지표로는 응답자 60.3%가 생성형 AI를 자사 IT 전략의 높은 우선순위로 평가했고, 74.0%가 전년 대비 투자 증가를 보고했습니다.</p>","source":"CIO Korea / Deloitte Korea","url":"https://www.cio.com/article/4045735/","published":"2026-09","foryou":"예산이 계속 늘어난다는 것은 뒤집어 말하면 <b>내년에 성과 질문이 온다</b>는 뜻입니다. 지금 할 일은 새 과제를 늘리는 게 아니라 이미 돌아가는 과제에 중간 지표를 붙이는 것입니다. 매출·이익은 AI가 직접 움직이기 어려우니, 과제별로 <b>처리 시간·처리 비중·재작업률·티켓 감소율 중 하나만</b> 정의해 두세요. 그리고 과제 우선순위를 다시 정할 때는 위 세 사례의 공통 패턴을 기준으로 쓰면 됩니다 — '흩어진 문서를 찾아 맞추는 작업'과 '반복 검수 작업'이 회수가 가장 빠릅니다."},"articles":[{"tag":"국내 사례 · 거버넌스","source":"getnews / SK Careers Journal","url":"https://www.getnews.co.kr/news/articleView.html?idxno=855507","published":"2026-09","title":"SK텔레콤, CEO 직속 'AI 보드' 신설 — 에이전틱 AI를 조직 구조로 받았다","summary":"SK텔레콤이 통신(MNO)과 AI를 양대 사업축으로 사내 조직을 <b>CIC(사내독립기업) 체제로 개편</b>하고, <b>CEO 직속 'AI 보드'</b>라는 거버넌스 체계를 신설했습니다. AI가 업무 프로세스를 이해하고 계획을 세워 실행·피드백까지 자율 완수하는 에이전틱 AI 시스템을 사내에 본격 도입하는 흐름과 맞물린 조직 설계입니다.","detail":"<p>참고할 지점은 두 가지입니다. 첫째, <b>AI 거버넌스를 CEO 직속으로 올렸다</b>는 것 — AI 도입 결정이 여러 조직의 이해관계에 걸리기 때문에 중간 계층에 두면 승인 병목이 생긴다는 판단으로 읽힙니다. 둘째, CIC 체제는 AI 사업의 손익을 독립적으로 볼 수 있게 만듭니다. 국내 대기업들이 AI 조직을 별도 단위로 떼어내는 흐름의 연장선입니다.</p><p>업계 전반의 진단도 같은 방향입니다 — 2026년 국내 기업의 AI 도입은 단순한 기술 도입을 넘어 <b>조직 설계와 거버넌스 구축</b>이 핵심 과제로 대두되고 있고, 기술 도입 속도가 아니라 조직의 학습·적응 시스템이 전환 성공의 대부분을 결정한다는 분석이 반복 인용됩니다.</p>","foryou":"AI 관련 의사결정이 계속 지연되고 있다면 원인이 <b>승인 경로</b>일 가능성이 높습니다 — AI 도구 도입은 보안·법무·재무·현업이 모두 걸리는데, 이 조합을 조율할 권한이 어디에도 없으면 모든 안건이 회의만 반복합니다. SK텔레콤의 'AI 보드' 형태를 그대로 만들 필요는 없지만, 최소한 <b>AI 안건의 최종 결정권자가 누구인지</b>를 문서로 명시해 두는 것만으로 리드타임이 줄어듭니다. 지금 그 이름을 한 명으로 답할 수 없다면, 그게 첫 번째 과제입니다."},{"tag":"국내 사례 · 조직 문화","source":"class101 (2026 HR 트렌드)","url":"https://class101.ghost.io/2026-hr-trend-3-ai-capabilities-flexible-work/","published":"2026-09","title":"당근의 '사이드 프로젝트 위크' — 분기마다 실험할 시간을 제도로 확보한다","summary":"당근은 <b>분기마다 '사이드 프로젝트 위크'</b>를 운영해 직원들이 새로운 아이디어를 자유롭게 시도할 수 있게 합니다. AI 도구 확산을 교육 프로그램이 아니라 <b>실험 시간의 제도화</b>로 접근한 사례입니다. 관련 분석에서는 기술 도입 속도가 아니라 조직의 학습·적응 시스템이 디지털 전환 성공의 대부분을 결정한다는 점이 반복 강조됩니다.","detail":"<p>대부분의 조직에서 AI 도구 확산이 실사용으로 이어지지 않는 이유는 도구가 부족해서가 아니라 <b>시도할 시간이 없어서</b>입니다. 계정을 발급하고 교육을 돌려도, 당장 처리할 업무가 있는 사람은 새 도구를 익히는 데 시간을 쓰지 않습니다. 실험 시간을 제도로 확보하면 이 병목이 해소됩니다.</p><p>국내 플랫폼 기업들 사이에서 유사한 패턴이 반복 관찰됩니다 — 직군을 섞은 사내 해커톤, 팀별 자원자 기반 확산 제도, 분기 단위 실험 주간. 공통점은 <b>중앙 조직이 도구를 밀어 넣는 방식이 아니라, 각 팀 안에서 무엇을 자동화할지 스스로 고르게 하는 구조</b>라는 점입니다. 팀의 업무 맥락은 중앙이 알 수 없기 때문입니다.</p>","foryou":"AI 확산 KPI를 '계정 발급률'이나 '교육 이수율'로 잡고 있다면 실사용과 상관관계가 거의 없을 가능성이 높습니다. 대신 운영 비용이 낮은 두 가지를 얹어 보세요 — ① <b>분기 1회, 반나절~1일 규모의 실험 시간</b>을 캘린더에 미리 박아 두기(길게 잡으면 실행이 안 됩니다), ② 실험 결과를 발표가 아니라 <b>'우리 팀에서 실제로 계속 쓰기로 한 것' 한 줄</b>로 취합하기. 계속 쓰기로 한 것의 개수가 실사용 지표로 훨씬 정직합니다."},{"tag":"해외 사례 · 멀티모델 조달","source":"업계 보도 (GenAI.mil)","url":"https://tilnote.io/en/pages/6a9df8a38a847deea17858b8","published":"2026-09","title":"미 국방부, 보안 AI 창구에 챗GPT·그록 추가 — 한 벤더에 묶지 않는 3모델 체제","summary":"미국 국방부가 보안 AI 접근 창구인 <b>GenAI.mil</b>에 오픈AI 챗GPT와 xAI 그록을 추가했습니다. 기존 구글 제미나이에 이어 <b>3모델 체제</b>가 됐습니다. 가장 보수적인 보안 요건을 가진 조직이 단일 벤더가 아니라 복수 모델을 같은 창구 아래 두는 구조를 선택했다는 점이 참고할 지점입니다.","detail":"<p>이 구조의 핵심은 모델 개수가 아니라 <b>창구를 하나로 통일했다는 것</b>입니다. 사용자는 하나의 승인된 경로로 접근하고, 그 뒤에 어떤 모델이 붙는지는 운영 조직이 관리합니다. 이렇게 하면 두 가지가 동시에 해결됩니다 — 사용자는 워크로드에 맞는 모델을 고를 수 있고, 조직은 접근 통제·로깅·데이터 처리 정책을 한 곳에서 강제할 수 있습니다.</p><p>반대 구조, 즉 팀마다 각자 벤더와 계약해 각자 쓰는 방식은 초기엔 빠르지만 6개월 뒤 통제 불가능해집니다. 이번 주 카테고리 1에서 본 '에이전트 53%가 모니터링 없이 운영된다'는 조사 결과가 정확히 그 상태의 결과입니다.</p>","foryou":"사내 AI 접근을 팀별 개별 계약으로 굴리고 있다면 <b>게이트웨이 패턴</b>을 검토할 시점입니다 — 모델을 하나로 통일하는 게 아니라, <b>접근 경로를 하나로 통일하고 그 뒤에 여러 모델을 붙이는</b> 구조입니다. 이 구조의 실질적 이점은 협상력과 감사 대응입니다: 사용량이 한곳에 모이면 벤더 협상 근거가 생기고, 로그가 한곳에 남으면 보안 감사 질문에 하루 만에 답할 수 있습니다. 모델 교체 비용도 크게 떨어집니다."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.08.24~08.31</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});

})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
