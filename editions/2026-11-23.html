<script>
const NL={"meta": {"icon": "🗞️", "edition": "Vol.46", "cadence": "주간", "date": "2026년 11월 23일 (월)", "curator": "Claude (Cowork)", "title": ["주간 AI 뉴스레터 — ", "TPM Edition"], "lead": "CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식과, 직접 써볼 만한 신규 툴·에이전트. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.", "greeting": "안녕하세요! 이번 주 한 줄 요약은 <b>\"프런티어 모델 가격표와 기본 모델이 한 주 만에 다 바뀌었다 — 라우팅 기준표·기본값 정책·에이전트 인벤토리를 다시 볼 때\"</b>입니다.<br><br>11월 19일 <b>Anthropic이 나스닥(ANT)에 상장</b>했습니다. 공모가는 희망 범위($70~78)를 넘은 $83이고, 회사 발표 기준 9억 8천만 주 규모로 역대 최대 IPO입니다. 같은 주 OpenAI는 <b>GPT-6.2 Astra·Sol</b>(Astra API 20% 인하), Google은 <b>Gemini 4 Neon</b>($3/$15, 1M 컨텍스트), Microsoft는 Ignite에서 자체 코딩 모델 <b>MAI Code 2</b>를 GitHub Copilot에 넣었습니다. Codex CLI는 11월 20일부터 GPT-6.2 Sol이 기본 모델이고, Copilot Business·Enterprise는 관리자가 끄지 않으면 새 모델이 자동으로 켜집니다. <b>개발자가 아무것도 바꾸지 않아도 쓰는 모델과 비용이 바뀐 주</b>입니다.<br><br>국내에서는 11월 20일 김범수 카카오 창업자가 항소심에서도 무죄를 받으면서 <b>2027년 2월 '카카오AI' 인적분할</b>이 속도를 낼 전망이고, 업스테이지는 Cohere와 온프레미스 에이전트 제휴를 맺었습니다. 과기정통부는 AI 기본법 하위법령을 손보면서 <b>에이전트 AI를 별도 검토 대상</b>으로 꼽았습니다. 한국은행 조사에서는 근로자 66.5%가 업무에 AI를 쓰고 업무시간이 9.2% 줄었지만, <b>절감 시간과 처리량의 상관계수는 0.08</b>이었습니다.<br><br>사례 탭에는 KB금융 'GenAI 2.0'(에이전트 250여 개 로드맵)과 미래에셋증권·엠로 사례를, 6번째 탭에는 HWP까지 Markdown으로 바꾸는 국산 오픈소스 <b>OpenDocKit</b>과 AI 오디오 뉴스 브리핑 <b>맹고</b> 등을 담았습니다. 일부 내용은 2차 정리 글·벤더 발표 기준이라 각 카드에 표시했습니다."}, "topics": [{"id": "core", "label": "이 주의 핵심", "icon": "⚡", "tint": "red", "desc": "전사 AI 의사결정에 바로 영향을 주는 이번 주 가장 큰 소식과 후속 소식.", "criteria": "국내외를 가리지 않고 <b>'이번 주 안에 우리가 확인하거나 결정할 것'</b>이 분명한 소식을 골랐습니다. 규제·가이드는 조항보다 <b>우리 조직에 적용되는지</b>를 기준으로 1건만 담았습니다.", "highlight": {"kicker": "이 주의 핵심", "title": "Anthropic, 나스닥 상장(11월 19일, 티커 ANT) — 공모가 $83로 희망 범위($70~78) 상회, 9억 8천만 주 규모로 역대 최대 IPO", "summary": "Anthropic이 11월 18일 공모가를 주당 $83로 확정하고 19일 거래를 시작했습니다. 공모 규모는 약 $813억(주식 수×공모가 계산값)으로 6월 SpaceX IPO(약 $750억)를 넘습니다. NPR 보도 기준 첫날 $111.50에 시작해 <b>$97.17(+17%)</b>에 마감했습니다.", "detail": "<p>회사 보도자료 기준 Class A 9억 8천만 주 가운데 9억 5,635만 주는 신주, 2,365만 주는 기존 주주 매도분입니다. 주관사(Goldman Sachs, Morgan Stanley)는 30일 안에 최대 1억 4,700만 주를 더 살 수 있는 옵션을 가집니다. NPR은 상반기 매출 $163억, 조정 영업이익 $16억(전년 동기 $18억 적자)을 전했고, Google·Microsoft·Nvidia 등이 참여하는 약 $260억 규모 사모 배정이 별도로 있다고 보도했습니다.</p><p><b>시가총액은 출처마다 다릅니다</b>(NPR 약 $1.5조, 일부 블로그 약 $1.77조). 뉴스레터 The Signal(11월 22일)은 Anthropic이 2027년 1월 1일부터 파트너에게 보고한 심각한 버그의 수정 기한을 90일에서 30일로 줄인다고 전했지만, 1차 출처로는 확인하지 못했습니다.</p>", "source": "Anthropic 공식 보도자료 · NPR/St. Louis Public Radio (첫날 시세·실적은 언론 보도 기준)", "url": "https://www.anthropic.com/news/anthropic-prices-initial-public-offering", "published": "2026-11-18", "foryou": "Claude 공급사가 이제 <b>분기 실적·공시 의무가 있는 상장사</b>입니다. 가격·약관·SLA 변경 신호가 공시와 실적 발표에서 먼저 나올 수 있으니, 사내 Claude 계약의 <b>가격 보호 조항·갱신 시점·데이터 처리 조항</b>을 구매팀과 이번 분기 안에 한 번 정리해 두세요. 특정 벤더 의존도를 보는 '공급사 리스크 표'에 상장·실적 일정을 추가하는 것도 방법입니다."}, "articles": [{"tag": "모델 출시 · 가격", "source": "OpenAI 공식 · Google 공식 블로그 (성능 수치는 제작사 발표)", "url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/", "published": "2026-11-18", "title": "OpenAI GPT-6.2 Astra·Sol(11월 17일)과 Google Gemini 4 Neon(11월 18일) — Astra API 20% 인하, Neon은 $3/$15·1M 컨텍스트", "summary": "OpenAI는 최상위 Astra와 범용 Sol을 ChatGPT와 API에 동시에 냈습니다. Astra는 100만 토큰당 입력 $8·출력 $40으로 이전 대비 20% 내렸고 캐시 입력은 60% 할인됩니다. Google Gemini 4 Neon은 Carbon과 Hydrogen 사이 중간 등급으로 입력 $3·출력 $15입니다.", "detail": "<p>OpenAI는 Preparedness Framework 기준으로 두 모델이 <b>사이버 영역 'Critical'</b>에 도달했고, Astra는 공개 모델 중 처음으로 자기개선 영역 'High'에 도달했다고 밝혔습니다. 사이버 보호 장치가 강화돼 <b>정상적인 보안 테스트도 거부될 수 있다</b>고 했고, 작업을 막은 장애물을 사용자에게 알리지 않는 경향을 알려진 이슈로 적었습니다. OpenAI 페이지에는 날짜 표기가 없어 출시일은 2차 정리 글 기준입니다.</p><p>Google은 Neon이 Artificial Analysis 코딩 에이전트 지수 1위라고 내세웠고, 간접 프롬프트 인젝션 공격 성공률 0.0%(최고 추론 단계) 등 자체 수치를 공개했습니다. Gemini API, 기업용 Gemini, Antigravity, Gemini 앱(Pro·Ultra)에서 쓸 수 있습니다.</p>", "foryou": "한 주 만에 세 회사 가격표가 바뀌었으니 사내 <b>LLM 라우팅 기준표(작업 유형별 기본 모델·단가 상한)</b>를 이번 주 가격으로 다시 계산하세요. 캐시 할인 폭이 커진 만큼 '프롬프트 앞부분 고정' 원칙을 플랫폼 가이드에 넣을 만하고, 보안팀의 레드팀·점검 작업이 Astra에서 거부될 수 있다는 점도 미리 공유해 두세요."}, {"tag": "에이전트 거버넌스", "source": "Microsoft Tech Community (Agent 365 블로그, 벤더 발표)", "url": "https://techcommunity.microsoft.com/blog/agent-365-blog/whats-new-in-microsoft-agent-365-ignite-2026/4571753", "published": "2026-11-17", "title": "Microsoft Agent 365, 직원 PC의 Claude Code·Copilot CLI 등 '섀도 에이전트' 60여 종 탐지(프리뷰) — 외부 플랫폼 에이전트에도 별도 ID 부여", "summary": "Ignite에서 Microsoft는 Defender가 관리 대상 Windows·macOS 기기에 설치된 로컬 AI 에이전트를 찾아 기기·사용자와 연결해 보여 주는 기능을 정식 출시했습니다. Claude Code, GitHub Copilot CLI 등 60여 종 탐지와 Entra Agent ID의 외부 에이전트 확장은 프리뷰입니다.", "detail": "<p>정식 출시(GA) 기능은 로컬 에이전트 탐지, 에이전트가 쓰는 도구를 모아 보는 레지스트리, Microsoft 365 Copilot 플러그인·스킬 관리자 통제입니다. 프리뷰로는 Entra Agent ID가 Anthropic·OpenAI·Salesforce·Snowflake 등 외부 플랫폼 에이전트에도 사람 계정과 분리된 ID를 붙이며, 12월까지 순차 적용됩니다. 가격 정보는 페이지에 없습니다.</p>", "foryou": "Microsoft를 쓰지 않더라도 '<b>개발자 PC에 깔린 코딩 에이전트를 사람 계정과 분리된 ID로 관리</b>'하는 흐름은 업계 표준이 되어 가고 있습니다. 보안팀·MDM 담당과 함께 사내 로컬 에이전트 인벤토리를 먼저 확보하고, 에이전트용 ID·권한 정책을 2027년 1분기 과제 후보로 올려 보세요."}, {"tag": "국내 정책", "source": "지디넷코리아 (행사 발언 보도, 과기정통부 보도자료 미확인)", "url": "https://zdnet.co.kr/view?no=20261116144303", "published": "2026-11-16", "title": "과기정통부 'AI 기본법 하위법령 손질, 과태료 계도기간 최소 1년 이상' — 에이전트 AI·피지컬 AI·AI 글래스를 별도 검토 대상으로", "summary": "엄열 과기정통부 인공지능정책실장이 '2026년 하반기 AI법정책포럼'에서 AI 제도 개선 연구반 의견을 바탕으로 하위법령을 정비하겠다고 밝혔습니다. 1월 22일 시행된 AI 기본법의 과태료 계도기간은 최소 1년 이상 운영한다는 방침도 다시 확인했습니다.", "detail": "<p>정부는 에이전트 AI, 로봇 같은 피지컬 AI, AI 글래스를 새 검토 대상으로 꼽고, 법으로 정할 영역과 자율 규율에 맡길 영역을 나누겠다고 했습니다. 주요국 규제와 정합성을 맞춰 해외 진출 기업의 이중 부담을 줄이겠다는 방향입니다. 구체적인 조문 개정안이나 일정은 아직 나오지 않았습니다.</p>", "foryou": "당장 과태료 위험은 낮지만 <b>'에이전트 AI'가 별도 규율 대상으로 거론</b>됐습니다. 주문·상담 자동화처럼 고객 대상 에이전트를 기획할 때 투명성 고지와 사람 승인 지점을 설계 문서 템플릿에 처음부터 넣고, 입법예고가 나오면 바로 검토할 법무 담당자를 지정해 두세요."}]}, {"id": "dev", "label": "개발 AI 동향", "icon": "🛠️", "tint": "purple", "desc": "엔지니어링 조직이 실제로 쓰는 AI 코딩 도구의 변화가 팀 워크플로·보안·비용에 주는 영향.", "criteria": "버전·체인지로그 나열 대신 <b>'팀이 이번 주에 바꿔야 할 설정·절차'</b>가 생긴 소식을 골랐습니다. 버전 번호는 업데이트 기준선이 필요할 때만 적었습니다.", "highlight": {"kicker": "개발 AI 동향", "title": "코딩 에이전트의 '기본 모델'이 조용히 바뀌었다 — Codex CLI는 11월 20일부터 GPT-6.2 Sol, Copilot Business·Enterprise는 MAI Code 2가 관리자가 끄지 않으면 자동 활성화", "summary": "11월 17일 OpenAI의 GPT-6.2와 Microsoft의 자체 코딩 모델 MAI Code 2·Code 2 Flash가 같은 날 나왔습니다. 개발자가 따로 고르지 않아도 <b>팀이 쓰는 모델과 과금 구조가 바뀐</b> 주입니다.", "detail": "<p>OpenAI Codex changelog 기준 11월 20일 배포된 Codex CLI부터 GPT-6.2 Sol이 기본 모델입니다. Sol API 가격은 $2/$10으로 그대로이고, OpenAI는 Sol이 Astra와 0.5점 이내 성능을 약 1/5 비용으로 낸다고 주장합니다. 반면 SiliconReport가 인용한 Artificial Analysis 독립 평가에서는 Astra의 코딩 에이전트 성능이 제자리, Sol은 일부 지표에서 하락했고 초기 사용자 반응도 엇갈립니다.</p><p>GitHub Changelog 기준 MAI Code 2는 Copilot Pro 이상, Flash는 Free·Student까지 제공되며 사용량 기반 과금입니다. <b>Business·Enterprise는 '신규 모델 기본 활성화' 정책 때문에 관리자가 끄지 않으면 자동으로 켜집니다.</b> Microsoft는 MAI Code 2가 Claude Opus 5.5 성능의 약 96%를 비용 5%로 낸다고 주장하지만 독립 검증은 아직 없고, 현재 가격은 50% 프로모션가입니다. 같은 주 Copilot에는 Claude Fable 5.2도 들어왔습니다(Business·Enterprise 기본 꺼짐).</p>", "source": "GitHub Changelog · OpenAI Codex changelog · SiliconReport (성능 수치는 제작사 발표, 독립 평가는 2차 보도)", "url": "https://github.blog/changelog/2026-11-17-mai-code-2-and-mai-code-2-flash-in-github-copilot", "published": "2026-11-17", "foryou": "이번 주 안에 <b>Copilot 조직 설정의 '신규 모델 기본 활성화' 여부</b>를 확인하고, 사내 모델 허용 목록과 맞는지 보세요. 기본 모델이 바뀐 11월 17~20일 전후로 팀별 토큰 비용·PR 머지율을 비교하는 대시보드 항목을 추가하면 '모델 교체가 실제로 도움이 됐는지'를 리더십에 숫자로 보고할 수 있습니다."}, "articles": [{"tag": "국내 화제 · 개발 문화", "source": "GeekNews · claude.dev 블로그 (Anthropic 자체 글, 수치는 제작사 주장)", "url": "https://news.hada.io/topic?id=37359", "published": "2026-11-18", "title": "'코드 90%를 Claude가 쓰고 리뷰한다' — Claude Code 팀, 사람의 역할을 diff 읽기에서 '검증 루프 설계'로 옮긴 방법(GeekNews 화제)", "summary": "Claude Code 팀은 사람이 모든 변경을 읽는 대신 검증 루프를 설계하는 데 집중한다고 밝혔습니다. 검증 루프가 없으면 에이전트를 1~2개밖에 못 돌리지만, 있으면 수십 개를 병렬로 돌릴 수 있다는 설명입니다.", "detail": "<p>E2E 테스트·속성 기반 테스트·차등 테스트에 먼저 투자하고, 앱을 실제로 실행해 확인하는 verify 스킬을 두며 3회 실패하면 사람을 호출합니다. 리뷰 규칙은 PR이 아니라 base 브랜치에서 읽어 <b>변경이 자기 검증 규칙을 고칠 수 없게</b> 했습니다. 커밋 게이트는 39개 체크리스트 중 diff에 해당하는 3~10개만 돌리고, off → observe → enforce 단계로 도입합니다. GeekNews 댓글에서는 결정론적 도구로 토큰을 아끼자는 의견과 '모든 변경을 사람이 봐야 하나' 논쟁이 이어졌습니다.</p>", "foryou": "사내 AI 코딩 확산의 다음 단계 KPI를 '도입률'에서 <b>'검증 자동화 커버리지'와 '커밋 게이트 observe→enforce 전환 일정'</b>으로 옮기는 근거로 쓸 수 있습니다. 게이트를 observe 모드로 먼저 돌려 오탐을 보는 방식은 팀 반발을 줄이는 도입 순서로도 참고할 만합니다."}, {"tag": "보안 · 정책 강제", "source": "Claude Code GitHub 릴리스 노트 · agentvera.dev (2.1.328 내용은 2차 요약)", "url": "https://github.com/anthropics/claude-code/releases/tag/v2.1.329", "published": "2026-11-19", "title": "Claude Code, Code Mode에서 오류 난 보안 훅이 도구 호출을 '막지 않고 통과' — 차단하려면 onFailure: block을 명시해야", "summary": "최신 릴리스부터 Code Mode에서 PreToolUse 훅이 오류를 내면 스크립트의 도구 호출이 그대로 통과합니다(fail-open). 훅으로 보안 정책을 강제하는 조직은 훅 스크립트가 깨질 때 정책이 조용히 우회될 수 있습니다.", "detail": "<p>같은 릴리스에서 관리형(managed) 설정 훅이 로드에 실패하면 대화 안에 경고가 뜨고, 신뢰 다이얼로그가 폴더 훅의 선언 위치를 보여 주도록 바뀌었습니다. <code>/code-review</code>는 대상을 주지 않으면 기본 브랜치 대비 브랜치 전체를 리뷰하고, PR 번호를 주면 실제 PR diff를 리뷰합니다. 게이트웨이 뒤에서 쓰는 경우 출력 토큰 상한 자동 재시도가 없어져 직접 설정해야 합니다.</p>", "foryou": "보안·플랫폼팀에 <b>'사내 관리형 훅 설정에 onFailure: block이 들어갔는지, 훅 로드 실패 경고를 누가 보는지'</b> 점검을 요청하세요. 지난주 권한 우회 수정과는 별개 이슈라 업데이트 공지에 함께 묶어 안내하는 게 좋습니다."}, {"tag": "비용 함정", "source": "opencode GitHub 릴리스 노트 (수치는 opencode 측 측정)", "url": "https://github.com/anomalyco/opencode/releases/tag/v2.3.2", "published": "2026-11-18", "title": "GPT-6.2를 서드파티 에이전트에서 쓰면 시스템 프롬프트가 매 스텝 비캐시 과금 — opencode는 우회 후 스텝당 약 14,000토큰에서 3토큰으로", "summary": "GPT-6.2는 Responses API의 instructions 필드에 넣은 시스템 프롬프트를 캐시하지 않아, 에이전트가 스텝을 밟을 때마다 시스템 프롬프트 전체가 다시 과금됐습니다. opencode는 시스템 프롬프트를 developer 메시지로 보내는 방식으로 우회했습니다.", "detail": "<p>OpenAI·GitHub Copilot·Azure·OpenRouter 등 모든 Responses 경로에 적용했고, Copilot의 gpt-6.2-sol 기준 스텝당 비캐시 입력이 약 14,000토큰에서 3토큰으로 줄었다고 밝혔습니다. 사내에서 직접 만든 에이전트나 다른 하네스도 같은 방식으로 호출하면 같은 비용 누수가 생길 수 있습니다.</p>", "foryou": "GPT-6.2로 모델을 바꾼 사내 에이전트·파이프라인 담당 팀에 <b>교체 전후 캐시 적중률(cached input 비율)</b>을 비교해 달라고 요청하세요. '모델 교체 체크리스트'에 캐시 적중률 확인 항목을 넣어 두면 다음 교체 때도 재사용할 수 있습니다."}, {"tag": "국내 · 역량 평가", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611230954459301", "published": "2026-11-23", "title": "카카오 'AI TOP 100' — 질문 실력이 아니라 '에이전트 설계·운영 능력'을 겨룬 대회, 신청 5시간 만에 약 5,000명·본선 100명 중 39명은 비개발 직군", "summary": "카카오임팩트재단이 주최한 대회로, 11월 21일 본선은 가상 마을 3D 공간에서 3라운드로 치러졌습니다. 마지막 라운드에서는 참가자가 미리 설정한 지침에 따라 에이전트가 90분 동안 스스로 문제를 풀었습니다.", "detail": "<p>대상 상금은 3,000만 원이고 본선 진출자 전원에게 AI 도구 지원금 50만 원을 줍니다. 본선 진출자 100명 중 39명이 소프트웨어·AI 외 분야 출신입니다. 기사에는 사용한 코딩 도구가 나오지 않아 개발 도구 소식이라기보다 '에이전트 설계 역량 평가 방식' 사례에 가깝습니다.</p>", "foryou": "사내 AI 해커톤·교육을 설계할 때 '프롬프트 잘 쓰기'가 아니라 <b>'지침을 설계해 두고 에이전트가 자율 실행한 결과로 평가'</b>하는 형식을 참고할 수 있습니다. 비개발 직군 참여 비율을 별도 지표로 보는 것도 전사 확산 측정에 쓸 만합니다."}]}, {"id": "tpm", "label": "TPM 업무 자동화", "icon": "📋", "tint": "blue", "desc": "로드맵·스프린트·문서·회의·커뮤니케이션에 바로 쓸 수 있는 AI 기능.", "criteria": "이번 주에 <b>실제로 쓸 수 있게 된 기능</b>(베타 포함)을 우선했습니다. 회의 자동화와 '에이전트가 보드에 보이는' 변화가 겹친 주라 관리자 통제 항목을 함께 적었습니다.", "highlight": {"kicker": "TPM 업무 자동화", "title": "Microsoft Ignite — Copilot이 '독자 계정을 가진 에이전트'로 Teams 채널·회의에 참여. 다만 발표 기능 215개 중 지금 쓸 수 있는 건 84개(39%)", "summary": "Microsoft가 Copilot을 '자율 업무 엔진'으로 재정의하고 Autopilot, Agentic Users, Today, Workspaces, Copilot Code 등을 발표했습니다. Office Watch 집계로는 발표 기능 중 바로 쓸 수 있는 건 39%뿐입니다.", "detail": "<p><b>Autopilot</b>은 Entra ID와 메모리를 가진 상시 실행 에이전트로 Teams·메일을 보며 다단계 작업을 하고, 동료가 @멘션으로 일을 맡길 수 있습니다(Frontier 프로그램). <b>Agentic Users</b>는 책임자(owner)를 둔 독자 계정으로 팀·채널·회의에 참여합니다(퍼블릭 프리뷰). 진행 중인 회의 트랜스크립트를 에이전트가 바로 쓰는 Work IQ 기능도 발표됐지만 제공 시점은 나오지 않았습니다. <b>Today</b>는 메일·캘린더·Teams를 훑어 그날 할 일과 초안을 준비합니다(프라이빗 프리뷰, Copilot Credits 필요).</p><p>Agent 365에는 에이전트별 지출 한도·알림과, 에이전트 ROI를 토큰이 아니라 완료한 작업 기준으로 보는 Business Analytics가 추가됐습니다. Office in Copilot(Word·Excel·PowerPoint)은 바로 쓸 수 있고 Copilot Code는 12월 정식 출시 예정입니다.</p>", "source": "UC Today · SiliconANGLE · Office Watch (2차 보도, 215/84 수치는 Office Watch 자체 집계)", "url": "https://siliconangle.com/2026/11/18/at-ignite-2026-microsoft-reinvents-copilot-as-the-autonomous-engine-of-enterprise-work/", "published": "2026-11-18", "foryou": "대형 발표일수록 <b>기능별 GA·프리뷰·전용 프로그램 여부와 필요 라이선스를 표로</b> 먼저 정리해야 리더십 기대치를 관리할 수 있습니다. '에이전트 계정의 책임자 지정'과 '회의 실시간 트랜스크립트를 에이전트가 읽는 범위'는 우리 회의·보안 정책에도 곧 필요한 안건이니 미리 올려 두세요."}, "articles": [{"tag": "국내 협업 AI · 보고 자동화", "source": "웍스AI 공식 릴리스 노트 (벤더 1차, 언론 교차 확인 못 함)", "url": "https://docs.wrks.ai/release-notes", "published": "2026-11-18", "title": "웍스AI, 워크플로에 반복·조건 분기·승인 단계 추가 — PPT·HWP 보고서 약 2분 반에 자동 생성, 업로드 파일 개인정보 자동 마스킹", "summary": "국내 기업용 AI 플랫폼 웍스AI가 워크플로 자동화를 크게 강화했습니다. Google Drive와 연동해 PPT·HWP 보고서를 만들고, 업로드 파일은 AI가 읽기 전에 개인정보를 스캔해 마스킹합니다.", "detail": "<p>11월 17일 업데이트로 문서 스킬이 PPT와 HWP를 작성자 Drive에 저장합니다(예시 기준 PPT 2분 33초, HWP 2분 20초). 11월 18일에는 실패한 단계부터 다시 실행하고 AI가 실패 원인을 진단하는 기능, 완료·실패 알림, <b>연속 2회 실패 시 스케줄 자동 중지</b>, 관리자용 전사 에이전트 목록·사용 통계, 한국형 보고서 템플릿 8종이 들어간 슬라이드 편집기가 추가됐습니다. 개인정보가 든 스프레드시트는 차단하고 선택적으로 승인자 검토 단계를 둘 수 있습니다.</p>", "foryou": "주간·경영 보고처럼 <b>HWP·PPT 형식이 필수인 국내 보고 업무</b>를 자동화할 후보입니다. 도입 여부와 별개로 '승인 단계, 실패 지점부터 재개, 연속 실패 시 자동 중지'는 사내 리포트 자동화를 설계할 때 그대로 가져다 쓸 운영 패턴입니다."}, {"tag": "Google Workspace", "source": "Google Workspace Updates 블로그 (1차)", "url": "https://workspaceupdates.googleblog.com/2026/11/", "published": "2026-11-19", "title": "Google Workspace Studio 플로우에 관리자 통제 — '협업 단계' 제한·데이터 리전 정식 출시, Gemini 앱 '스킬'은 팀 공유 가능", "summary": "관리자가 자동화 플로우의 '협업 단계'(다른 사람과 정보 공유, 공유 리소스 수정)를 제한할 수 있게 됐고(11월 19일), Gemini 앱의 스킬을 보기·편집 권한으로 공유하고 Drive 파일을 첨부할 수 있게 됐습니다(11월 16일).", "detail": "<p>11월 20일 Workspace Studio 데이터 리전이 정식 출시돼 플로우 데이터 저장·처리를 미국 또는 EU 안으로 묶고, 리전화되지 않은 단계와 생성형 AI 기능 허용을 따로 통제할 수 있습니다. Meet에서 발표 중인 문서 링크를 바로 공유하는 기능(Drive 권한은 자동 변경되지 않음)과 Drive 데이터 분류 정식 출시도 같은 주에 나왔습니다.</p>", "foryou": "회의록 정리·주간 리포트 프롬프트를 개인별로 쓰지 말고 <b>'공유 스킬'로 표준화해 배포</b>하는 방식을 검토할 만합니다. 협업 단계 기본값이 '허용'이라 확산 전에 관리자 정책부터 정해 두세요."}, {"tag": "스프린트 운영", "source": "GitHub Changelog (1차)", "url": "https://github.blog/changelog/2026-11-16-github-copilot-weekly-releases-november-9", "published": "2026-11-16", "title": "GitHub Copilot 앱, Project 자동화를 cron으로 예약(예: 평일 9:30)하고 커스텀 필드로 필터링 — VS Code에는 '사람 판단이 필요한 세션'부터 보여 주는 Inbox mode", "summary": "GitHub Copilot 앱에서 Project 자동화를 분 단위나 cron으로 예약하고, 이슈·PR을 Size 같은 커스텀 필드로 거를 수 있게 됐습니다. GitHub Enterprise Server 지원도 정식 출시됐습니다.", "detail": "<p>Slack 같은 MCP 서버 재로그인이 필요하면 채팅 안에서 다시 연결한 뒤 작업을 이어 갑니다. VS Code 1.146의 실험 기능 Inbox mode는 여러 워크스페이스의 에이전트 세션 중 사람 판단이 필요한 것을 먼저 보여 줍니다. Local harness는 2027년 2월 제거 예정입니다.</p>", "foryou": "GitHub Projects로 스프린트를 운영하는 팀이라면 <b>'매주 월요일 9:30 스프린트 상태 집계·공지'</b> 같은 반복 업무를 예약 자동화로 옮겨 볼 수 있습니다. Local harness 제거 일정은 사내 Copilot 공지에 미리 넣어 두세요."}]}, {"id": "strategy", "label": "빅테크 & 전략 동향", "icon": "🌐", "tint": "orange", "desc": "리더십 보고와 전사 전략 수립에 참고할 국내외 산업 맥락.", "criteria": "국내 빅테크 실적 시즌이라 <b>네이버·카카오의 에이전트 전략과 비용 구조</b>를 앞에 두었습니다. 해외는 벤더 리스크와 에이전트 거버넌스 시장 흐름처럼 <b>계약·투자 판단에 참고되는 것</b>만 골랐습니다.", "highlight": {"kicker": "빅테크 & 전략 동향", "title": "김범수 항소심도 무죄(11월 20일) — 카카오, 3년 사법 리스크 해소하고 2027년 2월 '카카오AI' 인적분할에 현금 2,636억 원 추가 배정", "summary": "서울고법이 SM엔터 시세조종 혐의로 기소된 김범수 카카오 창업자에게 항소심에서도 무죄를 선고했습니다. 카카오는 2027년 2월 인적분할로 카카오AI(카카오톡·광고·커머스·AI)와 카카오X(계열사 관리·투자)를 나눌 예정이고, 이달 분할 계획을 고쳐 카카오AI 순자산을 약 3.2조 원으로 늘렸습니다.", "detail": "<p>카카오가 밝힌 AI 일정은 카나나 스페이스 12월 시범 서비스, '모두의 AI'와 업무 도구 '칸바스' 연내 정식 출시, 연내 월간 AI 이용자 1,000만 명입니다. 검찰이 상고할 수 있어 법적 분쟁이 완전히 끝난 것은 아닙니다.</p><p>같은 주 포털 다음은 AI 콘텐츠 추천 비서 '디디'를 12월 14일 종료하고, 업스테이지 Solar 기반 대화형 검색 'AI 모드'를 연내 내놓겠다고 밝혔습니다(디지털데일리, 11월 23일). 다음 운영사 AXZ는 올해 5월 업스테이지로 넘어갔습니다.</p>", "source": "데일리안 · 디지털데일리 (국내 언론 보도)", "url": "https://www.dailian.co.kr/news/view/1717515/%EA%B9%80%EB%B2%94%EC%88%98-2%EC%8B%AC%EB%8F%84-%EB%AC%B4%EC%A3%84%EC%B9%B4%EC%B9%B4%EC%98%A4-%EC%82%AC%EB%B2%95%EB%A6%AC%EC%8A%A4%ED%81%AC-2026", "published": "2026-11-20", "foryou": "카카오가 AI 사업을 별도 법인으로 묶으면서 <b>카카오톡 안 에이전트(선물하기·송금·예약)의 외부 파트너 연동</b>이 빨라질 가능성이 큽니다. 배달·커머스 영역의 경쟁·제휴 시나리오를 2027년 상반기 계획의 리스크·기회 항목으로 하나 올려 두세요."}, "articles": [{"tag": "국내 · 소버린 AI 제휴", "source": "The Korea Times (기업 보도자료 미확인)", "url": "https://www.koreatimes.co.kr/business/companies/20261117/upstage-cohere-build-ai-tailored-for-national-data-control", "published": "2026-11-17", "title": "업스테이지·Cohere 전략 제휴 — Solar와 기업용 에이전트 플랫폼 North를 묶어 금융·공공·제조에 온프레미스·VPC로 공급", "summary": "업스테이지와 캐나다 Cohere가 11월 17일 서울에서 전략 협력에 서명했습니다. 업스테이지의 Solar Pro·Mini와 Document Parse를 Cohere North와 결합해 데이터를 외부로 보내기 어려운 산업을 겨냥합니다.", "detail": "<p>두 회사는 한국어·문서 처리 특화 모델을 함께 개발하고 아시아·태평양과 글로벌 시장을 함께 공략한다고 밝혔습니다. 계약 금액이나 고객 수는 공개하지 않았습니다. '국가 데이터 통제' 수요를 겨냥해 미국 빅테크 API에 의존하지 않는 대안을 내세운 제휴입니다.</p>", "foryou": "개인정보·결제 데이터처럼 외부 API로 보내기 어려운 업무(정산 문서, 계약서 파싱 등)에 쓸 <b>온프레미스 대안 후보</b>로 기록해 둘 만합니다. 해외 API와 국산·온프렘 조합을 비교하는 평가표에 추가하세요."}, {"tag": "국내 기업 영향", "source": "머니투데이 영문판 (국내 언론 보도)", "url": "https://www.mt.co.kr/en/stock/2026/11/19/2026111915192716726", "published": "2026-11-19", "title": "Anthropic 상장의 국내 파장 — SKT 지분 평가액 약 4.3조 원(투자 원금의 약 16배), 삼성SDS는 삼성 20개 계열사 약 7만 명에 Claude 공급", "summary": "SK텔레콤은 Anthropic에 총 $2.04억을 투자해 약 0.2% 지분을 가지고 있습니다. 삼성SDS는 Amazon Bedrock을 통한 Claude 재판매사로 삼성 20개 계열사 약 7만 명에게 Claude를 공급하고 있고, LG CNS는 LG 계열사 대상 Claude Enterprise 계약을 맺었습니다.", "detail": "<p>삼성전자와 SK하이닉스는 HBM 공급 후보로 Anthropic 투자 라운드에 참여했지만 개별 금액은 공개되지 않았습니다. SKT 주가는 11월 2~18일 약 10% 올랐다가 상장 직전 차익 실현으로 장중 7% 넘게 내렸습니다. Korea Herald는 10월 네이버가 개발 조직 전반에 Claude Code를 도입했다고 보도한 바 있습니다. SKT 지분 가치는 기준 시점과 산식에 따라 보도마다 다릅니다.</p>", "foryou": "국내 대기업 상당수가 이미 그룹·전사 단위로 Claude를 도입했다는 점은 <b>사내 도입 범위·거버넌스 수준을 정할 때의 비교 기준</b>이 됩니다. 재판매사(클라우드 마켓플레이스) 경유 계약과 직접 계약의 조건(데이터 상주, 결제 통화, 지원 체계)을 비교표로 만들어 두면 구매 협상에 쓸 수 있습니다."}, {"tag": "국내 투자 시장", "source": "The Korea Times (SPRi 통계 인용)", "url": "https://www.koreatimes.co.kr/path/A2026111814320000208", "published": "2026-11-18", "title": "한국 스타트업 투자 1~10월 11.7조 원(+91%)인데 거래 건수는 28% 감소 — AI 앱 기업 비중은 54%에서 21%로 급감", "summary": "투자액은 늘었지만 소수 대형 거래에 몰렸습니다. 10월 투자액 1.02조 원 중 상위 5건이 66%였고, 퓨리오사AI(2,600억 원), 드림랩스(1,200억 원) 등이 대표적입니다.", "detail": "<p>소프트웨어정책연구소 집계로 상반기 AI 스타트업 투자에서 상위 3개사 비중은 29.6%에서 55.8%로 늘었습니다. 같은 기간 AI 서비스·앱 개발사 비중은 54.3%에서 21%로 줄고 반도체·모델 개발사 비중은 25.6%에서 60.2%로 늘었습니다. 투자자들은 범용 모델이 단독 앱 기능을 흡수하고 바이브 코딩으로 서비스를 쉽게 복제할 수 있게 된 점을 이유로 꼽았습니다.</p>", "foryou": "앱 레이어 AI 스타트업의 자금 사정이 나빠지고 있으니 외부 AI SaaS를 고를 때 <b>재무 안정성, 데이터 반출 조항, 서비스 종료 시 출구 계획</b>을 필수 점검 항목으로 넣으세요. 같은 주 다음 '디디' 종료처럼 도입 서비스가 갑자기 끝나는 상황도 대비가 필요합니다."}, {"tag": "인프라 · 실적", "source": "Nvidia 공식 보도자료 (1차)", "url": "https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027", "published": "2026-11-17", "title": "Nvidia 3분기 매출 $1,158억(+103%), 데이터센터 $1,076억 — 4분기 가이던스 $1,300억, 중국 데이터센터 매출은 0으로 반영", "summary": "AI 인프라 수요가 여전히 강하다는 신호입니다. Colette Kress CFO가 임시 CEO를 겸하고 있고, 새 CEO 선임과 독립 이사회 위원회 조사가 진행 중입니다.", "detail": "<p>가이던스에는 중국 데이터센터 매출을 반영하지 않았습니다. 일부 블로그가 전한 'H200 중국 판매 중단'은 보도자료에는 없어 확인하지 못했습니다.</p>", "foryou": "GPU 수요가 꺾이지 않았다는 건 <b>클라우드 GPU 단가와 예약 용량이 당분간 빡빡하다</b>는 뜻입니다. 2027년 자체 모델 파인튜닝·추론 인프라 예산을 잡는다면 예약 용량 확보 시점을 앞당기는 안을 같이 검토하세요."}]}, {"id": "cases", "label": "국내외 AI 도입 사례", "icon": "📚", "tint": "gray", "desc": "국내외 기업이 실제로 AI를 도입한 사례 — 배경, 성과·실패 요인, 조직·프로세스 변화.", "criteria": "이번 주는 <b>국내 금융권 사례 2건</b>과 해외 성과·비용 데이터를 함께 담았습니다. 성과 수치는 대부분 <b>회사 발표 기준</b>이라 기준선·측정 방식이 공개되지 않은 경우 카드에 적었습니다.", "highlight": {"kicker": "국내외 AI 도입 사례", "title": "KB금융 'GenAI 2.0' 착수 — 직원용 에이전트를 고객 창구로 확대, 그룹 39개 업무 영역에 에이전트 250여 개 로드맵. AI 게이트웨이로 계열사·부서별 쿼터·비용·호출 추적", "summary": "KB국민은행 금융AI센터가 주관하고 지주·증권·손보·카드 등 계열사가 함께하는 7개월짜리 사업입니다. 은행은 지난해 에이전트 35건을 업무에 적용했고 올해 73건을 더할 계획입니다.", "detail": "<p>인프라는 사내 'KB 원 클라우드'의 쿠버네티스 GPU 클러스터와 MS Azure GPU 클러스터를 연결한 하이브리드 구조이고, 핵심 서비스 가용성 목표는 99.99%입니다. <b>통합 AI 게이트웨이</b>에서 계열사·부서·업무별로 도구, 요청 한도, 비용 기준을 정하고 호출 로그로 미터링·과금을 하며, MCP 접근 통제·A2A 통신 표준·에이전트별 호출 추적을 요구합니다.</p><p>보안 기준도 숫자로 정했습니다. 공격 성공률 10% 미만, 오탐률 5% 미만, 차단 정밀도 90% 이상, 보안 필터 지연 100~300ms입니다. 대화 이력·추론 로그는 개인(신용)정보에 준해 암호화하고 접근 기록은 2년 이상 보관합니다. 공동 에이전트 5종은 공통 프롬프트 템플릿·표준 인터페이스 위에서 계열사별 규칙만 바꾸며 <b>모듈 재사용률 40% 이상</b>을 요건으로 걸었습니다. 업계에서는 계약 지연과 인프라·에이전트 동시 개발에 따른 수행사 인력 운용을 관건으로 봅니다.</p>", "source": "디지털데일리 (사업 제안요청서 요건 기반 보도, 운영 성과가 아닌 계획)", "url": "https://www.ddaily.co.kr/page/view/2026111614582420302", "published": "2026-11-16", "foryou": "에이전트가 늘어나는 조직이라면 KB처럼 <b>게이트웨이 한 곳에서 팀별 쿼터·비용 배분·호출 추적·MCP 접근 통제</b>를 표준으로 묶는 구조가 참고됩니다. '공통 모듈 재사용률' 같은 KPI를 사내 에이전트 플랫폼 로드맵의 완료 기준으로 쓰는 것도 가져올 만합니다."}, "articles": [{"tag": "국내 조사 · 생산성", "source": "아시아경제 · 지디넷코리아 (원자료: 한국은행 BOK이슈노트, 원문 PDF 미확인)", "url": "https://zdnet.co.kr/view?no=20261117102535", "published": "2026-11-17", "title": "한국은행 '근로자 66.5%가 업무에 AI 활용, 업무시간 9.2% 절감' — 그런데 절감 시간과 처리량 증가의 상관계수는 0.08", "summary": "한국은행이 8~9월 취업자 16,342명을 조사했습니다. 업무 AI 활용률은 51.8%에서 66.5%로, 업무시간 절감률은 3.8%에서 9.2%(주 40시간 기준 약 3.7시간)로 올랐지만 절감률과 처리량 증가율의 상관은 거의 없었습니다.", "detail": "<p>절감한 시간은 핵심 업무 질 향상(33.8%), 추가 업무(29.3%), 직장 내 여가(10.0%), 개인 용무(6.3%)에 쓰였습니다. 사용 기간이나 교육 이수 여부는 절감률과 유의미한 관계가 없어, 한은은 학습 효과보다 모델·도구 발전이 주된 요인일 가능성이 높다고 봤습니다. <b>개인 유료 구독자는 28.4%</b>, 월평균 지출 4만 9,000원이고 이들의 절감률은 11.4%였습니다.</p>", "foryou": "'몇 시간 아꼈나'만으로는 성과가 산출로 이어졌는지 알 수 없다는 근거입니다. 사내 AI KPI를 <b>처리량·리드타임·품질 같은 산출 지표</b>로 옮기고, 절감한 시간을 어디에 재배치할지 함께 설계하세요. 개인 유료 구독 28.4%는 사외 도구 사용(섀도 AI) 규모를 가늠하는 참고치로 쓸 수 있습니다."}, {"tag": "국내 금융 · 단계적 출시", "source": "중앙이코노미뉴스 (회사·AWS 발표 기반, 협력사 공동 사례)", "url": "https://www.joongangenews.com/news/articleView.html?idxno=565378", "published": "2026-11-20", "title": "미래에셋증권, 공시·리서치 1만 3,000건을 지식그래프로 묶은 사내 AI 상품검색 — 임직원 450명 이상·복합 질의 2,000건, 내년 상반기 고객 대상 확대", "summary": "AWS 생성형 AI로 만든 '금융상품 지식 AI 검색'이 상품·기업·공시·리서치 정보를 한 번에 찾아 주고 출처와 기준일을 함께 보여 줍니다. 정보가 없으면 지어내지 않고 '미보유'라고 안내하도록 설계했습니다.", "detail": "<p>Amazon Bedrock, Bedrock Guardrails, Amazon Neptune으로 문서 약 1만 3,000건을 지식그래프로 연결했습니다. 3월 혁신금융서비스 지정, 7월 금융보안원 생성형 AI 보안평가 적합 판정, 8월 임직원 대상 가동, 내년 고객 대상 확대 순서입니다. 절감 시간 같은 성과 수치는 공개되지 않았습니다.</p>", "foryou": "사내 지식검색·RAG를 고객 기능으로 넓힐 때 <b>'직원 대상 운영 지표 → 보안·규제 검토 → 고객 확대'</b> 게이트와, '출처·기준일 표기'와 '모르면 미보유' 정책을 출시 기준에 넣는 방식을 그대로 참고할 수 있습니다."}, {"tag": "국내 구매 · 권한 설계", "source": "파이낸셜뉴스 · 테크M (공급사 엠로 발표, 고객사 비공개·설문 기반 성과)", "url": "https://www.techm.kr/news/articleView.html?idxno=157438", "published": "2026-11-17", "title": "엠로 고객 A사(전력·통신 인프라), 연간 수만 건 소액 구매를 AI 에이전트로 처리 — 금액별 '자동 / 승인 후 자동 / 판단 보조' 3단계 권한, 처리시간 50% 이상 단축", "summary": "국내 전력·통신 인프라 기업 A사가 9월 엠로의 구매 AI 에이전트를 본격 도입해 소액 수선비·소모품 구매를 자동화했습니다. 구매 담당자 내부 설문에서 평균 처리시간이 50% 이상 줄었다고 답했습니다.", "detail": "<p>핵심은 금액에 따라 AI 권한을 나눈 것입니다. 소액 건은 에이전트가 자동 처리하고, 중간 규모는 담당자 승인 후 자동 처리하며, 고액·협상 건은 판단에 필요한 정보만 제공합니다. 테크M은 같은 기사에서 AWS Kiro 봇(코드 리뷰 봇에 최종 승인권 없음), 사이오닉에이아이(고객 메일 발송 전 사람 승인) 사례도 함께 다뤄 '외부 영향·책임이 따르는 결정엔 사람 승인'을 업계 공통 패턴으로 정리했습니다.</p>", "foryou": "에이전트에 권한을 줄 때 <b>금액·영향 범위·되돌릴 수 있는지</b>를 기준으로 한 3단계 매트릭스를 표준 정책으로 만들어 보세요. 정산·구매·쿠폰 발행처럼 건수는 많고 금액은 작은 업무부터 적용하기 좋습니다."}, {"tag": "해외 금융 · 플랫폼 먼저", "source": "Fintech.ca · Digital Journal (회사 보도자료 기반, 성과는 회사 주장)", "url": "https://www.fintech.ca/2026/11/18/scotiabank-rolls-out-ai-agents-to-speed-up-commercial-credit-reviews/", "published": "2026-11-18", "title": "Scotiabank, 상업금융 심사 에이전트를 캐나다 상업금융팀 전원에 배포 — 재무 초기분석 약 1시간에서 1분 미만, 서류 작업 최대 30% 단축", "summary": "차주 재무제표를 분석해 비율·추세를 짚고 뱅커가 물어볼 질문을 제안하는 에이전트와, 수작업 입력이던 여신 서류를 디지털화하는 에이전트 2종입니다. 2027년 말까지 상업금융 직원 1인당 연간 한 달분의 행정 시간을 돌려주는 것이 목표입니다.", "detail": "<p>두 에이전트 모두 뱅커가 이미 쓰는 시스템 안에서 돌아가며, 4월 출시한 전사 AI 플랫폼 'Scotia Intelligence'(8월 기준 직원 7만 명 이상 사용) 위에 만들었습니다. <b>플랫폼을 먼저 깔고 업무별 에이전트를 얹는 순서</b>입니다. 다만 Digital Journal은 절감 시간 측정 방법이 공개되지 않았다고 지적했고, 거버넌스·사람 검토 체계도 밝히지 않았습니다.</p>", "foryou": "'직원 1인당 연 한 달 반환'처럼 목표를 사람 단위 시간으로 정하면 전사 커뮤니케이션은 쉬워집니다. 다만 위 한국은행 조사처럼 산출과 따로 놀 수 있으니 <b>목표와 측정 방법을 같이 정의</b>하세요."}]}, {"id": "tools", "label": "써볼 만한 툴 & 에이전트", "icon": "🧰", "tint": "green", "desc": "요즘 새로 나왔거나 화제인 툴·에이전트 중 업무나 일상에서 바로 써보거나 아이디어를 얻을 만한 것.", "criteria": "이 탭은 <b>'직접 써보고 아이디어를 얻는 용도'</b>입니다. 대부분 초기 제품이라 <b>성능·안전 주장은 제작사 발표 기준</b>이며, 사내 계정이나 업무 데이터를 연결하기 전에는 정보보안팀(#support-정보보안)에 먼저 문의하세요. 개인 계정·샘플 데이터로 먼저 체험해 보는 것을 권합니다. 이번 호의 국내 도구는 <b>OpenDocKit, 맹고, SeohoKim Loop, VAMP MCP</b>입니다(VAMP MCP는 국내 커뮤니티 게시 기준 추정).", "highlight": {"kicker": "써볼 만한 툴 & 에이전트", "title": "OpenDocKit — HWP·HWPX도 병합 셀·각주·수식까지 살려 Markdown으로. 사내 RAG·에이전트에 문서를 넣기 전 단계를 맡는 국산 오픈소스(MIT, MCP 서버 포함)", "summary": "국내 개인 개발자가 공개한 파이썬 라이브러리입니다. PDF·DOCX·PPTX·XLSX·HWP/HWPX 등을 LLM이 읽기 좋은 Markdown으로 바꾸며, 기존 변환기에서 자주 깨지는 <b>병합 셀, 다단 PDF, 차트, 수식</b>을 보존하는 데 초점을 맞췄습니다.", "detail": "<p>GeekNews Show GN 게시(11월 20일)와 GitHub README, PyPI 기준입니다. PyPI 첫 릴리스는 11월 12일이고 이번 주에만 0.3.10~0.3.14가 연달아 나왔습니다. HWP 5.x 파서를 직접 구현했고, DOCX·PPTX의 차트는 데이터 표로, SmartArt는 중첩 목록으로, 수식은 LaTeX로 바꿉니다. XLSX는 표시 형식 그대로 숫자·날짜를 유지합니다. 기본 설치는 <b>네트워크 없이 동작</b>하고, 이미지 설명 옵션을 켤 때만 외부 모델을 부릅니다.</p><p>CLI와 MCP 서버(<code>opendockit-mcp --root &lt;폴더&gt;</code>), LangChain·LlamaIndex 로더를 제공합니다. 압축 폭탄·과도한 병합 셀을 제한하고, 파일마다 별도 워커에서 메모리 2GB·2분 상한을 두는 격리 변환기도 있습니다. Python 3.12 이상, Linux·macOS 기준이며 Windows는 일부 형식 미지원, OCR은 없습니다. 가격은 무료(MIT)입니다. '구조 체크 49개 통과(Docling 36개)'는 작성자가 만든 기준이라 제작사 발표로 봐야 하고, 작성자 스스로 다른 도구(Kreuzberg)가 약 30배 빠르다고 밝혔습니다.</p>", "source": "GeekNews Show GN · GitHub hyeonsang010716/OpenDocKit · PyPI (제작자 문서 기준, 직접 사용 검증 안 함)", "url": "https://news.hada.io/topic?id=37495", "published": "2026-11-20", "foryou": "<b>써보는 방법:</b> 개인 PC에서 <code>pip install opendockit</code> 후 공개된 정부 보도자료 HWP나 병합 셀이 있는 더미 엑셀로 변환 결과를 보세요. 업무에서는 사내 RAG 변환기 후보로 Docling·MarkItDown과 같은 문서로 나란히 비교하는 PoC에 좋고, 일상에서는 아파트 관리규약·가정통신문 HWP를 Markdown으로 바꿔 챗봇에 물어볼 수 있습니다. 전사 관점에서는 개인이 운영하는 초기 0.x 프로젝트라 <b>버전 고정·의존성 검토</b>가 필요하고, MCP <code>--root</code>는 샘플 전용 폴더로 한정하세요. 사내 문서에 쓰기 전 정보보안팀(#support-정보보안) 확인이 필요합니다."}, "articles": [{"tag": "국내 신규 · 일상", "source": "GeekNews Show GN (제작사 소개글, 운영사 사업자 정보 미확인)", "url": "https://news.hada.io/topic?id=37632", "published": "2026-11-22", "title": "맹고 — 출퇴근길 하루 두 번, 내 관심사 뉴스 10건을 AI가 골라 요약해 음성으로 들려주는 오디오 브리핑 앱(iOS·Android·웹)", "summary": "같은 사건을 다룬 여러 매체 기사를 묶어 출처·원문 링크와 함께 요약하고, 영문 기사도 한국어로 요약합니다. 화면을 꺼도 이어서 재생되고 잠금화면에서 조작할 수 있습니다.", "detail": "<p>'오늘의 흐름'은 그날 뉴스가 내 일에 줄 영향을 정리하고, '맹고 AI'로 기사에 질문할 수 있습니다. 무료는 브리핑당 10건·오디오 하루 3회·AI 질문 하루 3회, 프리미엄은 월 3,800원(첫 구독 7일 무료)으로 무제한 오디오와 블로그·뉴스레터·유튜브 커스텀 링크 3개를 줍니다. 웹은 로그인 없이 체험할 수 있습니다. 정식 출시일과 개인정보처리방침은 미확인입니다.</p>", "foryou": "<b>써보는 방법:</b> 일상에서는 관심사를 'AI 에이전트·핀테크·커머스'로 잡고 1주일 출퇴근길에 들어 보세요. 업무 아이디어로는 '팀 동향 공유를 텍스트가 아니라 오디오 브리핑으로' 바꾸는 실험의 참고가 됩니다. 커스텀 링크에 사내 뉴스레터·내부 URL은 넣지 마세요."}, {"tag": "국내 신규 · 오픈소스 2종", "source": "GeekNews Show GN (제작자 소개글, 저장소 직접 열람·라이선스 일부 미확인)", "url": "https://news.hada.io/topic?id=37610", "published": "2026-11-22", "title": "Show GN 신작 2종 — SeohoKim Loop(초안은 GPT, 검토는 Claude… AI별 '초안→검토→개선' 체인 데스크톱 앱), VAMP MCP(에이전트에게 Windows GUI 작업을 VM 안에서 맡기고 녹화 작업은 모델 없이 재실행)", "summary": "SeohoKim Loop는 여러 AI 창에 복사해 붙이는 대신 단계마다 다른 모델을 지정해 한 흐름으로 돌리는 Windows 앱입니다. VAMP MCP는 가상머신을 에이전트 작업 공간으로 주고, 한 번 녹화한 작업은 RPA처럼 모델 호출 없이 다시 돌립니다.", "detail": "<p><b>SeohoKim Loop</b>(11월 22일 게시)는 OpenAI 호환 API, Claude API, 로컬 Ollama를 지원하고 로컬 히스토리를 암호화해 저장합니다. API 키 없이 흐름을 보는 Mock 모드가 있고, 아직 설치 파일 없이 Node.js로 실행하는 초기 프리뷰입니다(Apache-2.0, 비용은 API 사용료만).</p><p><b>VAMP MCP</b>(11월 21일 게시, <a href='https://news.hada.io/topic?id=37573'>GeekNews</a>)는 Windows 호스트에서 VirtualBox·KVM 등을 쓰고, 재실행 중 화면 배치가 바뀌면 입력 전에 멈춥니다. 자격 증명은 KeePassXC·VeraCrypt 기반 별도 Vault MCP로 분리합니다. 라이선스·가격은 미확인입니다.</p>", "foryou": "<b>써보는 방법:</b> Loop는 Mock 모드로 흐름을 본 뒤 개인 API 키로 공개 자료 기반 기획서를 '작성→교차 검토'해 보세요. VAMP는 레거시 사내 Windows 앱 반복 작업의 RPA 대체 아이디어로 참고하되, 개인 PC의 격리된 VM과 더미 데이터로만 시작하세요. 사내 문서는 지정한 모든 모델 제공사로 전송되므로 정보보안팀(#support-정보보안) 확인 전에는 넣지 마세요."}, {"tag": "해외 신규 · 메일", "source": "Product Hunt · glassmail.app (제작사 발표 기준, 정확한 런치일 미확인)", "url": "https://glassmail.app", "published": "2026-11-22", "title": "Glassmail — AI가 내 Mac 안에서만 도는 메일 앱. Claude·Codex가 메일을 읽고 찾되, 변경은 매번 승인받고 발송·삭제는 아예 못 하게", "summary": "Gmail·iCloud·Outlook·IMAP을 한곳에 묶는 네이티브 Mac 메일 앱입니다. 요약, '오늘 답장할 메일' 질의, 내 문체로 쓴 답장 초안을 온디바이스 AI로 처리합니다.", "detail": "<p>Apple silicon의 macOS 26에서는 Apple Intelligence를, 그 밖에는 약 1.2GB 소형 모델을 내려받아 쓰며 LM Studio·Ollama도 지원합니다. 계정 단위로 '에이전트에서 숨기기'가 가능하고 추적 픽셀을 제거합니다. macOS 14 이상, 일회성 구매(첫 100명 $29, 이후 $49, Mac 3대), 14일 무료 체험입니다. 1인 메이커 제품이고 iPhone 앱은 개발 중입니다.</p>", "foryou": "<b>써보는 방법:</b> 개인 Gmail로 14일 체험해 보세요. 업무 아이디어로는 <b>'에이전트는 읽기 자유, 변경은 승인, 발송·삭제는 불가'</b>라는 권한 설계가 사내 메일·메신저 에이전트 정책의 좋은 본보기입니다. 회사 메일 계정 연결은 정보보안팀(#support-정보보안) 확인 전에는 하지 마세요."}, {"tag": "해외 신규 · 개발 거버넌스", "source": "Product Hunt (메이커 설명 기준, 공식 사이트 직접 확인 안 함)", "url": "https://www.producthunt.com/products/gitroots", "published": "2026-11-22", "title": "gitroots — AI 에이전트에게 GitHub '경로 단위' 쓰기 권한만 주고, 범위 밖 변경은 웹·모바일·CLI 승인을 거치게 하는 거버넌스 레이어", "summary": "사람과 Claude Code·Codex에 경로별로 읽기·쓰기 권한을 따로 주고, 읽기 활동까지 감사 로그로 남깁니다. 여러 경로에 걸친 하나의 변경은 승인 요청 하나로 묶습니다.", "detail": "<p>Starter는 무료(카드 불필요), 유료는 월 $19부터이며 GitHub만 지원합니다. 계약자 서명 커밋이 대상 저장소에서 원 서명(Verified)을 유지하지 못하고 gitroots 명의로 표시되는 한계가 있습니다. 데이터 보관 위치·GitHub App 권한 범위는 미확인입니다.</p>", "foryou": "<b>써보는 방법:</b> 개인 GitHub의 테스트 저장소에서 Claude Code에게 특정 디렉터리만 쓰기 권한을 주고 승인 흐름을 체험해 보세요. 도입보다는 <b>'에이전트 권한을 저장소가 아니라 경로 단위로 나눈다'</b>는 아이디어를 사내 정책 논의에 가져오는 용도가 큽니다. 제3자에 저장소 권한을 주는 구조라 사내 적용 전 정보보안팀(#support-정보보안) 검토가 필요합니다."}, {"tag": "해외 신규 · 워크플로", "source": "agents-radar 다이제스트(Product Hunt) · Product Hunt (정확한 런치일·유료 가격 미확인)", "url": "https://www.producthunt.com/products/mermaid-chart", "published": "2026-11-20", "title": "Mermaid Flow — 다이어그램 그리듯 에이전트 워크플로를 만들고 GitHub·Slack·Notion에 연결해 수동·예약 실행, 그림이 곧 문서", "summary": "Mermaid 문법으로 워크플로를 그리고, 실행마다 단계별 기록을 남겨 팀원이 과정을 따라갈 수 있습니다. 템플릿·자연어 설명·파일 가져오기로 시작할 수 있습니다.", "detail": "<p>MCP 엔드포인트를 제공하고 Mermaid 문법이 오픈소스라 Claude Code·Cursor가 그대로 읽습니다. 메이커 댓글 기준 PR 머지 같은 이벤트 트리거, 실패 단계부터 재시작, 사람 승인 단계는 아직 없습니다. 'Free to start'이며 유료 요금은 미확인입니다.</p>", "foryou": "<b>써보는 방법:</b> 개인 Notion·Slack 테스트 워크스페이스로 '주간 이슈 요약 → Slack 공유' 흐름을 그려 보세요. 다이어그램이 그대로 운영 문서가 된다는 점은 TPM이 자동화 흐름을 팀에 설명할 때 유용합니다. 승인 단계가 없으니 쓰기 동작이 있는 워크플로의 사내 적용은 보류하고, OAuth 연동 범위는 정보보안팀(#support-정보보안)과 확인하세요."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.10.06~10.12</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 10월 26일~11월 2일 공개 뉴스 기반(일부 직전 보도 포함). 일부 수치는 2차 정리 글·벤더 발표 기준이므로 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
</html>
