const NL={"meta": {"icon": "🗞️", "edition": "Vol.43", "cadence": "주간", "date": "2026년 11월 2일 (월)", "curator": "Claude (Cowork)", "title": ["주간 AI 뉴스레터 — ", "TPM Edition"], "lead": "CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식과, 직접 써볼 만한 신규 툴·에이전트. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.", "greeting": "안녕하세요! 이번 주 한 줄 요약은 <b>\"AI 벤더의 재무·사고·과금 구조가 한꺼번에 공개된 주 — 이제 계약·보안·예산 점검 항목이 날짜와 함께 생겼다\"</b>입니다.<br><br>10월 26일 Anthropic이 <b>S-1(상장 신청서)을 공개</b>하면서 주요 AI 벤더 중 처음으로 감사받은 재무와 컴퓨트 의존 구조가 드러났습니다. 10월 29일에는 <b>Cursor 마켓플레이스에 올라간 Claude Code 확장이 변조</b>돼 약 11시간 배포됐고(최대 5,000명 영향 보도), 협업 도구는 <b>Notion이 11월 2일, Atlassian이 12월 3일</b>부터 AI 크레딧 과금으로 넘어갑니다. 같은 주에 GitHub은 모델을 자동 조합하는 <b>Copilot Fusion</b>을 내놓았고, 에이전트가 만든 PR이 전체의 40%를 넘었다고 밝혔습니다.<br><br>국내에서는 SKT가 <b>'AX 혁신 2.0'</b>(직원 4,000명 이상이 에이전트 제작, 사내 정기 사용 1,500개)을, 행정안전부가 공무원 업무망 <b>'온AI' 확대</b>를, 과기정통부가 <b>카카오 부사장을 국민AI서비스혁신추진단장으로 선임</b>한 소식이 있었습니다. 올트먼 CEO는 10월 30~31일 SK·삼성 경영진을 만났습니다(구체 합의는 확인되지 않음). 6번째 탭에는 한국 공공 데이터(DART·법령·한국은행)를 에이전트에 연결하는 <b>korea-data-mcp</b> 등 국내 도구 4건을 담았습니다.<br><br>이번 주는 네이버·토스·당근의 새 발표는 확인하지 못했습니다(당근은 10월 23일 발표 사례를 사례 탭에 실었습니다). 일부 내용은 2차 정리 글·벤더 발표 기준이라 각 카드에 표시했습니다."}, "topics": [{"id": "top", "label": "이 주의 핵심", "icon": "⚡", "tint": "red", "desc": "이번 주 국내외 AI 소식 중 전사 의사결정에 가장 직접적으로 영향을 주는 것들.", "criteria": "규제 조항 설명은 뺐고, <b>벤더 계약·연속성 판단</b>(Anthropic S-1), <b>우리 개발자 PC에 영향이 있는 보안 사고</b>, <b>날짜가 정해진 모델 종료·한도 변경</b>처럼 우리가 판단하거나 움직여야 하는 것을 우선했습니다. 수치는 대부분 신청서·보도 기준이며 미확정 항목은 카드에 표시했습니다.", "highlight": {"kicker": "이 주의 핵심", "title": "Anthropic, S-1 공개(10월 26일) — 상반기 매출 163억 달러, 컴퓨트 약정은 2045년까지, 고객 집중도·릴리스 지연 가능성도 위험 요인으로 명시", "summary": "Anthropic이 Nasdaq 상장(티커 ANT)을 위한 <b>S-1을 공개</b>했습니다. 지난 호에서 '공개 S-1은 아직 없음'이던 상태가 해소됐고, 벤더 계약을 맡은 입장에서 재무 체력과 의존 구조를 처음 숫자로 볼 수 있게 됐습니다. 주식 수·가격 범위는 비어 있고 상장 시점·기업가치는 보도 기준입니다.", "detail": "<p>서울경제(10월 27일)와 신청서 해설(Commons LLC, 2차 정리)을 종합하면 2026년 상반기 매출은 <b>163억 달러</b>, 영업손실은 약 6.9억 달러(전년 동기 약 21억 달러)입니다. 순손실 807억 달러는 대부분 <b>전환사채 등의 평가 손실(비현금)</b>이라고 설명됩니다. 9월 30일 기준 연 10만 달러 이상 고객이 1만 1,900곳 이상, 100만 달러 이상 1,900곳 이상, 1,000만 달러 이상 약 250곳입니다.</p><p>위험 요인으로는 <b>소수 공급사에서 수년 전에 사 두는 컴퓨트</b>(약정은 2045년까지, 총액은 공란), <b>일부 고객·유통 채널에 집중된 매출</b>, 모델이 의도와 다르게 동작할 때 보험·계약으로 책임이 다 덮이지 않을 수 있다는 점, 안전 사유로 모델 출시를 미룰 수 있다는 점이 꼽혔습니다. 창업자 지분과 장기 이익 신탁이 이사회 다수를 지명하는 구조라 일반 주주와 고객은 지배구조에 영향을 주기 어렵습니다. 기업가치는 FT 인용 보도로 1.5~1.75조 달러, 상장은 11월 중하순이 거론되지만 <b>모두 미확정</b>입니다. 이 카드는 투자 판단 자료가 아닙니다.</p>", "source": "서울경제 영문판 · Commons LLC 신청서 해설 (2차 정리, 신청서 원문 미확인)", "url": "https://en.sedaily.com/international/2026/10/27/anthropic-files-for-nasdaq-ipo-under-ticker-ant", "published": "2026-10-27", "foryou": "<b>전사 관점:</b> 상장 자체보다 <b>계약 갱신 때 확인할 항목</b>이 생겼다는 점이 핵심입니다. ① 모델 단종·릴리스 지연 시 대체 모델 조항, ② 사용량 과금 단가의 변동 가능성, ③ 한 벤더에 쏠린 코딩 에이전트 의존도를 지금 비중으로 둘지입니다. 신청서가 수정되면 숫자가 바뀔 수 있으니 원문(SEC) 확인 후 보고 자료에 쓰세요."}, "articles": [{"tag": "보안 사고", "source": "The Register (10월 30일 보도)", "url": "https://www.theregister.com/a/5306682", "published": "2026-10-30", "title": "Cursor 마켓플레이스에 올라간 'Claude Code' VS Code 확장이 변조 — 약 11시간 배포, 지속형 SSH 백도어 시도(최대 5,000명 영향 보도)", "summary": "10월 29일 Cursor 마켓플레이스에서 공식 Claude Code 확장 <b>2.1.313 버전이 변조돼 약 11시간</b> 배포됐습니다. Anthropic은 자사 시스템 침해가 아니라고 밝혔고, 변조 경로는 <b>아직 공개되지 않았습니다</b>.", "detail": "<p>보도에 따르면 변조본은 사용자명·Git 이메일·공인 IP를 수집해 공격자에게 보내고, 공격자의 SSH 키를 심고, 지속 설치(persistence)를 시도했습니다. 역방향 SSH 터널은 macOS·Windows에서 관리자 권한이 필요해 대부분 실패했지만, <b>터널이 실패해도 정보 전송과 키 설치는 진행</b>됐다고 합니다. 최초 탐지는 EDR 업체 Phorion, Cursor는 해당 버전을 내리고 마켓플레이스를 일시 중단한 뒤 키를 교체했고 정리 안내와 스크립트를 공개했다고 보도됐습니다.</p><p>중요한 점은 <b>최신 버전을 설치해도 이미 심어진 지속 설치는 지워지지 않는다</b>는 것입니다. 영향 인원 5,000명은 Cursor 발표 기준 '최대'치입니다.</p>", "foryou": "<b>전사 관점:</b> 개발자 PC 중 Cursor에서 해당 확장을 받은 사람이 있는지 <b>2.1.313 설치 이력부터</b> 확인하고, 있으면 Cursor 안내에 따른 제거·SSH 키 점검이 필요합니다. 확장·플러그인을 개인이 설치하는 구조라면 승인 목록 정책을 검토할 계기입니다. 점검은 정보보안팀(#support-정보보안)과 함께 하세요."}, {"tag": "날짜 있는 액션", "source": "aicoding-guide 주간 digest (2차 정리, 원문 changelog 확인 필요)", "url": "https://dev.to/aicoding-guide/this-week-in-claude-code-codex-and-gemini-cli-week-of-november-1-2026-15pn", "published": "2026-10-31", "title": "Opus 4.8 '빠른 모드'는 11월 30일 종료 — 종료 후에는 일반 Opus 4.8로 대체되지 않고 오류", "summary": "해당 digest에 따르면 Opus 4.8 fast mode는 10월 30일부로 폐지 예고됐고 <b>11월 30일 이후 요청은 오류</b>를 반환합니다. 11월 중 Opus 5.5로 옮기라는 안내입니다.", "detail": "<p>같은 digest는 Claude Code가 설정 파일로 모델·모드를 고정해 둔 스크립트나 자동화가 영향을 받는다고 짚습니다. 지난 호의 Copilot 모델 종료(11월 16일)와 마찬가지로 <b>'이름으로 고정된 설정'</b>이 점검 대상입니다. 이 카드는 2차 정리 글 기준이라 정확한 종료 조건은 공식 문서 확인이 필요합니다.</p>", "foryou": "<b>전사 관점:</b> 팀 설정·CI·공유 스크립트에서 'fast'나 모델명을 박아 둔 곳이 있는지 엔지니어링 리드에게 한 번 묻는 것으로 충분합니다. 11월 16일(Copilot)·11월 30일(Opus 4.8 fast) 두 날짜를 점검 캘린더에 올려 두세요."}, {"tag": "비용 구조", "source": "AI Weekly 일일 요약 (2차 정리, OpenAI 공식 확인 필요)", "url": "https://aiweekly.co/ai-news-today", "published": "2026-10-31", "title": "ChatGPT와 Codex, 12월부터 하나의 토큰 한도를 공유 — Plus·Pro·Business 대상으로 보도", "summary": "요약 글에 따르면 12월부터 ChatGPT와 Codex가 <b>하나의 토큰 기반 한도</b>를 함께 씁니다. 같은 기간 Pro 한도가 두 배가 됐다는 보도도 있어 플랜별 체감은 다를 수 있습니다.", "detail": "<p>일일 요약 한 줄에서 확인한 내용이라 적용 일자, 대상 플랜의 세부, 기존 한도와의 환산 방식은 <b>확인하지 못했습니다</b>. 코딩 에이전트를 많이 쓰는 사람의 사용량이 채팅 한도를 먼저 소진할 수 있다는 점이 실무상 포인트입니다.</p>", "foryou": "<b>전사 관점:</b> OpenAI 계정을 팀 단위로 쓰고 있다면 '코딩용과 채팅용을 따로 계산하던 예산'이 합쳐지는지 12월 전에 확인하세요. 공식 공지가 나오기 전에는 예산 변경까지 가지 말고 모니터링 항목으로만 두는 것을 권합니다."}]}, {"id": "dev", "label": "개발 AI 동향", "icon": "🛠️", "tint": "purple", "desc": "함께 일하는 엔지니어팀의 일하는 방식이 실제로 어떻게 바뀌는지.", "criteria": "버전 번호 나열은 하지 않고, <b>모델 자동 선택·에이전트가 만드는 PR 비중·권한 통제·사용량 관측</b>처럼 팀 운영에 영향이 있는 것만 골랐습니다. 국내 소식은 이번 주 GeekNews에 올라온 <b>개발자 공개 도구</b> 위주이며, 대기업의 개발 조직 문화 소식은 확인하지 못했습니다. 성능 수치는 벤더 발표 기준입니다.", "highlight": {"kicker": "이 주의 개발 AI", "title": "GitHub Copilot Fusion 공개(10월 28일, Universe) — 작업 단계마다 모델을 골라 조합, 'Opus 5.5 Max 대비 2점 차이에 비용은 절반'(벤더 주장)", "summary": "GitHub이 코딩 작업의 단계별로 <b>어떤 모델을 쓸지 자동으로 고르는 Copilot Fusion</b>을 공개했습니다. 사람이 모델을 고르는 방식에서 <b>플랫폼이 고르고 크레딧으로 과금</b>하는 방식으로의 이동입니다. 성능·비용 수치는 모두 마이크로소프트·GitHub 임원 발언입니다.", "detail": "<p>The Next Web 보도 기준으로 Fusion은 추론·코드 생성·디버깅·도구 사용 같은 필요에 따라 모델 또는 모델 조합을 정합니다. Jay Parikh는 Fusion Max가 Artificial Analysis Coding Agent Index에서 Claude Opus 5.5 Max와 2점 이내이면서 <b>비용은 절반, 작업 시간은 40% 짧다</b>고 했고, 나델라는 최대 77% 저렴하다고 했습니다(둘 다 <b>벤더 주장</b>). 함께 소개된 Copilot 앱은 여러 저장소를 병렬 세션으로 다루고, 클라우드 세션을 앱·VS Code·CLI·웹으로 이어 가며, 결과를 학습하는 자동화는 <b>개발자 승인을 받아</b> 변경을 제안합니다.</p><p>제공 방식은 Enterprise는 <b>영업팀을 통한 계약 우선</b>(셀프서비스는 곧), 기존 Business·Enterprise 고객은 현재 플랜 유지 또는 전환 선택, 사용량은 AI 크레딧으로 과금됩니다. 기사에는 관리자 정책·감사·에이전트 권한 설정에 대한 설명이 거의 없어 <b>GitHub 문서 확인이 필요</b>합니다. GitHub은 Azure 다중 리전 이전도 내년 초 완료 예정이라고 밝혔습니다.</p>", "source": "The Next Web (보도 기반, 수치는 벤더 발표)", "url": "https://thenextweb.com/news/github-universe-copilot-fusion-octoverse-agents", "published": "2026-10-28", "foryou": "<b>전사 관점:</b> 모델 선택이 사용자에서 플랫폼으로 넘어가면 <b>'어떤 모델이 우리 코드를 봤는가'를 설명하기 어려워집니다.</b> 도입 검토 시 모델별 데이터 처리 조건, 크레딧 상한·알림, 감사 로그 제공 여부를 계약 전 체크리스트로 요청하세요. 2배 저렴이라는 수치는 우리 코드베이스로 소규모 파일럿을 한 뒤에 판단하는 것이 안전합니다."}, "articles": [{"tag": "리뷰 병목", "source": "The Next Web (GitHub Octoverse 인용)", "url": "https://thenextweb.com/news/github-universe-copilot-fusion-octoverse-agents", "published": "2026-10-28", "title": "GitHub Octoverse — 9월 기준 PR의 40% 이상이 에이전트 초안으로 시작, 3월 17%에서 두 배 이상", "summary": "GitHub에 따르면 <b>2026년 9월 PR의 40% 이상이 에이전트가 쓴 초안으로 시작</b>했고, 3월에는 17%였습니다. GitHub은 에이전트를 모두 식별하지 못하므로 실제는 더 높을 수 있다고 밝혔습니다.", "detail": "<p>같은 발표에서 최근 12개월 푸시는 179억 회로 2024·2025년 합계보다 많다고 했습니다. 지난 호에서 다룬 '코드량은 늘고 완료 이슈는 제자리'라는 지적과 이어지는 숫자입니다. 기사에는 PR 건수와 합친 수치가 모호하게 표기돼 있어 <b>세부 수치는 GitHub 원문 확인이 필요</b>합니다.</p>", "foryou": "<b>전사 관점:</b> 에이전트 PR 비중이 올라갈수록 <b>병목은 작성이 아니라 리뷰</b>로 이동합니다. 우리 팀의 PR 대기 시간과 리뷰어 1인당 건수를 지금 측정해 두면 도입 효과를 설명할 기준선이 됩니다."}, {"tag": "거버넌스", "source": "aicoding-guide 주간 digest (2차 정리)", "url": "https://dev.to/aicoding-guide/this-week-in-claude-code-codex-and-gemini-cli-week-of-november-1-2026-15pn", "published": "2026-10-31", "title": "Claude Code — 작업 폴더 밖 쓰기를 모든 권한 모드에서 막는 설정, Team·Enterprise 서버 관리 설정은 승인 팝업 없이 적용", "summary": "digest 기준으로 <b>작업 디렉터리 밖 파일 쓰기를 항상 거부</b>하는 설정이 생겼고, 읽기 쪽 제한 설정과 짝을 이룹니다. Team·Enterprise 로그인에서는 서버에서 내려오는 관리 설정이 <b>승인 없이 적용</b>되고, 검증에 실패한 사본은 거부됩니다.", "detail": "<p>관리자 입장에서는 개발자 PC마다 설정을 맞추지 않아도 <b>정책을 중앙에서 강제</b>할 수 있다는 의미입니다. 반대로 서버 설정이 승인 없이 적용되므로 정책 변경 이력을 누가 관리하는지 정해 둬야 합니다. 같은 digest는 OpenTelemetry 이벤트 하나가 철회돼 해당 이벤트로 만든 대시보드는 다시 설계해야 한다고도 알렸습니다. 이 카드는 <b>2차 정리 글 기준</b>이라 설정 이름과 적용 조건은 공식 문서 확인이 필요합니다.</p>", "foryou": "<b>전사 관점:</b> 위 보안 사고 직후라 '쓰기 범위 제한'을 팀 기본 정책으로 둘지 이야기하기 좋은 시점입니다. 서버 관리 설정을 쓰는 조직이라면 정책 변경 승인자와 공지 경로를 먼저 정하세요."}, {"tag": "국내 도구", "source": "GeekNews Show GN (작성자 공개, 독립 검증 없음)", "url": "https://news.hada.io/show", "published": "2026-11-01", "title": "국내 개발자 공개 비용 관측 도구 2종 — Sprag(단순 작업을 싼 모델에 위임하는 CLI), cc-token-ledger(Claude Code 토큰 사용량을 날짜·에이전트·모델별 표로)", "summary": "Show GN에 올라온 <b>사용량·비용을 줄이는 개인 개발자 도구</b>입니다. Sprag는 파일 찾기·상태 확인 같은 단순 작업을 저렴한 모델에 넘기는 오픈소스 CLI이고, cc-token-ledger는 Claude Code 대화 기록에서 토큰 사용량을 읽어 표로 정리하는 Node.js 스크립트입니다.", "detail": "<p>두 도구 모두 목록 소개 문구까지만 확인했고 <b>설치 조건·라이선스·보안 처리는 확인하지 못했습니다</b>. 사용량 과금으로 넘어가는 도구가 늘면서(위의 Copilot·Atlassian·Notion) 개인 개발자가 먼저 관측 도구를 만드는 흐름으로 읽힙니다. 이런 스크립트는 대화 기록 파일을 읽으므로 <b>업무 저장소에서 쓰기 전에 코드를 확인</b>해야 합니다.</p>", "foryou": "<b>전사 관점:</b> 팀별 토큰 사용 현황을 보려면 어떤 데이터가 필요한지 힌트를 주는 사례입니다. 도입은 개인 계정·샘플 저장소에서 먼저 해 보고, 업무 기록을 읽는 도구라는 점에서 사내 사용 전에는 정보보안팀(#support-정보보안) 확인을 권합니다."}]}, {"id": "tpm", "label": "TPM 업무 자동화", "icon": "📋", "tint": "blue", "desc": "로드맵·스프린트·문서화·커뮤니케이션에 바로 붙일 수 있는 기능.", "criteria": "이번 주는 새 기능보다 <b>AI 과금 방식의 전환</b>이 크게 보여, 예산·한도 설정에 영향이 있는 것을 우선했습니다. 국내 협업 도구(Jira·Confluence 등)의 새 AI 기능은 확인하지 못했고, 공공 업무망 AI 사례를 국내 소식으로 포함했습니다. 수치와 기능은 <b>벤더 발표 기준</b>입니다.", "highlight": {"kicker": "이 주의 TPM 자동화", "title": "협업 도구 AI가 '좌석제'에서 '크레딧제'로 — Notion은 11월 2일, Atlassian Rovo는 12월 3일부터 초과 사용 과금", "summary": "Notion은 <b>11월 2일(오늘)</b> Business·Enterprise 워크스페이스를 AI 크레딧 체계로 옮깁니다. Atlassian은 Rovo 크레딧 초과분 과금을 <b>12월 3일</b>부터 시작하며 <b>초과 사용이 기본으로 켜져</b> 있다고 발표했습니다.", "detail": "<p>UC Today(10월 31일)에 따르면 Notion은 멤버당 월 Standard 1,500·Select 500 크레딧을 기본으로 주고, <b>풀링·이월은 불가</b>합니다. 공유된 커스텀 에이전트는 기본적으로 소유자의 Select 크레딧을 쓰고, 관리자가 워크스페이스 크레딧으로 충당할 수도 있으며, <b>크레딧이 소진되면 에이전트가 멈춥니다</b>. Wrike는 10월 26일 단순 작업(상태 변경·필드 복사)은 AI 한도에서 빼는 변경을 했고, Microsoft는 10월 28일 실적에서 좌석제에서 소비 기반 과금으로 이동 중이라고 밝혔습니다.</p><p>Atlassian 쪽은 Team '26 Europe(10월 초) 발표 기준으로 Rovo 초과 크레딧 목록가가 크레딧당 0.01달러이고, 과금 시작은 12월 3일입니다(NAND Research, 이 카드의 Atlassian 내용은 <b>한 주 이전 보도</b>). 위 수치는 모두 벤더 발표를 매체가 정리한 것이라 우리 계약 조건과 다를 수 있습니다.</p>", "source": "UC Today (2차 정리) · NAND Research (벤더 발표 정리)", "url": "https://uctoday.com/work-management-news-octobers-ai-giants-have-to-show-their-work", "published": "2026-10-31", "foryou": "<b>전사 관점:</b> 이번 주 안에 ① Notion 워크스페이스 관리자가 크레딧 한도와 '소진 시 에이전트 중지' 영향 범위를 확인하고, ② Atlassian 관리자가 Rovo <b>초과 사용 기본값을 꺼 둘지</b> 12월 3일 전에 결정하도록 요청하세요. 팀별 사용량이 한 도구에서 터지면 업무 자동화가 멈추는 구조라 '누가 한도를 올리는가'를 정해 두는 것이 핵심입니다."}, "articles": [{"tag": "이슈 트래커", "source": "UC Today (2차 정리, 각 벤더 발표 요약)", "url": "https://uctoday.com/work-management-news-octobers-ai-giants-have-to-show-their-work", "published": "2026-10-31", "title": "Jira는 Rovo Chat에서 코딩 에이전트 호출(10월 27일), Linear Loops는 Slack·GitHub 이벤트로 시작(10월 22일), monday는 '프런티어' 서비스 공개(10월 28일)", "summary": "이슈 트래커가 <b>사람이 일을 배정하는 곳에서 에이전트를 부르는 창구</b>로 바뀌고 있습니다. Jira는 이슈에서 코딩 에이전트를 부르고 결과를 이슈에 다시 써 줍니다(Jira Cloud와 Rovo 필요).", "detail": "<p>Linear Loops는 'PR이 테스트 준비 상태'가 되면 QA 계획 초안을 자동으로 만들고, 팀이 Loops를 공유 템플릿으로 저장하고 <b>추론 수준을 골라 비용을 조절</b>할 수 있다고 합니다. monday는 관리형 서비스와 파견 엔지니어를 묶은 '프런티어'를 공개했고(가격·대상 미공개), 고객 사례로 Clearwater의 에이전트 20개가 2개월 동안 3,000건 이상의 작업을 처리했다고 소개했습니다(<b>벤더 보고</b>). 담당자는 에이전트에 최소 권한만 주라고 강조했습니다.</p>", "foryou": "<b>TPM 관점:</b> 로드맵·스프린트 운영에서 '이슈 상태 변경이 에이전트 실행으로 이어지는 흐름'을 하나만 골라 시범해 볼 수 있습니다(예: 테스트 준비 시 QA 계획 초안). 에이전트가 이슈를 수정할 수 있다면 변경 이력과 승인 단계를 어디에 둘지 먼저 정하세요."}, {"tag": "국내·공공", "source": "전자신문 (행정안전부 발표 보도)", "url": "https://www.etnews.com/20261101000083", "published": "2026-11-01", "title": "정부 '온AI' 기능 확대 — 업무망에서 웹 검색 반영 답변, 다음 달 보고서 초안 작성 '온AI 협업' 시범, 2027년 에이전트 공유", "summary": "행안부가 공무원 업무망 AI '온AI'에 <b>웹 검색(지난달 도입)</b>을 더했고, 다음 달 시범 운영하는 '온AI 협업'은 기존 자료와 서식을 등록하면 보고서 초안을 쓰고 웹 편집기에서 수정·공유합니다. 우수 에이전트를 다른 공무원이 쓰게 하는 공유 기능은 2027년 예정입니다.", "detail": "<p>AI 답변에는 출처와 원문을 확인할 수 있는 QR코드가 붙습니다. 기사에는 보안 방식, 이용자 수, 예산이 나와 있지 않아 <b>규모와 안전장치는 확인하지 못했습니다</b>. '서식을 먼저 등록해 두고 초안을 받는다'는 구조는 사내 보고서·주간 리포트 자동화에도 그대로 옮길 수 있는 설계입니다.</p>", "foryou": "<b>TPM 관점:</b> 주간 보고·리더십 리뷰 문서의 <b>서식과 과거 자료를 한 곳에 모아 초안 에이전트에게 주는 방식</b>을 작게 시험해 볼 만합니다. 에이전트 공유 기능을 만든다면 '좋은 에이전트를 어떻게 평가해 승격시키는가' 기준이 먼저 필요합니다."}, {"tag": "벤더 발표", "source": "NAND Research (벤더 발표 정리, 10월 8일 보도)", "url": "https://nand-research.com/atlassian-team-26-europe-announcements-context-governance-at-the-center-of-agentic-work/", "published": "2026-10-08", "title": "Atlassian Team '26 Europe — Rovo Work(계획 승인 후 다단계 실행), 에이전트 계정·비인간 ID 목록은 '곧', EU 내 AI 추론 확대", "summary": "Rovo Work는 Rovo가 계획을 제안하면 사람이 승인한 뒤 <b>관리자가 통제하는 클라우드 샌드박스</b>에서 Jira·Confluence·연결 도구를 가로질러 실행합니다. 재구축한 MCP 서버는 도구 200개 이상, 토큰은 최대 25% 적게 쓴다고 주장합니다(<b>내부 벤치마크</b>).", "detail": "<p>거버넌스 쪽에서는 에이전트 계정과 비인간 ID 목록이 '곧', EU 호스팅 모델에서만 처리하는 EU AI 추론이 단계적 제공으로 소개됐습니다. 이 카드는 <b>한 주 이전 발표</b>이고 각 기능의 정식 제공 시점은 기사에 대부분 없습니다. 위 크레딧 과금과 같은 발표 묶음이라 함께 읽어야 합니다.</p>", "foryou": "<b>TPM 관점:</b> 'Rovo Work처럼 계획을 먼저 보여 주고 승인받는 방식'은 우리가 에이전트를 도입할 때 쓸 수 있는 승인 모델의 참고안입니다. 데이터 처리 위치와 에이전트 계정 목록 제공 시점은 도입 전에 벤더에 문서로 요청하세요."}]}, {"id": "biz", "label": "빅테크 & 전략 동향", "icon": "🌐", "tint": "orange", "desc": "리더십 보고와 전사 전략 수립에 참고할 산업 맥락.", "criteria": "이번 주는 <b>국내 정부·카카오·삼성·SK 관련 3건과 해외 2건</b>으로 구성했습니다. 순수 거시·지정학 얘기는 줄이고 인력·벤더·과금 판단에 연결되는 것만 골랐으며, 네이버·토스·당근의 새 전략 소식은 확인하지 못했습니다. 보도 기반 수치는 미확정이라고 표시했습니다.", "highlight": {"kicker": "이 주의 전략 동향", "title": "과기정통부, 카카오 김세웅 부사장을 '국민AI서비스혁신추진단장'에 선임 — 임기제 민간 개발자와 'AI챔피언' 61명이 공공 AI 서비스를 직접 만든다", "summary": "과기정통부가 11월 1일 신설 조직 <b>국민인공지능서비스혁신추진단</b>의 초대 단장으로 카카오 부사장을 선임했고, 11월 2일 업무를 시작했습니다. 외주 중심에서 벗어나 <b>임기제 공무원으로 채용된 민간 개발자</b>가 중심이 되는 구조입니다.", "detail": "<p>전자신문(11월 1일) 기준으로 추진단장은 고위공무원급이고 임기는 2028년 9월 말까지입니다. 기획·개발·보안 등 4개 팀과 단장·국장 체계로, 민간 개발자·AI챔피언·부처 인력·유관기관 전문가 등 총 <b>61명</b>이 참여하고 서울스퀘어에 사무실을 뒀습니다. 11월 초 민간 개발자 추가 채용이 시작됩니다.</p><p>어떤 서비스를 먼저 만들지, 예산 규모는 이 기사에서 <b>확인하지 못했습니다</b>. 국내 AI 인력 시장과 공공 협업 방식의 변화를 보여 주는 신호로 읽는 것이 적절합니다.</p>", "source": "전자신문 (과기정통부 발표 보도)", "url": "https://www.etnews.com/20261030000362", "published": "2026-11-01", "foryou": "<b>전사 관점:</b> 정부가 민간 개발자를 직접 채용해 AI 서비스를 만들면 <b>AI 개발 인력 채용 경쟁과 공공 서비스 연계 기회</b>가 모두 커집니다. 우리 조직의 AI 인력 유지·채용 계획과, 공공 데이터·서비스와 연결 가능한 영역이 있는지 CTO 보고 때 한 줄로 짚어 둘 만합니다."}, "articles": [{"tag": "국내 파트너십", "source": "전자신문 (보도, 구체 합의 미확인)", "url": "https://www.etnews.com/20261031000056", "published": "2026-10-31", "title": "올트먼 OpenAI CEO 방한 — 10월 30일 SK, 31일 삼성 경영진 회동, 스타게이트·HBM·국내 AI 데이터센터 논의 관측", "summary": "올트먼은 <b>1박 2일 일정</b>으로 SK(최태원 회장 등, 30일)와 삼성(계열사 사장단 50여 명, 31일)을 만났습니다. 논의 내용은 공개되지 않았고 기사는 스타게이트·HBM·데이터센터가 다뤄졌을 것이라는 <b>관측</b>만 전합니다.", "detail": "<p>삼성에서는 올트먼이 'AI를 쓰는 것만으로는 경쟁 우위가 어렵고, AI로 얼마나 빠르게 움직여 더 나은 제품을 만드는지가 중요하다'는 취지로 말했다고 보도됐습니다. 2025년 10월 스타게이트 협력의향서(LOI)가 체결돼 있고, 국내 AI 데이터센터 후보지로 포항(삼성)과 광주 장성(SK)이 거론됩니다. <b>구체 합의는 확인되지 않았습니다</b>.</p>", "foryou": "<b>전사 관점:</b> 합의 내용이 나오기 전이라 판단 자료로 쓰기엔 이르지만, 국내 대기업이 OpenAI와 물량·인프라 협력으로 움직이는 흐름은 우리 벤더 구성(어떤 모델을 누구 통해 사는가)을 점검하게 하는 배경입니다."}, {"tag": "국내 실적", "source": "디지털데일리 주간브리핑", "url": "https://www.ddaily.co.kr/page/view/2026103016181633127", "published": "2026-10-30", "title": "카카오 3분기 실적 11월 5일 — 쿠팡 11월 4일, 롯데쇼핑 11월 6일, 'AI 투자 부담과 수익화'가 관전 포인트", "summary": "카카오는 <b>11월 5일 오전 9시</b> 컨퍼런스콜과 함께 3분기 실적을 발표합니다. 매체는 AI 서비스 확대에 따른 투자 부담과 AI 수익화 전략, 카카오톡 광고·커머스 기여도를 관전 포인트로 꼽았습니다.", "detail": "<p>지난 2분기 매출은 2조 985억 원, 영업이익은 2,770억 원이었습니다. 기사는 카나나·에이전트 같은 구체적 서비스나 AI 비용 규모를 다루지 않았습니다. 지난 호의 카카오 인적분할 로드맵(12월 17일 임시주총)과 함께 볼 일정입니다.</p>", "foryou": "<b>전사 관점:</b> 국내 플랫폼이 AI 투자를 어떻게 설명하고 수익으로 연결하는지는 우리 AI 예산 논리를 만들 때 참고가 됩니다. 11월 4~6일 발표에서 'AI 비용 대비 매출 기여' 설명이 나오는지만 확인해도 충분합니다."}, {"tag": "가격 구조", "source": "UC Today (2차 정리, Microsoft 실적 발표 인용)", "url": "https://uctoday.com/work-management-news-octobers-ai-giants-have-to-show-their-work", "published": "2026-10-31", "title": "Microsoft, 10월 28일 실적 — Copilot 일일 사용자 분기 대비 약 50% 증가, 5만 좌석 이상 고객 전년 대비 8배, 사용량 기반 크레딧 고객 75% 증가", "summary": "Microsoft는 좌석제 구독에서 <b>소비 기반 과금</b>으로 옮겨 가고 있다고 설명했습니다. 신규 총 유료 좌석 수와 프로젝트 성과 지표는 공개되지 않았습니다(마지막 공개는 7월 3,000만 석 이상).", "detail": "<p>위 협업 도구의 크레딧제 전환(Notion·Atlassian)과 같은 방향입니다. 수치는 Microsoft 발표를 매체가 정리한 것이라 정확한 정의(일일 사용자 기준 등)는 <b>확인하지 못했습니다</b>.</p>", "foryou": "<b>전사 관점:</b> 주요 벤더가 모두 사용량 과금으로 가는 흐름이라, 내년 예산은 '좌석 수 × 단가'가 아니라 <b>'팀별 사용량 시나리오'</b>로 짜야 합니다. 상·중·하 3개 사용량 시나리오로 예산 범위를 잡아 두면 보고가 쉬워집니다."}, {"tag": "벤더 리스크", "source": "AI Weekly 일일 요약 (FT 보도 인용, 2차 정리·미확정)", "url": "https://aiweekly.co/ai-news-today", "published": "2026-10-30", "title": "OpenAI 투자 라운드 목표 300억 달러에서 약 200억 달러로 축소, 기업가치 1.4조에서 1.25조 달러로 조정 보도", "summary": "요약 글에 따르면 FT는 OpenAI가 라운드 규모와 기업가치 목표를 낮췄다고 보도했습니다. 지난 호의 <b>'약 300억 달러 조달 협상'</b>이 조정된 소식입니다.", "detail": "<p>FT 원문은 확인하지 못했고 일일 요약 한 줄을 근거로 한 카드입니다. 조달 규모 변화가 서비스 가격·제공 조건에 어떻게 영향을 줄지는 <b>알려진 바 없습니다</b>. Anthropic의 상장 서류 공개와 같은 주에 나온 대비되는 소식입니다.</p>", "foryou": "<b>전사 관점:</b> 벤더 재무 소식은 단기 서비스 중단과 직결되지 않지만, 한 벤더 의존도를 점검하는 정기 항목(분기 1회)에 넣어 두는 신호입니다. 미확정 보도라 보고서에는 '보도 기준'으로만 쓰세요."}]}, {"id": "case", "label": "국내외 AI 도입 사례", "icon": "📚", "tint": "gray", "desc": "실제로 도입한 조직의 성과와 실패 요인 — 우리 조직에 옮긴다면 무엇이 필요한지.", "criteria": "이번 주 사례는 <b>국내 2건(당근, SKT)과 해외 2건</b>입니다. 성과 수치는 대부분 <b>도입 기업·벤더의 자체 보고</b>이며 독립 검증은 아닙니다. 당근은 10월 23일 발표라 한 주 이전 내용이고, 실패 사례는 이번 주에는 확인하지 못했습니다.", "highlight": {"kicker": "이 주의 도입 사례", "title": "당근 — 사내 AI 에이전트 180개 이상 운영, 장애 원인 추적 40분에서 2분, 'LLM 라우터와 에이전트 게이트웨이'로 비용·권한을 한곳에서 관리", "summary": "당근 엔지니어가 10월 23일 'AWS AI 웨이브'에서 공개한 사례입니다. 슬랙 기반 사내 에이전트가 <b>180개 이상</b>이고, 장애 원인 추적이 약 95% 단축됐다고 합니다(발표자 보고). <b>팀은 사전 승인 없이 AI를 호출하되, 용도·비용·보안·사용량은 중앙 라우터에서 관리</b>하는 구조가 핵심입니다.", "detail": "<p>이데일리 보도 기준으로 가장 먼저 도입한 데이터 분석 에이전트는 SQL을 모르는 직원도 질문으로 데이터를 보게 했고, <b>신입 분석가를 온보딩하듯 에이전트를 가르쳤다</b>고 설명합니다. 에이전트는 로그·지표를 실시간으로 확인해 장애 원인을 분석합니다. 아마존 베드록으로 여러 모델을 쓰며 특정 벤더 장애 시 트래픽을 우회하고, 에이전트에는 <b>최소 권한만 위임</b>하는 게이트웨이를 둡니다.</p><p>규모는 MCP 서버 200개 이상, 스킬 600개 이상, 월간 활성 프로젝트 800개 이상입니다. 부동산 팀은 월 160회 이상 배포하며, 성공 사례와 핵심 스킬을 전사에 공유합니다. 모든 수치는 <b>발표자 자체 보고</b>이며 측정 방법은 기사에 없습니다.</p>", "source": "이데일리 (AWS AI 웨이브 발표 보도, 발표자 자체 보고)", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=05444806645615872", "published": "2026-10-23", "foryou": "<b>전사 관점:</b> 우리 조직에 옮긴다면 <b>① 모델 호출을 한 곳(라우터)으로 모아 비용·보안을 보게 하고, ② 에이전트 권한을 게이트웨이에서 최소화하고, ③ 잘 된 스킬을 전사 공유</b>하는 세 가지가 출발점입니다. 승인을 없앤 대신 중앙 관측을 둔 구조라는 점이 포인트이므로, 현재 우리 팀별 AI 호출이 어디로 흩어져 있는지부터 파악해 보세요."}, "articles": [{"tag": "국내 사례", "source": "솔루션뉴스 (SKT 발표 보도, 발표 11월 1일)", "url": "https://www.solnews.co.kr/news/articleView.html?idxno=85104", "published": "2026-11-02", "title": "SKT 'AX 혁신 2.0' — 4,000명 이상이 에이전트를 만들고 1,500개를 정기 사용, '개인에서 조직으로' 업무 절차 안에 에이전트를 넣는다", "summary": "SKT는 AX를 1단계(개인 업무 보조)에서 2단계(<b>조직 업무 절차 안에 에이전트 배치</b>)로 옮깁니다. 직원이 에이전트를 직접 만들고 회사는 <b>사번 부여와 평가 체계</b>로 관리하는 자체 생태계 방식입니다.", "detail": "<p>걸림돌로 데이터 접근·시스템 연계·보안을 꼽았고, 추진 프로그램은 AX 이네이블러 TF(교육·데이터·보안 인프라·에이전트 평가), AX 샌드박스(업무 재설계 실험), AX 카탈리스트(9월 1기 직원 10명 선발, AI 사용 비용과 연계 지원)입니다. 기술 측면에서는 AI에 원본 데이터를 보여 주지 않고 처리 결과만 넘기는 <b>'Z.E.Z(Zero Exposure Zone)'</b>와 데이터에 업무 맥락을 붙이는 '데이터 데스크'를 도입했습니다. 생산성 수치는 기사에 없어 <b>성과는 확인하지 못했습니다</b>(숫자는 기업 발표 기준).</p>", "foryou": "<b>전사 관점:</b> '에이전트에 사번을 주고 평가한다'는 발상은 우리 조직의 에이전트 거버넌스(소유자·권한·평가 주기) 설계에 바로 참고됩니다. 비용 지원 프로그램을 따로 둔 점도 파일럿이 예산 부담으로 멈추지 않게 하는 장치로 볼 만합니다."}, {"tag": "해외 사례", "source": "UC Today (monday.com 투자자 세션 발표 정리, 벤더 보고)", "url": "https://uctoday.com/work-management-news-octobers-ai-giants-have-to-show-their-work", "published": "2026-10-28", "title": "Clearwater — monday 에이전트 20개로 진행 중 프로젝트 508건 운영, 2개월간 3,000건 이상 작업, 연 1만 시간 이상 절감 추정", "summary": "monday.com이 10월 28일 투자자 세션에서 소개한 고객 사례입니다. <b>연 1만 시간 이상은 추정치</b>이고 수치 모두 벤더 보고입니다.", "detail": "<p>해당 세션에서 에이전트는 <b>관리자가 만들고 관리</b>하며, 담당자는 에이전트에 최소 권한을 주라고 강조했습니다. 어떤 업무를 에이전트에 맡겼는지, 비용은 얼마인지는 기사에 없어 <b>확인하지 못했습니다</b>.</p>", "foryou": "<b>TPM 관점:</b> '에이전트 20개가 프로젝트 508건을 돕는다'는 규모는 PMO 업무(현황 취합·리스크 알림)에 에이전트를 붙인 사례로 읽힙니다. 우리 PMO에서 반복되는 취합 업무를 먼저 3개만 꼽아 보세요."}, {"tag": "해외 사례", "source": "AI Weekly 일일 요약 (CNBC 보도 인용, 2차 정리)", "url": "https://aiweekly.co/ai-news-today", "published": "2026-11-01", "title": "Santander — 9개월간 AI로 약 2.16억 달러의 사업 가치를 냈다고 발표(CNBC 인용)", "summary": "일일 요약에 따르면 CNBC 보도에서 Santander는 9개월간 AI 관련 사업 가치를 약 <b>2.16억 달러</b>로 제시했습니다. 앞서 전 직원 18.5만 명에 AI 도구를 열었다는 발표가 있었습니다(6월 보도).", "detail": "<p>'사업 가치'가 어떤 기준(비용 절감·매출 기여 등)으로 계산됐는지는 <b>확인하지 못했습니다</b>. CNBC 원문을 보지 못했고 요약 글 한 줄 기반이라 보고서에 인용할 때는 원문 확인이 필요합니다.</p>", "foryou": "<b>전사 관점:</b> 성과를 '사업 가치'로 환산하는 지표 설계가 경영진 설득의 핵심이라는 점은 분명합니다. 우리도 AI 성과를 시간·비용·매출 중 무엇으로 보고할지 기준 한 장을 먼저 만들어 두면 좋습니다."}]}, {"id": "tools", "label": "써볼 만한 툴 & 에이전트", "icon": "🧰", "tint": "green", "desc": "요즘 새로 나왔거나 화제인 툴·에이전트 중 업무나 일상에서 바로 써보거나 아이디어를 얻을 만한 것.", "criteria": "이 탭은 <b>'직접 써보고 아이디어를 얻는 용도'</b>입니다. 대부분 개인 개발자가 올린 초기 제품이라 <b>성능·안전 주장은 제작사 발표 기준</b>이며, 사내 계정이나 업무 데이터를 연결하기 전에는 정보보안팀(#support-정보보안)에 먼저 문의하세요. 개인 계정·샘플 데이터로 먼저 체험해 보는 것을 권합니다. 이번 호의 국내 도구는 <b>korea-data-mcp, Shellside, LeftPen, 픽셀 오피스</b> 4건입니다.", "highlight": {"kicker": "이 주의 써볼 툴", "title": "korea-data-mcp — DART 공시·국가법령·한국은행 통계·부동산 실거래가를 AI 에이전트에 연결하는 국내 개발자 공개 MCP 서버", "summary": "GeekNews(10월 30일)에 올라온 <b>국내 개발자 공개 도구</b>입니다. Claude Desktop이나 Cursor 같은 에이전트가 한국 기업·법령·경제 지표를 조회할 때 틀리기 쉬운 값을 서버가 대신 처리합니다. 도구는 20개이고 <b>로컬에서만 실행</b>되며 제3자 서버나 텔레메트리는 없다고 합니다.", "detail": "<p>지원 범위는 OpenDART(기업 정보·공시·재무제표·배당·최대주주), 주가, 사업자 상태 조회, 공휴일, 공공데이터포털 아파트 실거래가, 국가법령정보(법령·판례), 한국은행 ECOS 지표 20종(기준금리·환율·CPI 등)입니다. 설치는 Claude Desktop에서 <code>.mcpb</code> 파일을 열거나 단일 Go 바이너리·<code>go install</code>이며, <b>직접 발급한 API 키</b>가 필요합니다(OpenDART 키 하나로 시작 가능). 키 없이 쓰는 호스팅 버전은 준비 중입니다.</p><p>작성자는 'DART 반기보고서 매출이 누적이 아닌 분기 값으로 올 수 있는' 같은 공공 API의 함정을 서버가 처리한다고 설명합니다. 자체 비교에서 원본 API 9/10, 이 서버 10/10이라고 밝혔지만 <b>작성자 자체 평가</b>이고, 댓글에는 일부 모델이 같은 질문에 정확히 답했다는 의견도 있었습니다. 라이선스는 게시글에 <b>명시되지 않아 미확인</b>이고, 가격은 별도 안내 없이 무료 API 키 방식입니다.</p>", "source": "GeekNews Show GN · GitHub (작성자 공개, 독립 검증 없음)", "url": "https://github.com/YoungsoonLee/korea-data-mcp", "published": "2026-10-30", "foryou": "<b>써보는 방법:</b> OpenDART 키 하나로 ① 관심 기업 두 곳의 최근 분기 매출·영업이익 비교표 만들기, ② 특정 법령 조문 확인을 시켜 보세요. 업무에서는 경쟁사·파트너사 공시 조사나 법령 확인 초안에, 일상에서는 부동산 실거래가 조회에 쓸 아이디어를 얻을 수 있습니다. <b>전사 관점:</b> 로컬 MCP 서버를 개인이 설치하는 구조라 어떤 MCP를 허용할지 기준이 필요합니다. 공시 숫자는 원문과 대조 후 쓰고, 사내 정식 사용 전에 정보보안팀(#support-정보보안) 확인을 권합니다."}, "articles": [{"tag": "국내·실험", "source": "GeekNews Show GN · GitHub (작성자 공개, PoC)", "url": "https://news.hada.io/topic?id=36285", "published": "2026-10-30", "title": "Shellside — 보드마다 Claude Code 세션이 붙어 '요청하면 나만의 도구'를 만들어 주는 생성형 캔버스(MIT)", "summary": "각 보드에 Claude Code가 돌아가는 터미널이 있고, 요청하면 React 컴포넌트를 만들어 <b>샌드박스 iframe에서 실행</b>합니다. 표를 고치면 연결된 차트가 같이 바뀌고, 위험한 단계는 승인 카드를 거칩니다.", "detail": "<p>로컬 전용(macOS·Linux)이며 Node 22+와 Claude Code 로그인이 필요합니다. 작성자가 <b>개념 증명(PoC)</b>이라고 밝혔고 보드당 세션은 하나입니다. 에이전트가 텍스트 스냅샷으로 앱을 확인해 색상·배치는 검증하지 못합니다. 가격은 게시글에 없어 <b>미확인</b>입니다.</p>", "foryou": "<b>써보는 방법:</b> 개인 계정에서 '샘플 CSV를 표로 올리고 요약 차트 만들어 줘'처럼 <b>작은 업무 도구 하나</b>를 말로 만들어 보세요. 로드맵 현황판·회의 액션 정리표를 즉석에서 만드는 아이디어를 얻을 수 있습니다. 보드 브라우저가 실제 Chrome 탭을 조작하므로 업무 계정이 로그인된 브라우저에서는 쓰지 마세요."}, {"tag": "국내·일상", "source": "GeekNews Show GN (작성자 설명)", "url": "https://news.hada.io/topic?id=36365", "published": "2026-11-01", "title": "LeftPen — 메일·공지문을 뜻과 말투를 살려 다듬는 AI 편집기(한 번에 800자, 무료 이용량 제한)", "summary": "'자연스럽게·간결하게·업무용' 중 고르고 말투(원문 유지, ~입니다/~다/~해요체)와 목표 글자 수를 지정합니다. Muckle 계정으로 로그인해 쓰는 방식입니다.", "detail": "<p>중요한 점은 <b>입력한 글이 교정을 위해 OpenAI API로 전송</b>된다는 것입니다. 작성자는 LeftPen 서버에는 원문과 결과를 저장하지 않는다고 밝혔고, 말투가 어색하거나 뜻이 바뀐 부분을 알려 달라고 요청했습니다. 지원 플랫폼은 <b>미확인</b>입니다.</p>", "foryou": "<b>써보는 방법:</b> 일상 메일이나 공개 가능한 공지 초안으로만 '업무용+~입니다체' 변환을 시험해 보세요. <b>사내 문서나 개인정보가 든 글은 넣지 마세요.</b> 외부 서비스·OpenAI 전송 구조라 사내 업무 사용은 정보보안팀(#support-정보보안) 확인이 필요합니다."}, {"tag": "에이전트 보안", "source": "GitHub README (Vercel Labs, 제작사 설명)", "url": "https://github.com/vercel-labs/agent-desktop", "published": "2026-11-01", "title": "Vercel agent-desktop — 접근성 API로 AI 에이전트가 데스크톱 앱을 읽고 조작하는 오픈소스 CLI(Apache-2.0)", "summary": "앱 화면을 JSON 스냅샷(요소별 참조값)으로 읽고, 참조값으로 클릭·입력한 뒤 다시 스냅샷으로 확인하는 방식입니다. macOS·Windows·Linux를 지원합니다.", "detail": "<p>macOS는 접근성 권한이 필요하고, 스냅샷·클립보드·스크린샷에 <b>개인 데스크톱 내용이 담길 수 있어</b> 공개 로그에 올리지 말라고 README가 안내합니다. 일부 기사는 '52단계 작업 토큰이 198K에서 31K로 줄었다'고 소개했지만 <b>README에서는 이 수치를 확인하지 못했습니다(미확인)</b>.</p>", "foryou": "<b>써보는 방법:</b> 샘플 앱(메모·계산기)으로 '열어서 값 입력 후 결과 읽기'를 시켜 에이전트가 화면을 어떻게 보는지 감을 잡아 보세요. <b>전사 관점:</b> 이런 도구는 PC의 모든 앱 화면에 접근하는 권한을 요구하므로, 업무 PC 사용 기준(허용 앱·로그 보관)을 정보보안팀(#support-정보보안)과 먼저 정하세요."}, {"tag": "국내·묶음", "source": "GeekNews Show GN 목록 (제목·한 줄 소개만 확인)", "url": "https://news.hada.io/topic?id=36418", "published": "2026-11-02", "title": "Show GN 신작 2종 — 픽셀 오피스(구독형 AI CLI에 역할을 나눠 맡기고 픽셀 사무실 화면에서 확인), memsearch-ko(한국어로 묻는 Claude Code 기억 검색 플러그인)", "summary": "픽셀 오피스는 <b>여러 AI에 역할을 나눠 맡기고 진행 상황을 픽셀 사무실 화면에서 보는</b> 오케스트레이션 앱입니다. memsearch-ko는 프로젝트 메모가 많아졌을 때 한국어 질문으로 관련 메모를 찾아 줍니다.", "detail": "<p>두 도구 모두 상세 페이지를 열어 확인하지 못했고(접속 오류 포함) <b>설치 조건·가격·라이선스·보안 처리는 확인하지 못했습니다</b>. 목록 소개 문구만 근거로 한 카드이며, 관심이 있다면 GeekNews 원문과 저장소를 직접 확인하세요.</p>", "foryou": "<b>써보는 방법:</b> 픽셀 오피스처럼 '에이전트별 진행 상황을 한 화면에서 본다'는 UI 아이디어는 우리 에이전트 파일럿의 현황 보드 설계에 참고할 만합니다. 도구 자체는 상세 확인 전까지 개인 환경에서만 시험하고, 사내 계정·구독 연결 전에는 정보보안팀(#support-정보보안) 확인을 권합니다."}]}]};

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.10.06~10.12</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 10월 26일~11월 2일 공개 뉴스 기반(일부 직전 보도 포함). 일부 수치는 2차 정리 글·벤더 발표 기준이므로 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
</html>
