<script>
const NL={meta:{icon:"🗞️",edition:"Vol.26",cadence:"주간",date:"2026년 7월 6일 (월)",curator:"Claude (Cowork)",title:["주간 AI 뉴스레터 — ","TPM Edition"],lead:"TPM 관점에서 꼭 알아야 할 한 주의 AI 소식. Claude Sonnet 5 출시부터 코딩 에이전트 보안 경보, 업무 도구의 에이전트 통합, 그리고 빅테크의 지분·칩 전략까지.",greeting:"안녕하세요! 이번 주는 Claude Sonnet 5가 무료·프로 기본 모델로 전환된 큰 소식부터, LiteLLM 원격코드실행 취약점처럼 실무 대응이 필요한 보안 이슈, Notion에 Claude·Cursor가 외부 에이전트로 들어온 업무 자동화 소식, OpenAI의 정부 지분 제안까지 폭넓게 챙겨봤어요. <b>탭마다 'TPM 관점'</b>으로 실무에 어떻게 연결되는지 담았습니다."},topics:[{id:"top",label:"이 주의 핵심",icon:"⚡",tint:"red",desc:"이번 주 AI 업계에서 가장 파급력 있는 한 가지.",criteria:"<b>프로그램 의사결정과 팀 운영에 직접 영향을 주는</b> 소식을 최우선으로 선정했습니다.",highlight:{kicker:"이 주의 빅스토리",title:"Claude Sonnet 5 출시 — Opus급 성능을 소넷 가격에, 무료·프로 기본 모델로 전환",summary:"앤트로픽이 6월 30일 Claude Sonnet 5를 출시하고, 7월 1일부터 전 세계 무료·프로 사용자의 기본 모델로 전환했습니다. 플래그십 Opus 4.8에 근접한 성능을 8월 31일까지 도입가($2/$10, 백만 토큰당)로 제공합니다.",detail:"<p><b>TPM 관점에서 왜 중요한가</b>: 팀이 쓰는 Claude 기반 도구(Claude Code, Claude Cowork 등)의 기본 모델이 바뀌면서 응답 속도·비용·동작 방식이 함께 바뀝니다. 특히 <b>추론(thinking) 항상 켜짐, temperature 등 샘플링 파라미터 제거, 새 토크나이저로 토큰량 최대 1.35배 증가</b>라는 3가지 호환성 변경사항이 있어 기존 연동 코드와 예산 정책 점검이 필요합니다.</p><p>Cursor 공동창업자 Sualeh Asif는 '에이전트가 계획을 벗어나지 않고 효율적인 비용으로 멀티스텝 변경을 완료한다'고 평가했고, Zapier 엔지니어는 절반에서 멈추던 자동화가 끝까지 완료됐다고 전했습니다.</p>",source:"TechCrunch",url:"https://techcrunch.com/2026/06/30/anthropic-launches-claude-sonnet-5-as-a-cheaper-way-to-run-agents/",published:"2026-06-30",foryou:"팀에서 Claude API나 Claude Code를 쓴다면, temperature 파라미터 제거와 토큰 집계 방식 변경이 예산·성능 지표에 영향을 줄 수 있습니다. 8월 말 도입가 종료 전에 마이그레이션 체크리스트를 만들어 전환 검토를 끝내세요."},articles:[{tag:"수출규제 해제",source:"Build Fast with AI",url:"https://www.buildfastwithai.com/blogs/ai-news-today-july-1-2026",published:"2026-07-01",title:"Fable 5, 19일 만에 전 세계 재개 — 수출규제 전면 해제",summary:"6월 12일부터 미 상무부 수출규제로 차단됐던 Fable 5·Mythos 5가 7월 1일부터 Claude.ai, API, Claude Code, Cowork 전반에서 전 세계 재개됐습니다. 국방부와의 자율무기·감시 사용 범위를 둘러싼 갈등이 배경이었습니다.",detail:"<p>법원에 공개된 이메일에 따르면, 국방부 차관 Emil Michael은 '공격용과 방어용 무기의 구분은 없다'며 가드레일 완화를 요구했고, CEO Dario Amodei는 완전자율무기와 국내 대규모 감시 두 가지를 명확한 레드라인으로 못박고 거부했습니다.</p><p>재개 조건으로 앤트로픽은 HackerOne 버그바운티와 AWS·마이크로소프트·구글이 공동 개발한 '탈옥 심각도 프레임워크' 초안을 공개했습니다.</p>",foryou:"특정 AI 벤더에 의존하는 핵심 워크플로가 있다면, 이번 사태처럼 정부 규제로 서비스가 일시 중단될 수 있는 리스크를 리스크 레지스터에 등록해두는 것을 권합니다."},{tag:"주정부 도입",source:"TechRadar",url:"https://www.techradar.com/pro/newsom-strikes-anthropic-deal-to-get-california-government-half-price-claude-ai-access",published:"2026-06-29",title:"캘리포니아, 사상 최대 주정부 AI 도입 — 전 기관 Claude 50% 할인",summary:"캘리포니아 주지사 개빈 뉴섬이 6월 29일 모든 주정부 기관과 참여 지자체가 Claude를 50% 할인가로 쓸 수 있는 계약을 발표했습니다. 무료 인력 교육과 앤트로픽 전담 기술지원이 포함됩니다.",detail:"<p>이미 주 근로자 2,800명이 참여한 AI 비서 'Poppy', DMV 고객 응대, 메디케이드 케이스워커 지원, 주 코드 보안 스캐닝 등에 Claude가 쓰이고 있으며, 이번 계약으로 30만 명 규모의 주정부 전체로 확대됩니다.</p>",foryou:"대규모 조직 단위 AI 도입 사례로, 예산 협상·교육 지원·거버넌스 포함 여부를 어떻게 계약에 반영했는지 참고할 만합니다. 사내 AI 도입 제안서에 벤치마크 사례로 인용해보세요."}]},{id:"devtools",label:"개발 AI 동향",icon:"🛠️",tint:"purple",desc:"함께 일하는 엔지니어팀이 쓰는 AI 도구 변화 — 알아야 대화가 됩니다.",criteria:"엔지니어 팀의 <b>실제 워크플로에 영향을 주는</b> AI 코딩 도구, 보안 이슈, 모델 변화를 중심으로 골랐습니다.",highlight:{kicker:"이 주의 개발 경보",title:"LiteLLM RCE 취약점(CVE-2026-42271), CISA 긴급 등재 — API 키 전체 노출 위험",summary:"다수 기업이 AI 게이트웨이로 쓰는 오픈소스 LiteLLM의 MCP 엔드포인트에서 인증 없이 원격코드실행이 가능한 취약점이 CISA 긴급대응 목록(KEV)에 등재됐습니다. 악용 시 게이트웨이에 설정된 OpenAI·Anthropic 등 모든 API 키가 탈취됩니다.",detail:"<p>패치는 6월 20일 배포됐지만, 아직 업데이트하지 않은 조직은 즉시 최신 버전으로 패치하고 <b>LiteLLM에 등록된 모든 API 키를 로테이션</b>해야 합니다. 패치 이전 접근 로그도 감사 대상입니다.</p><p>연방기관은 의무 패치 기한이 적용되는 만큼, 기업도 동일한 긴급도로 대응해야 한다는 것이 CISA의 권고입니다.</p>",source:"Build Fast with AI",url:"https://www.buildfastwithai.com/blogs/ai-news-today-july-1-2026",published:"2026-07-01",foryou:"팀이 LiteLLM이나 유사한 멀티 프로바이더 AI 게이트웨이를 운영 중이라면, 오늘 중으로 패치 여부와 API 키 로테이션 필요성을 엔지니어링 리드에게 확인하세요."},articles:[{tag:"AI 보안 리서치",source:"Build Fast with AI",url:"https://www.buildfastwithai.com/blogs/ai-news-today-july-1-2026",published:"2026-07-01",title:"Squidbleed — Claude Mythos가 찾아낸 29년 묵은 Squid 프록시 취약점",summary:"앤트로픽의 방어적 보안 리서치 프로그램 'Project Glasswing'을 통해 Claude Mythos 5가 29년간 인간 감사팀이 놓친 Squid 프록시 서버의 자격증명 노출 취약점(CVE-2026-47729)을 발견했습니다. 이 프로그램은 첫 달 만에 오픈소스 프로젝트 1,000개에서 취약점 23,019건을 찾아냈고 확인율은 90.6%입니다.",detail:"<p>수출규제로 논란이 됐던 것과 같은 계열 모델이 오히려 인간이 놓친 취약점을 찾아냈다는 점에서 AI 보안 리서치의 실질적 가치를 보여주는 사례로 꼽힙니다.</p>",foryou:"사내 보안팀에 AI 기반 코드 감사 도구 파일럿을 제안해볼 시점입니다. 오탐률이 낮다면(약 9%) 실무 적용 가치가 충분합니다."},{tag:"인수·경쟁구도",source:"Build Fast with AI",url:"https://www.buildfastwithai.com/blogs/ai-news-today-july-4-2026",published:"2026-07-04",title:"SpaceX, Cursor 모회사 Anysphere 인수 — Grok 4.5는 Cursor 데이터로 학습",summary:"SpaceX가 6월 Cursor 개발사 Anysphere를 약 600억 달러에 인수한 데 이어, xAI의 신모델 Grok 4.5가 Cursor IDE 세션 데이터로 보강 학습됐습니다. 1.5조 파라미터 규모로 SpaceX·Tesla에서 비공개 베타 중입니다.",detail:"<p>아직 공식 벤치마크는 없고 일론 머스크의 사내 평가 코멘트('Opus에 근접하거나 능가')만 존재합니다. 코딩 도구 시장의 소유 구조가 빅테크 인수를 통해 빠르게 재편되고 있다는 점이 핵심입니다.</p>",foryou:"팀이 Cursor를 쓰고 있다면, 소유권 변화가 향후 로드맵·가격·데이터 정책에 미칠 영향을 주시하고 대체 도구(Claude Code, Copilot 등) 옵션을 함께 파악해두세요."}]},{id:"tpm",label:"TPM 업무 자동화",icon:"📋",tint:"blue",desc:"로드맵·스프린트·문서화·커뮤니케이션에 바로 쓸 수 있는 AI 기능.",criteria:"<b>TPM 실무에 직접 적용 가능한</b> AI 도구 업데이트를 중심으로 골랐습니다.",highlight:{kicker:"TPM 필수 업데이트",title:"Notion 3.6 — Claude·Cursor가 '외부 에이전트'로 팀 보드에 합류",summary:"Notion이 7월 1일 3.6 업데이트를 공개했습니다. Claude와 Cursor를 팀원처럼 @멘션해 보드에서 작업을 맡길 수 있고, 회의록에 화자 구분이 추가됐으며, Outlook 메일·캘린더 연동으로 에이전트가 일정 조율까지 대신합니다.",detail:"<p><b>TPM에게 유용한 시나리오</b>:</p><p>① 스프린트 보드에서 Claude·Cursor에게 직접 이슈를 배정하고 진행상황을 팀 전체가 같은 화면에서 확인</p><p>② 화자 구분 회의록으로 누가 무엇을 결정했는지 자동 기록</p><p>③ 페이지를 PPT·Excel로 즉시 변환해 리더십 보고 자료 제작</p><p>④ Outlook 연동으로 인박스 트리아지, 회신 초안, 일정 조율 자동화</p><p>Mercury·Mixpanel·Miro·Box·ClickHouse 등 5개 커넥터가 추가돼 재무·분석 데이터를 에이전트가 직접 참조할 수 있습니다.</p>",source:"Notion",url:"https://www.notion.com/releases/2026-07-01",published:"2026-07-01",foryou:"여러 팀 보드를 오가며 상태를 취합하고 있다면, Claude·Cursor를 외부 에이전트로 등록해 이슈 배정부터 보고서 초안까지 한 화면에서 처리해보세요."},articles:[{tag:"요금제 개편",source:"Cursor",url:"https://cursor.com/blog/teams-pricing-june-2026",published:"2026-07-01",title:"Cursor Teams 요금제 개편 — 사용량 풀 분리 + Premium 시트($120) 신설",summary:"Cursor가 Teams 플랜의 사용량을 Composer/Auto와 서드파티 API(Claude·GPT·Gemini 등) 두 개 풀로 분리하고, 헤비 유저를 위한 Premium 시트(월 120달러)를 신설했습니다. 신규 고객은 즉시, 기존 고객은 7월 1일 갱신 주기부터 적용됩니다.",detail:"<p>Premium 시트는 Standard 대비 3배 비용에 5배 사용량을 제공합니다. 팀 내에서 시트 타입을 섞어 쓸 수 있어, 헤비 유저와 라이트 유저를 구분해 배정하면 비용 효율을 높일 수 있습니다.</p>",foryou:"다음 분기 AI 도구 예산을 편성할 때, 팀원별 사용 패턴을 확인해 Standard·Premium 시트를 구분 배정하면 불필요한 초과 비용을 줄일 수 있습니다."},{tag:"비용 거버넌스",source:"Build Fast with AI",url:"https://www.buildfastwithai.com/blogs/ai-news-today-july-4-2026",published:"2026-07-03",title:"Claude Enterprise, 관리자 분석·지출 알림 기능 출시",summary:"앤트로픽이 7월 3일 Claude Enterprise에 조직·팀·부서 단위 지출 한도, 모델별 사용 권한, 사용량 분석 대시보드, 실시간 지출 알림을 추가했습니다. 4개월 만에 연간 AI 예산을 소진한 사례 등 '토큰맥싱' 문제에 대한 직접적 대응입니다.",detail:"<p>Analytics API로 사내 BI 시스템에 사용량을 연동할 수 있고, effort controls로 에이전트 워크플로의 기본 추론 깊이를 설정할 수 있습니다. 임계치 도달 시 실시간 알림도 지원합니다.</p>",foryou:"다음 분기 예산안에 부서별 지출 캡과 알림 임계치를 미리 설정해두면 예산 초과로 인한 급작스러운 도구 중단을 막을 수 있습니다."}]},{id:"strategy",label:"빅테크 & 전략 동향",icon:"🌐",tint:"orange",desc:"리더십 보고와 프로그램 의사결정에 필요한 산업 맥락.",criteria:"<b>조직의 AI 전략과 프로그램 방향성에 영향을 주는</b> 빅픽처 동향을 담았습니다.",highlight:{kicker:"전략 이슈",title:"OpenAI, 美 정부에 지분 5%(약 426억 달러) 제안 — 규제와 지분의 유착 논란",summary:"9월 IPO를 앞둔 OpenAI가 미국 정부에 지분 5%를 제안했습니다. 앤트로픽·구글 등 다른 랩도 동일 비율을 내놓는 국부펀드형 구조가 거론됩니다. 동시에 백악관은 프론티어 모델 출시 전 최대 30일 정부 검토를 골자로 한 자율 표준 프레임워크를 각사와 조율 중입니다.",detail:"<p>비평가들은 규제기관이 피규제사 지분을 보유하면 공정한 집행이 어려워진다고 지적합니다. 앤트로픽은 백악관과 지분 관련 논의는 없었다고 선을 그었지만, 6월 2일 발효된 행정명령 14409에 따른 '커버드 프론티어 모델' 사전 검토 체계에는 이미 참여 중입니다.</p>",source:"CNBC",url:"https://www.cnbc.com/2026/07/02/openai-proposes-us-government-own-5percent-stake-to-address-political-blowback.html",published:"2026-07-02",foryou:"조직이 특정 AI 랩 하나에 크게 의존한다면, 이런 지분·규제 구조 변화가 향후 모델 출시 일정과 가격 정책에 영향을 줄 수 있다는 점을 리더십 보고 참고자료로 정리해두세요."},articles:[{tag:"반도체 전략",source:"TechCrunch",url:"https://techcrunch.com/2026/07/02/anthropic-is-discussing-a-new-custom-chip-with-samsung/",published:"2026-07-02",title:"앤트로픽, 삼성전자와 커스텀 AI 칩 개발 논의 — 엔비디아 의존 축소",summary:"앤트로픽이 삼성전자와 2나노 공정 기반 커스텀 AI 칩 생산 협력을 논의 중입니다. 아직 초기 단계로 칩의 용도·성능·서버 구성이 확정되지 않았지만, OpenAI·구글·아마존·메타에 이어 앤트로픽도 자체 칩 개발 대열에 합류하는 신호입니다.",detail:"<p>삼성전자·SK하이닉스·마이크론은 지난 5월 앤트로픽의 650억 달러 규모 펀딩 라운드에도 참여한 바 있어, 기존 사업 관계가 협력 논의를 뒷받침하고 있습니다.</p>",foryou:"AI 인프라를 특정 GPU 벤더에 의존하는 계획이 있다면, 프론티어 랩들의 자체 칩 개발 흐름이 중장기 가격·공급 안정성에 미칠 영향을 로드맵 리스크 항목에 반영해보세요."},{tag:"국제 거버넌스",source:"AI Weekly",url:"https://aiweekly.co/ai-news-today/anthropic-news",published:"2026-07-02",title:"UN·ITU 'AI for Good Global Commission' 출범 — Benioff·Kagame 공동의장",summary:"UN과 국제전기통신연합(ITU)이 7월 2일 'AI for Good Global Commission'을 출범했습니다. 세일즈포스 CEO 마크 베니오프와 르완다 대통령 폴 카가메가 공동의장을 맡고, 엔비디아·아마존·마이크로소프트·앤트로픽 등 주요 기업 리더가 창립 멤버로 참여합니다.",detail:"<p>AI로 인한 경제적 이익이 개발도상국에도 돌아가도록 하는 글로벌 표준 마련이 목표이며, 9월 UN 미래정상회의의 주요 의제와 연결됩니다. 미국 중심의 자율 표준 프레임워크와 별개로 다자간 거버넌스 트랙이 병행되는 셈입니다.</p>",foryou:"글로벌 조직이라면 국가별·다자간 AI 거버넌스 트랙이 각기 다른 속도로 진행되고 있다는 점을 인지하고, 리전별 컴플라이언스 로드맵에 두 트랙을 모두 반영해두세요."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.06.29~07.06</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 6월 29일~7월 6일 공개 뉴스 기반. 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
</html>
