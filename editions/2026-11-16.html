<script>
const NL={"meta": {"icon": "🗞️", "edition": "Vol.45", "cadence": "주간", "date": "2026년 11월 16일 (월)", "curator": "Claude (Cowork)", "title": ["주간 AI 뉴스레터 — ", "TPM Edition"], "lead": "CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식과, 직접 써볼 만한 신규 툴·에이전트. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.", "greeting": "안녕하세요! 이번 주 한 줄 요약은 <b>\"에이전트 사고는 모델이 아니라 승인 버튼 하나, 설정 파일 하나에서 난다 — 이제 점검 목록을 '권한·비밀정보·외부 약관' 단위로 짜야 할 때\"</b>입니다.<br><br>보안 업체 Apiiro는 Claude Code에서 <b>'다시 묻지 않기'로 승인한 명령이 비밀번호·키째로 <code>.claude/settings.local.json</code>에 저장</b>되고, 이 파일이 공개 GitHub에 올라간 사례가 1,122개 파일(실제 비밀정보 기준)이라고 밝혔습니다. 같은 주 Claude Code는 권한 우회 버그 여러 건을 고쳤고, 11월 9일 새 상위 모델 <b>Claude Fable 5.2</b>가 Claude Code 기본 모델로 들어왔습니다. 11월 10일에는 회의에 직접 들어가는 <b>Claude Meetings</b>(베타)가 나왔습니다.<br><br>국내에서는 11월 6일 과기정통부·KISA가 에이전트 환경용 <b>'자율형 인공지능 철통 인증 안내서'</b>(제로트러스트)를 냈고, 11월 12일 네이버는 3분기 실적 발표에서 <b>개인형 AI 에이전트 앱을 연내 출시</b>하겠다고 밝혔습니다. 결제·예약 확정은 이용자가 직접 하는 구조이고, 카카오 카나나 스페이스는 12월 비공개 베타입니다. 해외에서는 United Airlines가 11월 11일 <b>외부 AI 에이전트의 예약·결제를 약관으로 금지</b>했습니다. 우리 서비스에 외부 에이전트가 들어올 때의 정책도 생각해 볼 시점입니다.<br><br>사례 탭에는 JB금융(임직원 284명 참여 사내 AI 경진대회)과 NH농협은행(한 달 만에 에이전트 10종 시제품)을, 6번째 탭에는 GitHub Next의 팀 코딩 환경 <b>Ace</b>와 국내 개발자 공개 도구 2건(agent-otel-kit, agent-monitor)을 담았습니다. 일부 내용은 2차 정리 글·벤더 발표 기준이라 각 카드에 표시했습니다."}, "topics": [{"id": "core", "label": "이 주의 핵심", "icon": "⚡", "tint": "red", "desc": "전사 AI 의사결정에 바로 영향을 주는 이번 주 가장 큰 소식과 후속 소식.", "criteria": "국내외를 가리지 않고 <b>'이번 주 안에 우리가 확인하거나 결정할 것'</b>이 분명한 소식을 골랐습니다. 규제·가이드는 조항보다 <b>우리 조직에 적용되는지</b>를 기준으로 1건만 담았습니다.", "highlight": {"kicker": "이 주의 핵심", "title": "Claude Code '다시 묻지 않기'가 비밀번호·키를 설정 파일에 저장 — 공개 GitHub에서 실제 비밀정보가 든 파일 1,122개 발견(Apiiro)", "summary": "권한 창에서 <b>'Yes, and don't ask again'</b>을 고르면 그 명령이 허용 규칙으로 <code>.claude/settings.local.json</code>에 저장되는데, 명령에 직접 넣은 <b>DB 비밀번호·클라우드 키·SSH 정보까지 함께 남습니다</b>. 이 파일이 커밋돼 공개 저장소로 나간 사례를 Apiiro가 집계했습니다.", "detail": "<p>Apiiro 조사(RuntimeWire 11월 7일 보도, 국내 정리 글 포함)에 따르면 공개 GitHub에 있는 해당 파일 104,185개 중 <b>1,122개에 실제 비밀정보</b>가 있었습니다. 커밋 기록·공유 설정 파일·에이전트 대화 기록까지 넓히면 <b>1,994개 저장소, 2,539건</b>입니다. Apiiro는 자격증명을 실제로 써 보지는 않았다고 밝혀 유효성은 확인되지 않았습니다.</p><p>Claude Code는 이 파일을 처음 쓸 때 전역 git 제외 규칙을 추가하지만, <b>이미 추적 중인 파일이나 다른 기기의 복제본에는 적용되지 않는다</b>는 점이 지적됐습니다. Anthropic 측은 비밀정보를 걸러 내는 기능을 검토 중이라고 Hacker News에서 답했다고 Apiiro가 전했으며, 일정은 공개되지 않았습니다. 권장 조치는 ① 조직 저장소에서 두 설정 파일 검색 ② 기록·포크까지 확인 ③ 파일에 있던 자격증명 먼저 교체 ④ <code>git rm --cached</code> 후 <code>.gitignore</code> 추가 ⑤ 명령에는 환경 변수(<code>$VAR</code>)만 쓰고, 승인은 <code>Bash(npm run:*)</code> 같은 패턴으로 ⑥ pre-commit 비밀 검사·푸시 보호 켜기입니다.</p>", "source": "RuntimeWire (Apiiro 조사 보도) · braindetox 국내 정리 글 (2차 정리, 원 보고서 직접 확인 못 함)", "url": "https://runtimewire.com/article/claude-code-dont-ask-again-secrets-public-github-settings-files", "published": "2026-11-07", "foryou": "<b>이번 주 할 일:</b> 사내 GitHub·GitLab 전체에서 <code>settings.local.json</code> 커밋 여부를 일괄 검색하고, 나오면 키 교체를 먼저 하도록 정보보안팀(#support-정보보안)과 공동 공지하세요. 신규 저장소 템플릿 <code>.gitignore</code>에 <code>.claude/settings.local.json</code>을 기본 포함시키고, 서버 관리 설정(managed settings)으로 '명령에 비밀 직접 입력 금지' 가이드를 같이 배포하면 재발을 줄일 수 있습니다."}, "articles": [{"tag": "모델 출시", "source": "Anthropic 공식 발표 · SemiAnalysis(2차 인용)", "url": "https://www.anthropic.com/claude-fable-and-mythos-5-2", "published": "2026-11-09", "title": "Claude Fable 5.2 출시 — 100만 토큰당 입력 $8·출력 $40, Claude Code 기본 모델로. 일상 업무는 여전히 Opus 5.5 권장", "summary": "Anthropic 최상위 모델의 새 버전입니다. 같은 모델의 무제한판 <b>Mythos 5.2</b>는 사이버·생명과학 검증 기관에만 열립니다. Anthropic은 <b>대부분의 코딩·지식 업무에는 Opus 5.5</b>, 가장 어려운 작업에만 Fable을 쓰라고 안내합니다.", "detail": "<p>Anthropic 발표 기준 출력 속도는 Fable 5.1보다 최대 30% 빠르고, 빠른 모드(입력 $16·출력 $80)는 생성 속도를 최대 2.5배 높입니다. 코딩 평가 FrontierSWE v2에서 69.9%(Opus 5.5는 62.3%)를 기록했다고 밝혔습니다. AWS·Google Cloud·Azure에서 모두 쓸 수 있고, 데이터 보관 없음(ZDR) 대상 고객은 그대로 쓸 수 있으며 그 외에는 안전 모니터링용 30일 보관입니다. 같은 주 Claude Code가 Fable 5.2를 기본 모델로 바꿨습니다.</p><p>다만 SemiAnalysis는 한 시험에서 <b>토큰 단가는 낮아졌지만 작업 1건당 비용은 31% 늘었다</b>($67.16→$88.15)고 분석했습니다(AI News 뉴스레터 2차 인용). 더 길게 생각하고 더 많이 출력하기 때문입니다.</p>", "foryou": "Claude Code 기본 모델이 바뀌면 <b>팀 비용이 조용히 오를 수 있습니다</b>. 조직 기본 모델을 관리 설정으로 고정해 두었는지 확인하고, Fable은 '설계·대규모 리팩터링' 같은 용도로 한정하는 사용 기준을 정해 두세요. 지난주 소개한 비용 리포트 API로 전환 전후 1~2주를 비교하면 판단 근거가 됩니다."}, {"tag": "국내 정책·가이드", "source": "법률신문 (과기정통부·KISA 발표 보도)", "url": "https://www.lawtimes.co.kr/news/articleView.html?idxno=229325", "published": "2026-11-12", "title": "과기정통부·KISA '자율형 인공지능 철통 인증 안내서' 발간(11월 6일) — 에이전트의 도구 호출·위임·외부 통신마다 검증하라는 제로트러스트 기준", "summary": "에이전틱 AI를 도입하거나 검토하는 국내 기업을 위한 <b>자율 적용 안내서</b>입니다. 입력 처리, 도구 호출, 작업 위임, 외부 통신 등 <b>에이전트가 스스로 움직이는 지점마다 검증·정책 집행</b>을 하고, 위험도에 따라 사람 승인이나 사전 승인된 정책을 적용하라고 권합니다.", "detail": "<p>기존 '제로트러스트 가이드라인 2.0'의 4단계 성숙도 모델을 에이전트 환경에 맞게 넓혀, 기업이 스스로 보안 수준을 진단할 수 있게 했습니다. 기사 기준으로 의무 조항은 없고, 정부는 '민간 자율 확산 기반'이라고 설명했습니다. 에이전트 인증 방식의 구체적 기술 요건은 기사에서 확인하지 못했습니다.</p>", "foryou": "강제 규정은 아니지만 <b>사내 에이전트 보안 기준의 뼈대로 그대로 쓸 수 있는 국내 공식 문서</b>입니다. 원문을 받아 사내 에이전트 목록에 '도구 호출·위임·외부 통신' 3개 열을 만들고 각 칸에 승인 방식을 채워 보면, 위 settings.local.json 같은 사고 지점이 어디인지 바로 드러납니다."}, {"tag": "외부 에이전트 정책", "source": "Unite.AI (United Airlines 운송약관 개정 보도)", "url": "https://www.unite.ai/united-airlines-bars-unauthorized-ai-agents-from-booking-travel/", "published": "2026-11-11", "title": "United Airlines, 승인받지 않은 외부 AI 에이전트의 예약·변경·구매를 약관으로 금지 — 사람이 감독해도 해당, 마일리지 삭제·회원 자격 박탈까지", "summary": "브라우저·SNS·여행사 도구에 들어 있는 AI 비서까지 포함해 <b>자율·반자율 에이전트가 united.com과 앱에서 예약·결제하는 것</b>을 막았습니다. 승인된 연동만 허용하고, 사이트 데이터로 AI를 학습하는 것도 금지했습니다.", "detail": "<p>이유로는 로그인 정보 공유에 따른 계정 보안, 의도하지 않은 구매·변경, 마일리지 사용, 체크인 시 위험물 확인처럼 사람이 직접 해야 하는 규제 절차를 들었습니다. 11월 11일 이전 예약은 취소하지 않고, AI로 검색·계획만 하는 것과 장애인 보조 기술은 예외입니다.</p>", "foryou": "네이버·카카오가 '대신 예약·주문하는 에이전트'를 연내 내놓는 상황이라 <b>우리 서비스에도 외부 에이전트가 들어올 날이 가깝습니다</b>. 막을지, 공식 연동(API·파트너 채널)으로 받을지, 약관·주문 확인 절차를 어떻게 바꿀지 법무·서비스·보안이 함께 보는 안건으로 올려 둘 만합니다."}]}, {"id": "dev", "label": "개발 AI 동향", "icon": "🛠️", "tint": "purple", "desc": "엔지니어링 조직이 실제로 쓰는 AI 코딩 도구의 변화가 팀 워크플로·보안·비용에 주는 영향.", "criteria": "버전·체인지로그 나열 대신 <b>'팀이 이번 주에 바꿔야 할 설정·절차'</b>가 생긴 소식을 골랐습니다. 버전 번호는 업데이트 기준선이 필요할 때만 적었습니다.", "highlight": {"kicker": "개발 AI 동향", "title": "Claude Code, 권한 우회 버그 여러 건 수정 — cp·mv로 거부 규칙을 피해 가거나 MCP 로그인 토큰이 다른 호스트로 새는 문제. 최소 v2.1.325로 올려야", "summary": "이번 주 업데이트에는 <b>보안 관련 수정이 몰려</b> 있었습니다. 경로 기반 거부(deny) 규칙이 <code>cp</code>·<code>mv</code>로 디렉터리에 복사할 때 적용되지 않던 문제, 읽기 전용 셸 명령이 승인 없이 샌드박스 밖에서 돌던 문제, MCP 로그인 과정에서 서버가 리다이렉트하면 갱신 토큰이 다른 호스트로 갈 수 있던 문제 등입니다.", "detail": "<p>DEV Community 주간 정리(11월 14일)에 따르면 v2.1.321에 위 권한 수정이, v2.1.325에 압축 응답 처리 관련 보안 수정이 들어갔습니다. 같은 주에 <b>Fable 5.2가 기본 모델</b>이 됐고, 실험 기능으로 Claude가 도구 호출을 자바스크립트로 묶어 쓰는 'Code Mode'가 추가됐습니다. 플러그인은 지원 버전 범위를 선언해야 하며, <code>Bash(PORT=* npm run dev)</code>처럼 변수 값에 <code>*</code>가 들어간 허용 규칙에는 시작 시 경고가 뜹니다.</p><p>Gemini CLI는 rootless podman 환경 샌드박스 오류와 Windows 경로 대소문자 검사를 고쳤습니다.</p>", "source": "DEV Community 'This week in Claude Code, Codex and Gemini CLI' (2차 정리, 공식 릴리스 노트 기반)", "url": "https://dev.to/aicoding-guide/this-week-in-claude-code-codex-and-gemini-cli-week-of-november-15-2026-4pmm", "published": "2026-11-14", "foryou": "<b>최소 버전 정책</b>을 관리 설정이나 MDM으로 강제하고 있다면 기준선을 v2.1.325로 올리세요. 경로 deny 규칙으로 민감 디렉터리를 막아 왔다면 그 규칙이 이번 버그로 뚫려 있었을 수 있으니, 해당 기간 에이전트 실행 로그에서 <code>cp</code>·<code>mv</code> 사용 여부를 한 번 보는 게 좋습니다. 위 '핵심' 탭의 settings.local.json 점검과 묶어 한 번에 공지하면 효율적입니다."}, "articles": [{"tag": "CI 영향", "source": "DEV Community 주간 정리 (Codex 릴리스 기준)", "url": "https://dev.to/aicoding-guide/this-week-in-claude-code-codex-and-gemini-cli-week-of-november-15-2026-4pmm", "published": "2026-11-14", "title": "Codex, 신뢰하지 않은 디렉터리에서는 <code>codex exec</code>가 프로젝트 설정·MCP 서버를 불러오지 않도록 변경 — CI가 '조용히' 도구 없이 돌 수 있다", "summary": "<code>--sandbox workspace-write</code>를 줘도 신뢰 등록이 안 된 디렉터리에서는 프로젝트 설정과 MCP 서버가 꺼집니다. CI에서 Codex로 리뷰·수정 작업을 돌리고 있다면 <b>오류 없이 MCP만 빠진 채 실행</b>될 수 있습니다.", "detail": "<p><code>codex exec</code>나 <code>codex review</code>에 <code>--trust</code>를 붙여 신뢰를 명시적으로 저장하면 됩니다. 멀티 에이전트 설정 키도 <code>features.multi_agent</code>에서 <code>agents.enabled</code>로 바뀌었습니다.</p>", "foryou": "보안 측면에서는 바람직한 기본값이지만, <b>파이프라인 결과 품질이 소리 없이 떨어지는 유형</b>이라 놓치기 쉽습니다. Codex를 CI에 쓰는 팀에 '업데이트 후 MCP 로드 확인' 체크를 요청하고, 신뢰 등록을 누가 승인하는지도 정해 두세요."}, {"tag": "비용 설계", "source": "OpenRouter 블로그 (자체 측정, 단일 작업 기준)", "url": "https://openrouter.ai/blog/insights/mcp-vs-cli-vs-skills/", "published": "2026-11-11", "title": "같은 GitHub 조회 작업에 CLI는 1,421토큰, MCP(기본 도구 46개)는 59,417토큰 — '도구를 어떻게 붙이느냐'가 비용을 40배 가른다", "summary": "OpenRouter가 <code>gh</code> CLI, 스킬 파일, GitHub MCP 서버(도구 2·46·91개)로 같은 작업을 비교했습니다. Sonnet 5.5 기준 작업당 비용은 <b>CLI $0.0075, MCP 46개 도구 $0.1274</b>였습니다.", "detail": "<p>도구 정의만으로도 요청마다 수천~수만 토큰이 붙고, 결과 객체 하나(릴리스 정보)가 약 2만 토큰이었습니다. 도구를 필요할 때만 불러오는 Tool Search를 쓰면 Sonnet은 비용이 절반 가까이 줄었지만 Haiku는 오히려 늘었습니다. 권장은 'CLI가 있으면 CLI, 사내 도구는 CLI+스킬, MCP는 필요한 도구만 열고 결과를 잘라서'입니다. 한 서버·한 작업 측정이라 일반화에는 한계가 있다고 저자도 밝혔습니다.</p>", "foryou": "사내 MCP 서버를 늘리는 중이라면 <b>'도구 개수 상한·결과 크기 제한'을 플랫폼 기준으로 정할 근거</b>가 됩니다. 사내에서 가장 많이 쓰는 MCP 서버 하나로 같은 측정 스크립트를 돌려 보면 토큰 예산 논의가 훨씬 구체적이 됩니다."}, {"tag": "국내 · 리뷰 문화", "source": "GeekNews (개인 개발자 실측 기록)", "url": "https://news.hada.io/topic?id=37202", "published": "2026-11-15", "title": "\"AI 코딩 에이전트의 '테스트 모두 통과'를 믿기 전에 확인하는 9가지\" — 테스트 3,066개 통과인데 기기에서는 DB가 안 열렸다", "summary": "국내 개발자가 직접 겪은 수치만으로 정리한 점검 목록입니다. <b>E2E '100% 통과'의 근거였던 러너 7개에 검증 구문이 하나도 없었고</b>, 버그 수정을 되돌려도 테스트 13개가 그대로 통과했습니다.", "detail": "<p>그 밖에 접근성 검사가 텍스트의 59.6%만 측정하고 실패 0건을 보고한 사례, '크래시 없음'을 실행 857ms로만 판단했다가 몽키 테스트 15번째 이벤트에서 앱이 종료된 사례가 있습니다. 규칙마다 근거 노트를 링크해 두었습니다(GeekNews에는 일부만 요약, 전체 9가지는 원문).</p>", "foryou": "에이전트 PR 리뷰 기준에 <b>'수정을 되돌려도 테스트가 통과하는지(뮤테이션 확인)', '검증 구문 없는 테스트 탐지'</b> 두 항목만 추가해도 효과가 큽니다. 리뷰 병목 논의 때 '사람이 꼭 봐야 할 것' 목록의 국내 사례로 공유할 만합니다."}, {"tag": "공유 링크 유출", "source": "Ars Technica (AI News 뉴스레터 2차 인용)", "url": "https://arstechnica.com/security/2026/11/grok-build-coding-agent-leaks-oodles-of-confidential-info-some-belonging-to-spacexsi/", "published": "2026-11-12", "title": "xAI 코딩 에이전트 Grok Build, 공유 링크 43,601개 중 3만 5천 개 이상이 공개 상태 — 사내 기밀이 그대로 노출", "summary": "코딩 에이전트 대화·결과를 공유하는 링크가 <b>기본적으로 누구나 볼 수 있는 상태</b>여서 기밀 정보가 새어 나갔다는 보도입니다(원문은 접근이 막혀 2차 정리 기준).", "detail": "<p>세부 피해 범위와 xAI의 대응은 직접 확인하지 못했습니다. 다만 '공유 링크 기본 공개'는 다른 AI 도구에서도 반복된 유형입니다.</p>", "foryou": "사내에서 허용한 AI 도구(ChatGPT, Claude, Cursor 등)마다 <b>공유 링크 기본값과 관리자 차단 옵션</b>을 표로 정리해 두면 이런 사고가 터질 때 바로 답할 수 있습니다. 승인 도구 목록 갱신 때 체크 항목으로 넣어 두세요."}]}, {"id": "tpm", "label": "TPM 업무 자동화", "icon": "📋", "tint": "blue", "desc": "로드맵·스프린트·문서·회의·커뮤니케이션에 바로 쓸 수 있는 AI 기능.", "criteria": "이번 주에 <b>실제로 쓸 수 있게 된 기능</b>(베타 포함)을 우선했습니다. 회의 자동화와 '에이전트가 보드에 보이는' 변화가 겹친 주라 관리자 통제 항목을 함께 적었습니다.", "highlight": {"kicker": "TPM 업무 자동화", "title": "Claude Meetings 베타(11월 10일) — Google Meet 회의에 참석자로 들어와 계획 초안·타임라인 화이트보드·액션 아이템까지. 외부 손님이 있으면 기본적으로 안 들어온다", "summary": "Team·Enterprise 요금제 베타로, Claude가 <b>보이는 참석자</b>로 회의에 들어와 논의 중인 계획을 정리하고 채팅 질문에 답하며, 연결된 업무 앱에서 정보를 찾아옵니다. 회의가 끝나면 회의록·액션 아이템이 claude.ai에 남습니다.", "detail": "<p>TechCrunch 보도 기준으로 출시 시점에는 <b>Google Meet만 지원</b>합니다. 관리자가 허용하지 않으면 <b>외부 손님이 있는 회의에는 들어가지 않고</b>, 회의 중 외부 손님이 들어오면 스스로 나갑니다. 참석 시 채팅에 안내 문구를 남깁니다.</p><p>같은 날 함께 나온 기능은 실시간 공동 계획판 <b>Whiteboards</b>(베타, 문서·슬라이드로 내보내기), 탭·수식·드롭다운을 갖춘 <b>Sheets</b>(베타), 데이터 웨어하우스·CRM에 연결해 대시보드와 해설을 만드는 <b>Data</b>(정식, 이전 이름 Dashboards), Adobe·Atlassian·HubSpot 앱을 Claude 안에서 여는 <b>인터랙티브 커넥터</b>입니다.</p>", "source": "TechCrunch (Anthropic 발표 보도)", "url": "https://techcrunch.com/2026/11/10/anthropic-launches-claude-meetings-to-turn-workplace-discussions-into-plans-and-tasks/", "published": "2026-11-10", "foryou": "사내 회의 도구가 Google Meet가 아니면 당장은 대상이 아닙니다. 다만 <b>'AI가 회의에 참석해도 되는 조건'</b>(외부인 포함 여부, 녹음 고지, 회의록 보관 위치)을 지금 정해 두면 Zoom·Teams 지원이 열릴 때 바로 적용할 수 있습니다. 아래 국내 사례처럼 'AI 회의록이 제안을 합의로 적는' 문제도 기준에 함께 넣으세요."}, "articles": [{"tag": "에이전트 가시화", "source": "Atlassian 공식 블로그", "url": "https://www.atlassian.com/blog/development/jira-autumn-release", "published": "2026-10-30", "title": "Jira 가을 릴리스 11월 정식 배포 — 에이전트마다 신원이 생겨 보드·작업에 보이고, '에이전트 사용 대시보드'가 사이클 타임·처리량과 연결된다", "summary": "Rovo·코딩 도구·외부 에이전트가 한 작업을 <b>스페이스 리포트 탭에서 사람 작업과 같은 지표로</b> 볼 수 있게 됩니다. 에이전트가 어떤 자동화·워크플로에 들어가 있는지도 스페이스 설정에서 확인합니다.", "detail": "<p>Atlassian은 10월 30일 발표에서 11월 중 Jira Cloud 전체에 정식 배포한다고 밝혔습니다. 팀 관리형 스페이스용 맞춤 템플릿이 Standard·Premium 요금제로 확대되고, 관리자가 전역 필드·전역 상태만 쓰도록 정책을 걸 수 있습니다. 작업 생성 시 필드 추천은 사람이 하나씩 확인해야 반영됩니다. 실제 배포 완료 여부는 이번 주 확인하지 못했습니다.</p>", "foryou": "'에이전트가 실제로 처리량을 늘렸나'를 <b>별도 집계 없이 Jira 리포트로 볼 수 있는 첫 수단</b>입니다. 배포되면 에이전트를 많이 쓰는 팀 2~3곳을 골라 도입 전후 사이클 타임을 비교해 리더십 보고 자료로 쓰세요. 전역 상태 정책은 전사 리포팅 표준화에도 바로 쓸 수 있습니다."}, {"tag": "Notion 에이전트", "source": "Releasebot (Notion 개발자 릴리스 노트 집계)", "url": "https://releasebot.io/updates/notion", "published": "2026-11-11", "title": "Notion, 커스텀 에이전트를 '담당자'로 지정하면 바로 작업 시작(11월 9~10일) — 에이전트 API 정식(11월 2일), 기존 MCP SSE 엔드포인트는 2027년 2월 23일 종료", "summary": "데이터베이스의 사람 속성에 <b>커스텀 에이전트를 담당자로 넣거나 ID로 멘션하면 실행</b>됩니다. 작업 배정 흐름 안에 에이전트를 넣을 수 있게 된 것입니다.", "detail": "<p>11월 2일 에이전트 API가 정식 전환돼 개인 에이전트(Notion AI)도 개인 액세스 토큰으로 호출할 수 있습니다. 10월 말에는 MCP로 제안 편집·과거 버전 보기·복원 도구가 추가됐습니다(제안 편집은 Business·Enterprise). 기존 MCP SSE 엔드포인트를 쓰는 연동은 Streamable HTTP로 옮겨야 합니다.</p>", "foryou": "작업 트래커에서 '담당자: 에이전트'가 가능해지면 <b>누가 승인하고 결과를 검수하는지</b>가 흐려지기 쉽습니다. 에이전트 담당 작업에는 '검수자' 속성을 필수로 두는 템플릿을 미리 만들어 두세요. 사내 Notion MCP 연동이 SSE 방식이면 2월 종료 일정을 연동 담당 팀 로드맵에 넣어 두어야 합니다."}, {"tag": "국내 · 회의록 실무", "source": "GeekNews Ask GN (사용자 질문과 답변)", "url": "https://news.hada.io/topic?id=36986", "published": "2026-11-11", "title": "\"AI 회의록 요약에서 제가 제안한 게 합의한 걸로 정리됩니다\" — 프롬프트로는 안 풀리고, 회의 마지막에 '합의/제안'을 소리 내 정리하는 게 답", "summary": "영업 직군 비개발자의 질문에 달린 답변의 결론은 <b>화자 구분과 합의 여부는 별개 문제</b>라는 것입니다. 긴 회의에서는 '제안과 합의를 나눠라'는 지시만으로 혼동이 사라지지 않습니다.", "detail": "<p>답변에서 나온 방법은 통화를 마치기 전 합의 사항과 제안 사항을 말로 다시 정리하기, 후속 메일에는 합의 항목만 적고 제안은 '확인 필요'로 따로 묶기, 고객이 동의하면 '이 방식으로 확정하겠다'고 말해 녹음에 남기기입니다.</p>", "foryou": "AI 회의록이 늘수록 <b>'회의록에 적힌 것 = 결정'으로 읽히는 위험</b>이 커집니다. 사내 회의록 템플릿을 '결정 / 제안·검토 필요 / 액션' 3칸으로 나누고, 진행자가 마지막 2분에 결정 사항을 소리 내 확인하는 규칙을 TPM 쪽에서 먼저 써 보길 권합니다."}]}, {"id": "strategy", "label": "빅테크 & 전략 동향", "icon": "🌐", "tint": "orange", "desc": "리더십 보고와 전사 전략 수립에 참고할 국내외 산업 맥락.", "criteria": "국내 빅테크 실적 시즌이라 <b>네이버·카카오의 에이전트 전략과 비용 구조</b>를 앞에 두었습니다. 해외는 벤더 리스크와 에이전트 거버넌스 시장 흐름처럼 <b>계약·투자 판단에 참고되는 것</b>만 골랐습니다.", "highlight": {"kicker": "빅테크 & 전략 동향", "title": "네이버·카카오 3분기 — AI 투자 규모가 수익성을 갈랐다(네이버 영업이익 -20.9%, 카카오 +7%). 둘 다 '대답하는 AI'에서 '실행하는 AI'로", "summary": "네이버는 11월 12일 <b>개인형 AI 에이전트 앱을 연내 출시</b>하겠다고 밝혔습니다. 쇼핑·플레이스·예약·지도·네이버페이를 자체 API로 잇고, 연동되지 않은 외부 사이트는 <b>격리된 브라우저</b>에서 처리합니다. 결제·예약 확정은 이용자가 직접 합니다.", "detail": "<p>지디넷코리아에 따르면 네이버 3분기 매출은 3조 4,724억 원(+10.7%), 영업이익은 4,513억 원(-20.9%)이었고 인프라 비용(2,823억 원, +29.1%)과 마케팅 비용이 늘었습니다. 카카오는 매출 2조 867억 원(+6%), 영업이익 2,403억 원(+7%)으로 자체 데이터센터 활용 등으로 외주·인프라비를 줄였습니다.</p><p>네이버는 3월 출시한 쇼핑 에이전트의 이용자가 9월 기준 출시 초기의 5배, 에이전트 거래액은 약 4배라고 밝혔고(한국경제), 연내 에이전트 화면 즉시 결제를 시범 도입할 계획입니다. 메일 발송·일정 등록도 실행 전 이용자 확인을 거칩니다(이투데이). 카카오는 카나나 스페이스로 카톡 설정 변경·선물하기·송금을 대신 실행하고 있으며 12월 비공개 베타를 거쳐 외부 서비스 연동을 늘릴 계획입니다. 정신아 대표는 연내 월간 AI 이용자 1,000만 명 달성이 가능하다고 했습니다.</p>", "source": "지디넷코리아 · 한국경제 · 이투데이 (실적 발표·컨퍼런스콜 보도)", "url": "https://zdnet.co.kr/view/?no=20261112182533", "published": "2026-11-13", "foryou": "두 회사 모두 <b>'공식 연동은 싸고 정확, 브라우저 대행은 비싸고 불안정'</b> 구조를 전제로 파트너 연동을 늘리겠다고 했습니다(지난주 카카오 공개 단가: 연동 건당 약 5원 vs 브라우저 조작 약 800~900원). 플랫폼 사업자 입장에서는 <b>국내 에이전트에 어떤 API를 어떤 조건으로 열지</b>가 내년 상반기 전략 안건이 될 수 있습니다. 핵심 탭의 United Airlines 사례와 함께 보고하면 '막을 것인가, 연동할 것인가'의 선택지가 분명해집니다."}, "articles": [{"tag": "국내 모델", "source": "서울신문 (LG AI연구원 발표 보도)", "url": "https://www.seoul.co.kr/news/economy/industry/2026/11/10/20261110030002", "published": "2026-11-10", "title": "LG 'K-엑사원 2.5' API 무료 개방 발표(11월 9일, 엔비디아 AI 데이 서울) — 에이전트 평가에서 딥시크·GLM과 비슷한 수준, 8월 대비 70% 향상(자체 평가)", "summary": "업무 자동화·웹 검색·소프트웨어 개발 영역의 에이전트 평가 24개 지표를 종합해 <b>8월 버전보다 70% 이상 좋아졌다</b>고 LG는 밝혔습니다. 3차 모델은 내년 1월까지 프런티어급 성능이 목표입니다.", "detail": "<p>무료 제공 기간·대상·사용량 한도·라이선스는 기사에서 확인하지 못했습니다(미확인). 성능 수치는 LG 자체 평가 기준입니다.</p>", "foryou": "국내 데이터 주권·비용 측면에서 <b>보조 모델 후보로 시험해 볼 가치</b>가 있습니다. 다만 무료 조건이 불명확하니 운영 적용 전에는 약관(데이터 사용·보관, 상업 이용)을 먼저 확인하고, 사내 평가 세트로 현재 쓰는 소형 모델과 나란히 비교해 보세요."}, {"tag": "벤더 리스크", "source": "RTTNews (Anthropic 공모 조건 보도)", "url": "https://www.rttnews.com/3712632/anthropic-sets-ipo-price-range-at-70-78-per-share-launches-roadshow.aspx?type=ipo", "published": "2026-11-10", "title": "Anthropic, IPO 로드쇼 시작(11월 10일) — 주당 70~78달러, 나스닥 티커 'ANT', 신주 약 8억 주", "summary": "지난주 지연 관측이 있었지만 11월 10일 로드쇼를 시작했습니다. 회사가 내놓는 신주는 <b>8억 135만 주</b>, 기존 주주 매도분 2,365만 주이며 공모가 확정일은 기사에 없습니다.", "detail": "<p>일부 매체는 공모가 범위 기준 기업가치를 1조 달러대로 계산하지만, 기사 원문에는 기업가치가 명시돼 있지 않습니다. 상장 후에는 분기 실적·위험 요인이 정기 공시되므로 고객사 입장에서도 확인할 수 있는 정보가 늘어납니다.</p>", "foryou": "상장 자체가 서비스 조건을 바꾸지는 않지만, 상장 전후로 <b>가격 정책·요금제 정비</b>가 이어지는 경우가 많습니다. 연간 계약 갱신 시점이 가깝다면 가격 고정 조항과 모델 종료 사전 통지 기간을 이번에 다시 확인해 두세요."}, {"tag": "에이전트 거버넌스 시장", "source": "AI Agents Directory 뉴스 브리프 (2차 정리)", "url": "https://aiagentsdirectory.com/news/ai-agents-news-brief-2026-11-14", "published": "2026-11-14", "title": "돈이 '에이전트 통제'로 몰린다 — LangChain 3억 달러 조달(거버넌스 도구), CrowdStrike 에이전트 보안 스타트업 2곳 4.95억 달러 인수, OpenAI×Databricks 연동", "summary": "11월 13~14일 사이 <b>에이전트를 만드는 도구보다 감시·통제하는 도구</b> 쪽 투자가 이어졌습니다. OpenAI와 Databricks는 기업이 거버넌스가 적용된 Databricks 데이터 위에서 ChatGPT·Codex를 쓰도록 연동했습니다.", "detail": "<p>LangChain은 기업가치 30억 달러로 시리즈 C를 받아 LangSmith 등 거버넌스 도구에 투자한다고 밝혔고, CrowdStrike 인수는 보도 기준입니다. Cloudflare는 에이전트용 브라우저 엔진 Kitesurf를 Apache 2.0으로 공개했습니다. 개별 기사 원문은 직접 확인하지 못했습니다.</p>", "foryou": "사내 에이전트 거버넌스를 <b>직접 만들지, 사서 쓸지</b> 판단할 때 시장이 빠르게 커지고 있다는 신호입니다. 다만 인수·통합이 잦은 시기라 단기 계약 위주로 검토하고, 로그·정책을 표준 형식(OpenTelemetry 등)으로 남겨 도구를 바꿔도 이어지게 하는 편이 안전합니다."}]}, {"id": "cases", "label": "국내외 AI 도입 사례", "icon": "📚", "tint": "gray", "desc": "국내외 기업이 실제로 AI를 도입한 사례 — 배경, 성과·실패 요인, 조직·프로세스 변화.", "criteria": "이번 주는 <b>국내 금융권 사례 2건</b>과 해외 성과·비용 데이터를 함께 담았습니다. 성과 수치는 대부분 <b>회사 발표 기준</b>이라 기준선·측정 방식이 공개되지 않은 경우 카드에 적었습니다.", "highlight": {"kicker": "국내외 AI 도입 사례", "title": "JB금융 사내 AI 경진대회 — 임직원 284명·145팀 참가(2월의 2배 이상), 본상 2팀은 IT가 아닌 현업 직원만으로 구성", "summary": "11월 2~4일 전북 정읍에서 열린 하반기 대회에 6개 계열사가 예선에 참여했고, 통과한 60개 팀(194명)이 <b>2박 3일 합숙하며 바이브 코딩으로 업무용 AI를 만들어 시연</b>했습니다. 총상금은 1억 4천만 원입니다.", "detail": "<p>스페셜경제 보도에 따르면 대상은 전북은행 원팩트(One PACT)팀이 받았고, 수상작은 대출 서류 점검, 업무 인수인계, 공문 작성·결재 지원, 외국인 고객 전세계약 지원, 수익성 분석, 위험 관리 등 <b>현업이 매일 하는 일</b>이었습니다. 외부 금융 전문가 9명이 심사했습니다. 수상작이 실제 운영에 들어가는지, 들어간다면 어떤 검증 절차를 거치는지는 기사에서 확인하지 못했습니다.</p>", "source": "스페셜경제 (JB금융 발표 보도)", "url": "https://www.speconomy.com/news/articleView.html?idxno=420101", "published": "2026-11-05", "foryou": "참가 팀이 반년 만에 두 배가 된 것은 <b>'현업이 직접 만든다'는 방식이 정착 단계</b>라는 신호입니다. 우리 조직에서 비슷한 행사를 한다면 시상보다 <b>수상작을 운영으로 넘기는 경로</b>(보안 검토, 소유 팀, 유지 비용)를 먼저 설계해 두는 게 핵심입니다. 그렇지 않으면 데모만 쌓이고 그림자 AI가 늘어납니다."}, "articles": [{"tag": "국내 · 금융", "source": "지디넷코리아", "url": "https://zdnet.co.kr/view/?no=20261105085542", "published": "2026-11-05", "title": "NH농협은행, AI 기업 애자일소다 인수 4개월 만에 — 컴플라이언스·여신 심사·상품 추천 등 '10대 에이전트' 시제품을 한 달여 만에 구현", "summary": "7월 인수한 애자일소다와 9월 초 프로젝트를 시작해 <b>한 달여 만에 은행 핵심 직무용 에이전트 10종 프로토타입</b>을 만들고 11월 4일 사내 시연회를 열었습니다.", "detail": "<p>처리 건수나 비용 절감 같은 정량 성과는 기사에 없습니다. 확인되는 성과는 개발 기간 약 한 달이라는 점입니다. 인수를 통해 내부 AI 개발 역량을 확보한 사례로 볼 수 있습니다.</p>", "foryou": "'직무별 대표 에이전트 10개'처럼 <b>범위를 직무 단위로 먼저 정하고 시제품을 짧게 돌리는 방식</b>은 전사 로드맵을 짤 때 참고할 만합니다. 다만 시제품 이후 운영 전환율이 핵심 지표라, 우리 쪽 계획에는 처음부터 '운영 전환 기준'을 같이 두세요."}, {"tag": "해외 · 고객 지원", "source": "CX Dive (Airbnb 3분기 실적 발표 보도)", "url": "https://www.customerexperiencedive.com/news/airbnb-reduces-customer-support-cost-per-booking-17/874307/", "published": "2026-11-10", "title": "Airbnb, AI 상담으로 예약 1건당 고객 지원 비용 17% 이상 감소 — 3분기 문의의 약 40%를 상담원 없이 해결", "summary": "1년 반 전 도입한 AI 상담 비서 덕분이라고 CEO가 실적 발표에서 밝혔습니다. 미국에서는 <b>음성 상담</b>으로 확대하고, 2027년 상반기에는 플랫폼 밖까지 다루는 AI 여행 비서를 내놓을 계획입니다.", "detail": "<p>회사 발표 기준이며 기준 금액, '해결'의 정의, 측정 방식은 공개되지 않았습니다. 예약 1건당 비용이라 전체 지원 비용 감소와는 다를 수 있습니다.</p>", "foryou": "고객 지원 AI 성과를 보고할 때 <b>'건당 비용'과 '무인 해결률'을 같이, 정의와 함께</b> 제시하는 형식의 좋은 예입니다. 사내 CS AI 지표를 정할 때 '해결'의 정의(재문의 없음 기준 기간 등)를 먼저 합의해 두세요."}, {"tag": "비용 · ROI", "source": "VentureBeat VB Pulse 조사 (156명, 10월 실시)", "url": "https://venturebeat.com/infrastructure/ais-biggest-bottleneck-is-cost-companies-blame-stalled-projects-on-overruns-three-times-as-often-as-on-compute-shortages", "published": "2026-11-10", "title": "AI 프로젝트를 멈춘 이유는 컴퓨트 부족(12%)보다 예상 밖 비용(38%)이 세 배 — 재무를 설득할 ROI를 가진 곳은 26%", "summary": "응답자의 79%는 내년 AI 예산이 늘 것으로 봤지만, <b>재무 부서가 수익 수치를 검토·승인한 곳은 전체의 약 20%</b>였습니다.", "detail": "<p>권고는 워크플로 하나를 골라 성공 기준과 사람 개입 허용치를 정하고, 재무와 비용 기준선을 합의하며, 비교할 때 통합·지원·재시도·사람 검토 비용까지 넣으라는 것입니다. '요청 단가가 낮아도 재작업이 늘면 손해'라는 지적은 이번 주 Fable 5.2 작업당 비용 분석과도 맞닿습니다.</p>", "foryou": "내년 AI 예산 논의 때 <b>'재무가 승인한 ROI 수치가 있는 과제'를 별도로 표시</b>하는 것만으로도 상위 20% 그룹에 들어갈 수 있습니다. 주요 과제 3개를 골라 재무와 비용 기준선을 미리 맞춰 두세요."}, {"tag": "연구 · 멀티 에이전트", "source": "arXiv 프리프린트 (Amazon·워싱턴대, 동료 심사 전, AI News 뉴스레터 인용)", "url": "https://arxiv.org/abs/2611.12953", "published": "2026-11-12", "title": "멀티 에이전트 팀은 토큰 1.4~4.7배·시간 2.6~5.8배를 쓰고도 단일 에이전트보다 크게 낫지 않았다", "summary": "합성 벤치마크와 Claude 모델 하나로 시험한 결과, 지시를 충분히 준 팀은 73.1%, 지시를 줄인 팀은 59.8%, <b>단일 에이전트는 67.4%</b>였습니다.", "detail": "<p>동료 심사 전 프리프린트이고 한 가지 모델·합성 과제 기준이라 일반화에는 한계가 있습니다. 그래도 '에이전트 여러 개 = 더 좋은 결과'라는 가정을 다시 보게 하는 데이터입니다.</p>", "foryou": "멀티 에이전트 구조를 제안받으면 <b>'단일 에이전트 + 좋은 지시' 대비 실측 비교</b>를 요구하는 기준으로 쓰기 좋습니다. 비용이 몇 배 늘 수 있다는 점을 예산 검토 체크리스트에 넣어 두세요."}]}, {"id": "tools", "label": "써볼 만한 툴 & 에이전트", "icon": "🧰", "tint": "green", "desc": "요즘 새로 나왔거나 화제인 툴·에이전트 중 업무나 일상에서 바로 써보거나 아이디어를 얻을 만한 것.", "criteria": "이 탭은 <b>'직접 써보고 아이디어를 얻는 용도'</b>입니다. 대부분 초기 제품이라 <b>성능·안전 주장은 제작사 발표 기준</b>이며, 사내 계정이나 업무 데이터를 연결하기 전에는 정보보안팀(#support-정보보안)에 먼저 문의하세요. 개인 계정·샘플 데이터로 먼저 체험해 보는 것을 권합니다. 이번 호의 국내 도구는 <b>agent-otel-kit, agent-monitor</b> 2건이고, 국내에서 화제인 개인 비서 앱 '피클' 사용기를 함께 담았습니다.", "highlight": {"kicker": "써볼 만한 툴 & 에이전트", "title": "Ace (GitHub Next) — 팀 채널에서 논의하다 @ace를 부르면 에이전트가 앞선 대화를 읽고 작업 시작. 내 Mac에서 돌고 작업마다 별도 브랜치·PR(MIT)", "summary": "Copilot Workspace·GitHub Spark를 만든 GitHub 연구팀의 실험 프로젝트입니다. 사람과 에이전트가 <b>같은 채널에서 함께 일하고</b>, 에이전트가 질문하면 답을 아는 팀원이 대신 답할 수 있습니다.", "detail": "<p>GeekNews 소개(11월 14일)와 GitHub 저장소 기준으로, 작업마다 Git worktree와 브랜치를 따로 만들어 병렬로 진행하고 PR을 엽니다. GitHub 이슈나 기존 PR을 채널로 가져와 이어서 작업할 수도 있습니다. 팀 구성은 <b>Tailscale 네트워크</b>로 정해지고, 채널 주인이 허용하면 다른 팀원의 Mac에서 에이전트에게 일을 맡길 수 있습니다. 팀 Cloudflare 계정에 클라우드 채널을 배포하면(베타) Mac이 꺼져 있어도 리눅스 컨테이너에서 계속 작업합니다.</p><p>가격 안내는 없고 <b>Anthropic 또는 OpenAI API 키를 직접 넣어</b> 씁니다. 공식 지원 플랫폼은 저장소에 명시돼 있지 않으며 GeekNews 소개는 Apple Silicon용 macOS 앱이라고 적었습니다. <b>주의:</b> 저장소 문서는 에이전트가 호스트 사용자 권한으로 돌며 프로젝트 밖 파일도 바꾸거나 지울 수 있고, <b>채널이 보안 샌드박스가 아니다</b>라고 명시합니다. Ace 자체 계정·접근 제어도 없습니다.</p>", "source": "GeekNews · GitHub 저장소 githubnext/ace (제작사 문서 기준, 직접 사용 검증 안 함)", "url": "https://github.com/githubnext/ace", "published": "2026-11-14", "foryou": "<b>써보는 방법:</b> 개인 Mac과 개인 API 키, 공개 저장소로 '이슈 하나를 채널에 올리고 동료와 논의 → @ace에 맡기기' 흐름을 한 번 돌려 보세요. 업무 아이디어로는 <b>'에이전트 작업을 개인 터미널이 아니라 팀 채널에서 보이게 하기'</b>가 리뷰 병목·중복 작업을 줄이는 운영 방식의 힌트가 됩니다. 전사 관점에서는 샌드박스가 없고 Tailscale이 곧 권한이므로 사내 저장소·네트워크에 붙이기 전에 정보보안팀(#support-정보보안) 확인이 필수입니다."}, "articles": [{"tag": "국내 신규 · 비용 관측", "source": "GeekNews (제작자 소개글, 직접 사용 검증 안 함)", "url": "https://news.hada.io/topic?id=37198", "published": "2026-11-15", "title": "agent-otel-kit — Claude Code·Codex·Gemini CLI의 사용량·비용·도구 호출을 대시보드 하나로. docker compose 한 번에 로컬 실행", "summary": "OpenTelemetry Collector·Prometheus·Loki·Tempo·Grafana를 로컬에 띄우고, CLI로 각 에이전트를 연결합니다. <b>세 에이전트를 기간별로 나란히 비교</b>하고 도구별 호출 수·실패·p95 소요 시간·권한 결정까지 봅니다.", "detail": "<p>프롬프트 내용·도구 인자와 출력·<code>user.email</code>은 collector에서 기본 제거하고 외부로 보내는 데이터는 없다고 제작자가 밝혔습니다. 세션별 비용은 현재 Claude Code만 지원합니다. 설치는 Homebrew(<code>brew install s3onghyun/tap/agent-otel-kit</code>) 또는 v0.1.0 바이너리(macOS·Linux)입니다. 라이선스는 소개글에 없어 미확인입니다.</p>", "foryou": "<b>써보는 방법:</b> 개인 노트북에서 1주일만 켜 두고 내 에이전트 사용 패턴(어떤 도구가 자주 실패하는지, 권한 승인이 몇 번인지)을 보세요. 전사 관점에서는 <b>사내 에이전트 관측 표준을 OpenTelemetry로 잡을 때의 참고 구성</b>입니다. 사내 수집 서버로 보내는 구성은 정보보안팀(#support-정보보안)과 상의하세요."}, {"tag": "국내 신규 · 멀티 세션", "source": "GeekNews · GitHub 저장소 (제작자 소개, 직접 사용 검증 안 함)", "url": "https://news.hada.io/topic?id=37251", "published": "2026-11-16", "title": "agent-monitor — 에이전트 세션 5개 중 2개가 내 답을 기다린다는 걸 메뉴바에 '2/5'로 보여 주는 macOS 앱(MIT)", "summary": "터미널의 Claude Code·Codex, Claude 데스크톱 앱, ChatGPT 앱의 Codex 스레드까지 모아 <b>승인 대기·입력 대기·작업 중</b>을 구분합니다. 대기 세션에 마우스를 올리면 대기 중인 명령이 보이고, 클릭하면 해당 터미널로 이동합니다.", "detail": "<p>세션별 CPU·메모리, 7일간 동시 세션 수·대기 시간 통계를 보여 주며 대화 내용은 기록하지 않는다고 밝혔습니다. 창 이동·탭 복원은 Terminal.app에서만 됩니다. Claude Code 상태 파일이 공식 공개 형식이 아니라 업데이트로 깨질 수 있습니다. GeekNews 글은 서명·공증된 빌드라고 했지만 GitHub README는 '서명·공증되지 않음'이라고 적고 있어 <b>배포 방식은 직접 확인이 필요</b>합니다.</p>", "foryou": "<b>써보는 방법:</b> 에이전트를 여러 개 띄워 놓고 일하는 날 하루 써 보면 '내가 병목'인 시간이 숫자로 보입니다. 팀 차원에서는 <b>'사람 대기 시간'이 에이전트 생산성의 숨은 비용</b>이라는 논의 자료가 됩니다. 서명되지 않은 앱 설치는 사내 기기 정책에 걸릴 수 있으니 업무 기기에는 정보보안팀(#support-정보보안) 확인 후 설치하세요."}, {"tag": "국내 화제 · 사용기", "source": "개인 블로그 사용기 (GeekNews 공유, 제작사·출시일 미확인)", "url": "https://news.hada.io/topic?id=37188", "published": "2026-11-15", "title": "앱스토어 상위권 개인 AI 비서 '피클'을 하루 써 본 기록 — 네이버 예약은 확정까지 했지만, 스마트스토어 상품 196개 등록 보고는 전부 노출 제한", "summary": "네이버 예약, 홈택스 조회, 체험단 신청, 스마트스토어 등록, 전화 대행을 시켜 본 사용기입니다. 홈택스에서는 <b>묻지 않은 감면 종료일까지</b> 알려 줬지만, 전화 대행은 한 지점만 부탁했는데 <b>확인 없이 두 지점에 전화</b>했습니다.", "detail": "<p>필자가 공개된 자격증명 보관 코드를 읽어 본 결과, OAuth 토큰은 보관소 밖으로 나가지 않게 막혀 있지만 <b>일반 사이트 비밀번호와 카드 번호는 입력 시 평문으로 운영 측 브라우저 작업자에게 전달</b>되는 구조였고, 이 한계는 README와 처리방침에도 적혀 있다고 합니다. 제작사·가격·플랫폼은 원문에서 확인하지 못했습니다.</p>", "foryou": "<b>써보는 방법:</b> 써 본다면 비밀번호·카드가 필요 없는 일(정보 조회, 예약 후보 찾기)부터 개인 계정으로만 해 보세요. 업무 아이디어로는 '<b>했다고 보고한 일과 실제 결과가 다르다</b>'는 사례가 에이전트 결과 검수 기준을 설명할 때 좋은 예시입니다. 사내 계정 연결은 정보보안팀(#support-정보보안) 확인 전에는 하지 마세요."}, {"tag": "해외 신작 묶음", "source": "Product Hunt AI Digest 2026-11-12 (agents-radar) · AI Agents Directory (2차 정리)", "url": "https://github.com/duanyytop/agents-radar/issues/4255", "published": "2026-11-12", "title": "이번 주 해외 신작 4종 — 저장소를 에이전트로 읽는 Co-Review, PDF를 읽어 주고 질문받는 Quillo, 실제 사용자처럼 행동하는 QA 에이전트 Seldon, 에이전트용 오픈소스 브라우저 엔진 Cloudflare Kitesurf", "summary": "<b>Co-Review</b>는 저장소 전체를 에이전트와 대화하며 읽게 해 주고, <b>Quillo</b>는 아무 PDF나 소리 내 읽어 주며 이어서 질문할 수 있습니다. <b>Seldon</b>은 실제 사용자 행동을 흉내 내는 QA 에이전트, <b>Kitesurf</b>는 Cloudflare가 Apache 2.0으로 공개한 Workers 기반 에이전트용 브라우저 엔진입니다.", "detail": "<p>Product Hunt 득표 기준으로는 Seldon 252표, Co-Review 103표, Quillo 77표였습니다. 각 제품의 가격·출시일·운영 주체는 공식 사이트에서 확인하지 못했습니다(미확인). 소개 문구는 다이제스트 요약을 옮긴 것입니다.</p>", "foryou": "<b>써보는 방법:</b> 업무에서는 Co-Review로 처음 보는 사내 오픈소스 저장소 구조를 파악해 보거나, Seldon을 개인 사이드 프로젝트 QA에 붙여 볼 만합니다. 일상에서는 Quillo로 긴 보고서 PDF를 출퇴근길에 듣는 용도가 좋습니다. 사내 문서·코드를 올리는 것은 정보보안팀(#support-정보보안) 확인 후에 하세요."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;

tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 10월 26일~11월 2일 공개 뉴스 기반(일부 직전 보도 포함). 일부 수치는 2차 정리 글·벤더 발표 기준이므로 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
