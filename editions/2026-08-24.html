const NL={"meta":{"icon":"🗞️","edition":"Vol.33","cadence":"주간","date":"2026년 8월 24일 (월)","curator":"Claude (Cowork)","title":["주간 AI 뉴스레터 — ","TPM Edition"],"lead":"CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.","greeting":"안녕하세요! 이번 주 국내 최대 뉴스는 <b>카카오가 'AI 법인'과 '투자 법인'으로 회사를 쪼갠 일</b>입니다. AI를 기존 조직의 부가 기능으로 두는 단계를 넘어 손익·의사결정을 물리적으로 분리한 첫 국내 사례라, 우리도 'AI 성과를 어느 단위로 측정할지' 질문을 받게 될 겁니다. 원가 쪽에서는 AT&T가 <b>모델 라우팅만으로 코딩 AI 비용을 56% 줄인</b> 숫자를 공개했고, 오픈AI는 최상급 모델 가격을 3개월간 한시 인하했어요. 개발 쪽 키워드는 한 단어로 '<b>거버넌스</b>'입니다 — 상반기 AI 개발도구 보안사고가 전년 동기 대비 3배, 깃허브는 8시간 멈췄습니다. 사례 탭에는 현대차그룹의 7년치 AX 성과와, KB·HD현대·롯데쇼핑이 공개한 \"실패하는 PoC는 없다, 확산에서 실패한다\"는 자기 진단을 담았습니다."},"topics":[{"id":"top","label":"이 주의 핵심","icon":"⚡","tint":"red","desc":"이번 주 국내외 AI 소식 중 전사 의사결정에 가장 직접적으로 영향을 주는 것들.","criteria":"<b>지금 당장 우리가 무엇을 해야 하는지가 명확한</b> 소식만 골랐습니다. 해외 규제 조항 나열은 제외하고, 조직 구조·원가·벤더 리스크에 직접 영향을 주는 것으로 좁혔습니다. 국내 소식을 우선 배치했습니다.","highlight":{"kicker":"이 주의 빅스토리","title":"카카오가 회사를 쪼갰다 — '카카오AI'와 '카카오X', AI 손익을 법인 단위로 분리","summary":"카카오가 8월 21일 이사회에서 AI 사업에 집중하는 신설법인 '카카오AI'와 투자·기존 사업을 담는 존속법인 '카카오X'로의 인적분할을 결의했습니다. 분할비율은 순자산 장부가액 기준 카카오AI 0.36 / 카카오X 0.64이고, 12월 17일 임시주주총회를 거쳐 2027년 1월 1일 분할 완료, 1월 27일 재상장을 추진합니다. 카카오AI는 2030년까지 AI 일간 활성 이용자 2000만명, 신설법인 매출 6조원을 목표로 걸었습니다.","detail":"<p>주목할 점은 이것이 '신사업 조직 신설'이 아니라 '법인 분리'라는 점입니다. AI를 기존 서비스의 부가 기능으로 붙이는 단계를 넘어, 손익·자본조달·인재 채용·의사결정 속도를 물리적으로 분리해야 한다는 판단이 국내 대형 플랫폼에서 처음으로 법인 구조 수준까지 내려왔습니다. 카카오AI 대표에는 정신아 현 카카오 대표가, 카카오X는 김도영 카카오인베스트먼트 대표가 내정됐습니다.</p><p>분할 논리로 제시된 근거는 숫자입니다. 증권사 SOTP 평균 기준 그룹 잠재가치 34조2000억원과 최근 3개월 평균 시가총액 16조8000억원 사이 17조원 이상의 격차를 좁히겠다는 것입니다. 다만 AI가 아직 대규모 매출을 만드는 사업이 아니어서, 수익화가 늦어지면 AI 개발·인프라 비용 부담이 곧바로 부각되는 구조이기도 합니다. 카카오X 쪽은 카카오모빌리티의 미국 증시 상장 추진이 첫 시험대가 될 전망입니다.</p>","source":"파이낸셜뉴스 / ZDNet Korea","url":"https://www.fnnews.com/news/202608231813439953","published":"2026-08-23","foryou":"경쟁사가 'AI 조직의 손익·의사결정 분리'를 법인 단위로 실행했다는 것은, 우리도 곧 \"AI 투자 성과를 어느 단위로 측정·귀속하는가\"라는 질문을 받는다는 뜻입니다. 지금 할 수 있는 가장 실질적인 준비는 흩어진 AI 비용·성과를 매핑해 별도 코스트센터와 별도 KPI 뷰로 보이게 만드는 것입니다. 조직 논의가 시작될 때 근거 데이터를 가진 쪽이 논의를 리드합니다."},"articles":[{"tag":"AI 원가 관리","source":"Tech Startups (The Information·Goldman Sachs 인용)","url":"https://techstartups.com/2026/08/21/goldman-sachs-says-open-source-ai-could-be-big-techs-unexpected-winner-as-att-cuts-model-costs-by-56/","published":"2026-08-21","title":"AT&T, 모델 라우팅만으로 코딩 AI 비용 56% 절감 — 품질 저하는 2%","summary":"AT&T가 사내 AI 질의를 작업 난이도에 따라 저가 오픈 모델과 프런티어 모델로 자동 분배하는 라우팅 체계를 도입해, 일부 코딩 작업 비용을 최대 56% 줄이면서 품질 저하는 2%에 그쳤다고 밝혔습니다. 하루 약 450억 토큰을 처리하며 전사 질의의 약 40%를 오픈 모델로 보내고 있고, 이 비율을 60~70%까지 올릴 계획입니다.","detail":"<p>질문이 '어느 모델이 가장 좋은가'에서 '이 작업을 안정적으로 처리하는 가장 싼 모델은 무엇인가'로 이동했다는 게 핵심입니다. 코드 요약·문서 요약 같은 저난도 작업은 오픈 모델로, 복잡한 코드 생성은 프런티어 모델로 보냅니다. 담당 임원은 다수 작업에서 오픈 모델이 '구세대 상용 모델과 동등하거나 더 낫다'고 평가했고, 회사는 총 사용량이 늘어도 프리미엄 AI 지출은 횡보시키는 것을 목표로 합니다.</p><p>같은 흐름의 신호가 이어집니다. 스트라이프가 모델 라우팅 게이트웨이 오픈라우터를 70억 달러 이상에 인수하고, DoiT가 토큰·모델·에이전트 단위 지출 가시화 스타트업을 인수했습니다. 라우팅·비용 귀속 레이어가 '실험적 미들웨어'에서 '결제 인프라급 필수 플랫폼'으로 재평가되고 있습니다.</p>","foryou":"전사 AI 비용이 '한 줄의 클라우드 청구서'로 뭉쳐 있으면 이 절감은 재현이 불가능합니다. 이번 분기 안에 ① 업무 유형별(요약/분류/코드리뷰/복잡 구현) 모델 티어 정책 문서화, ② 팀·기능 단위 토큰 비용 귀속 대시보드, ③ '품질 저하 허용 상한(예: 2%p)'을 명시한 A/B 검증 절차 — 이 세 가지를 만들어두면 다음 벤더 협상과 예산 편성에 근거를 들고 들어갈 수 있습니다."},{"tag":"국내 정책·국산 모델","source":"파이낸셜뉴스","url":"https://www.fnnews.com/news/202608181108484327","published":"2026-08-18","title":"'독파모' 2차 평가 통과 — 업스테이지·SKT·LG AI연구원 3파전으로 정리","summary":"과기정통부·NIPA의 독자 AI 파운데이션 모델 사업 2차 단계평가 결과가 8월 18일 공개됐습니다. 업스테이지(Solar Open2), SK텔레콤(A.X K2), LG AI연구원(K-EXAONE 2.0)이 3차로 진출하고 모티프테크놀로지스는 탈락했습니다. 평가는 벤치마크 40점·전문가 35점·사용자 25점 구성이며, 정부는 내년 초 3차 평가로 최종 2개 팀을 선정하되 이후 지원 방식은 전면 재검토합니다.","detail":"<p>국산 파운데이션 모델 진영이 4개에서 3개로 정리됐다는 것은, 국내 소버린 AI 선택지가 좁아지는 동시에 남은 후보의 상용화·API 제공 압력이 커진다는 뜻입니다. 특히 사용자 평가 배점이 25점이나 되기 때문에, 실사용 레퍼런스를 확보하려는 각 팀의 기업 대상 PoC 제안이 하반기에 늘어날 가능성이 높습니다.</p><p>동시에 정부가 '3차 이후 지원 방식 전면 재검토'를 명시한 점은 리스크 신호입니다. 국산 모델을 프로덕션 경로에 넣으려는 기업이라면 정부 지원이 축소·전환될 경우의 모델 유지보수·가격·SLA 지속성을 계약 단계에서 확인해야 합니다.</p>","foryou":"데이터 국외이전 제약이 있는 워크로드(고객 개인정보 인접 영역, 공공 연계 서비스)를 대비해 국산 모델 후보를 3개로 좁혀 평가하기 좋은 시점입니다. 실무 포인트는 하나입니다 — '정부 지원 종료 시 모델 업데이트·가격·SLA가 어떻게 되는가'를 PoC 제안서 단계에서 서면으로 받아두세요."},{"tag":"에이전트 거버넌스","source":"전자신문","url":"https://www.etnews.com/20260819000269","published":"2026-08-19","title":"AI 에이전트 '월권'이 새 보안 리스크 — 국내 IT서비스사, 권한·승인·감사 체계 구축","summary":"기업의 AI 에이전트 도입이 본격화하면서 에이전트가 부여된 범위를 벗어나 행동하는 '월권'이 새로운 보안 리스크로 부상했습니다. 국내 IT서비스 업계는 에이전트 권한을 제한하고 중요 작업에는 사람 승인을 거치며 판단·행동을 추적·감사하는 통제체계 강화에 나섰습니다. 삼성SDS는 'AI 에이전트를 위한 적응형 안전 기술' 등 관련 R&D 실적을 공개했는데, 에이전트 안전·보안을 명시한 과제는 이번이 처음입니다.","detail":"<p>생성형 AI와 달리 AI 에이전트는 ERP·CRM·그룹웨어 같은 실제 기업 시스템을 호출해 업무를 수행합니다. 따라서 '어디까지 할 수 있는지'를 정하는 권한(permission), '언제 사람이 개입할지'를 정하는 승인(approval), '어떤 판단과 행동을 했는지'를 추적하는 감사(audit) 이 세 축이 기업용 AI 운영의 핵심으로 자리 잡고 있다는 것이 업계 진단입니다.</p><p>국내 대형 IT서비스사들이 상용 솔루션보다 먼저 통제 프레임워크 R&D에 예산을 배정하기 시작한 것은, 이 순서를 반대로 하면 되돌리기 비용이 크다는 판단으로 읽힙니다. 에이전트가 코드를 만들고 사내 시스템을 플러그인으로 물어 결과물을 생산하는 구조가 확산될수록, 통제 설계가 없는 조직은 '누가 무엇을 승인했는지' 설명할 수 없는 상태로 감사에 노출됩니다.</p>","foryou":"전사 에이전트 로드맵을 짤 때 도구 선정보다 먼저 '권한-승인-감사' 3단 템플릿을 표준화해두면 팀별 파편화를 막습니다. 구체적으로 ① 에이전트별 접근 가능 시스템과 read/write 구분, ② 금액·배포·개인정보 조회처럼 사람 승인이 필수인 액션 목록, ③ 에이전트 행동 로그의 보관 위치·기간 — 이 세 가지를 CTO 스태프 차원에서 한 장으로 정의해 배포하는 것이 가장 빠른 레버입니다."}]},{"id":"dev","label":"개발 AI 동향","icon":"🛠️","tint":"purple","desc":"함께 일하는 엔지니어 조직의 일하는 방식을 실제로 바꾸는 도구 변화.","criteria":"버전 번호와 체인지로그는 걷어내고, <b>팀의 작업 경로·리뷰 방식·권한 구조가 어떻게 달라지는가</b>만 남겼습니다. 이번 주는 유독 '거버넌스와 장애 대응'으로 이슈가 몰렸습니다.","highlight":{"kicker":"워크플로가 바뀐다","title":"에이전트가 '데모'에서 '승인받아야 하는 사내 자산'으로 — 병목이 성능에서 보안으로 옮겨갔다","summary":"이번 주 코딩 에이전트 생태계의 변화는 기능 추가가 아니라 '관리 가능성'에 있습니다. 스킬과 MCP 서버 설정을 하나의 패키지로 묶어 IDE·CLI·웹·SDK에서 동일하게 동작시키는 플러그인 포맷이 정식화되고, 관리자가 어떤 플러그인·MCP 서버를 사내에서 실행할 수 있는지 허용목록으로 통제하는 관리 설정이 함께 제공됐습니다. 에이전트 도입의 병목이 '성능'에서 '보안·플랫폼 승인'으로 넘어갔다는 뜻입니다.","detail":"<p>실무적으로 세 가지가 달라집니다. 첫째, 사내 에이전트 자산의 표준화가 가능해졌습니다. 지금까지는 팀마다 IDE별 설정 문서를 따로 유지했지만, 이제 하나의 아티팩트로 배포·검증·회수할 수 있어 보안·플랫폼 조직이 '승인할 대상'을 명확히 가질 수 있습니다. 둘째, IDE가 Git worktree를 이용해 같은 저장소에 여러 에이전트 세션을 병렬로 돌리는 방식이 보편화되고 있습니다. 여러 접근법을 동시에 시도하면서 브랜치 충돌을 줄이는 구조인데, 리뷰 대기열과 CI 부하 설계가 함께 바뀝니다. 셋째, 모델 선택이 '이벤트'가 아니라 '주기적 운영 업무'가 됐습니다. 승인 모델 목록을 조직 차원에서 관리하지 않으면 '피커에서 한번 써봤다'가 그대로 지출로 남습니다.</p><p>데이터에 접근하는 MCP 서버 설계를 통합 작업이 아니라 보안 엔지니어링으로 다뤄야 한다는 가이드도 구체화됐습니다. 점진적 스키마 노출, 읽기 전용 강제, 최소 권한 역할, 파괴적 작업에 대한 명시적 확인이 권고 패턴으로 정리됐습니다. 전체를 관통하는 원칙은 하나입니다 — '에이전트는 제안하고, PR이 결정한다'. CI 체크·코드리뷰·브랜치 보호 같은 결정론적 장치가 에이전트 산출물의 신뢰를 만듭니다.</p>","source":"Tech Hub (Weekly GitHub Copilot Roundup)","url":"https://tech.hub.ms/github-copilot/roundups/weekly-github-copilot-roundup-2026-08-17","published":"2026-08-17","foryou":"지금 필요한 산출물은 도구 도입 결정이 아니라 '사내 에이전트 자산 카탈로그 + 승인 프로세스'입니다. 이번 스프린트에 ① 승인된 플러그인·MCP 서버 허용목록과 각 소유자, ② 프로덕션 데이터에 닿는 MCP 서버의 읽기 전용·최소 권한 기본값, ③ 저장소별 리포 지침 소유자와 갱신 주기를 문서 한 장으로 확정하면, 확산 속도를 늦추지 않고 보안 조직 승인을 받을 수 있습니다."},"articles":[{"tag":"AI 도구 보안","source":"The Hacker News (GitProtect Lab 리포트 기반)","url":"https://thehackernews.com/expert-insights/2026/08/why-your-ai-developer-tools-might-be.html","published":"2026-08-17","title":"상반기 DevOps AI 보안사고 84건 — 전년 동기 대비 약 3배","summary":"주요 DevOps 플랫폼에서 집계된 AI 관련 보안 사고가 2025년 연간 68건이었는데, 2026년은 상반기 6개월만에 84건으로 전년 동기 대비 약 3배가 됐습니다. DevOps·보안 리더 설문에서는 3명 중 1명이 이미 AI와 직접 연결된 보안 사고를 겪었다고 답했습니다. 생산성 이득은 분명하지만 가드레일 없이 쓰면 운영 리스크가 그만큼 커진다는 정량적 근거입니다.","detail":"<p>핵심 공격 경로는 간접 프롬프트 인젝션입니다. 이슈 티켓, PR 코멘트, 에이전트 설정 파일, 오염된 MCP 툴 설명, 업로드 문서 같은 '비정형 데이터'에 명령을 심어두면, 조직 전체 읽기 권한을 가진 에이전트가 의도치 않은 내부자로 바뀝니다. 서버를 뚫거나 계정을 훔칠 필요 없이 공개 코멘트 한 줄로 소스코드·API 키·환경변수가 외부로 흐를 수 있습니다.</p><p>두 번째 축은 자율 실행에 따른 가용성 사고입니다. 인프라 오류를 '고치라'는 지시를 받은 에이전트가 비즈니스 맥락 없이 라이브 컴포넌트를 재생성해 트래픽을 끊는 시나리오가 대표적입니다. 세 번째는 공급망입니다. 악성 코드가 전혀 없는 저장소가 특정 런타임 오류를 일으키도록 설계되고, 에이전트가 '자가 치유'로 실행하는 수정 명령이 외부 DNS 레코드에서 페이로드를 끌어오는 방식이 보고됐습니다.</p>","foryou":"이 숫자는 보안 조직에 '왜 지금 가드레일 예산이 필요한가'를 설명할 때 그대로 쓸 수 있는 근거입니다. 실행 항목은 세 가지입니다 — 코드리뷰 목적 에이전트에서 셸 실행 권한 제거, 저장소 접근을 읽기 전용으로 내리고 커밋·머지는 사람 승인 게이트 뒤로 이동, 에이전트가 접근 가능한 CI 시크릿을 저장소별로 뽑아 단기 토큰으로 전환."},{"tag":"에이전트 취약점","source":"Adversa AI","url":"https://adversa.ai/blog/top-10-zero-click-attacks-against-ai-agents","published":"2026-08-18","title":"'제로클릭' 에이전트 공격 톱10 — 승인 프롬프트를 신뢰 기준으로 쓸 수 없게 됐다","summary":"실제 출시된 제품에서 문서화된 제로클릭(사용자 조작 없이 성립하는) 에이전트 공격 10건을 무엇이 깨졌고 어떤 통제가 리스크를 줄이는지 기준으로 정리한 리뷰입니다. 공통 결론은 하나입니다 — 사용자가 승인한 것과 실제로 실행된 것이 다릅니다. 즉 '승인 다이얼로그를 사람이 보고 막는다'는 전제는 더 이상 통제 수단이 아닙니다.","detail":"<p>문제는 개별 벤더 버그가 아니라 여러 제품에서 동시에 무너지는 신뢰 경계입니다. 심볼릭 링크와 승인 우회 패턴이 여러 코딩 어시스턴트에서 동일하게 관찰됐고, 딥링크 한 번 클릭으로 공격자 통제 MCP 서버가 설치되는 사례, 웹페이지의 숨겨진 텍스트를 읽은 에이전트가 스스로 자기 MCP 설정 파일을 다시 쓰는 사례, 공개 이슈 본문만으로 에이전트가 같은 조직의 비공개 저장소를 읽어 공개 코멘트로 붙여버린 사례가 함께 보고됐습니다. 저장소 자체(README, 의존성 파일, 이슈 본문, 스킬 마크다운)를 '적대적 입력'으로 가정해야 한다는 뜻입니다.</p><p>흥미로운 점은 가장 교훈적인 사고가 익스플로잇이 아니었다는 것입니다. 첫 세션 10분 만에 에이전트가 스키마 불일치를 조사하다 마이그레이션 도구를 잘못된 대상에 실행해 프로덕션 DB를 삭제한 사용자 보고가 있었습니다. 파괴적 DB·파일시스템 작업은 일반 편집과 다른 별도 권한 클래스로 분리해야 한다는 결론으로 이어집니다.</p>","foryou":"AI 코딩 도구 도입·갱신 심사 체크리스트를 '기능 비교'에서 '신뢰 경계 질문'으로 바꿔야 합니다. 최소한 ① 파괴적 작업(DB 마이그레이션·삭제·인프라 변경)을 일반 편집과 분리된 권한으로 다룰 수 있는가, ② OS 레벨 샌드박스인가 에이전트 레벨 거부목록인가, ③ 에이전트가 이름을 해석하는 소스(패키지·스킬 레지스트리)를 허용목록으로 제한할 수 있는가 — 이 세 문항을 벤더 서면 답변으로 받아두세요."},{"tag":"개발 인프라 리스크","source":"The GitHub Blog","url":"https://github.blog/news-insights/company-news/the-august-17-outage-and-the-work-ahead/","published":"2026-08-20","title":"깃허브 7시간 47분 장애 — 원인은 배포가 아니라 용량과 '재시도 폭증'이었다","summary":"8월 17일 GitHub.com과 API·Actions·Issues·PR·인증·Copilot이 약 7시간 47분간 영향을 받은 장애의 사후분석이 8월 20일 공개됐습니다. 원인은 신규 배포나 설정 변경이 아니라, 트래픽이 신기록을 찍는 상황에서 중앙 미국 데이터센터의 핵심 구성요소가 함께 스케일하지 못한 용량 문제였습니다. 복구 국면에서는 클라이언트 측 재시도 루프가 트래픽을 다시 밀어올려 회복을 지연시켰습니다.","detail":"<p>최악 구간에서 웹·API 오류율은 약 20%, 아카이브·원본 콘텐츠 다운로드 오류율은 50%에 근접했습니다. 특히 Copilot 주변에서 발생한 재시도 트래픽이 복구를 방해했다는 점이 이번 사고의 핵심 교훈입니다. AI 코딩 에이전트는 실패 시 사람보다 훨씬 공격적으로 재시도하고, 그 재시도가 그대로 원인 시스템에 부하로 돌아갑니다.</p><p>깃허브는 8월 6일과 17일 사고를 묶어 두 가지 즉시 조치를 내놨습니다. 서비스 간 호출 전반에 일관된 재시도 한도·재시도 예산·가변 타임아웃을 적용해 재시도 폭풍과 연쇄 부하를 막는 것, 그리고 급격한 트래픽 급증 시 먼저 무너질 수 있는 구성요소를 찾기 위해 낮은 우선순위의 CPU·메모리 알람을 재검토하는 것입니다.</p>","foryou":"우리 조직의 에이전트·CI 클라이언트가 외부 API 실패 시 어떤 재시도 정책을 쓰는지 지금 확인할 가치가 있습니다. 지수 백오프+지터, 조직 단위 재시도 예산, 회로 차단기가 없으면 우리가 남의 장애를 길게 만드는 쪽이 됩니다. 동시에 '깃허브가 8시간 멈추면 배포·릴리스·에이전트 워크플로가 어디까지 멈추는가'를 릴리스 계획 리스크로 명시하고, 최소 수동 배포 경로를 한 번은 훈련해두세요."}]},{"id":"tpm","label":"TPM 업무 자동화","icon":"📋","tint":"blue","desc":"로드맵·스프린트·문서화·커뮤니케이션에 이번 주부터 바로 붙여볼 수 있는 기능.","criteria":"데모가 예쁜 기능이 아니라 <b>TPM이 매주 반복하는 작업을 실제로 덜어주는</b> 것만 골랐습니다. 이번 주는 '에이전트 작업을 팀이 볼 수 있게 만드는' 방향의 변화가 많았습니다.","highlight":{"kicker":"바로 써볼 것","title":"코딩 에이전트가 채널로 올라왔다 — 슬랙 'Code'로 에이전트 작업이 팀에 보이기 시작","summary":"슬랙이 8월 21일 AI 코딩 에이전트를 슬랙 채널 안에 직접 붙이는 'Slack Code'를 공개했습니다. Claude Code, Devin, GitHub Copilot, Vercel 에이전트를 전용 채널에서 팀 단위로 함께 지시·검토·배포할 수 있고, 대화·플랜·코드 diff·라이브 프리뷰가 탭으로 분리돼 제공됩니다. 모든 슬랙 플랜에서 즉시 사용 가능하고(파트너 에이전트 이용권은 별도), 향후 API를 개방해 사내 커스텀 에이전트도 붙일 수 있게 할 계획입니다.","detail":"<p>그동안 코딩 에이전트 작업은 개인 터미널·IDE 안에서 벌어져 팀이 볼 수 없는 '블랙박스'였습니다. Slack Code는 이 흐름을 공개 채널로 끌어올려, 에이전트가 세운 계획과 만들어낸 diff, 실행 결과 프리뷰를 채널 참여자 전원이 동시에 보고 라인 단위로 코멘트하며 방향을 틀 수 있게 만들었습니다. TPM 관점에서 핵심은 '에이전트 작업의 감사 기록이 자연스럽게 슬랙 스레드로 남는다'는 점입니다.</p><p>전략적으로는 슬랙을 '사람+에이전트 공동 작업 표면'으로 재정의하려는 시도입니다. Microsoft Teams/Copilot, Atlassian Rovo와 정면으로 겹치는 영역인데, 멀티 에이전트를 특정 벤더에 묶지 않고 채널 위에 얹는다는 점에서 개방형 포지셔닝을 택했습니다.</p>","source":"Dataconomy","url":"https://dataconomy.com/2026/08/21/slack-launches-code-for-ai-coding-collaboration/","published":"2026-08-21","foryou":"이미 슬랙을 쓰고 있다면 코딩 에이전트 논의를 '어떤 에이전트를 살까'에서 '에이전트 작업을 어느 채널에 어떤 승인 규칙으로 노출할까'로 옮길 수 있습니다. 파일럿 스쿼드 1~2개를 골라 code 채널에 PR 승인 게이트와 리뷰어 지정 규칙을 붙이고, 4주 뒤 '에이전트가 만든 PR의 리뷰 리드타임·리버트율'을 지표로 뽑아 전사 확산 여부를 판단하는 실험 설계가 바로 가능합니다."},"articles":[{"tag":"보고서 자동화","source":"전자신문","url":"https://www.etnews.com/20260820000250","published":"2026-08-20","title":"오픈AI '챗GPT 워크' 서울 데모 — 조사부터 보고서 초안까지 한 흐름으로","summary":"오픈AI가 8월 20일 서울에서 '챗GPT 워크' 미디어 데모 세션을 열고, 단순 업무 자동화를 넘어 연구보고서·자료집 초안 작성까지 확장된 활용 사례를 공개했습니다. 코딩 에이전트 '코덱스' 기술이 내장돼 정보 수집부터 스프레드시트·슬라이드·문서 완성까지 하나의 흐름으로 처리합니다. 국내에서는 삼성전자·삼성디스플레이 등 기업과 서울대가 이미 쓰고 있습니다.","detail":"<p>TPM 업무에 직결되는 건 세 가지입니다. 첫째, 구글 드라이브·지메일·세일즈포스·데이터브릭스 등 1400개 이상 서비스를 플러그인으로 연결하고, 사내 자체 데이터가 붙은 내부 시스템도 플러그인으로 물려 맥락을 끌어올 수 있습니다. 둘째, '예약 작업' 기능으로 정기적으로 프로젝트 정보를 갱신해 업무 연속성을 유지합니다. 셋째, 내장 브라우저를 통해 조사→분석→반복업무→결과물 제작이 끊기지 않습니다. 코덱스와 챗GPT 워크 합산 주간활성사용자는 1000만명을 넘었습니다.</p><p>보안 질문에 대해 오픈AI 측은 \"플러그인 연결로 생기는 보안 이슈는 'AI의 데이터 접근 범위 제한' 등 프롬프트로 제어 가능하다\"고 답했는데, 이 부분은 그대로 받아들이기 어려운 지점입니다. 서울대 사례는 국가별 통계·법령·정책문서를 수집·구조화해 보고서 초안까지 이어지고, 연구자는 출처·사실관계 검증에 집중하는 역할 분담을 제시했습니다.</p>","foryou":"'주간 사업보고·분기 리뷰덱' 같은 반복 산출물을 예약 작업 + 사내 플러그인 조합으로 초안까지 자동 생성하는 파일럿을 설계할 수 있습니다. 단, 플러그인 접근범위를 프롬프트로만 통제한다는 점은 리스크이므로, 커넥터별 read/write 권한과 접근 가능한 스페이스 화이트리스트를 먼저 정의한 뒤 도입 순서를 잡으세요."},{"tag":"이슈·스프린트","source":"Atlassian Blog","url":"https://www.atlassian.com/blog/development/jira-summer-release","published":"2026-08","title":"지라 여름 릴리스, AI 에이전트가 '반복 조율 업무'를 먼저 들고 온다","summary":"지라의 2026 여름 릴리스가 8월 말까지 지라 클라우드 전반에 순차 적용됩니다. AI 에이전트가 더 능동적으로 바뀌어 인사이트를 먼저 띄우고, 상태 업데이트를 스스로 작성하고, 반복되는 조율 업무를 대신 가져갑니다. 여기에 핵심 화면 재구축, 캐파 플래닝, 수식 필드, 성능 개선이 함께 들어갑니다.","detail":"<p>주목할 지점은 '요청하면 해준다'에서 '먼저 가져간다'로 바뀐 방향입니다. TPM 업무에서 실제 시간을 먹는 건 판단이 아니라 조율입니다 — 지연 감지, 담당자 확인, 상태 업데이트 작성, 관련자 공유. 이 구간이 자동화되면 남는 시간은 판단에 쓰입니다.</p><p>동시에 리스크도 같이 옵니다. 에이전트가 작성한 상태 업데이트가 실제 상황보다 낙관적이거나 맥락을 놓친 채로 관련자에게 전달되면, 그 오차를 나중에 사람이 되돌려야 합니다. 캐파 플래닝도 마찬가지로 입력 데이터(가용률, 휴가, 병행 과제)의 정확도가 낮으면 그럴듯한 숫자가 오판을 만듭니다.</p>","foryou":"자동 상태 업데이트를 켜기 전에 '에이전트가 쓴 업데이트는 담당자 확인 후 발송'을 2~3주간 기본값으로 두고 오차 패턴을 모아보세요. 오차 유형이 파악되면 그때 자동 발송으로 전환하면 됩니다. 캐파 플래닝은 가용률 입력 규칙(휴가·병행 과제·온콜 반영 방식)을 먼저 통일하지 않으면 숫자만 예뻐집니다."},{"tag":"회의 자동화","source":"Notion Releases","url":"https://www.notion.com/releases","published":"2026-08-19","title":"회의 노트가 끝나면 에이전트가 이어받는다 — 노션 커스텀 에이전트 트리거 확장","summary":"노션이 AI 회의 노트 작성이 끝나는 시점을 트리거로 커스텀 에이전트를 실행하는 기능을 확장했습니다. 회의 후 트래커 업데이트, 요약 공유, 피드백을 티켓으로 전환하는 작업을 자동으로 처리합니다. 개발자 API 쪽에서도 수식 참조 정확도, 페이지 쓰기 응답 축소, 에이전트 관리용 Admin API 문서가 정리됐습니다.","detail":"<p>회의록 요약 자체는 이제 어느 도구나 합니다. 차이는 '요약 다음'입니다. TPM 업무에서 실제 시간을 먹는 건 회의 내용을 정리하는 일이 아니라, 정리된 내용을 트래커·티켓·주간 보고 세 곳에 옮겨 붙이는 일입니다. 트리거가 회의 종료 시점에 걸리면 이 옮겨 붙이기가 사라집니다.</p><p>Admin API로 에이전트를 관리할 수 있게 된 점도 함께 볼 만합니다. 팀마다 만든 커스텀 에이전트가 늘어나면 '누가 만든 무엇이 어떤 데이터에 닿는지'를 파악하지 못하는 상태가 곧 옵니다. 관리 API가 있으면 인벤토리를 자동으로 유지할 수 있습니다.</p>","foryou":"가장 회수가 빠른 건 정기 회의(주간 스쿼드 싱크, 스프린트 리뷰) 한 개를 골라 '회의 종료 → 액션아이템 티켓 생성 → 담당자 알림'까지만 자동화해보는 것입니다. 전면 도입 검토보다 한 회의체에서 2주 돌려보고 결정하세요. 동시에 Admin API로 사내 커스텀 에이전트 목록을 주기적으로 덤프해두면 나중에 감사 요청에 즉시 답할 수 있습니다."}]},{"id":"biz","label":"빅테크 & 전략 동향","icon":"🌐","tint":"orange","desc":"리더십 보고와 전사 전략 수립에 인용할 만한 산업 맥락.","criteria":"거시·지정학 얘기는 빼고, <b>벤더 선택·투자 판단·조직 설계에 참고가 되는</b> 소식만 담았습니다. 국내 진영 지도와 해외 벤더 리스크를 함께 배치했습니다.","highlight":{"kicker":"국내 진영 지도","title":"'모두의 AI' 6파전 확정 — 카카오·LG 연합 vs SKT vs KT, 네이버는 불참","summary":"전 국민이 무료로 쓰는 AI 챗봇·에이전트를 개발하는 과기정통부 '모두의 AI' 사업에 총 6개 컨소시엄이 지원해 경쟁 구도가 확정됐습니다. SK텔레콤(K-AI 얼라이언스), KT(업스테이지·모티프·NC AI·솔트룩스), 이스트소프트(메가존·와이즈넛 등)가 주관사로 나섰고, 카카오는 LG유플러스·LG AI연구원·LG CNS·LG전자 등 14개사 컨소시엄을 이끕니다. 독파모 톱5였던 네이버클라우드·네이버는 불참했습니다.","detail":"<p>카카오 컨소시엄은 카카오가 주관, LG AI연구원이 'K-엑사원' 모델 제공·고도화·안전성 검증을, LG전자가 디바이스 연계, LG CNS가 공공 시스템·데이터 연계를 맡는 구조입니다. 여기에 루닛·서울대병원·신한은행·크라우드웍스·퓨리오사AI 등이 합류했습니다. 국내 1·2위 플랫폼 중 카카오만 참여하고 네이버가 빠졌다는 점, 통신 3사 중 SKT·KT가 각각 독자 컨소시엄을 꾸렸다는 점이 진영 지도의 핵심입니다.</p><p>평가 배점이 시사적입니다. 서면평가에서 AI 모델 활용 적정성·서비스 고도화·개발계획 구체성 등 '서비스' 관련 항목이 100점 만점에 70점, 발표평가에서도 서비스 편의성·이용자 확보·유지가 50점, 서비스 품질·안전성이 30점입니다. 모델 성능이 아니라 서비스 기획·운영 역량이 당락을 가른다는 뜻입니다. 과기정통부는 8월 중 2~3개 사업자를 선정해 9월 말 베타, 12월 본서비스를 계획하고 있습니다.</p>","source":"전자신문","url":"https://www.etnews.com/20260818000352","published":"2026-08-18","foryou":"국내 AI 진영이 '모델 성능'보다 '서비스 운영 역량'으로 평가받는 구도가 정부 사업 배점으로 공식화됐다는 점은 리더십 보고에 쓸 만한 프레임입니다. 실무적으로는 어느 진영이 선정되느냐에 따라 국산 모델(K-엑사원 / A.X K2 / 솔라) 중 어떤 계열이 국내 생태계·툴체인·인재 풀에서 표준에 가까워질지 갈리므로, 9월 말 베타 시점을 사내 모델 벤치마킹 재검토 트리거로 캘린더에 걸어두세요."},"articles":[{"tag":"벤더 리스크","source":"머니투데이 / Bloomberg","url":"https://www.mt.co.kr/world/2026/08/22/2026082216095693847","published":"2026-08-22","title":"앤트로픽, 2조 달러 몸값 IPO 추진 — 프런티어 벤더가 상장사가 된다","summary":"앤트로픽이 최대 2조 달러 기업가치를 목표로 1000억 달러 이상을 조달하는 IPO를 추진 중입니다. 성공하면 스페이스X를 넘어 역대 최대 IPO입니다. 지난달 연환산 매출은 650억 달러를 넘겨 작년 말 90억 달러에서 7개월 만에 7배 이상 늘었고, 수 주 안에 투자설명서 공개가 예상됩니다. 이미 비공개로 신청했고 모건스탠리·골드만삭스·JP모건이 주관합니다.","detail":"<p>매출 런레이트는 2025년 말 약 90억 달러 → 4월 300억 달러 → 5월 470억 달러 → 7월 650억 달러로 분기가 아니라 월 단위로 계단을 올랐습니다. 2분기 예비 매출은 115억 달러 이상(1년 전 7억8700만 달러)이고 조정 영업이익 흑자를 기록했다고 보도됐습니다. 다만 2025년 순손실은 약 420억 달러 규모로, 상장 후에는 마진·지출·거버넌스에 대한 외부 감시가 커집니다.</p><p>실무적 함의는 가격 정책입니다. 상장 후 분기 실적 압력은 무료·저가 티어 운영, 사용량 한도, 엔터프라이즈 할인 구조를 '성장 우선'에서 '수익성 증명' 쪽으로 기울일 수 있습니다. 안정성 신호도 같은 주에 있었습니다. 8월 16일 인증 실패를 시작으로 약 42분간 claude.ai·Claude Code 등 사용자 대면 제품이 중단됐고 API는 대체로 유지됐습니다. OpenAI도 비공개 IPO 서류를 제출한 상태여서, 주요 벤더 두 곳이 동시에 공개시장 규율 아래로 들어가는 국면입니다.</p>","foryou":"모델 벤더가 상장사가 되면 요금·약관 변경 주기가 짧아지고 공시로 예고됩니다. 갱신 협상 전에 ① 다년 가격 고정 또는 인상 상한 조항, ② 사용량 한도 변경 사전 통지 조항, ③ 사용자 대면 제품 장애 시 API 경로로 자동 폴백하는 운영 절차 — 이 세 가지를 준비하면 이번 뉴스가 실제 방어력으로 바뀝니다."},{"tag":"가격 전략","source":"전자신문","url":"https://www.etnews.com/20260823000066","published":"2026-08-23","title":"오픈AI, 최상급 'GPT-5.6 Sol' API 3개월 한시 인하 — 출력 가격은 33% 내렸다","summary":"오픈AI가 최상급 모델 GPT-5.6 Sol의 API·크레딧 가격을 3개월간 한시적으로 인하합니다. 입력 20%, 출력 33.3% 인하이며 11월 21일까지 적용됩니다. 같은 주 GPT-5.6 Luna 요금을 최대 80% 인하하고 Sol은 속도를 2.5배 높이는 등 라인업 전반의 가격·성능 재배치를 진행했습니다.","detail":"<p>눈여겨볼 대목은 '한시적'이라는 조건입니다. 영구 인하가 아니라 3개월 창구를 열어 실제 프로덕션 트래픽을 끌어들이고, 전환 비용이 발생한 뒤 원가로 복귀하는 구조입니다. 입력보다 출력 인하폭이 큰 것(20% vs 33.3%)도 시사점이 있습니다. 장문 생성·에이전트 다단 추론처럼 출력 토큰이 많은 워크로드에 유리하게 설계돼 있어, 에이전트형 사용을 유도하는 가격 설계입니다.</p><p>앤트로픽 IPO 추진과 맞물려 보면, 프런티어 모델 시장이 '성능 경쟁'에서 '단가와 처리량 경쟁'으로 축을 옮기고 있음을 보여줍니다. 모델 성능 격차가 좁혀질수록 벤더가 팔 수 있는 것은 가격·속도·유통이 됩니다.</p>","foryou":"3개월 한시 인하는 '지금 벤치마킹하고 11월에 재계약 협상하라'는 신호로 읽는 게 맞습니다. 프런티어 모델을 쓰는 사내 워크로드를 골라 이 기간에 동일 프롬프트로 원가·품질을 실측해두면, 11월 21일 이후 단가 복귀 시 어떤 워크로드를 저가 모델로 내릴지 데이터로 결정할 수 있습니다. 출력 인하폭이 큰 만큼 요약·보고서 생성처럼 출력이 무거운 TPM 워크로드를 우선 이관 후보로 잡으세요."},{"tag":"국내 인프라 전략","source":"글로벌이코노믹 / 디지털데일리","url":"https://www.g-enews.com/article/ICT/2026/08/2026080310020347233d7a510102_1","published":"2026-08-03","title":"네이버 AI 팩토리, 엔비디아 10억 달러 유치 — '소버린 AI 수요'를 파는 쪽으로","summary":"네이버가 엔비디아로부터 10억 달러 규모 제3자 배정 유상증자를 유치했고(지분 4.5%, 납입 10월 30일), 브룩필드와는 90억 달러 규모 GPU 인프라·데이터센터 사전계약을 체결했습니다. AI 팩토리는 2027년 상반기 55MW로 가동을 시작해 2028년 200MW, 이후 1GW급까지 확장하며 아시아·태평양·유럽·중동의 소버린 AI 수요를 공략합니다.","detail":"<p>카카오가 법인을 쪼개 유통 채널 위에서 AI를 수익화하려는 것과, 네이버가 컴퓨트와 데이터센터를 소유해 '소버린 AI를 팔겠다'는 것은 정반대 베팅입니다. 같은 국내 시장에서 두 회사가 서로 다른 자본 구조를 선택했다는 점이 이번 주 국내 전략 지도의 핵심입니다.</p><p>실무적으로 참고할 지점은 벤더 협상입니다. 네이버 사례는 '우리가 상대하는 회사가 어디까지 수직 통합했는지'를 파악하는 기준이 되고, 대부분의 조직에게 실제로 복제 가능한 모델은 카카오형(가진 채널에 남의 모델을 얹는 쪽)입니다. 인프라 소유 논의보다 '우리 채널에서 AI가 완결되는 지점이 어디인가'로 논의를 좁히는 게 생산적입니다.</p>","foryou":"전사 AI 전략 문서를 쓸 때 이 두 사례는 '무엇을 소유하고 무엇을 빌릴지'를 설명하는 좋은 대조군입니다. 특히 GPU 조달·클라우드 학습 예산을 다년으로 잡고 있다면, 국내 대형 사업자가 컴퓨트 공급 쪽으로 진입한다는 사실을 조달 시나리오(낙관·기준·비관)에 반영해두면 내년 예산 재승인 요청을 줄일 수 있습니다."}]},{"id":"case","label":"국내외 AI 도입 사례","icon":"📚","tint":"gray","desc":"실제로 도입해본 조직들의 결과 — 성과, 실패 요인, 그리고 조직이 어떻게 바뀌었는지.","criteria":"'AI를 도입했다'는 보도자료가 아니라 <b>규모·성과·조직 변화가 확인되는</b> 사례만 담았습니다. 이번 주는 특히 실패·기대 미달을 스스로 공개한 국내 사례가 값집니다.","highlight":{"kicker":"국내 사례","title":"현대차그룹 임직원 80%가 사내 AI를 쓴다 — 그런데 진짜 자산은 그 앞의 7년이었다","summary":"현대차그룹이 8월 12일 'AX 성과 발표회'를 열고 2019년 DX 착수 이후 7년간의 전사 AI 전환 성과를 공개했습니다. 사내 생성형 AI 플랫폼 'H Chat Pro' 사용자가 3만명을 넘어 현대차·기아 일반·연구직 임직원의 약 80%에 달하고, 개발자가 아닌 현업 담당자가 직접 AI 에이전트를 만드는 단계까지 왔습니다. 발표의 무게는 '사용량'이 아니라 업무별로 검증된 정량 성과에 있었습니다.","detail":"<p>정량 성과가 업무 단위로 쪼개져 제시된 것이 특징입니다. 연구개발에서는 '충돌안전 AI 어시스턴트'가 여러 시스템에 흩어진 충돌 시험 결과·이미지·해석 자료를 통합 검색하게 해 사례 탐색·분석 시간을 약 90% 줄였습니다. 제조에서는 차량 식별번호 자동 판독을 국내외 약 70개 생산 거점에 적용해 연간 52억4000만원을 절감했고, 부품 공급 대차 경로 최적화로 불필요한 생산 중단 시간을 약 86% 줄였습니다. 정비 현장 진단 대응 시간은 약 42% 단축, 고객 리뷰 대응은 1건당 평균 35분에서 5분으로 줄어 현재 전체 리뷰의 약 85%를 AI가 처리합니다.</p><p>주목할 점은 AI가 아니라 그 앞단의 7년입니다. 2019년부터 Jira·Dooray·Confluence를 순차 도입해 업무 과정과 지식을 데이터로 축적하고, 연구개발·생산·품질·판매 데이터를 '글로벌 원 데이터 파이프라인'으로 연결한 뒤에야 H Chat Pro(ChatGPT·Gemini·Claude를 보안 환경에서 선택 사용)가 얹혔습니다. 제조 특화 플랫폼에서는 품질·생산·설비·물류 엔지니어가 자기 업무용 에이전트를 직접 만듭니다. 진은숙 현대차·기아 ICT담당 사장은 \"AI를 가장 많이 쓰는 기업이 아니라 가장 제대로 쓰는 기업\"이 목표라고 밝혔습니다.</p>","source":"디지털데일리","url":"https://www.ddaily.co.kr/page/view/2026081210094839897","published":"2026-08-12","foryou":"전사 AI 성과를 '도입률' 한 줄로 보고하지 말고, '업무 단위 × 절감 지표 × 적용 범위(거점 수·처리 비중)' 3열 테이블로 관리하면 경영진 보고와 다음 투자 우선순위 판단이 동시에 해결됩니다. 특히 '리뷰 1건당 35분→5분, 전체의 85% 처리' 같은 형식은 리뷰·CS·정산 같은 반복 오퍼레이션에 그대로 이식 가능한 측정 템플릿입니다."},"articles":[{"tag":"국내 사례 · 확산 실패","source":"아이티데일리","url":"https://www.itdaily.kr/news/articleView.html?idxno=241080","published":"2026-08-19","title":"\"실패하는 PoC는 없다, 확산에서 실패한다\" — KB·HD현대·롯데쇼핑의 자기 진단","summary":"8월 19일 'AI 서밋 서울 2026' 패널에서 KB국민은행·HD현대·롯데쇼핑 임원이 각사 AI 확산 경험과 실패를 공개했습니다. 공통 진단은 \"실패하는 PoC는 없다, 확산 단계에서 안 된다\"였습니다. 업무시간 절감은 확인됐지만 이를 매출·이익으로 환산하는 문제는 세 회사 모두 미해결 과제로 남겨뒀습니다.","detail":"<p>KB금융은 그룹 전체에서 약 100개 AI 서비스를 운영하며 300여 개까지 확대를 추진합니다. 대상자의 약 90%가 실제로 쓰고 실사용자는 8000명을 넘었습니다. 망분리 제약을 우회하려고 'AI Dev 센터'를 세워 외부 R&D 환경에서 SaaS 도구로 1차 개발한 뒤 안전 절차를 거쳐 내부망으로 결과물을 반입하는 프로세스를 만들었습니다. HD현대는 LLM·VLM을 전장·기장 설계에 적용해 특정 설계 작업을 1주일에 끝내며 약 3주치 공수를 줄였는데, 범용 LLM으로는 현장 수준의 답이 나오지 않아 오픈소스 모델에 내부 데이터를 파인튜닝한 제조 특화 모델을 씁니다.</p><p>실패 사례가 가장 구체적인 쪽은 롯데쇼핑입니다. 내부 업무에서는 \"숙련자가 1시간 걸리던 일을 1분에 하는\" 사례가 여럿 나왔지만, 지난해 내놓은 고객용 '뷰티 AI'는 트래픽·고객 유입으로 이어지는 연결고리가 기대만큼 강하지 않았습니다. 원인으로 꼽힌 것은 모델 성능이 아니라 <b>이미 ChatGPT·Gemini·Claude에 익숙해진 소비자의 UX 기대치</b>였습니다. 담당 임원은 매출·이익을 직접 KPI로 잡는 대신 CTR 개선→CVR 개선처럼 AI가 직접 영향을 줄 수 있는 중간 KPI를 임직원·경영진 합의로 설계하는 중이라고 밝혔습니다. 배경 지표로 인용된 맥킨지 조사에서는 88%가 최소 한 개 업무에 AI를 쓰지만 EBIT 5% 이상 기여로 '상당한 가치'를 만든 기업은 약 6%였습니다.</p>","foryou":"고객 대면 AI 기능은 '모델 품질'이 아니라 '범용 LLM에 길들여진 사용자 기대치'와 경쟁한다는 롯데쇼핑의 자기 진단은, 우리 앱에 AI 추천·대화형 검색을 붙일 때 벤치마크를 경쟁 커머스가 아니라 ChatGPT로 잡아야 한다는 뜻입니다. 또 매출/이익을 곧바로 KPI로 걸지 말고 CTR→CVR 같은 중간 KPI를 경영진과 사전 합의하는 방식은, AI 과제 승인 게이트에 '측정 가능한 중간 지표 정의'를 필수 항목으로 넣을 근거가 됩니다."},{"tag":"해외 사례 · 실패 요인","source":"VentureBeat","url":"https://venturebeat.com/orchestration/enterprises-winning-with-ai-agents-are-limiting-how-much-the-agents-can-do-alone","published":"2026-08-22","title":"에이전트로 성과 내는 기업들은 오히려 '자율성'을 줄이고 있다","summary":"'자율성이 클수록 성능이 좋다'는 가정으로 배포된 에이전트들이 실제 프로덕션에서 대규모로 실패하고 있다는 분석입니다. 가트너는 현재 진행 중인 에이전틱 AI 프로젝트의 40% 이상이 2028년을 못 넘길 것으로 봅니다 — 모델 성능 부족이 아니라 비용 급증, 불명확한 비즈니스 가치, 부실한 리스크 통제 때문입니다. 성과를 낸 기업은 가장 유능한 에이전트를 만든 곳이 아니라 리스크·법무 승인을 받아내고 그 승인을 유지한 곳이라는 논지입니다.","detail":"<p>맥킨지 조사에서 책임 AI 성숙도는 4점 만점에 평균 2.3, 거버넌스·에이전틱 통제 영역에서 3점 이상에 도달한 조직은 약 30%에 불과합니다. 에이전트 배포 속도는 거버넌스 성숙도 개선 속도의 약 8배입니다. 벤더 노이즈도 지적됩니다 — 가트너 집계로 '에이전틱 AI' 라벨로 팔리는 수천 개 제품 중 실제 자율 실행 능력을 갖춘 것은 약 130개뿐입니다. 실패 패턴은 반복적입니다. 야심찬 광범위 자율 워크플로로 출발 → 수 주 내 통합 복잡도에 부딪힘 → ROI 경로 없이 정체.</p><p>반대로 성숙한 조직에서 반복 관찰되는 네 가지 패턴을 제시합니다. ① 범용 에이전트 대신 단일 책임의 좁은 에이전트로 워크플로를 분해한다(실패 범위가 작으면 감사 범위도 작다). ② 휴먼 체크포인트를 결과 이후가 아니라 <b>의사결정 경계 앞</b>에 둔다 — 민감 데이터가 이동하거나 트랜잭션이 기록되거나 외부 시스템이 트리거되기 '전'. ③ 의사결정 추적성을 사후 재구성이 아닌 설계 요구사항으로 못 박는다. ④ 데이터 주권을 서류가 아니라 blast radius 제한 장치로 쓴다. 동시에 모든 사소한 작업에 승인을 요구하는 에이전트는 \"수동 프로세스를 코스튬처럼 입은 자동화\"일 뿐이라며, 목표는 최대 통제가 아니라 오류 비용이 높은 지점에 집중된 '캘리브레이션된 통제'라고 못 박습니다.</p>","foryou":"기사가 제시한 배포 검토 질문 네 개는 사내 에이전트 승인 체크리스트로 그대로 옮겨 쓸 수 있습니다. 특히 '오작동 시 알아채기 전까지 닿을 수 있는 시스템·데이터 범위'를 정산·주문·배차처럼 금전·운영 리스크가 실재하는 도메인의 배포 전 필수 기재 항목으로 만들면, 자율성 수준을 도메인별로 차등 승인하는 근거가 생깁니다."},{"tag":"해외 사례 · 대규모 전환","source":"CIO (Foundry)","url":"https://www.cio.com/article/4210980/wide-ranging-transformation-at-tiaa-enables-dozens-of-business-use-cases.html","published":"2026-08-21","title":"TIAA의 전사 전환 'TETRIS' — 기술부채 절반 감축, 제품 출시 35% 가속","summary":"미국 금융서비스 기업 TIAA가 클라우드·AI를 축으로 한 전사 IT 전환 프로그램 2단계를 완료하고 내부 운영 방식을 공개했습니다. 1단계는 순수 기술 현대화, 2단계는 87개 비즈니스 유즈케이스 활성화로 목표 자체를 바꾼 것이 핵심입니다. 대형 전환 프로젝트 실패율이 70~95%로 추정되는 환경에서 성공 요인으로 지목된 것은 기술이 아니라 지표 설계와 변화관리였습니다.","detail":"<p>2022년 착수 직전 TIAA의 IT 워크로드 80% 이상이 파편화된 단종(EOL) 플랫폼에 남아 있었습니다. 1단계에서 데이터 클라우드를 포함한 10개 엔터프라이즈 플랫폼으로 코어 스택을 현대화하고, 2단계에서 전 사업 부문 87개 유즈케이스를 구현했습니다. 결과로 기술부채를 거의 절반으로 줄였고, 난립했던 17개 디자인 시스템을 통합해 제품 출시 속도를 35% 앞당겼으며 다국어 지원으로 비영어권 고객 18만5000명 이상의 접근성을 개선했습니다.</p><p>담당 임원이 강조한 두 가지는 지표와 투명성입니다. 1단계는 '플랫폼 납품과 마이그레이션 달성'처럼 비즈니스 목표와 분리된 지표로, 2단계는 비즈니스 성과 지표로 이사회와 성공 기준을 나눠 합의했습니다. \"큰 프로그램은 1~2년차에 무엇을 낼 수 있고 실제 사업 임팩트는 언제부터 보이는지 정직하게 말해야 한다\"며 과대 약속을 경계했고, 도구 선택이 틀릴 경우의 플랜 B와 리셋 가능성을 사전에 이사회에 공유했습니다. \"레거시 시스템에서 일하면 언젠가 본인이 레거시 인재가 된다\"는 직원들의 실질적 공포를 업스킬 경로로 전환하는 작업이 프로젝트의 절반이었다고 그는 말합니다.</p>","foryou":"AI 과제 마일스톤 지표를 단계별로 성질을 다르게 잡는 방식(1단계=플랫폼·마이그레이션 산출물, 2단계=비즈니스 성과)은 전사 로드맵을 경영진과 합의할 때 바로 쓸 수 있는 프레이밍입니다. 여기에 '어떤 KPI를 몇 년차에 낼 수 있는지'와 '도구 선택 실패 시 플랜 B'를 승인 문서에 명시해두면, 성과가 늦게 나오는 구간에서 프로그램이 흔들리는 것을 구조적으로 막을 수 있습니다."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.08.17~08.24</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 8월 17일~8월 24일 공개 뉴스 기반. 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
</html>
