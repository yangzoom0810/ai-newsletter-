<script>
const NL={meta:{icon:"🗞️",edition:"Vol.28",cadence:"주간",date:"2026년 7월 20일 (월)",curator:"Claude (Cowork)",title:["주간 AI 뉴스레터 — ","TPM Edition"],lead:"TPM 관점에서 꼭 알아야 할 한 주의 AI 소식. 함께 일하는 엔지니어팀의 도구 변화, 프로그램 관리 자동화, 그리고 리더십 보고에 쓸 수 있는 빅테크 전략 동향까지.",greeting:"안녕하세요! 이번 주는 마이크로소프트가 자사 세일즈에 경쟁 AI를 깎아내리라 지시한 사건부터, 보안 리뷰용 코딩 에이전트를 되레 악성코드 실행 도구로 만드는 'Friendly Fire' 취약점, Jira의 에이전트 정식 출시, 그리고 EU가 구글 안드로이드를 경쟁 AI에 개방하도록 강제한 결정까지 챙겨봤어요. <b>탭마다 'TPM 관점'</b>으로 실무에 어떻게 연결되는지 담았습니다."},topics:[{id:"top",label:"이 주의 핵심",icon:"⚡",tint:"red",desc:"이번 주 AI 업계에서 가장 파급력 있는 한 가지.",criteria:"<b>프로그램 의사결정과 팀 운영에 직접 영향을 주는</b> 소식을 최우선으로 선정했습니다.",highlight:{kicker:"이 주의 빅스토리",title:"마이크로소프트, 자사 세일즈팀에 OpenAI·Anthropic 깎아내리기 교육 — Office 앱서 자사 모델로 교체",summary:"블룸버그 보도에 따르면 마이크로소프트 경영진이 지난주 내부 회의에서 세일즈팀에 OpenAI·구글·Anthropic 제품을 부정적으로 비교하도록 지시했습니다. Copilot 총괄은 Claude가 오피스 앱 내에서 '더 느리고 부정확하며 보안 통합이 부족하다'고 직접 언급했습니다.",detail:"<p><b>TPM 관점에서 왜 중요한가</b>: 마이크로소프트는 Word·Excel 등 핵심 앱에서 OpenAI·Anthropic 모델을 자사 모델로 교체하는 비용 절감 작업을 병행하고 있습니다. 오피스 생태계에 얹힌 AI 워크플로가 있다면, 백엔드 모델이 바뀌면서 품질과 응답 패턴이 달라질 수 있습니다.</p><p><b>공급자 리스크 재확인</b>: 오랜 파트너였던 OpenAI·Anthropic을 동시에 견제 대상으로 삼는 것은, AI 벤더 관계가 언제든 재편될 수 있음을 보여줍니다. 특정 벤더에 고정된 통합이 있다면 대체 경로를 점검해야 할 시점입니다.</p>",source:"TechCrunch",url:"https://techcrunch.com/2026/07/15/microsoft-is-reportedly-training-salespeople-to-talk-down-openai-and-anthropic/",published:"2026-07-15",foryou:"팀이 Microsoft 365 생태계 안에서 Copilot이나 연동 AI 기능을 쓰고 있다면, 최근 응답 품질이나 모델이 바뀐 건 아닌지 확인해보세요. 벤더 의존도 점검을 리스크 레지스터에 올릴 타이밍입니다."},articles:[{tag:"모델 동향",source:"Bloomberg",url:"https://www.bloomberg.com",published:"2026-07-16",title:"Gemini 3.5 Pro, 또 한 번 연기 — 구글 딥마인드 전면 재구축",summary:"7월 17일 출시가 유력했던 Gemini 3.5 Pro가 내부 품질 기준 미달로 다시 연기됐습니다. 200만 토큰 컨텍스트와 'Deep Think' 추론 모드가 예고됐지만 구글은 공식 확인을 하지 않았습니다.",detail:"<p>구글 딥마인드는 재귀적 툴콜링과 SVG 생성에서 구조적 결함을 발견해 베이스 모델을 처음부터 다시 학습시킨 것으로 알려졌습니다.</p><p><b>TPM 관점</b>: 특정 차세대 모델 출시를 전제로 로드맵을 짰다면, 반복되는 지연 가능성을 감안한 버퍼가 필요합니다.</p>",foryou:"Gemini 3.5 Pro 출시를 전제로 한 계획이 있다면, 출시일 대신 '출시 후 N주'를 마일스톤 기준으로 잡아 리스크를 낮추세요."},{tag:"모델 출시",source:"Build Fast with AI",url:"https://www.buildfastwithai.com/blogs/ai-news-today-july-14-2026",published:"2026-07-14",title:"GPT-5.6 3종(Luna·Terra·Sol) 공개 — 100만 토큰 컨텍스트로 장기 에이전틱 벤치마크 우위",summary:"OpenAI가 GPT-5.6 패밀리를 세 가지 크기로 공개했습니다. 100만 토큰 컨텍스트를 지원하며 장기 실행 에이전틱 벤치마크에서 Claude Fable 5를 앞섰다는 보고가 나왔습니다.",detail:"<p>Codex를 비롯한 OpenAI 코딩 도구가 이미 GPT-5.6 Sol로 전환됐습니다.</p><p><b>TPM 관점</b>: 벤치마크 우위가 실제 팀 워크플로 품질로 이어지는지는 별개 문제입니다. 벤더 전환을 검토 중이라면 실제 업무 시나리오로 파일럿 테스트를 먼저 해보세요.</p>",foryou:"AI 모델 벤치마크 발표는 마케팅 신호로만 참고하고, 팀의 실제 업무 케이스로 자체 검증한 뒤 도구 전환을 결정하세요."}]},{id:"devtools",label:"개발 AI 동향",icon:"🛠️",tint:"purple",desc:"함께 일하는 엔지니어팀이 쓰는 AI 도구 변화 — 알아야 대화가 됩니다.",criteria:"엔지니어 팀의 <b>실제 워크플로에 영향을 주는</b> AI 코딩 도구, 보안 이슈, 모델 변화를 중심으로 골랐습니다.",highlight:{kicker:"이 주의 개발 경보",title:"'Friendly Fire' 취약점 — 보안 리뷰용 코딩 에이전트가 되레 악성코드를 실행한다",summary:"AI Now Institute가 공개한 'Friendly Fire' 취약점은 Claude Code·Codex CLI 같은 코딩 에이전트가 제3자 저장소를 보안 리뷰하는 순간, 문서와 소스 코드에 숨겨진 프롬프트 인젝션에 속아 악성 코드를 직접 실행하게 만듭니다. 아직 CVE도, 패치도 없습니다.",detail:"<p><b>공격 원리</b>: 별도의 훅·플러그인·MCP 서버 없이도, 오픈소스 라이브러리의 문서나 소스 파일에 심어둔 지시문만으로 공격이 성립합니다. 'auto-review' 같은 기본 설정에서 특히 취약합니다.</p><p><b>영향 범위</b>: Claude Sonnet 4.6·Sonnet 5·Opus 4.8, GPT-5.5 등 주요 모델 기반 에이전트가 모두 대상입니다.</p>",source:"AI Now Institute",url:"https://ainowinstitute.org/publications/friendly-fire-policy-brief",published:"2026-07-08",foryou:"엔지니어 팀에 '신뢰할 수 없는 외부 저장소를 AI 에이전트의 auto-review·auto-mode로 리뷰하지 말 것'을 공지하세요. 외부 코드 보안 리뷰는 당분간 사람이 먼저 훑어보는 단계를 넣는 게 안전합니다."},articles:[{tag:"거버넌스",source:"Visual Studio Magazine",url:"https://visualstudiomagazine.com/articles/2026/07/14/low-coding-in-the-age-of-ai-dataverse-embraces-copilot-claude-and-cursor.aspx",published:"2026-07-14",title:"마이크로소프트 Dataverse, 코딩 에이전트 플러그인을 Claude·Cursor·Copilot로 확장",summary:"마이크로소프트가 Dataverse의 코딩 에이전트 플러그인을 Claude·Cursor·GitHub Copilot으로 확장하고, MCP 지원·인증·거버넌스 체계를 마이크로소프트 AI 스택 전반에 넓혔습니다.",detail:"<p><b>TPM 관점</b>: 여러 AI 코딩 에이전트가 같은 데이터 플랫폼에 접근하게 되면서, 접근 권한과 감사 로그를 어떻게 통합 관리할지가 새로운 거버넌스 과제로 떠올랐습니다.</p>",foryou:"여러 AI 코딩 도구를 동시에 쓰는 팀이 있다면, 각 도구가 접근하는 데이터 범위와 감사 로그가 한곳에서 확인되는지 점검해보세요."},{tag:"요금제",source:"Developers Digest",url:"https://www.developersdigest.tech/blog/ai-coding-tools-pricing-2026",published:"2026-07",title:"AI 코딩 도구 요금제 개편 러시 — Copilot 사용량 과금 전환, Cursor 좌석 풀 분리",summary:"GitHub Copilot이 6월부터 사용량 기반 과금(AI Credit)과 $100 Max 플랜을 도입했고, Cursor는 Teams 요금제를 자체 모델용과 Claude·GPT 등 서드파티 모델용 좌석 풀로 분리했습니다.",detail:"<p><b>TPM 관점</b>: 정액제에서 사용량 기반으로 전환되면서, 팀별 AI 코딩 도구 사용량을 추적하지 않으면 예산이 예상치 못하게 초과될 수 있습니다.</p>",foryou:"엔지니어 팀의 AI 코딩 도구 월별 사용량과 비용을 대시보드로 추적하는 체계를 지금 만들어두면, 다음 분기 예산 편성이 훨씬 수월해집니다."}]},{id:"tpm",label:"TPM 업무 자동화",icon:"📋",tint:"blue",desc:"로드맵·스프린트·문서화·커뮤니케이션에 바로 쓸 수 있는 AI 기능.",criteria:"<b>TPM 실무에 직접 적용 가능한</b> AI 도구 업데이트를 중심으로 골랐습니다.",highlight:{kicker:"TPM 필수 업데이트",title:"Atlassian Rovo, Jira 에이전트 정식 출시 — 모든 유료 플랜에 네이티브 코딩 에이전트",summary:"Jira의 Rovo 에이전트가 정식 출시(GA)됐습니다. 모든 에이전트 세션이 상태별로 홈에 그룹핑돼 막힌 작업을 풀고, 방향이 틀어진 작업을 리다이렉트하고, 준비된 작업을 승인할 수 있습니다. 이제 Cursor에 작업을 직접 위임할 수도 있습니다.",detail:"<p><b>TPM에게 가장 유용한 기능</b>: 에이전트에게 작업을 할당하고, 댓글로 멘션하고, 워크플로에 임베드할 수 있으며 모든 행동이 로그로 남아 감사 가능합니다. 자동화 규칙으로 버그 수정이나 취약점 대응을 백그라운드 에이전트에 라우팅할 수도 있습니다.</p><p><b>주의</b>: 에이전트가 만든 이슈·배정·PR은 병합 전 반드시 사람이 검토해야 합니다.</p>",source:"The Jira Guy",url:"https://thejiraguy.com/2026/07/15/jira-ai-native-sdlc-launch/",published:"2026-07-15",foryou:"다음 스프린트에서 막혀있는 이슈 목록을 Rovo 홈에서 상태별로 한눈에 보고, 정체된 작업 하나를 에이전트에 시범 위임해보세요. 검토는 반드시 직접 하는 방식으로 시작하면 안전합니다."},articles:[{tag:"도구 업데이트",source:"Releasebot",url:"https://releasebot.io/updates/slack",published:"2026-07",title:"Slack, AI 답변 자동화 스텝 + Confluence·Teams 엔터프라이즈 서치 연동 확장",summary:"Slack이 소스를 지정하면 질문에 자동 답변하고 채널을 요약하는 'AI 답변 스텝'을 워크플로에 추가했습니다. Slackbot은 이제 사용자의 Slack 활동 맥락을 기억해 답변과 초안 작성에 활용합니다.",detail:"<p><b>TPM 활용 시나리오</b>: 여러 팀이 반복적으로 묻는 질문(배포 일정, 담당자 확인 등)에 자동 응답하는 워크플로를 만들어두면, 상태 확인 문의에 쓰는 시간을 줄일 수 있습니다.</p>",foryou:"팀에서 반복적으로 받는 질문 3가지를 추려 Slack AI 답변 스텝으로 자동화해보세요."},{tag:"도구 업데이트",source:"Linear",url:"https://linear.app/now/code-intelligence-for-linear-agent",published:"2026-05-14",title:"Linear Code Intelligence — 코드베이스 맥락을 아는 에이전트로 채택 확산 중",summary:"5월 공개된 Linear의 Code Intelligence가 7월 들어 채택이 확산되고 있습니다. 코드가 실제로 어떻게 구현됐는지, 특정 변경이 무엇에 영향을 주는지 엔지니어를 방해하지 않고 물어볼 수 있습니다.",detail:"<p><b>TPM 관점</b>: 기술적 제약사항을 확인하려 엔지니어를 붙잡지 않고도, 고객 요청이 기술적으로 타당한지 1차로 스스로 확인할 수 있습니다.</p>",foryou:"고객 요청이나 우선순위 논의 전에 Code Intelligence로 기술적 영향 범위를 먼저 확인해보면, 엔지니어 미팅 시간을 줄일 수 있습니다."}]},{id:"strategy",label:"빅테크 & 전략 동향",icon:"🌐",tint:"orange",desc:"리더십 보고와 프로그램 의사결정에 필요한 산업 맥락.",criteria:"<b>조직의 AI 전략과 프로그램 방향성에 영향을 주는</b> 빅픽처 동향을 담았습니다.",highlight:{kicker:"전략 이슈",title:"EU, 구글에 안드로이드 AI 어시스턴트 개방 명령 — Claude·ChatGPT 시스템 레벨 접근권 확보",summary:"유럽연합이 7월 16일, 구글이 Gemini에만 허용해온 안드로이드 시스템 레벨 접근권을 경쟁 AI 어시스턴트에도 개방하도록 법적 구속력 있는 명령을 내렸습니다. 이제 사용자가 Gemini와 동일한 방식으로 ChatGPT나 Claude를 음성으로 호출할 수 있게 됩니다.",detail:"<p><b>명령 내용</b>: 구글은 제3자 AI 개발사에 안드로이드 하드웨어·소프트웨어 기능에 대한 '자유롭고 효과적인 상호운용성'을 제공해야 하며, 검색 랭킹·쿼리·클릭 데이터도 경쟁사와 공정한 조건으로 공유해야 합니다.</p><p><b>일정</b>: 데이터 공유는 2027년 1월부터, 안드로이드 관련 변경은 2027년 7월까지 이행해야 합니다. 항소해도 이행 의무는 자동 정지되지 않습니다.</p>",source:"Tech Times",url:"https://www.techtimes.com/articles/320760/20260716/eu-gives-rival-ai-assistants-system-level-android-access-google-reserved-gemini.htm",published:"2026-07-16",foryou:"모바일 환경에서 AI 어시스턴트 도입을 계획 중이라면, 안드로이드 생태계에서 Claude·ChatGPT의 접근성이 2027년까지 단계적으로 개선된다는 점을 로드맵에 반영해보세요."},articles:[{tag:"규제",source:"Tech Times",url:"https://www.techtimes.com/articles/320541/20260715/eu-forces-meta-reopen-whatsapp-chatgpt-after-rare-antitrust-order.htm",published:"2026-07-13",title:"EU, 메타에 WhatsApp서 ChatGPT 재개방 강제 — 20년 만의 반독점 긴급 개입",summary:"EU가 메타에 WhatsApp에서 경쟁 AI 어시스턴트로의 무료 접근을 복원하라고 명령했습니다. 2004년 이후 두 번째 긴급 개입(Article 8(1))으로, 5억 명의 유럽 사용자가 영향을 받습니다.",detail:"<p>메타는 앞서 건당 요금을 부과하는 방식으로 정책을 바꿨지만, EU가 이를 반독점 위반으로 판단해 무료 접근 복원을 명령했습니다.</p><p><b>TPM 관점</b>: 메신저 플랫폼 위에 AI 기능을 얹는 서비스가 있다면, 플랫폼 사업자의 정책 변경이 언제든 규제로 뒤집힐 수 있다는 선례입니다.</p>",foryou:"제3자 플랫폼(메신저, 앱스토어 등) 위에서 동작하는 AI 기능이 있다면, 해당 플랫폼의 정책 변경 이력을 주기적으로 확인하는 루틴을 만들어두세요."},{tag:"규제",source:"IBTimes UK",url:"https://www.ibtimes.co.uk/global-ai-regulation-eu-us-china-1806017",published:"2026-07",title:"EU AI Act 투명성 의무, 8월 2일 전면 시행 — 위반시 매출 7% 과징금",summary:"5월 합의된 AI Omnibus에 따라 8월 2일부터 EU의 생성형 AI 투명성 의무가 전면 시행됩니다. 위반 시 최대 3,500만 유로 또는 전 세계 매출 7% 중 큰 금액이 과징금으로 부과됩니다.",detail:"<p>이미 출시된 생성형 AI 시스템은 12월 2일까지 기계 판독 가능한 마킹 요건을 갖추면 됩니다.</p><p><b>TPM 관점</b>: EU 사용자 대상 서비스에 생성형 AI 기능을 넣고 있다면, 8월 시행 전까지 콘텐츠 출처 표시·마킹 요건 충족 여부를 법무팀과 함께 점검해야 합니다.</p>",foryou:"EU 사용자를 대상으로 하는 제품에 AI 생성 콘텐츠가 포함된다면, 8월 2일 전까지 투명성 표시 요건 충족 여부를 체크리스트로 만들어 법무팀에 전달하세요."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.07.13~07.20</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 7월 13~20일 공개 뉴스 기반. 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
</html>
