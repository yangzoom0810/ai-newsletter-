<script>
const NL={meta:{icon:"🗞️",edition:"Vol.27",cadence:"주간",date:"2026년 7월 13일 (월)",curator:"Claude (Cowork)",title:["주간 AI 뉴스레터 — ","TPM Edition"],lead:"TPM 관점에서 꼭 알아야 할 한 주의 AI 소식. GPT-5.6이 정부 안보 검토를 통과해 공개되고, AI 코딩 어시스턴트 6종에서 심볼릭 링크 결함이 발견됐으며, MS Teams가 회의 AI 온오프 토글을 도입하고, OpenAI가 정부에 지분을 제안한 한 주였습니다.",greeting:"안녕하세요! 이번 주는 GPT-5.6이 12일간의 정부 안보 검토를 거쳐 공개된 소식부터, Claude Code·Cursor 등 6개 AI 코딩 어시스턴트에 영향을 준 GhostApproval 취약점, MS Teams의 회의 AI 온오프 토글처럼 실무에 바로 쓸 수 있는 기능, OpenAI의 정부 지분 제안까지 폭넓게 챙겨봤어요. <b>탭마다 'TPM 관점'</b>으로 실무에 어떻게 연결되는지 담았습니다."},topics:[{id:"top",label:"이 주의 핵심",icon:"⚡",tint:"red",desc:"이번 주 AI 업계에서 가장 파급력 있는 한 가지.",criteria:"<b>프로그램 의사결정과 팀 운영에 직접 영향을 주는</b> 소식을 최우선으로 선정했습니다.",highlight:{kicker:"이 주의 빅스토리",title:"GPT-5.6 공개 출시 — 12일 정부 안보 검토 게이트, AI 출시가 국가안보 사안이 되다",summary:"OpenAI가 7월 9일 GPT-5.6 Sol·Terra·Luna를 ChatGPT·API·Codex 전반에 공개했습니다. 6월 26일 예고 이후 미 정부가 사이버 공격 관련 능력을 우려해 12일간의 안보 검토를 요구했고, 상무부 승인을 거쳐서야 일반 공개가 이뤄졌습니다.",detail:"<p><b>TPM 관점에서 왜 중요한가</b>: 가장 강력한 모델인 Sol은 취약점 연구·익스플로잇 등 장기 사이버 보안 작업에서 성능-효율 프론티어를 끌어올린 것으로 평가되며, 이 때문에 연방기관이 국가안보 리스크를 이유로 광범위한 공개 전에 소규모 신뢰 파트너에게만 먼저 제공하도록 요구했습니다.</p><p>이번 사례는 프론티어 모델 출시가 이제 단순한 제품 이벤트가 아니라 정부 검토·수출정책·지정학적 경쟁의 대상이 되고 있음을 보여주는 가장 뚜렷한 신호로 꼽힙니다. Terra·Luna는 더 저렴한 범용 모델로 별도 심사 없이 함께 출시됐습니다.</p>",source:"Tech Times",url:"https://www.techtimes.com/articles/319979/20260709/gpt-56-goes-public-after-12-day-white-house-gate-tests-voluntary-ai-framework.htm",published:"2026-07-09",foryou:"프론티어 모델 출시가 정부 안보검토를 통과해야 하는 시대가 열리면서, 벤더의 신모델 도입 일정에 예측 불가능한 지연이 생길 수 있습니다. 로드맵에 모델 업그레이드용 버퍼 기간을 마련해두세요."},articles:[{tag:"규제 프레임워크",source:"FAQ.com.tw",url:"https://faq.com.tw/en/policy/2026-07-04-white-house-voluntary-ai-release-standards-en/",published:"2026-07-04",title:"백악관, OpenAI·Google·Anthropic과 '30일 사전검토' 프레임워크 막바지 조율",summary:"백악관이 프론티어 모델을 공개하기 전 최대 30일간 국가안보 영향을 검토할 수 있는 자율적 프레임워크를 3개 주요 랩과 조율 중입니다. GPT-5.6의 12일 지연은 이 프레임워크가 실제로 작동하는 첫 사례로 꼽힙니다.",detail:"<p>정부의 역할은 승인·차단이 아니라 자문과 이슈 제기에 그치도록 설계됐지만, 어떤 규모의 모델부터 검토 대상이 되는지를 둘러싸고 기업과 정부 사이에 이견이 남아 있습니다. 기업들은 더 높은 기준을, 정부는 더 낮은 기준을 원합니다.</p>",foryou:"주요 AI 벤더 한 곳에 크게 의존하는 프로그램이 있다면, 신모델 출시가 정부 검토로 지연될 수 있다는 리스크를 벤더 관리 계획에 반영해두세요."},{tag:"빅테크 소송",source:"unrot.co",url:"https://unrot.co/blogs/today-top-10-ai-news-july-12-2026",published:"2026-07-11",title:"Apple, OpenAI 상대 영업비밀 소송 제기 — 전직 직원 400명 채용 문제 삼아",summary:"애플이 7월 11일 북부 캘리포니아 연방법원에 OpenAI를 상대로 소송을 제기했습니다. OpenAI가 애플 실리콘·온디바이스 AI팀 출신 400명 이상을 채용한 것을 통상적인 이직이 아닌 조직적인 기밀 기술 유출로 규정했습니다.",detail:"<p>애플은 소장에서 이번 채용이 우연한 인재 이동이 아니라 애플의 반도체·온디바이스 AI 노하우를 겨냥한 협조적 추출이라고 주장했습니다. 소송 결과에 따라 빅테크 간 인재 이동과 경쟁금지 관행에 파급 효과가 예상됩니다.</p>",foryou:"핵심 인력이 경쟁사나 파트너사로 이동할 때의 지식재산 리스크를 점검하고, 팀 내 기밀정보 이관 프로세스를 다시 확인해볼 시점입니다."}]},{id:"devtools",label:"개발 AI 동향",icon:"🛠️",tint:"purple",desc:"함께 일하는 엔지니어팀이 쓰는 AI 도구 변화 — 알아야 대화가 됩니다.",criteria:"엔지니어 팀의 <b>실제 워크플로에 영향을 주는</b> AI 코딩 도구, 보안 이슈, 모델 변화를 중심으로 골랐습니다.",highlight:{kicker:"이 주의 개발 경보",title:"GhostApproval 취약점 — Claude Code·Cursor 등 AI 코딩 어시스턴트 6종, 심볼릭 링크로 임의 파일 쓰기 가능",summary:"7월 8일 공개된 GhostApproval은 Amazon Q, Claude Code, Augment, Cursor, Antigravity, Windsurf 등 6개 AI 코딩 어시스턴트에서 발견된 심볼릭 링크 결함입니다. 90일 이상의 조정된 공개 기간을 거쳐 공표됐으며, 승인된 파일 경로를 심볼릭 링크로 위장해 임의 파일에 쓰기가 가능해집니다.",detail:"<p>공격자는 에이전트가 '승인된' 것으로 인식하는 경로에 심볼릭 링크를 심어, 실제로는 전혀 다른 위치의 파일을 덮어쓰도록 유도할 수 있습니다. 같은 주에 공개된 'Friendly Fire' 연구도 Claude Code 오토모드·Codex 오토리뷰가 신뢰할 수 없는 서드파티 코드베이스를 점검하는 과정에서 프롬프트 인젝션에 의해 공격자 제어 코드를 실행하도록 유도될 수 있음을 보였습니다.</p><p>두 사례 모두 '자동 승인' 워크플로가 늘어날수록 공격 표면도 함께 넓어진다는 점을 보여줍니다.</p>",source:"CyberSecurityNews",url:"https://cybersecuritynews.com/ghostapproval-vulnerability/",published:"2026-07-08",foryou:"팀이 AI 코딩 어시스턴트를 자동 승인·오토모드로 운영 중이라면, 해당 벤더의 패치 여부를 확인하고 신뢰할 수 없는 외부 코드베이스를 다룰 때는 수동 검토 모드로 되돌리는 것을 권합니다."},articles:[{tag:"보안 기본값 변경",source:"Tech Times",url:"https://www.techtimes.com/articles/319874/20260707/claude-code-defaults-human-approval-auto-mode-requires-explicit-opt-in.htm",published:"2026-07-07",title:"Claude Code v2.1.200 — 기본 권한 모드가 'Manual'로 전환",summary:"앤트로픽이 Claude Code의 기본 권한 모드를 CLI, VS Code 확장, JetBrains 플러그인 전반에서 Auto에서 Manual로 변경했습니다. 파일 쓰기·셸 명령·네트워크 호출 전에 사람의 명시적 승인이 필요해지는 변경입니다.",detail:"<p>변경의 배경은 '승인 피로'입니다. 사용자의 약 93%가 권한 요청을 별다른 검토 없이 그냥 승인해온 것으로 나타났고, 이는 알림이 너무 많아 진짜 위험 신호를 구분하지 못하게 되는 보안관제센터의 상황과 유사합니다.</p><p>기존에 Auto 모드로 자동화 파이프라인을 구성해둔 팀은 신규 설치 시 동작이 달라질 수 있어 설정 점검이 필요합니다.</p>",foryou:"CI 파이프라인이나 야간 자동화에 Claude Code를 Auto 모드로 연결해뒀다면, 업그레이드 전에 설정 파일에서 permission mode를 명시적으로 지정해뒀는지 확인하세요."},{tag:"에디터 업데이트",source:"Visual Studio Magazine",url:"https://visualstudiomagazine.com/articles/2026/07/08/claude-ai-gets-yet-another-boost-in-vs-code-1-128.aspx",published:"2026-07-08",title:"VS Code 1.128 — Claude 에이전트 세션 멀티챗 지원",summary:"VS Code 1.128이 7월 8일 출시되며 Claude 에이전트 세션의 멀티챗 지원이 핵심 기능으로 추가됐습니다. 하나의 세션 안에서 여러 접근법을 비교하거나 이전 턴에서 분기해 병렬로 작업을 진행할 수 있습니다.",detail:"<p>여러 채팅을 추가하고, 기존 턴에서 포크하고, 여러 턴을 동시에 전송할 수 있어 동일한 문제에 대해 서로 다른 구현을 나란히 실험해볼 수 있습니다.</p>",foryou:"복잡한 기술 검토나 아키텍처 결정을 앞두고 있다면, 멀티챗으로 여러 대안을 병렬 실험해본 뒤 결과를 비교해 의사결정 자료로 활용해보세요."}]},{id:"tpm",label:"TPM 업무 자동화",icon:"📋",tint:"blue",desc:"로드맵·스프린트·문서화·커뮤니케이션에 바로 쓸 수 있는 AI 기능.",criteria:"<b>TPM 실무에 직접 적용 가능한</b> AI 도구 업데이트를 중심으로 골랐습니다.",highlight:{kicker:"TPM 필수 업데이트",title:"MS Teams, 회의 중 AI 온오프 토글 도입 — Copilot·Facilitator·Recap 개별 제어",summary:"마이크로소프트 팀즈가 회의 주최자·발표자가 실시간으로 Copilot, Facilitator, Recap을 개별적으로 켜고 끌 수 있는 '회의 AI 토글'을 7월 초부터 타겟 릴리스로 배포하고 있으며, 7월 중순 일반 배포(GA) 완료를 목표로 합니다.",detail:"<p>Copilot과 Recap만 끄고 Facilitator는 유지하거나, 전체를 켜고 끄는 등 세부 조합이 가능합니다. 단, Meeting AI와 회의 녹취(transcription)는 서로 연동돼 있어 녹취를 켜면 Meeting AI·Recap도 함께 켜지므로, AI를 완전히 배제하려면 두 가지 모두 꺼야 합니다.</p><p>이 토글은 Windows·macOS·모바일·웹 등 모든 기기에서 지원되며, Teams Premium 또는 Copilot for Microsoft 365 라이선스를 가진 주최자만 사용할 수 있습니다.</p>",source:"Windows Latest",url:"https://www.windowslatest.com/2026/07/05/microsoft-caves-after-teams-ai-backlash-will-let-you-turn-off-copilot-facilitator-and-recap-mid-meeting/",published:"2026-07-05",foryou:"고객사·외부 파트너와의 민감한 회의에서는 회의 시작 전 AI 토글 상태를 미리 확인·고지하는 체크리스트를 만들어두면 동의 없는 녹취·요약 이슈를 예방할 수 있습니다."},articles:[{tag:"AI 코워커",source:"WorkManagementHub",url:"https://workmanagementhub.com/asana-vs-monday-vs-clickup-ai-features-2026/",published:"2026-07-01",title:"ClickUp Brain 2.0 — 'Super Agents'로 업무를 배정할 수 있는 AI 코워커 등장",summary:"ClickUp이 6월 말 'Brain 2'로 전면 리론칭하며 워크스페이스 전체 지식 검색, 자동 스탠드업 리포트에 더해 팀원처럼 멘션·배정·스케줄링이 가능한 'Super Agents'를 선보였습니다. MCP 지원으로 Claude·GPT 등 외부 AI가 ClickUp 데이터를 직접 조회·조작할 수 있습니다.",detail:"<p>2026년 프로젝트 관리 도구 시장에서는 AI 성숙도가 팀 생산성에 측정 가능한 차이를 만들 만큼 벌어지면서, AI 계층이 도구 교체 결정의 핵심 변수가 되고 있습니다.</p>",foryou:"여러 프로젝트 관리 도구를 병행하고 있다면, Super Agents 같은 'AI 팀원' 배정 기능을 파일럿으로 도입해 반복적인 상태 취합 업무부터 위임해보세요."},{tag:"MCP 확장",source:"Slack",url:"https://slack.com/blog/news/slackbots-mcp-client",published:"2026-06-18",title:"Slack MCP 클라이언트 정식 출시(GA) — Atlassian·Linear·Notion 등 20여 개 파트너 앱 연동",summary:"Slackbot의 MCP(Model Context Protocol) 클라이언트가 정식 출시되며, Amplitude·Atlassian·Box·Canva·Docusign·Linear·Miro·Notion·Zoom 등 20개 이상의 파트너 앱을 Slackbot에서 직접 연결할 수 있게 됐습니다. 7월 들어 도입 사례가 빠르게 늘고 있습니다.",detail:"<p>Slackbot은 이제 대화 맥락을 기억해 답변과 초안 작성에 활용하고, 다른 AI 도구의 메모리를 가져와 온보딩 시간을 줄일 수도 있습니다. 오픈 MCP 표준 기반이라 사내에서 자체 구축한 도구도 연결할 수 있습니다.</p>",foryou:"스프린트 현황이나 이슈 트래커 정보를 계속 오가며 확인하고 있다면, Slack에서 Atlassian·Linear를 MCP로 연결해 채널 안에서 바로 조회·업데이트하는 흐름으로 바꿔보세요."}]},{id:"strategy",label:"빅테크 & 전략 동향",icon:"🌐",tint:"orange",desc:"리더십 보고와 프로그램 의사결정에 필요한 산업 맥락.",criteria:"<b>조직의 AI 전략과 프로그램 방향성에 영향을 주는</b> 빅픽처 동향을 담았습니다.",highlight:{kicker:"전략 이슈",title:"OpenAI, 美 정부에 지분 5%(426억 달러) 제안 — '퍼블릭 웰스 펀드' 구상",summary:"OpenAI가 852억 달러 밸류에이션 기준 지분 5%(약 426억 달러)를 미국 정부에 제공하는 방안을 제안했습니다. 알래스카 영구기금을 본뜬 국부펀드 구조로, 구글·메타·앤트로픽 등 다른 랩도 동일한 방식으로 참여하는 구상입니다.",detail:"<p>샘 올트먼은 대중에게 AI 회사의 재무적 지분을 나눠주는 것이 AI가 만드는 이익을 공유하는 최선의 방법이라고 주장했습니다. 그는 트럼프 대통령, 러트닉 상무장관, 베센트 재무장관과 이 제안을 논의한 것으로 알려졌습니다.</p><p>비평가들은 규제 권한과 재무적 지분을 동시에 가진 정부는 구조적으로 이해상충 상태에 놓인다고 경고합니다. OpenAI의 가치를 낮추는 규제는 정부 지분의 가치도 함께 낮추기 때문입니다.</p>",source:"Tech Times",url:"https://www.techtimes.com/articles/319571/20260702/openai-offers-washington-426-billion-stake-experts-warn-safety-rules-face-conflict-risk.htm",published:"2026-07-02",foryou:"특정 AI 랩에 대한 정부의 지분·규제 구조 변화는 향후 해당 벤더의 가격 정책과 신모델 출시 속도에 영향을 줄 수 있습니다. 리더십 보고 자료에 이런 구조적 변화를 배경 정보로 정리해두세요."},articles:[{tag:"인프라 베팅",source:"SiliconANGLE",url:"https://siliconangle.com/2026/07/06/anthropic-inks-19b-ai-data-center-lease-terawulf/",published:"2026-07-06",title:"Anthropic, TeraWulf와 20년 190억 달러 데이터센터 리스 체결",summary:"앤트로픽이 비트코인 채굴업체 TeraWulf와 20년 장기 리스를 체결해 켄터키주 헤이스빌에 401메가와트 규모의 AI 전용 데이터센터 캠퍼스를 확보합니다. 계약 규모는 약 190억 달러로, 2027년 하반기 초기 가동, 2028년 초 전체 가동을 목표로 합니다.",detail:"<p>TeraWulf는 이번 계약을 위해 30억~40억 달러를 투자할 계획으로, 리스 가치의 5분의 1도 안 되는 투자로 장기 고정 수익을 확보하며 비트코인 채굴 의존에서 벗어나는 전환점을 맞았습니다.</p>",foryou:"AI 인프라 조달 계획이 있다면, 프론티어 랩들이 20년 단위 장기 전력·부지 계약으로 컴퓨트를 선점하고 있다는 점을 감안해 자사의 인프라 확보 시점을 앞당길 필요가 있는지 검토해보세요."},{tag:"컴퓨트 부족",source:"Forbes",url:"https://www.forbes.com/sites/jonmarkman/2026/06/29/google-limits-metas-gemini-usage-over-compute-shortages/",published:"2026-06-29",title:"구글, 메타의 Gemini 사용량 제한 — 컴퓨트 부족이 빅테크 전략까지 바꾼다",summary:"구글이 컴퓨트 수요를 감당하지 못해 메타의 Gemini 사용량에 상한을 두기로 했습니다. 이에 메타는 2027년까지 자체 컴퓨트 용량을 두 배로 늘리는 계획과 삼성 등과의 장기 공급 계약을 담은 내부 메모를 공개하며 주가가 7% 이상 뛰었습니다.",detail:"<p>구글 클라우드의 주문 잔고는 한 분기 만에 4,600억 달러로 거의 두 배가 됐고, AI 토큰 사용량은 분당 160억 건에 달합니다. 메타는 2028년까지 미국 내 데이터센터 확장에 최대 6,000억 달러를 투자하겠다고 밝혔으며, 캐나다 앨버타에 10억 달러 규모의 신규 데이터센터도 발표했습니다.</p>",foryou:"외부 AI 벤더의 컴퓨트 배정에 의존하는 서비스가 있다면, 수요 급증기에 사용량이 제한될 수 있다는 공급망 리스크를 사업연속성계획(BCP)에 반영해두는 것이 안전합니다."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;
document.getElementById("header").innerHTML=`<div class="nl-icon">${esc(m.icon)}</div><div class="nl-eyebrow"><span class="nl-eyebrow__chip">🗓️ ${esc(m.date)}</span><span>${esc(m.edition)} · ${esc(m.cadence)}</span></div><h1 class="nl-title">${esc(m.title[0])}<b>${esc(m.title[1])}</b></h1><p class="nl-lead">${esc(m.lead)}</p><div class="nl-meta"><span>🤖 큐레이터 <b>${esc(m.curator)}</b></span><span>📅 기간 <b>2026.07.07~07.13</b></span><span>🎯 주제 <b>${topics.length}</b>개</span></div><div class="nl-greet"><span class="nl-greet__icon">👋</span><div>${m.greeting}</div></div>`;
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});
render(0);
panelEl.addEventListener("click",e=>{const b=e.target.closest(".nl-more-btn");if(!b)return;const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));const d=b.nextElementSibling;if(d&&d.classList.contains("nl-detail"))d.classList.toggle("open",!open);const t=b.querySelector(".nl-more-btn__t");if(t)t.textContent=open?"자세히 보기":"접기"});
document.getElementById("footer").innerHTML=`<footer class="nl-footer"><div class="nl-footer__brand"><div class="nl-footer__logo">AI</div><div><div class="nl-footer__name">주간 AI 뉴스레터 — TPM Edition</div><div class="nl-footer__sub">Claude (Cowork) 큐레이션 · 매주 월요일 오후 1시 자동 발행</div></div></div><p class="nl-footer__disc">※ 2026년 7월 7일~7월 13일 공개 뉴스 기반. 개별 사실은 원문 링크를 확인하세요.</p></footer>`;
})();
(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
</body>
</html>
