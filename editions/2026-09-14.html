const NL={"meta":{"icon":"🗞️","edition":"Vol.36","cadence":"주간","date":"2026년 9월 14일 (월)","curator":"Claude (Cowork)","title":["주간 AI 뉴스레터 — ","TPM Edition"],"lead":"CTO 스태프 겸 전사 TPM 관점에서 실제로 참고할 수 있는 한 주의 AI 소식. 국내외 소식을 균형 있게, 실무에 바로 연결되는 관점으로 정리했습니다.","greeting":"안녕하세요! 지난주는 <b>AI 보안이 '나중에 볼 것'에서 '이번 분기에 볼 것'으로 넘어간 주</b>였습니다. 앤트로픽이 클로드를 악용한 실제 공격 사례를 9개월치로 공개했고, 같은 날 마이크로소프트는 <b>AI로 작성된 경영진 사칭 인보이스 사기</b>가 100만 통 규모로 돌았다고 보고했습니다. 둘 다 모델 성능 얘기가 아니라 <b>우리 회사 결제 승인 프로세스와 에이전트 권한 설계</b> 얘기입니다.<br><br>도구 쪽은 방향이 뚜렷해졌습니다. 커서가 <b>에이전트를 지휘하는 에이전트</b>를 붙였고, 오픈AI는 코덱스를 굴리던 엔진을 Agents API로 열었습니다. 개발자 한 명이 여러 에이전트를 감독하는 구조로 가는 중인데, 같은 주 조사에서는 <b>에이전트 파일럿의 88%가 프로덕션에 못 간다</b>는 숫자도 나왔습니다. 막히는 지점은 대부분 모델이 아니라 격리·거버넌스·컴플라이언스입니다.<br><br>국내는 <b>기업 AI 활용률이 48%에서 58%로</b> 올랐는데, 도입한 곳의 81%가 생산성 향상을 체감하면서도 <b>공식 전략과 ROI 측정 체계를 갖춘 곳은 여전히 소수</b>입니다. 전사 TPM이 지금 채워야 할 빈칸이 어디인지 꽤 분명하게 가리키는 숫자입니다."},"topics":[{"id":"top","label":"이 주의 핵심","icon":"⚡","tint":"red","desc":"이번 주 국내외 AI 소식 중 전사 의사결정에 가장 직접적으로 영향을 주는 것들.","criteria":"<b>이번 주 안에 담당자를 지정할 수 있는</b> 소식만 골랐습니다. 해외 규제는 제외하고, 국내에 실제 적용되는 의무(AI기본법 표시 의무) 1건만 넣었습니다. 나머지는 보안·정책·예산처럼 전사 차원에서 판단이 필요한 건입니다.","highlight":{"kicker":"이 주의 빅스토리","title":"AI 악용이 '가능성'에서 '이번 달 실제 피해'로 — 같은 날 나온 앤트로픽·MS 보고서 두 건","summary":"9월 10일 앤트로픽이 <b>작년 12월부터 올해 8월까지</b> 클로드를 악용한 사이버 공격·사기·감시 시도를 사례별로 공개했습니다. 핵심 결론은 <b>AI가 개인 공격자와 국가 단위 조직 사이의 실력 격차를 좁히고 있다</b>는 것. 같은 날 마이크로소프트는 8월 초 <b>AI로 쓰인 정황이 있는 경영진 사칭 인보이스 사기</b>가 100만 통 규모로 돌았고, 건당 5만 달러에 가까운 송금을 요구했다고 보고했습니다.","detail":"<p>두 보고서를 붙여 읽으면 그림이 선명합니다. 앤트로픽 쪽은 <b>공급 측</b> 얘기입니다 — 예전 같으면 팀 단위 조직이 필요했던 정찰·취약점 탐색·피싱 문안 작성을 개인 공격자가 혼자 해내기 시작했다는 것. 다만 앤트로픽은 <b>표적을 정하는 판단은 여전히 사람이 하고 있다</b>고 덧붙였습니다. 자동화된 건 '실행 능력'이지 '의도'가 아니라는 뜻입니다.</p><p>마이크로소프트 쪽은 <b>수요 측</b>, 즉 실제 피해입니다. 주목할 대목은 마이크로소프트가 <b>사칭당한 거래처가 해킹당한 흔적은 없다</b>고 명시한 부분입니다. 시스템이 뚫린 게 아니라, 공개 정보만으로 충분히 그럴듯한 메일을 대량 생산할 수 있게 된 겁니다. 방어 포인트가 '계정 보안'에서 <b>'프로세스 검증'</b>으로 이동한다는 신호입니다 — 아무리 그럴듯한 메일 스레드라도, 송금 요청은 그 스레드 <b>바깥에서</b> 확인해야 합니다.</p>","source":"Anthropic / Microsoft Security Blog","url":"https://www.microsoft.com/en-us/security/blog/2026/09/10/protecting-organizations-ai-assisted-executive-impersonation-invoice-fraud/","published":"2026-09-10","foryou":"이번 주에 두 가지를 확인해 두면 좋습니다. ① <b>재무·구매 프로세스에 '메일 밖 검증' 단계가 명문화돼 있는지</b> — 계좌 변경이나 일정 금액 이상 송금은 메일 회신이 아니라 등록된 연락처로 별도 확인하는 규칙이 있는지, 없으면 재무 조직에 이번 분기 안건으로 올리세요. ② 사내에서 돌아가는 <b>AI 에이전트의 권한 목록을 한 번 뽑아보세요</b>. 외부 입력(메일·티켓·웹)을 읽는 에이전트가 쓰기 권한까지 갖고 있으면 지금이 분리할 시점입니다."},"articles":[{"tag":"업계 기류","source":"AI Weekly / 로이터","url":"https://aiweekly.co/ai-news-today/edition/2026-09-11","published":"2026-09-11","title":"올트먼, 사내에 \"AI 개발 속도를 늦출 수도 있다\" — 자율 에이전트 이상 동작이 계기","summary":"9월 11일 샘 올트먼이 직원들에게 <b>모델 안전 우려가 커지면 개발 속도를 늦출 여지가 있다</b>고 말한 것으로 전해졌습니다. 배경에는 자율 에이전트가 예상과 다르게 행동한 사례들이 있습니다. 경쟁이 가장 치열한 시점에 선두 주자가 감속 가능성을 언급했다는 점에서 기류 변화로 읽힙니다.","detail":"<p>발언 자체를 액면 그대로 받을 필요는 없습니다. 다만 <b>한 주 전 프런티어 랩들이 위험 기능에 '게이팅'을 붙인 것과 같은 방향</b>이라는 점은 눈여겨볼 만합니다. 지난주 뉴스레터에서 다룬 심사 기반 접근 제한이 일회성 조치가 아니라 업계 기본값으로 굳어가는 흐름의 일부일 가능성이 큽니다.</p><p>실무 영향은 '언제 뭐가 나오는가'의 예측 가능성입니다. 그동안 AI 로드맵은 '다음 분기에는 더 좋은 모델이 나올 것'을 암묵 전제로 깔고 짜는 경우가 많았는데, 감속·게이팅·심사가 겹치면 이 전제가 흔들립니다. <b>모델 성능 향상을 전제로 한 과제와, 현재 성능으로 이미 되는 과제를 분리해 두는 것</b>이 안전합니다.</p>","foryou":"다음 분기 계획 리뷰 때 <b>'모델이 더 좋아지면 된다'에 기대고 있는 과제가 몇 개인지</b> 세어보세요. 그 과제들은 일정 리스크가 아니라 <b>실현 가능성 리스크</b>로 분류해야 합니다. 반대로 현재 모델로 이미 되는 과제는 지금 밀어붙이는 게 맞습니다."},{"tag":"국내 정책","source":"대한민국 정책브리핑 / 파이낸셜뉴스","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148968284","published":"2026-09-09","title":"정부 \"550조 AI 데이터센터 투자 견인, 1인 1 AI 에이전트\" — K-AI 독자모델 현장 적용 본격화","summary":"9월 9일 AI World 2026에서 정부가 <b>550조 원 규모 AI 데이터센터 투자 견인</b>과 '1인 1 AI 에이전트' 구상을 제시했습니다. 내년 상반기에는 국제기구 9곳의 AI 기능을 모은 캠퍼스를 열고, <b>K-AI 브랜드 독자 파운데이션 모델을 현장에 본격 적용</b>해 글로벌 3강에 안착하겠다는 계획입니다. 산업부는 제조·AI 융합(M.AX)에 정책 역량을 집중합니다.","detail":"<p>정부 발표를 실무 언어로 옮기면 두 가지입니다. 첫째, <b>국산 파운데이션 모델을 쓰는 과제에 정책 자금과 사업 기회가 붙는다</b>는 것. 공공·제조 영역에서 특히 그렇습니다. 둘째, '1인 1 AI 에이전트'라는 표현이 정부 문서에 들어갔다는 건 <b>개인 생산성 도구 보급이 정책 지표가 됐다</b>는 뜻이라, 관련 실증·지원 사업 공고가 늘어날 가능성이 큽니다.</p><p>다만 신중히 볼 대목도 있습니다. 550조는 '정부 직접 투자'가 아니라 <b>민간 투자를 견인하겠다는 목표치</b>입니다. 데이터센터 수급이 실제로 언제 풀리는지는 별도로 봐야 합니다 — 지금 GPU 조달 일정을 이 숫자에 맞춰 낙관적으로 잡는 건 위험합니다.</p>","foryou":"국산 모델 검토를 '나중 일'로 미뤄뒀다면 <b>지금 최소 1개 과제에 파일럿을 붙여두는 편</b>이 실익이 있습니다. 성능 비교 목적이 아니라, 정책 자금·공공 사업 요건에 '국산 모델 활용 실적'이 요구될 때 답할 게 있느냐의 문제입니다. 조달팀과 함께 상반기 공고 캘린더를 한 번 훑어보세요."},{"tag":"국내 규제","source":"법률신문 / SK AX","url":"https://www.lawtimes.co.kr/news/articleViewAmp.html?idxno=223727","published":"2026-09-08","title":"AI기본법 생성형 AI 표시 의무 — 기존 서비스 유예가 12월 2일로 끝납니다","summary":"AI기본법은 올해 1월 전면 시행됐고, 7월 21일 개정안으로 'AI 제품·서비스 확인 제도'가 신설됐습니다. 실무상 지금 챙길 시한은 하나입니다 — <b>기계판독 워터마크 의무의 기존 시스템 유예가 12월 2일 종료</b>됩니다. 8월 2일 이후 새로 출시한 시스템은 유예 없이 출시 시점부터 의무 대상입니다.","detail":"<p>조문을 따라갈 필요는 없고, 우리 서비스가 걸리는지만 판단하면 됩니다. 판단 기준은 <b>'이용자가 보는 결과물 중 AI가 만든 게 있는가'</b>입니다 — 챗봇 응답, 생성 이미지·음성, AI 요약문, 추천 문구까지 포함될 수 있습니다. 걸린다면 두 가지를 해야 합니다. ① 서비스 제공 <b>전에</b> AI 기반으로 동작한다는 사실을 이용자에게 알릴 것, ② 생성 콘텐츠에 기계가 읽을 수 있는 표식을 넣을 것.</p><p>①은 대개 문구 추가라 가볍지만, <b>②는 생성 파이프라인을 건드려야 해서 리드타임이 있습니다</b>. 12월 2일까지 남은 시간이 실질적으로 한 분기가 안 됩니다. 정부가 고영향 AI 판단·투명성 확보 가이드라인을 공개해 뒀으니 법무 검토보다 먼저 이 문서로 자가 점검하는 게 빠릅니다.</p>","foryou":"이번 주에 <b>'우리 서비스 중 AI 생성 결과물을 이용자에게 노출하는 지점' 목록을 한 장으로 만들어 두세요</b>. 목록만 있으면 법무·보안 검토가 며칠로 끝나지만, 없으면 12월에 각 팀에 개별로 물어보며 한 달을 씁니다. 해당되는 서비스가 있으면 워터마크 삽입 작업을 이번 분기 백로그에 올리는 것이 안전합니다."}]},{"id":"dev","label":"개발 AI 동향","icon":"🛠️","tint":"purple","desc":"함께 일하는 엔지니어팀의 일하는 방식이 실제로 어떻게 바뀌는지.","criteria":"버전 번호와 체인지로그는 뺐습니다. <b>팀 구조·리뷰 프로세스·보안 통제에 실제 변화를 요구하는 것</b>만 담았고, 국내 개발 플랫폼 소식도 함께 넣었습니다.","highlight":{"kicker":"이 주의 개발 이슈","title":"커서가 '에이전트를 지휘하는 에이전트'를 붙였다 — 개발자 역할이 작업자에서 감독자로","summary":"9월 10일 커서가 <b>Projects</b> 베타를 공개했습니다. 핵심은 <b>코디네이터 에이전트</b>입니다 — 개발자가 프로젝트 단위로 일을 맡기면, 코디네이터가 작업을 쪼개 다른 에이전트들에게 나눠주고 전체 맥락을 유지합니다. 개발자는 코딩이 아니라 <b>방향을 잡고 결과를 검수하는 쪽</b>으로 옮겨갑니다.","detail":"<p>비슷한 시기에 오픈AI도 <b>Agents API</b>를 퍼블릭 베타로 열었습니다. 코덱스를 돌리던 엔진을 그대로 개방한 것으로, 세션 관리·툴 조정·실패 복구를 플랫폼이 대신 해줍니다. 두 소식의 공통 메시지는 명확합니다 — <b>'에이전트 여러 개를 어떻게 굴릴 것인가'가 도구 회사들의 경쟁 축이 됐다</b>는 것.</p><p>팀 관점에서 진짜 변수는 <b>리뷰 부하</b>입니다. 한 명이 동시에 다섯 갈래 작업을 돌리면 생성되는 PR 수가 급증하는데, 리뷰어 수는 그대로입니다. 실제로 업계 조사에서는 <b>AI가 쓴 코드의 절반 가까이가 보안 테스트를 통과하지 못한다</b>는 수치가 나왔고, 권고는 일관됩니다 — <b>에이전트 PR도 사람 PR과 완전히 동일한 게이트</b>(오너 리뷰, 커버리지 기준, 린트, SAST, 시크릿 탐지)를 통과시켜야 합니다.</p><p>참고로 Agents API 베타는 <b>US 데이터 레지던시이고 Zero Data Retention을 지원하지 않습니다</b>. 국내 서비스 코드베이스에 붙이기 전에 보안 검토가 필요한 대목입니다.</p>","source":"AI Weekly / Cursor","url":"https://aiweekly.co/ai-news-today/edition/2026-09-11","published":"2026-09-10","foryou":"에이전트 도입 효과를 '생성 속도'로 보고 있다면 지표를 하나 더 붙이세요 — <b>PR이 열린 뒤 머지까지 걸리는 시간</b>입니다. 생성이 빨라져도 이 숫자가 늘고 있으면 병목이 리뷰로 옮겨간 것이고, 그때 필요한 건 더 좋은 모델이 아니라 <b>리뷰 자동화와 리뷰어 배치 조정</b>입니다. 엔지니어링 리드와 이 숫자부터 맞춰보세요."},"articles":[{"tag":"도입 장벽","source":"Northflank","url":"https://northflank.com/blog/enterprise-ai-coding-agent-deployment","published":"2026-09-09","title":"에이전트 파일럿의 88%가 프로덕션에 못 간다 — 막히는 건 모델이 아니라 배포 인프라","summary":"기업 에이전트 파일럿 중 <b>88%가 프로덕션에 도달하지 못한다</b>는 분석이 나왔습니다. 실패 원인으로 지목된 건 에이전트 성능이 아니라 <b>격리(isolation)·거버넌스·컴플라이언스 통제·데이터 레지던시</b>입니다. 보안팀이 요구하는 조건을 파일럿 단계에서 설계에 넣지 않으면, 잘 돌아가는 데모가 그대로 멈춥니다.","detail":"<p>TPM 입장에서 이 숫자는 실패율이 아니라 <b>착수 체크리스트</b>로 읽어야 합니다. 파일럿이 죽는 지점이 매번 같다면, 그 항목을 처음부터 요구사항에 넣으면 됩니다 — 에이전트가 도는 실행 환경이 격리돼 있는가, 누가 어떤 권한으로 승인했는지 로그가 남는가, 데이터가 어느 리전에 머무는가, 사고 시 롤백 경로가 있는가.</p><p>같은 맥락에서 최근 에이전트는 몇 분에서 몇 시간까지 연속 실행됩니다. 짧은 질의응답이 아니라 <b>장시간 자율 실행</b>이라서, 중간 상태를 사람이 관찰할 수 없다면 사고가 나도 재구성이 안 됩니다. 관측 가능성(observability)을 나중에 붙이는 항목이 아니라 착수 조건으로 잡는 편이 결과적으로 빠릅니다.</p>","foryou":"사내 에이전트 파일럿을 승인할 때 <b>'프로덕션 이행 조건'을 착수 문서에 먼저 적게 하세요</b> — 격리, 권한·승인 로그, 데이터 리전, 롤백 경로 네 항목이면 충분합니다. 보안 검토를 파일럿 <b>끝</b>이 아니라 <b>시작</b>에 붙이는 것만으로 88%의 상당 부분이 걸러집니다."},{"tag":"국내 플랫폼","source":"스마트비즈 / 테크M","url":"https://www.smartbizn.com/news/articleView.html?idxno=146282","published":"2026-09-08","title":"LG CNS 'DevOn 에이전틱 AIND' — 요구사항 분석부터 품질 검증까지 에이전트가 분담하는 개발 플랫폼","summary":"LG CNS가 에이전틱 AI 기반 개발 플랫폼을 내놨습니다. <b>요구사항 분석·설계·코딩·테스트·품질 검증</b>을 각각 담당하는 에이전트가 협업하는 구조입니다. 국내 SI 대형사가 SDLC 전 단계를 에이전트로 쪼갠 제품을 공개했다는 점에서, 국내 기업 개발 조직의 표준 기대치가 올라가는 신호입니다.","detail":"<p>제품 자체보다 <b>구조를 참고할 가치</b>가 있습니다. 코딩 에이전트 논의는 대체로 '구현'에 쏠려 있는데, 실제로 TPM 시간이 가장 많이 들어가는 건 요구사항 정리와 수용 기준 합의입니다. SDLC를 단계별 에이전트로 나눈 설계는 <b>어느 단계가 자동화 가능하고 어느 단계가 사람 판단인지</b>를 명시적으로 드러냅니다.</p><p>국내 대기업들도 같은 방향입니다. SK AX는 에이전트를 연결하는 오케스트레이션 플랫폼을 내놨고, SK하이닉스 제조 공정 디지털 트윈, 신한금융 '1인 1 금융 에이전트' 같은 적용 사례를 함께 공개했습니다. 사내 도구를 직접 만들지, 이런 플랫폼을 얹을지는 <b>우리 조직의 표준화 수준</b>에 달렸습니다.</p>","foryou":"사내 개발 프로세스에서 <b>에이전트에 맡길 단계와 사람이 붙잡을 단계를 한 번 그어보세요</b>. 대개 테스트 코드 작성·문서화·마이그레이션 같은 반복 구간은 먼저 넘길 수 있고, 요구사항 확정과 아키텍처 결정은 남습니다. 이 선이 그어져 있어야 도구 도입 논의가 '어떤 툴이 좋냐'에서 '어디에 쓸 거냐'로 넘어갑니다."},{"tag":"플랫폼 기능","source":"Anthropic Release Notes","url":"https://releasebot.io/updates/anthropic/claude-developer-platform","published":"2026-09-10","title":"Computer use·Skills API·Files API 정식 출시 — 에이전트가 '결과 파일'까지 내놓는 단계로","summary":"앤트로픽 플랫폼에서 <b>컴퓨터 사용, Skills API, Files API가 정식(GA)</b>으로 전환됐습니다. 세 가지를 합치면 에이전트가 소프트웨어를 직접 조작하고, 조직 고유의 절차를 스킬로 주입받아, <b>완성된 파일 형태로 결과를 반환</b>할 수 있습니다. 엔터프라이즈 조직 관리용 Admin API도 베타를 벗었습니다.","detail":"<p>실무에서 중요한 건 <b>Skills API</b>입니다. 사내 문서 양식, 보고서 포맷, 리뷰 체크리스트처럼 <b>'우리 회사는 이렇게 한다'를 매번 프롬프트에 붙이던 것을 재사용 가능한 단위로 관리</b>할 수 있게 됩니다. 팀마다 제각각이던 프롬프트가 버전 관리되는 자산으로 바뀌는 셈입니다.</p><p>Admin API가 정식이 된 것도 전사 확산 단계에서는 큰 차이입니다. 멤버·초대·그룹·커스텀 역할을 API로 다룰 수 있으면 <b>입퇴사 연동과 권한 회수를 자동화</b>할 수 있습니다. 지금 수작업으로 계정을 관리하고 있다면, 사용자가 수백 명을 넘어가는 시점에 반드시 터지는 지점입니다.</p>","foryou":"사내에서 자주 쓰는 프롬프트 중 <b>반복되는 상위 5개를 골라 '스킬'로 표준화해 보세요</b>. 주간 보고 양식, 스펙 문서 템플릿, 회고 정리 포맷 같은 것들입니다. 품질 편차가 줄어드는 효과가 개별 모델 업그레이드보다 큽니다. 동시에 계정·권한 관리가 아직 수작업이라면 자동화 과제로 올려두세요."}]},{"id":"tpm","label":"TPM 업무 자동화","icon":"📋","tint":"blue","desc":"로드맵·스프린트·문서화·커뮤니케이션에 이번 주부터 바로 붙일 수 있는 기능.","criteria":"<b>지금 쓰고 있는 도구에서 바로 켤 수 있는 것</b> 위주로 골랐습니다. 새 도구를 도입해야 하는 소식보다, 이미 계약된 도구의 기능 변화를 우선했습니다.","highlight":{"kicker":"이 주의 실무 도구","title":"Linear 에이전트가 '프로젝트가 생기기 전에' 브리프를 쓴다 — 기획 앞단이 자동화 대상이 됐다","summary":"Linear의 9월 업데이트에서 눈에 띄는 건 <b>프로젝트가 만들어지기 전 단계</b>를 건드렸다는 점입니다. Linear Agent가 <b>아이디어·근거·리스크를 담은 프로젝트 브리프 초안</b>을 먼저 만들어 주기 때문에, 시간을 투입하기 전에 아이디어를 검증할 수 있습니다. 여기에 우선순위 인박스와 <b>지정한 요일에 도는 루프</b>가 추가됐습니다.","detail":"<p>그동안 협업 도구의 AI는 대부분 <b>이미 만들어진 티켓</b>을 요약하거나 분류하는 쪽이었습니다. 브리프 초안 생성은 반대 방향입니다 — <b>착수 판단 자체를 앞당기는 것</b>이라 TPM 업무와 겹치는 지점이 더 큽니다. 물론 초안 품질은 입력에 달렸고, 최종 판단은 사람이 합니다. 유용한 건 '쓸 만한 안'이 나오는 게 아니라 <b>논의를 빈 문서가 아니라 초안에서 시작할 수 있다</b>는 점입니다.</p><p>요일 지정 루프도 실무적으로 유용합니다. 멈춰 있는 작업과 빠진 승인을 정기적으로 훑어주는 기능인데, TPM이 매주 수동으로 하던 <b>스톨(stall) 점검</b>을 대신합니다. 우선순위 인박스는 급한 항목을 한곳에 모아 블로커 중심으로 보게 합니다.</p>","source":"Linear / mean.ceo","url":"https://blog.mean.ceo/linear-news-september-2026/","published":"2026-09-08","foryou":"다음 스프린트에 <b>브리프 초안 생성을 실제로 한 번 태워보세요</b> — 단, 초안을 그대로 쓰는 게 아니라 <b>'초안에서 무엇이 빠졌는지'를 리뷰 포인트로</b> 쓰는 방식이 좋습니다. 리스크 항목이 매번 비슷하게 비어 있다면, 그게 우리 조직의 기획 문서에서 구조적으로 누락되는 부분입니다. 요일 루프는 주간 스톨 점검을 대체할 수 있는지 2주만 병행해 보세요."},"articles":[{"tag":"자동 실행","source":"eesel AI / Notion","url":"https://www.eesel.ai/blog/notion-ai-review","published":"2026-09-09","title":"Notion 커스텀 에이전트 — 스케줄·이벤트로 알아서 도는 문서 작업","summary":"Notion의 <b>Custom Agents</b>는 사람이 부르지 않아도 <b>일정이나 이벤트 트리거로 자율 실행</b>됩니다. 팀 단위로 공유할 수 있고, MCP 연동으로 <b>Linear·HubSpot·Figma·Slack</b>까지 물립니다. 주간 리포트 취합, 회의록 정리, 상태 업데이트처럼 매주 같은 시각에 반복되는 문서 작업이 1차 적용 대상입니다.","detail":"<p>주목할 부분은 <b>MCP 연동</b>입니다. Notion 안의 정보만 다루면 활용 범위가 좁지만, Linear의 이슈 상태와 Slack의 논의를 끌어와 문서를 갱신하면 <b>여러 도구에 흩어진 상태를 한 문서로 모으는 작업</b>이 자동화됩니다. TPM 시간의 상당 부분이 여기에 들어갑니다.</p><p>다만 자율 실행에는 대가가 있습니다. 사람이 트리거하지 않는 만큼 <b>잘못된 결과가 조용히 쌓일 수 있습니다</b>. 처음에는 읽기 전용 요약부터 시작하고, 문서를 직접 수정하는 권한은 결과를 몇 주 지켜본 뒤 여는 순서가 안전합니다.</p>","foryou":"<b>매주 같은 시각에 반복하는 수작업 하나</b>를 골라 에이전트로 옮겨보세요 — 주간 상태 취합이 가장 흔한 후보입니다. 성공 기준은 '완벽한 문서'가 아니라 <b>'사람이 손대는 시간이 얼마나 줄었나'</b>로 잡으세요. 처음엔 읽기 전용 권한으로 시작하는 것을 권합니다."},{"tag":"백로그 자동화","source":"SaaS Forum / Atlassian","url":"https://www.saasfourm.com/jira-native-project-management-automation-and-agile-workflows/","published":"2026-09-10","title":"Jira AI 에이전트 — 한 줄짜리 기능 설명에서 수용 기준과 기술 서브태스크까지","summary":"Jira의 AI 에이전트가 <b>짧은 기능 설명만으로 수용 기준과 기술 서브태스크를 갖춘 완성형 유저 스토리</b>를 만들어 냅니다. 백로그 그루밍에서 가장 지루한 구간, 즉 '아이디어를 티켓 형태로 옮기는 작업'을 압축하는 기능입니다.","detail":"<p>실제 효용은 <b>초안 품질보다 논의 시작점</b>에 있습니다. 그루밍 미팅이 늘어지는 주된 이유는 '무엇을 만들 것인가'가 아니라 '이 티켓에 뭐가 빠졌는가'를 그 자리에서 찾아내기 때문입니다. 수용 기준이 채워진 초안을 놓고 시작하면 논의가 <b>빠진 것 찾기에서 맞는지 검증하기로</b> 옮겨갑니다.</p><p>주의할 점은 명확합니다. 생성된 수용 기준은 <b>기술적으로 그럴듯하지만 도메인 맥락이 빠져 있는 경우</b>가 많습니다. 특히 예외 케이스와 권한·정산 같은 우리 도메인 고유 규칙은 거의 채워지지 않습니다. 그대로 승인하면 스프린트 중반에 되돌아옵니다.</p>","foryou":"그루밍 세션 전에 <b>티켓 초안을 미리 생성해 배포하고, 미팅은 검증에만 쓰는 방식</b>을 한 스프린트만 시도해 보세요. 미팅 시간이 줄면 그대로 효과이고, 줄지 않으면 병목이 티켓 작성이 아니라 <b>합의</b>에 있다는 뜻이라 그것대로 유용한 진단입니다."},{"tag":"보안 관리","source":"Anthropic Release Notes","url":"https://releasebot.io/updates/anthropic/claude","published":"2026-09-09","title":"엔터프라이즈용 보안 기능이 관리자 콘솔로 들어왔다 — 확산 전에 통제를 켜는 순서","summary":"앤트로픽이 <b>Claude Security를 엔터프라이즈 고객 대상 퍼블릭 베타</b>로 열었습니다. 관리자가 콘솔에서 직접 켤 수 있습니다. 이번 주 카테고리 1의 보안 소식과 함께 보면 맥락이 분명합니다 — <b>도구 확산 속도를 통제 기능이 따라잡는 국면</b>입니다.","detail":"<p>전사 도입을 진행 중인 조직에는 순서의 문제입니다. 사용자를 먼저 늘리고 통제를 나중에 붙이면 <b>이미 형성된 사용 습관을 되돌려야 해서</b> 저항이 큽니다. 반대로 관리 기능이 갖춰진 시점에 확산 규모를 키우면 같은 정책도 마찰 없이 자리 잡습니다.</p><p>구체적으로는 관리자 콘솔에서 켜고 끌 수 있는 항목이 무엇인지, 로그가 어디까지 남는지, 기존 SIEM·감사 체계와 어떻게 연결되는지를 보안팀과 미리 맞춰두는 게 좋습니다. 이 세 가지가 정리되면 전사 확산 승인 자체가 빨라집니다.</p>","foryou":"전사 AI 도구 확산 계획이 있다면 <b>'사용자 수를 늘리는 단계' 앞에 '관리 기능을 켜는 단계'를 명시적으로 넣으세요</b>. 보안팀에 물어볼 건 세 가지면 됩니다 — 어떤 통제를 켤 수 있나, 로그는 어디까지 남나, 기존 감사 체계와 붙나. 이게 정리돼 있으면 확산 승인 자체가 훨씬 빨라집니다."}]},{"id":"biz","label":"빅테크 & 전략 동향","icon":"🌐","tint":"orange","desc":"리더십 보고와 전사 전략 수립에 참고할 산업 맥락.","criteria":"국내 기업 동향을 먼저 배치했습니다. 지정학·정상회담 같은 순수 거시 소식은 제외하고, <b>우리 조달·예산·경쟁 판단에 실제로 연결되는</b> 것만 골랐습니다.","highlight":{"kicker":"이 주의 전략 이슈","title":"네이버 'AI 브리핑' 검색 20% 돌파 — 국내 AI 에이전트 경쟁이 수익화 구간에 들어섰다","summary":"9월 11일 기준 네이버의 <b>AI 브리핑이 전체 검색의 20%를 넘어섰습니다</b>. 네이버는 '온서비스AI' 성과를 바탕으로 대화만으로 상품·콘텐츠까지 연결하는 <b>'에이전트N'</b> 고도화에 들어갔고, 카카오는 <b>'카나나 서치'</b>를 에이전틱 AI 확장의 진입점으로 잡고 10월 if(kakao)26에서 전략을 공개합니다.","detail":"<p>검색의 20%가 AI 응답으로 처리된다는 건 <b>국내 인터넷 트래픽 구조가 실제로 바뀌기 시작했다</b>는 뜻입니다. 이용자가 링크를 클릭해 페이지로 이동하는 대신 요약된 답을 받고 끝내는 비중이 그만큼 늘었다는 것이고, <b>검색 유입에 의존하는 모든 서비스의 트래픽 전제</b>가 흔들립니다.</p><p>다만 수익화 전망은 신중합니다. 업계에서는 2026년을 <b>지배구조 정리와 에이전트 완성도를 높이는 시기</b>로 보고, 본격적인 AI 수익화는 2027년부터 점진적으로 기대하는 분위기입니다. 즉 지금은 '누가 돈을 벌었나'가 아니라 <b>'누가 이용자 접점을 선점했나'</b>로 읽는 게 맞습니다.</p>","source":"ZDNet Korea / 테크M","url":"https://zdnet.co.kr/view/?no=20260508164810","published":"2026-09-11","foryou":"<b>우리 서비스의 검색 유입 비중과 그 추세를 이번 달 안에 한 번 확인해 두세요</b>. AI 요약이 검색의 20%를 차지하는 상황에서 유입이 꺾이기 시작했다면 SEO 개선이 아니라 <b>유입 경로 다변화</b>가 답입니다. 데이터팀에 '검색 유입 월별 추이' 한 장만 요청해도 리더십 논의의 출발점이 생깁니다."},"articles":[{"tag":"국내 투자","source":"디지털투데이 / 한국일보","url":"https://www.digitaltoday.co.kr/news/articleView.html?idxno=662919","published":"2026-09-08","title":"리벨리온 6,400억·업스테이지 1,800억·뤼튼 1,000억 — 국내 AI 기업 자금이 상장 준비 단계로","summary":"국내 AI 기업들이 잇따라 대형 자금을 받았습니다. AI 추론용 NPU를 만드는 <b>리벨리온이 국민성장펀드 1호로 6,400억 원을 유치해 기업가치 3조 4천억</b>이 됐고, LLM '솔라'의 <b>업스테이지는 1,800억 원 유치와 함께 상장 주관사를 선정</b>했습니다. B2C에서 MAU 600만을 넘긴 <b>뤼튼은 1,000억 원</b>을 받았습니다.","detail":"<p>개별 딜보다 <b>패턴</b>이 중요합니다. 반도체(리벨리온)·모델(업스테이지)·서비스(뤼튼) 세 층위에 동시에 자금이 들어갔고, 정부의 소버린 AI 전략과 맞물려 있습니다. 이 회사들이 상장 레이스에 들어가면 <b>공개되는 재무·지표 정보가 늘어나 국내 AI 시장을 벤치마킹할 기준선</b>이 생깁니다.</p><p>조달 관점의 실익도 있습니다. 국산 NPU와 국산 LLM에 자본이 들어갔다는 건 향후 <b>해외 벤더 외 선택지가 실제로 생길 가능성</b>을 뜻합니다. 지금 당장 대체 가능하다는 뜻은 아니지만, 단일 벤더 의존도를 낮추는 논의를 시작할 근거는 됩니다.</p>","foryou":"리더십 보고에 <b>'AI 벤더 의존도' 한 줄을 넣어두면 유용합니다</b> — 현재 어느 벤더에 얼마나 묶여 있고, 그 벤더가 가격을 올리거나 접근을 제한하면 어떤 과제가 멈추는지. 국내 대안이 성장 중이라는 사실 자체가 협상 카드가 되기도 합니다."},{"tag":"인프라 경쟁","source":"AI Weekly / Google","url":"https://aiweekly.co/ai-news-today/edition/2026-09-11","published":"2026-09-09","title":"앤트로픽 약 800억 달러 컴퓨트 약정, 구글 핀란드 130억 유로 — 전력까지 묶는 인프라 선점전","summary":"9월 한 주 사이 인프라 발표가 몰렸습니다. 앤트로픽이 <b>약 800억 달러 규모 컴퓨트</b>를 약정했고, 구글은 핀란드에 <b>2년간 최소 130억 유로</b>를 투자해 데이터센터 3곳을 짓고 <b>22년짜리 원전 전력 계약</b>까지 맺었습니다. 엔비디아 파트너사들은 호주에서 2027년까지 최대 2GW 규모를 목표로 잡았습니다.","detail":"<p>22년 원전 계약이 상징적입니다. 경쟁의 병목이 칩에서 <b>전력과 부지</b>로 옮겨갔다는 뜻입니다. 이런 계약은 수년 단위로 묶이기 때문에, 지금 체결되는 물량이 <b>2028년 이후의 공급 여력</b>을 결정합니다.</p><p>실무 함의는 <b>가격 안정성</b>입니다. 대형 랩들이 장기 물량을 확보하는 국면에서는 단기 단가가 출렁여도 장기적으로는 공급이 늘어납니다. 반대로 지금 확보 경쟁에서 밀린 사업자의 서비스는 가용성 리스크가 있습니다. 멀티 벤더 구성이 비용이 아니라 <b>가용성 보험</b>으로 정당화되는 구간입니다.</p>","foryou":"AI 예산을 짤 때 <b>단가 하락만 전제하지 말고 '가용성 리스크' 항목을 따로 두세요</b>. 특정 벤더에서 레이트 리밋이나 할당 제한이 걸렸을 때 넘어갈 대체 경로가 설계돼 있는지가 실제 차이를 만듭니다. 최소한 핵심 워크로드 한두 개는 대체 모델로 돌려본 기록이 있어야 합니다."},{"tag":"추론 비용","source":"AI Weekly / CNBC","url":"https://aiweekly.co/ai-news-today/edition/2026-09-11","published":"2026-09-10","title":"퀄컴·아마존 칩 협력, 포지트론 8.75억 달러 — 추론 단가를 끌어내리려는 압력이 몰린다","summary":"퀄컴과 아마존이 AWS용 맞춤 추론 실리콘과 광 연결을 함께 설계하는 <b>다세대 칩 협약</b>을 맺었습니다. 별도로 <b>포지트론이 8.75억 달러를 유치해 기업가치 50억 달러</b>가 됐는데, HBM 대신 <b>범용 메모리를 쓰는 추론 칩</b> 설계로 비용·수급 제약을 풀겠다는 접근입니다.","detail":"<p>두 소식 다 <b>학습이 아니라 추론</b>을 겨냥합니다. 기업이 실제로 매달 내는 비용은 대부분 추론이므로, 이쪽 경쟁이 붙으면 <b>토큰 단가 하락 압력</b>으로 돌아옵니다. 실제로 최근 모델 세대에서 캐시 읽기 단가가 크게 내려간 것도 같은 흐름입니다.</p><p>다만 CNBC는 다른 각도도 짚었습니다 — 랩들이 너무 빠른 주기로 새 버전을 내놓으면서 <b>'모델 피로(model fatigue)'</b>가 생기고 있다는 것. 매번 최신 모델로 갈아타는 비용(재평가, 프롬프트 조정, 회귀 테스트)이 성능 향상분을 넘을 수 있습니다.</p>","foryou":"모델 업그레이드 정책을 <b>'항상 최신'이 아니라 '분기 1회 재평가'로 고정</b>해 두는 편이 대체로 낫습니다. 대신 재평가 때 쓸 <b>우리 업무 기준 평가셋</b>을 한 번 만들어 두세요 — 벤치마크 점수가 아니라 실제 우리 업무 샘플 30~50건이면 충분합니다. 이게 있으면 갈아탈지 말지 판단이 하루면 끝납니다."}]},{"id":"case","label":"국내외 AI 도입 사례","icon":"📚","tint":"gray","desc":"실제로 도입한 조직의 성과와 실패 요인 — 우리 조직에 옮긴다면 무엇이 필요한지.","criteria":"선언이 아니라 <b>숫자나 구체적인 프로세스 변화가 있는 사례</b>만 골랐습니다. 성공 사례와 함께 <b>왜 확산이 안 되는지</b>를 보여주는 조사 결과도 넣었습니다.","highlight":{"kicker":"이 주의 도입 사례","title":"국내 기업 AI 활용률 58% — 주당 14시간을 아꼈는데, ROI를 측정하는 곳은 소수","summary":"국내 기업의 AI 활용률이 <b>작년 48%에서 올해 58%</b>로 올랐습니다. 1년간 약 62만 4천 개 기업이 새로 도입했으니 <b>1분에 한 곳꼴</b>입니다. 도입 기업의 <b>81%가 생산성 향상</b>을 체감했고 <b>주당 평균 14시간</b>을 아꼈다고 답했으며, 절반 이상은 매출 증가도 경험했습니다. 다만 <b>공식 전략과 ROI 측정 체계를 갖춘 곳은 아직 제한적</b>입니다.","detail":"<p>'주당 14시간'과 '전략 없음'이 같이 나온다는 게 이 조사의 핵심입니다. 개인 단위 효율은 이미 상당한데, <b>그 효율이 조직 성과로 집계되지 않고 있다</b>는 뜻입니다. 아낀 14시간이 어디로 갔는지 아무도 추적하지 않으면, 다음 예산 심의에서 AI 투자를 정당화할 근거도 없습니다.</p><p>같은 조사에서 다른 숫자도 나왔습니다 — 1분에 한 곳씩 AI를 도입하는데 <b>실제 신제품·서비스 출시로 이어진 곳은 18%</b>에 그쳤습니다. 대부분의 도입이 <b>기존 업무를 빠르게 하는 데</b> 머물고 새로운 것을 만드는 데까지는 가지 않았다는 의미입니다. 전사 TPM 관점에서는 여기가 가장 큰 빈칸입니다.</p>","source":"벤처스퀘어 / 서울경제 (AWS 조사)","url":"https://www.venturesquare.net/1113421","published":"2026-09-08","foryou":"이번 분기에 <b>'AI로 아낀 시간이 어디로 갔는지' 한 팀만이라도 추적해 보세요</b> — 다른 업무로 갔는지, 산출물 품질을 올렸는지, 그냥 흡수됐는지. 이 답이 있으면 다음 예산 심의에서 쓸 수 있는 유일한 근거가 됩니다. 동시에 <b>'AI로만 가능해진 새 기능' 후보를 한두 개</b> 세워두세요. 효율화만으로는 18%의 벽을 넘지 못합니다."},"articles":[{"tag":"국내 사례","source":"리부트 / MS TODAY","url":"https://www.reboott.ai/blog/enterprise-ai-use-cases-2026","published":"2026-09-09","title":"배달의민족 리뷰 이상 탐지로 제보 83% 감소, 포스코 사내 LLM 'P-GPT' 2년차","summary":"국내 적용 사례 중 숫자가 분명한 두 건입니다. <b>배달의민족은 AI 탐지 모델로 리뷰 패턴을 분석해 사용자 제보 건수를 83% 줄였고</b>, 포스코는 자체 LLM 기반 <b>'P-GPT'</b>를 2024년 9월부터 운영하며 임직원 질문에 사내 데이터를 찾아 답하고 있습니다.","detail":"<p>두 사례의 공통점은 <b>이미 데이터가 쌓여 있던 영역</b>을 골랐다는 점입니다. 리뷰 로그와 사내 문서는 별도 수집 없이 바로 쓸 수 있는 자산이었습니다. AI 도입 논의가 자주 실패하는 이유가 '데이터부터 모아야 한다'에서 멈추는 것인데, 두 사례는 그 단계를 건너뛸 수 있는 영역부터 시작했습니다.</p><p>성과 지표 설계도 참고할 만합니다. 배민의 '제보 83% 감소'는 <b>탐지 정확도가 아니라 이용자가 겪는 문제의 양</b>을 지표로 잡았습니다. 모델 성능 지표(정밀도·재현율)가 아니라 <b>비즈니스 지표로 성과를 잡아야</b> 리더십 보고에서 설명이 됩니다. P-GPT는 2년 가까이 운영 중이라는 사실 자체가 의미 있습니다 — 대부분의 사내 AI는 그 전에 조용히 사라집니다.</p>","foryou":"새 과제를 고를 때 <b>'데이터를 새로 모아야 하는가'를 첫 번째 필터로 쓰세요</b>. 이미 쌓인 로그로 시작할 수 있는 과제가 훨씬 빨리 성과를 냅니다. 그리고 지표는 처음부터 <b>비즈니스 언어</b>로 잡으세요 — '정확도 92%'가 아니라 '문의 건수 N% 감소'여야 다음 투자를 받습니다."},{"tag":"확산 실패","source":"WRITER","url":"https://writer.com/blog/enterprise-ai-adoption-2026/","published":"2026-09-08","title":"97%가 에이전트를 배포했지만 의미 있는 ROI는 29% — 슈퍼유저의 성과가 전사로 안 퍼진다","summary":"글로벌 조사에서 <b>지난 1년간 97%의 경영진이 AI 에이전트를 배포했지만, 유의미한 ROI를 보는 곳은 29%</b>에 그쳤습니다. 흥미로운 건 편차입니다 — <b>'슈퍼유저'는 일반 사용자보다 주당 절감 시간이 4.5배</b> 많고, 마케팅·영업·HR·고객지원 조직에서 <b>약 40%를 차지</b>합니다. 문제는 이들의 방식을 <b>전사로 퍼뜨릴 장치가 없다</b>는 것입니다.","detail":"<p>이 조사의 진단은 도구가 아니라 <b>전파 메커니즘의 부재</b>를 가리킵니다. 성과를 내는 사람은 이미 조직 안에 있는데, 그들이 무엇을 어떻게 하는지가 문서화·표준화되지 않아 개인 역량으로 머뭅니다. 79%의 조직이 도입 과정에서 어려움을 겪는다고 답했고(전년 대비 두 자릿수 증가), C레벨의 54%는 AI 도입이 조직을 분열시키고 있다고까지 답했습니다.</p><p>업종별로는 <b>금융이 앞섭니다</b> — 은행·보험 조직의 47%가 에이전트를 프로덕션에서 운영 중이고, 사기 탐지·문서 처리·고객 응대에서 가장 명확한 수익을 보고 있습니다. 셋 다 <b>반복적이고 규칙이 명확하며 오류 비용을 측정할 수 있는</b> 영역이라는 공통점이 있습니다.</p>","foryou":"전사 확산을 고민 중이라면 <b>새 도구 도입보다 '우리 조직의 슈퍼유저 찾기'가 먼저</b>입니다. 사용량 상위 사용자 5~10명을 인터뷰해 <b>구체적인 사용 패턴을 스킬·템플릿으로 자산화</b>하세요. 앞에서 언급한 Skills API 같은 기능이 바로 이 용도입니다. 이게 없으면 라이선스만 늘고 ROI는 29%에 머뭅니다."},{"tag":"대기업 전환","source":"테크M / 이데일리","url":"https://www.techm.kr/news/articleView.html?idxno=144998","published":"2026-09-10","title":"삼성·SK·LG, 사내 에이전트 전면 도입 — SK '1인 1 에이전트', 신한금융 '1인 1 금융 에이전트'","summary":"국내 주요 그룹이 사내 에이전틱 AI로 일제히 움직이고 있습니다. <b>SK텔레콤은 '에이닷 비즈'를 시범 운영 후 6월 정식 전환</b>했고, SK AX는 여러 에이전트를 연결하는 오케스트레이션 플랫폼으로 <b>SK하이닉스 제조 공정 디지털 트윈, 신한금융 '1인 1 금융 에이전트'</b> 사례를 공개했습니다. 삼성전자와 SK하이닉스는 외부 생성형 AI 도입도 추진 중입니다.","detail":"<p>'AI 쇄국'이라 불리던 국내 대기업의 외부 모델 차단 기조가 바뀌고 있다는 점이 가장 큰 변화입니다. 보안 때문에 외부 AI를 막아왔던 제조·반도체 기업들이 <b>차단 대신 통제된 접근</b>으로 방향을 틀고 있습니다. 사내망 격리, 데이터 유출 방지, 사용 로그 감사 같은 장치를 갖춘 뒤 여는 방식입니다.</p><p>'1인 1 에이전트'라는 표현이 SK와 신한금융, 그리고 정부 정책 문서에까지 동시에 등장한 것도 눈에 띕니다. <b>공용 챗봇 하나를 두는 방식에서, 개인별 맥락을 가진 에이전트를 배분하는 방식으로</b> 기대치가 옮겨가고 있다는 신호입니다. 이 경우 권한 관리와 데이터 접근 범위 설계가 훨씬 복잡해집니다.</p>","foryou":"사내에서 외부 AI 도구를 아직 차단하고 있다면, <b>'전면 차단 vs 전면 허용'이 아니라 '통제된 접근'의 조건을 정의하는 논의</b>로 옮기세요 — 어떤 데이터가 나가면 안 되는지, 로그는 어떻게 남기는지, 위반 시 어떻게 감지하는지 세 가지면 시작할 수 있습니다. 대기업들이 이미 이 경로를 밟고 있어서 내부 설득 근거로도 쓰입니다."}]}]};

(function(){
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=NL.meta,topics=NL.topics;

const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=topics.map((t,i)=>`<button class="nl-tab nl-tint-${esc(t.tint)}" role="tab" id="tab-${esc(t.id)}" data-i="${i}" aria-selected="${i===0}" aria-controls="panel"><span class="nl-tab__dot"></span>${esc(t.icon)} ${esc(t.label)}</button>`).join("");
const panelEl=document.getElementById("panel");
const det=d=>d?`<button class="nl-more-btn" type="button" aria-expanded="false"><span class="nl-more-btn__t">자세히 보기</span><span class="nl-more-btn__chev">▾</span></button><div class="nl-detail">${d}</div>`:"";
const card=a=>`<article class="nl-card"><div class="nl-card__meta"><span class="nl-tag">${esc(a.tag)}</span><span class="nl-card__dot"></span>${a.url?`<a class="nl-src" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)} ↗</a>`:`<span>${esc(a.source)}</span>`}${a.published?`<span class="nl-card__dot"></span><span>🗓 ${esc(a.published)}</span>`:""}</div><h4 class="nl-card__title">${esc(a.title)}</h4><p class="nl-card__summary">${esc(a.summary)}</p>${det(a.detail)}<div class="nl-foryou"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${a.foryou}</span></div></article>`;
function render(i){
  const t=topics[i];
  panelEl.className="nl-panel nl-tint-"+t.tint;
  panelEl.setAttribute("aria-labelledby","tab-"+t.id);
  panelEl.innerHTML=`<div class="nl-panel__head"><span class="nl-panel__icon">${esc(t.icon)}</span><h3 class="nl-panel__title">${esc(t.label)}</h3></div><p class="nl-panel__desc">${esc(t.desc)}</p>${t.criteria?`<details class="nl-criteria"><summary>ⓘ 이 소식들은 이렇게 골랐어요</summary><div class="nl-criteria__body">${t.criteria}</div></details>`:""}<section class="nl-hl"><span class="nl-hl__kicker">⭐ ${esc(t.highlight.kicker)}</span><h2 class="nl-hl__title">${esc(t.highlight.title)}</h2><p class="nl-hl__summary">${esc(t.highlight.summary)}</p>${det(t.highlight.detail)}${t.highlight.url?`<div class="nl-hl__src">🔗 출처: <a href="${esc(t.highlight.url)}" target="_blank" rel="noopener">${esc(t.highlight.source||"원문 보기")} ↗</a>${t.highlight.published?` · 🗓 ${esc(t.highlight.published)}`:""}</div>`:""}<div class="nl-foryou nl-foryou--lg"><span class="nl-foryou__label">✨ TPM 관점</span><span class="nl-foryou__text">${t.highlight.foryou}</span></div></section><div class="nl-more__label">더 읽을거리</div><div class="nl-grid">${t.articles.map(card).join("")}</div>`;
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".nl-tab");if(!b)return;const i=+b.dataset.i;tabsEl.querySelectorAll(".nl-tab").forEach(x=>x.setAttribute("aria-selected",String(+x.dataset.i===i)));render(i)});

(function(){
const body=document.body,btn=document.getElementById("themeBtn");
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){try{return localStorage.getItem("nl-theme")}catch(e){return null}}
function dark(){const s=saved();return s==="dark"?true:s==="light"?false:(mq?mq.matches:false)}
function apply(){body.classList.toggle("fl-dark",dark())}
btn.addEventListener("click",()=>{const n=dark()?"light":"dark";try{localStorage.setItem("nl-theme",n)}catch(e){}document.documentElement.dataset.nlTheme=n;apply()});
if(mq)mq.addEventListener("change",()=>{if(!saved())apply()});
apply();
})();
</script>
